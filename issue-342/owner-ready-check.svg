<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="703px" preserveAspectRatio="none" style="width:637px;height:703px;background:#FFFFFF;" version="1.1" viewBox="0 0 637 703" width="637px" zoomAndPan="magnify"><defs/><g><ellipse cx="198.6777" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="none" height="192.1094" style="stroke:#000000;stroke-width:1.5;" width="331.1289" x="33.1133" y="40"/><path d="M192.5879,40 L192.5879,49.2969 L182.5879,59.2969 L33.1133,59.2969" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="149.4746" x="36.1133" y="53.9951">Poll (each repository)</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="146.9023" x="125.2266" y="76.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="112.7461" x="135.2266" y="97.4355">Read the snapshot</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="126.9023" x="135.2266" y="111.4043">(one GraphQL query)</text><rect fill="#FFFFFF" height="75.875" rx="12.5" ry="12.5" style="stroke:#D62728;stroke-width:3;" width="311.1289" x="43.1133" y="144.2344"/><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="291.1289" x="53.1133" y="165.373">Read who added the newest cumin/status/ready</text><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="242.1621" x="53.1133" y="179.3418">- only for issues that would start (R1, I1)</text><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="147.5039" x="53.1133" y="193.3105">- only when a slot is free</text><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="245.1563" x="53.1133" y="207.2793">- Owner = IsOwner (the definition of I12)</text><rect fill="none" height="274.0156" style="stroke:#000000;stroke-width:1.5;" width="375.3555" x="11" y="242.1094"/><path d="M240.3994,242.1094 L240.3994,251.4063 L230.3994,261.4063 L11,261.4063" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="219.3994" x="14" y="256.1045">Decision (pure function, no I/O)</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="284.4277" x="56.4639" y="278.4063"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="137.666" x="66.4639" y="299.5449">Compute the free slots</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="264.4277" x="66.4639" y="313.5137">max_issues_in_progress - issues in progress</text><rect fill="#FFFFFF" height="75.875" rx="12.5" ry="12.5" style="stroke:#D62728;stroke-width:3;" width="355.3555" x="21" y="346.3438"/><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="171.873" x="31" y="367.4824">Collect R1 and I1 candidates</text><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="191.1738" x="31" y="381.4512">- open, with cumin/status/ready</text><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="188.7305" x="31" y="395.4199">- every blocked-by issue closed</text><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="335.3555" x="31" y="409.3887">- new: the Owner added the newest cumin/status/ready</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="257.2344" x="70.0605" y="442.2188"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="206.3203" x="80.0605" y="463.3574">Sort the R1, R4, and I1 candidates</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="237.2344" x="80.0605" y="477.3262">by priority label, then by issue number,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="211.0723" x="80.0605" y="491.2949">and keep as many as the free slots</text><rect fill="none" height="124.1719" style="stroke:#000000;stroke-width:1.5;" width="602.1616" x="24.6201" y="526.125"/><path d="M242.1182,526.125 L242.1182,535.4219 L232.1182,545.4219 L24.6201,545.4219" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="207.498" x="27.6201" y="540.1201">Apply (in the order of the list)</text><path d="M382.7354,572.6602 L382.7354,596.3594 L362.7354,600.3594 L382.7354,604.3594 L382.7354,628.0586 A0,0 0 0 0 382.7354,628.0586 L616.7817,628.0586 A0,0 0 0 0 616.7817,628.0586 L616.7817,582.6602 L606.7817,572.6602 L382.7354,572.6602 A0,0 0 0 0 382.7354,572.6602" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M606.7817,572.6602 L606.7817,582.6602 L616.7817,582.6602 L606.7817,572.6602" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#D62728" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.5239" x="388.7354" y="589.7271">A ready that is not the Owner's:</text><text fill="#D62728" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.1641" x="388.7354" y="604.8599">no label change, no request,</text><text fill="#D62728" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.0464" x="388.7354" y="619.9927">one log line for each such event.</text><rect fill="#F1F1F1" height="75.875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="328.1152" x="34.6201" y="562.4219"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="281.6895" x="44.6201" y="583.5605">R1: change the label to cumin/status/planning,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="169.3594" x="44.6201" y="597.5293">then ask the Planner to split</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="308.1152" x="44.6201" y="611.498">I1: change the label to cumin/status/implementing,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="156.252" x="44.6201" y="625.4668">then ask the Implementer</text><ellipse cx="198.6777" cy="681.2969" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="198.6777" cy="681.2969" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="198.6777" x2="198.6777" y1="124.2344" y2="144.2344"/><polygon fill="#181818" points="194.6777,134.2344,198.6777,144.2344,202.6777,134.2344,198.6777,138.2344" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="198.6777" x2="198.6777" y1="30" y2="76.2969"/><polygon fill="#181818" points="194.6777,66.2969,198.6777,76.2969,202.6777,66.2969,198.6777,70.2969" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="198.6777" x2="198.6777" y1="326.3438" y2="346.3438"/><polygon fill="#181818" points="194.6777,336.3438,198.6777,346.3438,202.6777,336.3438,198.6777,340.3438" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="198.6777" x2="198.6777" y1="422.2188" y2="442.2188"/><polygon fill="#181818" points="194.6777,432.2188,198.6777,442.2188,202.6777,432.2188,198.6777,436.2188" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="198.6777" x2="198.6777" y1="220.1094" y2="278.4063"/><polygon fill="#181818" points="194.6777,268.4063,198.6777,278.4063,202.6777,268.4063,198.6777,272.4063" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="198.6777" x2="198.6777" y1="504.125" y2="562.4219"/><polygon fill="#181818" points="194.6777,552.4219,198.6777,562.4219,202.6777,552.4219,198.6777,556.4219" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="198.6777" x2="198.6777" y1="638.2969" y2="670.2969"/><polygon fill="#181818" points="194.6777,660.2969,198.6777,670.2969,202.6777,660.2969,198.6777,664.2969" style="stroke:#181818;stroke-width:1;"/><!--SRC=[ZLJRRXen47tVhnYb3o4I5q6gjWAAb2PAXHGrAUrxPDR3heLtxDhUK5JbtpksWGGbaSB3hl7SpfmpiwSmzxv5a4fKJZImCWu-d7ySZI7K2BSRGWTbZUKQp2fT-I1Sw8AYzCyQhQ4Jdps9fPBOjssZkr2suQnV-BKYAs9QNmjfDeegM0djyPb5uagqEbmR2Zz4m_a5-Pv7frR5r8UjnbaXog0ULDXUxJ3-Am3w3AF2aCu0DuhmqkY8_UhJwFFeo-7sTwtADQ7tS9xkOfsNdjz4kQwSQKdkRDVfnxR7uh6O3dP0YjHymS232ieGdDob_b6KDJYqngjWtFRi9C4QBr38p1a9wsiJ-B9Z2E6x4xR-UGD_McJloS5tKniGKcAE8joW3qnbeuWHYD3wWMEtBVltm93U9hLKrCzpX0YmCQsMMIBeB8PTc0_FdhmtDH88yDe4ZeALGqp6hF9NdeHywiJgh8kYt2KhFn-EpYOmdMRMPpDcvHaBLoozZwUERHt2ggKo6hf01kQ3spqVbwQnRS3KN2oUa7YsDEBlVMxZNj6zTQPoKR7UlZSUjltb92VI6ii0Yo48aWmEIduhAGBwtAv5hhvHeNwBFdnWwc6fJRb6sLjkSoaejV4eamVJ_tm9tg7B4K4CyvTX6M94L6BniVigM2vjdJAEvnkqM28lJuWw7I1HsopHTTarXgyHBGZFbD4sle-vd1phSc4jozxPxQfnallOhR5MFXpcT3Zc7HTKPMaI2WZck4Eh1H4lS0II00g_JkvtqS29ES1RhUAGpz-JK3LMOuCKNaiwtnlHnPx8yDWuLTKn-xICEphUxU_i0XBvUG5uhDdtIRPJFvuEal_iPIHFPuQMiQPnTSXBwKFtxQYumDfKp20VuWAcxVSjFtYeAFGFeSXwHUJysJ3sFm00]--></g></svg>