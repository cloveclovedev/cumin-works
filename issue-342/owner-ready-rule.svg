gth="125.2075" x="175.3" y="513.4597">two abnormal ends</text></g><!--link Decision to Ready--><g class="link" data-entity-1="Decision" data-entity-2="Ready" data-source-line="13" data-uid="lnk7" id="link_Decision_Ready"><path d="M278.52,546.77 C289.14,539.09 299.46,529.21 305.3,517.26 C334.4,457.77 337.07,426.37 305.3,368.26 C292.28,344.44 272.979,330.0583 250.099,318.5383" fill="none" id="Decision-to-Ready" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="244.74,315.84,250.9797,323.4601,249.2059,318.0886,254.5774,316.3147,244.74,315.84" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.438" x="377.6134" y="432.3269">Owner answers,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201.4048" x="329.13" y="447.4597">adds cumin/status/ready again</text></g><!--SRC=[TPD1Rzim38Nl-XL4SrWos0cI3TiG53aL0tnPXrwR7cYBYONAKYR94FBlHqbUq3MDJxBqtZC_Klu4ZVSZWLHuT3Z0mJgOVVcwsKBe2Toe2UmXhtr05s3-jAwWMIz06L39MVD-8BySv5BqIXBGS0fdaEGxfqv1MID4bi3TWyD3s9kviIaiZ1uqjgGNTu0Uyk4_PJSEogoAQEK8vJbhdjBgGuqQJfe6Ca6POvOsRpO-T614bGvh6msvMbAdF1TRQfbUX7Z-_09rlIlLmHP-QpGi1-xIO_91nzKn_juW-B6jSqj4KITVhfXzaxYdxjM32XNhfVHmpIcAetwUFNpRVD_yg5ghvGidlGNYmFlEQkksashNh4iMLyyVI4DC8xjq1TCSxbVPinF_HMMwYPTpcmsqsdQl92k6t9iGBM1hh1jG0ndfnKLypOV6HtB-DXtW4HMtrLYUXrF7FgJRLK9cF_CZu3tRBuhGMIDLWaZwXgyW6fcjwmlLbM_kwC-eN2OjTxM2KaMmS4g3PFx5zdP0Qk449YN9t593aNouxRbcNjuMFtAYYyhJzBVP21xF7cAFOPgdjFnlNH9u091wznS0]--></g></svg>