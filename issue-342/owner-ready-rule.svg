566,252.6 L301.54,252.6 A0,0 0 0 0 301.54,252.6" fill="#FFFFFF" style="stroke:#181818;stroke-width:0.5;"/><path d="M589.0566,252.6 L589.0566,262.6 L599.0566,262.6 L589.0566,252.6" fill="#FFFFFF" style="stroke:#181818;stroke-width:0.5;"/><text fill="#D62728" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.314" x="307.54" y="269.6669">New condition of I1, and of R1</text><text fill="#D62728" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="256.0835" x="307.54" y="284.7997">(requirement issue, ready to planning):</text><text fill="#D62728" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.103" x="307.54" y="299.9325">the Owner added the newest</text><text fill="#D62728" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.9937" x="307.54" y="315.0653">cumin/status/ready.</text><text fill="#D62728" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="276.5166" x="307.54" y="330.1981">Otherwise: the row says what cumin does.</text></g><!--link *start* to Draft--><g class="link" data-entity-1=".start." data-entity-2="Draft" data-source-line="9" data-uid="lnk3" id="link_.start._Draft"><path d="M193.3,26.12 C193.3,45.4 193.3,84.74 193.3,111.51" fill="none" id="*start*-to-Draft" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="193.3,117.51,197.3,108.51,193.3,112.51,189.3,108.51,193.3,117.51" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.7056" x="194.3" y="69.0669">Planner or Owner creates</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="73.4487" x="240.4284" y="84.1997">a sub-issue</text></g><!--link Draft to Ready--><g class="link" data-entity-1="Draft" data-entity-2="Ready" data-source-line="10" data-uid="lnk4" id="link_Draft_Ready"><path d="M193.3,161.09 C193.3,191 193.3,23