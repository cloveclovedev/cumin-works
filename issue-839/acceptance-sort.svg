<text x="285.0" y="24" text-anchor="middle" font-size="15" font-weight="bold">Acceptance check: open items and their three groups</text>
<rect x="20" y="50" width="240" height="110" rx="10" fill="#F4F4F8" stroke="#333333" stroke-width="1.2"/><text x="140.0" y="72" text-anchor="middle" font-weight="bold" fill="#333333">open items</text><text x="140.0" y="92" text-anchor="middle" font-size="12" fill="#444">Fail rows</text><text x="140.0" y="108" text-anchor="middle" font-size="12" fill="#444">open non-blocking review comments</text><text x="140.0" y="124" text-anchor="middle" font-size="12" fill="#444">Follow-up of merged pull requests</text><text x="140.0" y="140" text-anchor="middle" font-size="12" fill="#444">work that a follow-up note names</text><rect x="320" y="70" width="220" height="70" rx="10" fill="#FDECEC" stroke="#D62728" stroke-width="3"/><text x="430.0" y="92" text-anchor="middle" font-weight="bold" fill="#D62728">the Planner sorts</text><text x="430.0" y="112" text-anchor="middle" font-size="12" fill="#444">one group and a one-line reason</text><text x="430.0" y="128" text-anchor="middle" font-size="12" fill="#444">for each open item</text><line x1="260" y1="105" x2="318" y2="105" stroke="#555555" stroke-width="1.2" marker-end="url(#g)"/><rect x="20" y="220" width="170" height="90" rx="10" fill="#F4F4F8" stroke="#333333" stroke-width="1.2"/><text x="105.0" y="242" text-anchor="middle" font-weight="bold" fill="#333333">Fix in this requirement</text><text x="105.0" y="262" text-anchor="middle" font-size="12" fill="#444">a new sub-issue,</text><text x="105.0" y="278" text-anchor="middle" font-size="12" fill="#444">one risk label, no status</text><text x="105.0" y="294" text-anchor="middle" font-size="12" fill="#444">first check only</text><rect x="200" y="220" width="170" height="90" rx="10" fill="#F4F4F8" stroke="#333333" stroke-width="1.2"/><text x="285.0" y="242" text-anchor="middle" font-weight="bold" fill="#333333">Needs a decision</text><text x="285.0" y="262" text-anchor="middle" font-size="12" fill="#444">a draft: new requirement</text><text x="285.0" y="278" text-anchor="middle" font-size="12" fill="#444">issue or backlog row</text><text x="285.0" y="294" text-anchor="middle" font-size="12" fill="#444">(nothing is written)</text><rect x="380" y="220" width="170" height="90" rx="10" fill="#F4F4F8" stroke="#333333" stroke-width="1.2"/><text x="465.0" y="242" text-anchor="middle" font-weight="bold" fill="#333333">No action</text><text x="465.0" y="262" text-anchor="middle" font-size="12" fill="#444">the reason</text><line x1="400" y1="140" x2="105" y2="218" stroke="#D62728" stroke-width="3" marker-end="url(#r)"/><line x1="430" y1="140" x2="285" y2="218" stroke="#D62728" stroke-width="3" marker-end="url(#r)"/><line x1="460" y1="140" x2="465" y2="218" stroke="#D62728" stroke-width="3" marker-end="url(#r)"/><text x="280" y="345" text-anchor="middle" font-size="12" fill="#D62728">Red: this issue adds the sort to the Planner instructions and the template.</text></svg>