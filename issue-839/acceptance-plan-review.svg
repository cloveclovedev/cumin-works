<svg xmlns="http://www.w3.org/2000/svg" width="560" height="460" viewBox="0 0 560 460" font-family="Helvetica, Arial, sans-serif" font-size="14">
<defs><marker id="g" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#555555"/></marker>
<marker id="r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#D62728"/></marker></defs>
<rect width="560" height="460" fill="#FFFFFF"/>
<text x="280.0" y="24" text-anchor="middle" font-size="15" font-weight="bold">Requirement issue after the acceptance check</text>
<rect x="170" y="50" width="220" height="60" rx="10" fill="#F4F4F8" stroke="#333333" stroke-width="1.2"/><text x="280.0" y="72" text-anchor="middle" font-weight="bold" fill="#333333">implementing</text><text x="280.0" y="92" text-anchor="middle" font-size="12" fill="#444">the agents work on the sub-issues</text><rect x="170" y="190" width="220" height="60" rx="10" fill="#F4F4F8" stroke="#333333" stroke-width="1.2"/><text x="280.0" y="212" text-anchor="middle" font-weight="bold" fill="#333333">accepting</text><text x="280.0" y="232" text-anchor="middle" font-size="12" fill="#444">the Planner checks the merged work</text><rect x="20" y="350" width="230" height="60" rx="10" fill="#F4F4F8" stroke="#333333" stroke-width="1.2"/><text x="135.0" y="372" text-anchor="middle" font-weight="bold" fill="#333333">awaiting-plan-review</text><text x="135.0" y="392" text-anchor="middle" font-size="12" fill="#444">a Maintainer reviews the sub-issues</text><rect x="310" y="350" width="230" height="60" rx="10" fill="#F4F4F8" stroke="#333333" stroke-width="1.2"/><text x="425.0" y="372" text-anchor="middle" font-weight="bold" fill="#333333">awaiting-acceptance</text><text x="425.0" y="392" text-anchor="middle" font-size="12" fill="#444">a Maintainer decides the acceptance</text><line x1="280" y1="110" x2="280" y2="188" stroke="#555555" stroke-width="1.2" marker-end="url(#g)"/><text x="290" y="140" text-anchor="start" font-size="12" fill="#555555">request the acceptance check</text><text x="290" y="155" text-anchor="start" font-size="12" fill="#555555">[every sub-issue is closed]</text><line x1="320" y1="250" x2="420" y2="348" stroke="#555555" stroke-width="1.2" marker-end="url(#g)"/><text x="400" y="280" text-anchor="start" font-size="12" fill="#555555">ask for the acceptance</text><text x="400" y="295" text-anchor="start" font-size="12" fill="#555555">[check written, every</text><text x="400" y="310" text-anchor="start" font-size="12" fill="#555555">sub-issue is closed]</text><line x1="230" y1="250" x2="140" y2="348" stroke="#D62728" stroke-width="3" marker-end="url(#r)"/><text x="10" y="262" text-anchor="start" font-size="12" fill="#D62728" font-weight="bold">ask for the plan review</text><text x="10" y="277" text-anchor="start" font-size="12" fill="#D62728" font-weight="bold">[check written,</text><text x="10" y="292" text-anchor="start" font-size="12" fill="#D62728" font-weight="bold">an open fix sub-issue,</text><text x="10" y="307" text-anchor="start" font-size="12" fill="#D62728" font-weight="bold">the split check passes]</text><line x1="60" y1="348" x2="165" y2="95" stroke="#555555" stroke-width="1.2" marker-end="url(#g)"/><text x="20" y="130" text-anchor="start" font-size="12" fill="#555555">mark the requirement</text><text x="20" y="145" text-anchor="start" font-size="12" fill="#555555">as in work</text><text x="280" y="445" text-anchor="middle" font-size="12" fill="#D62728">Red: AcceptanceEnd returns ask for the plan review.</text></svg>