<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="506px" preserveAspectRatio="none" style="width:601px;height:506px;background:#FFFFFF;" version="1.1" viewBox="0 0 601 506" width="601px" zoomAndPan="magnify"><defs/><g><ellipse cx="209.9404" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="160.291" x="129.7949" y="94"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="140.291" x="139.7949" y="115.1387">The tick of poll_interval</text><path d="M338.375,151.2227 L338.375,174.9219 L318.375,178.9219 L338.375,182.9219 L338.375,206.6211 A0,0 0 0 0 338.375,206.6211 L563.9282,206.6211 A0,0 0 0 0 563.9282,206.6211 L563.9282,161.2227 L553.9282,151.2227 L338.375,151.2227 A0,0 0 0 0 338.375,151.2227" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M553.9282,151.2227 L553.9282,161.2227 L563.9282,161.2227 L553.9282,151.2227" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.5532" x="344.375" y="168.2896">New: a repository with no issue</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.7539" x="344.375" y="183.4224">in work is read only once</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="160.3291" x="344.375" y="198.5552">in each idle poll interval.</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#D62728;stroke-width:3;" width="216.8691" x="101.5059" y="147.9688"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="120.7324" x="111.5059" y="169.1074">For each repository:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="196.8691" x="111.5059" y="183.0762">is the repository in work, or is its</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="133.6172" x="111.5059" y="197.0449">idle poll interval over?</text><polygon fill="#F1F1F1" points="142.7212,229.875,277.1597,229.875,289.1597,241.875,277.1597,253.875,142.7212,253.875,130.7212,241.875,142.7212,229.875" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="134.4385" x="142.7212" y="245.6831">Poll this repository now?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="111.7129" y="239.2808">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="289.1597" y="239.2808">no</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="206.5918" x="11" y="263.875"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="186.5918" x="21" y="285.0137">Read the snapshot, decide, act</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="76.3535" x="21" y="298.9824">(unchanged)</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="181.4375" x="23.5771" y="331.8125"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="161.4375" x="33.5771" y="352.9512">Remember: in work or not,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="143.543" x="33.5771" y="366.9199">and the time of this poll</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="135.9863" x="237.5918" y="263.875"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="115.9863" x="247.5918" y="285.0137">Skip this repository</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="115.4824" x="247.5918" y="298.9824">(no GraphQL point)</text><polygon fill="#F1F1F1" points="209.9404,385.75,221.9404,397.75,209.9404,409.75,197.9404,397.75,209.9404,385.75" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="209.9404,50,221.9404,62,209.9404,74,197.9404,62,209.9404,50" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="179.2124,429.75,240.6685,429.75,252.6685,441.75,240.6685,453.75,179.2124,453.75,167.2124,441.75,179.2124,429.75" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="61.4561" x="179.2124" y="445.5581">cumin runs</text><ellipse cx="209.9404" cy="484.75" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="209.9404" cy="484.75" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="209.9404" x2="209.9404" y1="127.9688" y2="147.9688"/><polygon fill="#181818" points="205.9404,137.9688,209.9404,147.9688,213.9404,137.9688,209.9404,141.9688" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="114.2959" x2="114.2959" y1="311.8125" y2="331.8125"/><polygon fill="#181818" points="110.2959,321.8125,114.2959,331.8125,118.2959,321.8125,114.2959,325.8125" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="130.7212" x2="114.2959" y1="241.875" y2="241.875"/><line style="stroke:#181818;stroke-width:1;" x1="114.2959" x2="114.2959" y1="241.875" y2="263.875"/><polygon fill="#181818" points="110.2959,253.875,114.2959,263.875,118.2959,253.875,114.2959,257.875" style="stroke:#181818;stroke-width:1;"/><line style="st