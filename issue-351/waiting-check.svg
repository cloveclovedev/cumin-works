<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="682px" preserveAspectRatio="none" style="width:577px;height:682px;background:#FFFFFF;" version="1.1" viewBox="0 0 577 682" width="577px" zoomAndPan="magnify"><defs/><g><ellipse cx="384.4319" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="184.2324" x="292.3157" y="50"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="164.2324" x="302.3157" y="71.1387">Poll every target repository</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="135.5742" x="302.3157" y="85.1074">(snapshot -&gt; decision)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="152.3047" x="308.2795" y="167.9492"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="132.3047" x="318.2795" y="189.0879">forget the mark "told"</text><ellipse cx="384.4319" cy="241.0313" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="384.4319" cy="241.0313" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="314.9783,117.9375,453.8855,117.9375,465.8855,130.7422,453.8855,143.5469,314.9783,143.5469,302.9783,130.7422,314.9783,117.9375" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="388.4319" y="153.7573">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="138.9072" x="314.9783" y="128.1479">cumin decided an action,</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="97.2651" x="314.9783" y="140.9526">or an agent runs?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="465.8855" y="128.1479">no</text><path d="M10,284.0313 L10,324.2969 L258.7285,324.2969 L258.7285,294.0313 L248.7285,284.0313 L10,284.0313" fill="#FFFFFF" style="stroke:#D62728;stroke-width:0.5;"/><path d="M248.7285,284.0313 L248.7285,294.0313 L258.7285,294.0313 L248.7285,284.0313" fill="#FFFFFF" style="stroke:#D62728;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.6177" x="16" y="301.0981">This issue adds this question</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="227.7285" x="16" y="316.231">as a pure function of the snapshot.</text><rect fill="#FDE0DD" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="157.0215" x="305.9211" y="399.918"/><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="103.3418" x="315.9211" y="421.0566">no notification,</text><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="137.0215" x="315.9211" y="435.0254">cumin does not wait</text><ellipse cx="384.4319" cy="478.8555" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="384.4319" cy="478.8555" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="270.7285,324.2969,498.1353,324.2969,510.1353,349.9063,498.1353,375.5156,270.7285,375.5156,258.7285,349.9063,270.7285,324.2969" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="388.4319" y="385.7261">yes</text><text fill="#D62728" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="225.8384" x="270.7285" y="334.5073">an issue exists that cumin moves on</text><text fill="#D62728" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="122.4878" x="270.7285" y="347.312">without the Owner?</text><text fill="#D62728" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="171.2036" x="270.7285" y="360.1167">- cumin/status/awaiting-checks</text><text fill="#D62728" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="227.4067" x="270.7285" y="372.9214">- cumin/status/ready, waits for a free slot</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="510.1353" y="347.312">no</text><polygon fill="#F1F1F1" points="305.9736,531.8555,462.8901,531.8555,474.8901,544.6602,462.8901,557.4648,305.9736,557.4648,293.9736,544.6602,305.9736,531.8555" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="156.9165" x="305.9736" y="542.0659">the Owner already heard Q4</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="129.3574" x="305.9736" y="554.8706">since cumin last acted?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="274.9653" y="542.0659">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="474.8901" y="542.0659">no</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="106.2441" x="230.8516" y="567.4648"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="86.2441" x="240.8516" y="588.6035">no notification</text><ellipse cx="283.9736" cy="646.4023" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="283.9736" cy="646.4023" fill="#222222" 