<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="703px" preserveAspectRatio="none" style="width:552px;height:703px;background:#FFFFFF;" version="1.1" viewBox="0 0 552 703" width="552px" zoomAndPan="magnify"><defs/><g><ellipse cx="359.9343" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="184.2324" x="267.8181" y="50"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="164.2324" x="277.8181" y="71.1387">Poll every target repository</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="135.5742" x="277.8181" y="85.1074">(snapshot -&gt; decision)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="152.3047" x="283.782" y="167.9492"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="132.3047" x="293.782" y="189.0879">forget the mark "told"</text><ellipse cx="359.9343" cy="241.0313" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="359.9343" cy="241.0313" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="290.4807,117.9375,429.3879,117.9375,441.3879,130.7422,429.3879,143.5469,290.4807,143.5469,278.4807,130.7422,290.4807,117.9375" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="363.9343" y="153.7573">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="138.9072" x="290.4807" y="128.1479">cumin decided an action,</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="97.2651" x="290.4807" y="140.9526">or an agent runs?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="441.3879" y="128.1479">no</text><path d="M10,284.0313 L10,369.6953 L247.2773,369.6953 L247.2773,294.0313 L237.2773,284.0313 L10,284.0313" fill="#FFFFFF" style="stroke:#D62728;stroke-width:0.5;"/><path d="M237.2773,284.0313 L237.2773,294.0313 L247.2773,294.0313 L237.2773,284.0313" fill="#FFFFFF" style="stroke:#D62728;stroke-width:0.5;"/><text fill="#D62728" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.0493" x="16" y="301.0981">issue-states.md, row Q4:</text><text fill="#D62728" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.3423" x="16" y="316.231">the Owner writes which states</text><text fill="#D62728" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.2773" x="16" y="331.3638">mean "cumin moves on by itself"</text><text fill="#D62728" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.4282" x="16" y="346.4966">(for example awaiting-checks,</text><text fill="#D62728" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.9272" x="16" y="361.6294">ready that waits for a free slot).</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="141.7285" x="289.0701" y="419.707"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="90.0586" x="299.0701" y="440.8457">no notification,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="121.7285" x="299.0701" y="454.8145">cumin does not wait</text><ellipse cx="359.9343" cy="499.7734" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="359.9343" cy="499.7734" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F