<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="614px" preserveAspectRatio="none" style="width:433px;height:614px;background:#FFFFFF;" version="1.1" viewBox="0 0 433 614" width="433px" zoomAndPan="magnify"><title>Output of cumin status, from top to bottom</title><defs/><g><g class="title" data-source-line="3"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="344.5449" x="37.2676" y="22.9951">Output of cumin status, from top to bottom</text></g><!--entity Q1--><g class="entity" data-entity="Q1" data-source-line="4" data-uid="ent0002" id="entity_Q1"><rect fill="#F1F1F1" height="54.8906" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="420.0801" x="7" y="44.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="47.2432" x="17" y="60.292">Quota:</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="267.8252" x="25.9004" y="76.5889">read at ..., 5h window, weekly window</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="391.1797" x="25.9004" y="92.8857">agent starts: go on | stopped by the &lt;window&gt; window</text></g><!--entity Q2--><g class="entity" data-entity="Q2" data-source-line="5" data-uid="ent0003" id="entity_Q2"><rect fill="#FFFFFF" height="38.5938" rx="2.5" ry="2.5" style="stroke:#D62728;stroke-width:2;" width="355.4531" x="39.31" y="159.1869"/><text fill="#D62728" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="192.5752" x="49.31" y="175.182">Quota: before the first read</text><text fill="#D62728" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="326.5527" x="58.2104" y="191.4789">not read yet (the output and quota.md say so)</text></g><!--entity S--><g class="entity" data-entity="S" data-source-line="6" data-uid="ent0004" id="entity_S"><rect fill="#F1F1F1" height="38.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="394.5" x="19.79" y="257.7869"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="36.5449" x="29.79" y="273.782">Stop:</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="365.5996" x="38.6904" y="290.0789">only while a stop after the current runs is requested</text></g><!--entity A1--><g class="entity" data-entity="A1" data-source-line="7" data-uid="ent0005" id="entity_A1"><rect fill="#FFFFFF" height="71.1875" rx="2.5" ry="2.5" style="stroke:#D62728;stroke-width:2;" width="392.8389" x="20.62" y="356.3769"/><text fill="#D62728" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="274.8594" x="30.62" y="372.372">Agents at work:   (short heading again)</text><text fill="#D62728" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="363.9385" x="39.5204" y="388.6689">one note line: an issue here can wait with no agent,</text><text fill="#D62728" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="248.4932" x="39.5204" y="404.9657">only while agent starts are stopped</text><text fill="#D62728" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="309.1416" x="39.5204" y="421.2626">or a stop after the current runs is requested</text></g><!--entity A2--><g class="entity" data-entity="A2" data-source-line="8" data-uid="ent0006" id="entity_A2"><rect fill="#F1F1F1" height="38.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="308.3057" x="62.89" y="487.5669"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="279.4053" x="81.7904" y="503.562">&lt;repository&gt; #&lt;issue&gt; &lt;status label&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdju