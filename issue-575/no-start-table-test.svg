<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="745px" preserveAspectRatio="none" style="width:616px;height:745px;background:#FFFFFF;" version="1.1" viewBox="0 0 616 745" width="616px" zoomAndPan="magnify"><title>The one check before every start of an agent</title><defs/><g><g class="title" data-source-line="13"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="357.041" x="128.0352" y="32.9951">The one check before every start of an agent</text></g><ellipse cx="136.6406" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><path d="M266.2998,77.2969 L266.2998,131.2617 L246.2998,135.2617 L266.2998,139.2617 L266.2998,193.2266 A0,0 0 0 0 266.2998,193.2266 L604.1113,193.2266 A0,0 0 0 0 604.1113,193.2266 L604.1113,87.2969 L594.1113,77.2969 L266.2998,77.2969 A0,0 0 0 0 266.2998,77.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M594.1113,77.2969 L594.1113,87.2969 L604.1113,87.2969 L594.1113,77.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="143.584" x="272.2998" y="94.3638">Every kind of request:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251.7036" x="272.2998" y="109.4966">split, acceptance check, claim, review,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258.3687" x="272.2998" y="124.6294">check fix, conflict resolution, review fix,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.6514" x="272.2998" y="139.7622">fix of the review of the Owner, cause,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.9941" x="272.2998" y="154.895">and the second request of the split,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="316.8115" x="272.2998" y="170.0278">of the acceptance check, of the implementation,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.6479" x="272.2998" y="185.1606">of the review, and of the cause.</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="219.3184" x="26.9814" y="111.293"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="199.3184" x="36.9814" y="132.4316">a poll or the end of a run decides</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="130.1602" x="36.9814" y="146.4004">a request to an agent</text><rect fill="#FFFFFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#D62728;stroke-width:3;" width="224.8965" x="24.1924" y="261.6289"/><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="204.8965" x="34.1924" y="282.7676">no agent starts, no label changes,</text><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="111.8848" x="34.1924" y="296.7363">nothing is counted</text><ellipse cx="136.6406" cy="342.0977" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="136.6406" cy="342.0977" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="39.064,213.2266,234.2173,213.2266,246.2173,225.2266,234.2173,237.2266,39.064,237.2266,27.064,225.2266,39.064,213.2266" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="140.6406" y="247.437">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="195.1533" x="39.064" y="229.0347">cumin stops after the current runs?</text><rect fill="#FFFFFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#D62728;stroke-width:3;" width="224.8965" x="24.1924" y="443.5"/><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="204.8965" x="34.1924" y="464.6387">no agent starts, no label changes,</text><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="111.8848" x="34.1924" y="478.6074">nothing is counted</text><ellipse cx="136.6406" cy="523.9688" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="136.6406" cy="523.9688" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="73.2671,395.0977,200.0142,395.0977,212.0142,407.0977,200.0142,419.0977,73.2671,419.0977,61.2671,407.0977,73.2671,395.0977" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="140.6406" y="429.3081">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="126.7471" x="73.2671" y="410.9058">quota usage at a limit?</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="251.2813" x="11" y="576.9688"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="231.2813" x="21" y="598.1074">change the label or count the request,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="121.0488" x="21" y="612.0762">then start the agent</text><ellipse cx="136.6406" cy="655.9063" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="136.6406" cy="655.9063" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="136.6406" x2="136.6406" y1="67.2969" 