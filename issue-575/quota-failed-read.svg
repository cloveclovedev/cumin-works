<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="803px" preserveAspectRatio="none" style="width:492px;height:803px;background:#FFFFFF;" version="1.1" viewBox="0 0 492 803" width="492px" zoomAndPan="magnify"><title>The quota check before a start, inside one poll</title><defs/><g><g class="title" data-source-line="13"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="369.3115" x="59.9019" y="32.9951">The quota check before a start, inside one poll</text></g><ellipse cx="232.1899" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="236.7676" x="113.8062" y="87.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="216.7676" x="123.8062" y="108.4355">a poll decides a request to an agent</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="171.7637" x="146.3081" y="189.668"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="94.875" x="156.3081" y="210.8066">no minimal run,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="151.7637" x="156.3081" y="224.7754">the stored usage decides</text><ellipse cx="232.1899" cy="270.1367" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="232.1899" cy="270.1367" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="115.1458,141.2656,349.2341,141.2656,361.2341,153.2656,349.2341,165.2656,115.1458,165.2656,103.1458,153.2656,115.1458,141.2656" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="236.1899" y="175.4761">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="234.0884" x="115.1458" y="157.0737">stored usage read at most 5 minutes ago?</text><rect fill="#FFFFFF" height="61.9063" rx="12.5" ry="12.5" style="stroke:#D62728;stroke-width:3;" width="176.0059" x="144.187" y="373.1484"/><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="111.0996" x="154.187" y="394.2871">The request waits.</text><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="124.8633" x="154.187" y="408.2559">No new minimal run,</text><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="156.0059" x="154.187" y="422.2246">no label change, no count</text><ellipse cx="232.1899" cy="466.0547" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="232.1899" cy="466.0547" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="155.9875,323.1367,308.3923,323.1367,320.3923,335.9414,308.3923,348.7461,155.9875,348.7461,143.9875,335.9414,155.9875,323.1367" style="stroke:#181818;stroke-width:0.5;"/><text fill="#D62728" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="236.1899" y="358.9565">yes</text><text fill="#D62728" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="152.4048" x="155.9875" y="333.3472">a read of the usage already</text><text fill="#D62728" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="96.728" x="155.9875" y="346.1519">failed in this poll?</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="187.7012" x="138.3394" y="519.0547"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="167.7012" x="148.3394" y="540.1934">minimal run of Claude Code</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="100.1836" x="148.3394" y="554.1621">(read the usage)</text><polygon fill="#F1F1F1" points="198.4192,586.9922,265.9607,586.9922,277.9607,598.9922,265.9607,610.9922,198.4192,610.9922,186.4192,598.9922,198.4192,586.9922" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="67.5415" x="198.4192" y="602.8003">usage read?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="172.7175" y="596.3979">no</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="277.9607" y="596.3979">yes</text><rect fill="#FFFFFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#D62728;stroke-width:3;" width="136.0566" x="41.6328" y="620.9922"/><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="116.0566" x="51.6328" y="642.1309">Keep the failure for</text><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="113.3145" x="51.6328" y="656.0996">the rest of this poll</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="197.3223" x="11" y="702.8984"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="177.3223" x="21" y="724.0371">stop agent starts: notify once</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="128.3555" x="21" y="738.0059">until a read succeeds</text><ellipse cx="109.6611" cy="781.8359" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="109.6611" cy="781.8359" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="252.793" x="228.3223" y="620.9922"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="232.793" x="238.3223" y="642.1309">store the usage, then the limits decide</text><ellipse cx="354.7188" cy="699.9297" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="354.7188" cy="699.9297" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="232.1899" x2="232.1899" y1="67.2969" y2="87.2969"/><polygon fill="#181818" points="228.1899,77.2969,232.1899,87.2969,236.1899,77.2969,232.1899,81.2969" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="232.1899" x2="232.1899" y1="237.6055" y2="259.1367"/><polygon fill="#181818" points="228.1899,249.1367,232.1899,259.1367,236.1899,249.1367,232.1899,253.1367" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="232.1899" x2="232.1899" y1="165.2656" y2="189.668"/><polygon fill="#181818" points="228.1899,179.668,232.1899,189.668,236.1899,179.668,232.1899,183.668" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="361.2341" x2="373.2341" y1="153.2656" y2="153.2656"/><polygon fill="#181818" points="369.2341,229.1367,373.2341,239.1367,377.2341,229.1367,373.2341,233.1367" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="373.2341" x2="373.2341" y1="153.2656" y2="303.1367"/><line style="stroke:#181818;stroke-width:1;" x1="373.2341" x2="232.1899" y1="303.1367" y2="303.1367"/><line style="stroke:#181818;stroke-width:1;" x1="232.1899" x2="232.1899" y1="303.1367" y2="323.1367"/><polygon fill="#181818" points="228.1899,313.1367,232.1899,323.1367,236.1899,313.1367,232.1899,317.1367" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="232.1899" x2="232.1899" y1="121.2656" y2="141.26