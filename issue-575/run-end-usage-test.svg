<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="510px" preserveAspectRatio="none" style="width:479px;height:510px;background:#FFFFFF;" version="1.1" viewBox="0 0 479 510" width="479px" zoomAndPan="magnify"><title>The usage of a run and the next start</title><defs/><g><g class="title" data-source-line="13"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="296.1055" x="90.3577" y="32.9951">The usage of a run and the next start</text></g><ellipse cx="235.926" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="130.0684" x="170.8918" y="87.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="110.0684" x="180.8918" y="108.4355">an agent run ends</text><rect fill="#FFFFFF" height="61.9063" rx="12.5" ry="12.5" style="stroke:#D62728;stroke-width:3;" width="280.5195" x="95.6663" y="141.2656"/><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="216.7793" x="105.6663" y="162.4043">store the usage that the run reports</text><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="147" x="105.6663" y="176.373">and the time of the read</text><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="260.5195" x="105.6663" y="190.3418">(the real path, no usage stored by the test)</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="193.1094" x="139.3713" y="223.1719"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="158.959" x="149.3713" y="244.3105">the end of the run decides</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="173.1094" x="149.3713" y="258.2793">the next request to an agent</text><polygon fill="#F1F1F1" points="118.8818,291.1094,352.9702,291.1094,364.9702,303.1094,352.9702,315.1094,118.8818,315.1094,106.8818,303.1094,118.8818,291.1094" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="234.0884" x="118.8818" y="306.9175">stored usage read at most 5 minutes ago?</text><text fill="#D62728" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="87.8735" y="300.5151">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="364.9702" y="300.5151">no</text><rect fill="#FFFFFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#D62728;stroke-width:3;" width="171.7637" x="11" y="325.1094"/><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="94.875" x="21" y="346.248">no minimal run,</text><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="151.7637" x="21" y="360.2168">the stored usage decides</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="187.7012" x="281.1196" y="325.1094"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="167.7012" x="291.1196" y="346.248">minimal run of Claude Code</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="100.1836" x="291.1196" y="360.2168">(read the usage)</text><polygon fill="#F1F1F1" points="235.926,379.0469,247.926,391.0469,235.926,403.0469,223.926,391.0469,235.926,379.0469" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="254.832" x="108.51" y="423.0469"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="234.832" x="118.51" y="444.1855">the limits decide, then the agent starts</text><ellipse cx="235.926" cy="488.0156" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="235.926" cy="488.0156" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="235.926" x2="235.926" y1="67.2969" y2="87.2969"/><polygon fill="#181818" points="231.926,77.2969,235.926,87.2969,239.926,77.2969,235.926,81.2969" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="235.926" x2="235.926" y1="121.2656" y2="141.2656"/><polygon fill="#181818" points="231.926,131.2656,235.926,141.2656,239.926,131.2656,235.926,135.2656" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="235.926" x2="235.926" y1="203.1719" y2="223.1719"/><polygon fill="#181818" points="231.926,213.1719,235.926,223.1719,239.926,213.1719,235.926,217.1719" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="106.8818" x2="96.8818" y1="303.1094" y2="303.1094"/><line style="stroke:#181818;stroke-width:1;" x1="96.8818" x2="96.8818" y1="303.1094" y2="325.1094"/><polygon fill="#181818" points="92.8818,315.1094,96.8818,325.1094,100.8818,315.1094,96.8818,319.1094" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="364.9702" x2="374.9702" y1="303.1094" y2="303.1094"/><line style="stroke:#181818;stroke-width:1;" x1="374.9702" x2="374.9702" y1="303.1094" y2="325.1094"/><polygon fill="#181818" points="370.9702,315.1094,374.9702,325.1094,378.9702,315.1094,374.9702,319.1094" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="96.8818" x2="96.8818" y1="373.0469" y2="391.0469"/><line style="stroke:#181818;stroke-width:1;" x1="96.8818" x2="223.926" y1="391.0469" y2="391.0469"/><polygon f