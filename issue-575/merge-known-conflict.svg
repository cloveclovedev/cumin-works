<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="875px" preserveAspectRatio="none" style="width:543px;height:875px;background:#FFFFFF;" version="1.1" viewBox="0 0 543 875" width="543px" zoomAndPan="magnify"><title>At every poll, for an issue in cumin/status/merging</title><defs/><g><g class="title" data-source-line="13"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="401.1738" x="69.8857" y="32.9951">At every poll, for an issue in cumin/status/merging</text></g><ellipse cx="270.311" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="252.6816" x="143.9702" y="87.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="232.6816" x="153.9702" y="108.4355">Read the issue again: the pull request,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="214.5527" x="153.9702" y="122.4043">the reviews, the checks, mergeable</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="220.877" x="159.8726" y="205.2461"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="137.584" x="169.8726" y="226.3848">Go back to the checks:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="200.877" x="169.8726" y="240.3535">cumin/status/checking, no merge</text><ellipse cx="270.311" cy="285.3125" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="270.311" cy="285.3125" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="176.051,155.2344,364.571,155.2344,376.571,168.0391,364.571,180.8438,176.051,180.8438,164.051,168.0391,176.051,155.2344" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="274.311" y="191.0542">no</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="188.52" x="176.051" y="165.4448">The conditions of the merge hold?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="126.3765" x="176.051" y="178.2495">(MergeConditionsHold)</text><rect fill="#FFFFFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#D62728;stroke-width:3;" width="191.6563" x="174.4829" y="386.7148"/><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="95.6191" x="184.4829" y="407.8535">Send no merge.</text><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="171.6563" x="184.4829" y="421.8223">Request a conflict resolution</text><polygon fill="#F1F1F1" points="191.0015,458.5513,349.6206,458.5513,361.6206,471.356,349.6206,484.1606,191.0015,484.1606,179.0015,471.356,191.0015,458.5513" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="158.6191" x="191.0015" y="468.7617">The one check before a start</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="84.9761" x="191.0015" y="481.5664">gives a permit?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="159.9932" y="468.7617">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="98.5811" x="361.6206" y="455.957">no: quota limit, or</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="146.3247" x="361.6206" y="468.7617">stop after the current runs</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="217.5313" x="49.6997" y="494.1606"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="168.9023" x="59.6997" y="515.2993">cumin/status/implementing,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="197.5313" x="59.6997" y="529.2681">then the Implementer resolves it</text><rect fill="#FFFFFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#D62728;stroke-width:3;" width="189.8516" x="287.231" y="494.1606"/><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="169.8516" x="297.231" y="515.2993">Keep cumin/status/merging.</text><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="102.0117" x="297.231" y="529.2681">No call to GitHub</text><polygon fill="#F1F1F1" points="270.311,548.0981,282.311,560.0981,270.311,572.0981,258.311,560.0981,270.311,548.0981" style="stroke:#181818;stroke-width:0.5;"/><ellipse cx="270.311" cy="603.0981" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="270.311" cy="603.0981" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="192.5188,338.3125,348.1033,338.3125,360.1033,350.3125,348.1033,362.3125,192.5188,362.3125,180.5188,350.3125,192.5188,338.3125" style="stroke:#181818;stroke-width:0.5;"/><text fill="#D62728" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="274.311" y="372.5229">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="155.5845" x="192.5188" y="354.1206">mergeable is CONFLICTING?</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="192.6699" x="173.9761" y="656.0981"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="172.6699" x="183.9761" y="677.2368">cumin-core sends the merge</text><polygon fill="#F1F1F1" points="190.177,710.0669,350.4451,710.0669,362.4451,722.0669,350.4451,734.0669,190.177,734.0669,178.177,722.0669,190.177,710.0669" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="160.2681" x="190.177" y="725.875">GitHub refuses for a conflict?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="159.1687" y="719.4727">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="362.4451" y="719.4727">no</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="275.1406" x="11" y="744.0669"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="171.6563" x="21" y="765.2056">Request a conflict resolution</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="255.1406" x="21" y="779.1743">(as today, for UNKNOWN or a late conflict)</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="171.8223" x="306.1406" y="744.0669"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="151.8223" x="316.1406" y="765.2056">Merged, kept, or stopped</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="147.7207" x="316.1406" y="779.1743">for the Owner (as today)</text><polygon fill="#F1F1F1" points="270.311,798.0044,282.311,810.0044,270.311,822.0044,258.311,810.0044,270.311,798.0044" style="stroke:#181818;stroke-width:0.5;"/><ellipse cx="270.311" cy="853.0044" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="270