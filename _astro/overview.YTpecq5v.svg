<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="444px" preserveAspectRatio="none" style="width:1344px;height:444px;background:#FFFFFF;" version="1.1" viewBox="0 0 1344 444" width="1344px" zoomAndPan="magnify"><defs/><g><g id="Checking"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="178.7891" x="463" y="7"/><line style="stroke:#181818;stroke-width:0.5;" x1="463" x2="641.7891" y1="33.2969" y2="33.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="62.6377" x="521.0757" y="24.9951">checking</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="158.7891" x="468" y="49.4355">(the implementation area)</text></g><g id="Reviewing"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="274.7305" x="415.03" y="182.63"/><line style="stroke:#181818;stroke-width:0.5;" x1="415.03" x2="689.7605" y1="208.9269" y2="208.9269"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="68.2568" x="518.2668" y="200.6251">reviewing</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="254.7305" x="420.03" y="225.0655">do / the Reviewer reviews the pull request</text></g><g id="Implementing"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="178.7891" x="7" y="388.26"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="185.7891" y1="414.5569" y2="414.5569"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="97.1797" x="47.8047" y="406.2551">implementing</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="158.7891" x="12" y="430.6955">(the implementation area)</text></g><g id="Decision"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="177.582" x="463.6" y="388.26"/><line style="stroke:#181818;stroke-width:0.5;" x1="463.6" x2="641.182" y1="414.5569" y2="414.5569"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="122.3975" x="491.1923" y="406.2551">awaiting-decision</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="157.582" x="468.6" y="430.6955">do / the Assignee answers</text></g><g id="Merge"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="274.7207" x="922.03" y="388.26"/><line style="stroke:#181818;stroke-width:0.5;" x1="922.03" x2="1196.7507" y1="414.5569" y2="414.5569"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="254.7207" x="932.03" y="406.2551">merging or awaiting-merge-decision</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="102.7148" x="927.03" y="430.6955">(the merge area)</text></g><!--link Checking to Reviewing--><g class="link" data-entity-1="Checking" data-entity-2="Reviewing" data-source-line="23" data-uid="lnk2" id="link_Checking_Reviewing"><path d="M462.69,57.53 C449.5,64.97 437.62,74.66 429.39,87.26 C417.98,104.76 419.03,116.13 429.39,134.26 C441.51,155.46 457.2021,168.2824 478.4521,179.4824" fill="none" id="Checking-to-Reviewing" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="483.76,182.28,477.6632,174.5451,479.3368,179.9487,473.9331,181.6222,483.76,182.28" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="122.5796" x="468.2919" y="100.3269">request the review</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.3833" x="430.39" y="115.4597">[every required check passed]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.5054" x="439.829" y="130.5925">/ cumin starts the Reviewer</text></g><!--link Reviewing to Checking--><g class="link" data-entity-1="Reviewing" data-entity-2="Checking" data-source-line="25" data-uid="lnk4" id="link_Reviewing_Checking"><path d="M591.83,182.4 C607.89,170.14 624.69,153.73 633.39,134.26 C641.92,115.19 643.24,105.69 633.39,87.26 C626.94,75.18 621.3932,68.7453 610.0832,60.9153" fill="none" id="Reviewing-to-Checking" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="605.15,57.5,610.2729,65.9117,609.261,60.346,614.8266,59.3341,605.15,57.5" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.8477" x="737.476" y="100.3269">go back to the checks</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335.2197" x="641.29" y="115.4597">[no Reviewer runs, and: the head commit changed,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="306.1982" x="655.8007" y="130.5925">or APPROVE but a required check did not pass]</text></g><!--link Reviewing to Implementing--><g class="link" data-entity-1="Reviewing" data-entity-2="Implementing" data-source-line="24" data-uid="lnk3" id="link_Reviewing_Implementing"><path d="M414.71,213.71 C301.12,220.86 152.22,238.38 111.39,281.26 C84.38,309.64 85.8401,352.6909 90.4001,382.0809" fill="none" id="Reviewing-to-Implementing" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="91.32,388.01,93.8928,378.5031,90.5534,383.0691,85.9874,379.7297,91.32,388.01" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.2256" x="177.0821" y="294.3269">request a review fix</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258.6099" x="112.39" y="309.4597">[no Reviewer runs, REQUEST_CHANGES</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.4966" x="120.9466" y="324.5925">on the head commit, below the limit]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.8965" x="140.2467" y="339.7253">/ cumin starts the Implementer</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.105" x="177.1424" y="354.8581">in the same session</text></g><!--link Reviewing to Reviewing--><g class="link" data-entity-1="Reviewing" data-entity-2="Reviewing" data-source-line="26" data-uid="lnk5" id="link_Reviewing_Reviewing"><path d="M689.99,199.49 C710.71,200.77 724.76,203.53 724.76,207.76 C724.76,212 716.6986,214.39 695.9786,215.67" fill="none" id="Reviewing-to-Reviewing" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="689.99,216.04,699.2195,219.4775,694.9805,215.7317,698.7262,211.4927,689.99,216.04" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.7476" x="814.4285" y="189.8269">request the review again</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="330.0845" x="730.76" y="204.9597">[no Reviewer runs, no review on the head commit,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="148.7319" x="821.4363" y="220.0925">no question, first time]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="219.6733" x="785.9656" y="235.2253">/ cumin starts the Reviewer again</text></g><!--link Reviewing to Reviewing--><g class="link" data-entity-1="Reviewing" data-entity-2="Reviewing" data-source-line="27" 