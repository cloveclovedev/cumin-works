if" font-size="13" lengthAdjust="spacing" textLength="270.6958" x="394.39" y="324.4597">[the Reviewer wrote the cause comment]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.4072" x="479.5343" y="339.5925">/ cumin notifies</text></g><!--link Reviewing to Decision--><g class="link" data-entity-1="Reviewing" data-entity-2="Decision" data-source-line="29" data-uid="lnk8" id="link_Reviewing_Decision"><path d="M616.53,233.29 C637.17,244.6 657.71,260.28 669.39,281.26 C686.04,311.16 687.83,329.43 669.39,358.26 C661.44,370.71 655.0072,377.3419 642.1272,384.7719" fill="none" id="Reviewing-to-Decision-1" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="636.93,387.77,646.7246,386.7377,641.261,385.2716,642.7271,379.808,636.93,387.77" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.9531" x="788.0673" y="294.3269">stop the review</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="292.2271" x="692.4304" y="309.4597">[no Reviewer runs, and: the Reviewer asked,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="181.3589" x="747.8645" y="324.5925">or no review after the retry,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309.9878" x="683.55" y="339.7253">or not exactly one risk label, or no pull request]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.4072" x="788.3403" y="354.8581">/ cumin notifies</text></g><!--link Reviewing to Merge--><g class="link" data-entity-1="Reviewing" data-entity-2="Merge" data-source-line="30" data-uid="lnk9" id="link_Reviewing_Merge"><path d="M690.13,216.72 C803.77,225.83 953.77,244.51 1001.39,281.26 C1035.39,307.5 1048.7653,352.0302 1054.6153,382.1302" fill="none" id="