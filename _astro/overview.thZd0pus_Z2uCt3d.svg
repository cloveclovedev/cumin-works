<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="586px" preserveAspectRatio="none" style="width:1274px;height:586px;background:#FFFFFF;" version="1.1" viewBox="0 0 1274 586" width="1274px" zoomAndPan="magnify"><defs/><g><g id="Before"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="361.0791" x="434.05" y="7"/><line style="stroke:#181818;stroke-width:0.5;" x1="434.05" x2="795.1291" y1="33.2969" y2="33.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="341.0791" x="444.05" y="24.9951">planning, implementing, or awaiting-plan-review</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="89.6191" x="439.05" y="49.4355">(the plan area)</text></g><g id="Accepting"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="315.2422" x="456.97" y="197.64"/><line style="stroke:#181818;stroke-width:0.5;" x1="456.97" x2="772.2122" y1="223.9369" y2="223.9369"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="68.6123" x="580.2849" y="215.6351">accepting</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="295.2422" x="461.97" y="240.0755">do / the Planner checks the requirement on main</text></g><g id="AwaitingAcceptance"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="261.8398" x="103.67" y="388.27"/><line style="stroke:#181818;stroke-width:0.5;" x1="103.67" x2="365.5098" y1="414.5669" y2="414.5669"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="145.4141" x="161.8829" y="406.2651">awaiting-acceptance</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="241.8398" x="108.67" y="430.7055">do / the Assignee accepts or sends back</text></g><g id="PlanReview"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="166.5762" x="531.3" y="388.27"/><line style="stroke:#181818;stroke-width:0.5;" x1="531.3" x2="697.8762" y1="414.5669" y2="414.5669"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="146.5762" x="541.3" y="406.2651">awaiting-plan-review</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="89.6191" x="536.3" y="430.7055">(the plan area)</text></g><g id="Implementing"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="117.1797" x="7" y="530.53"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="124.1797" y1="556.8269" y2="556.8269"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="97.1797" x="17" y="548.5251">implementing</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="89.6191" x="12" y="572.9655">(the plan area)</text></g><g id="Decision"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="177.582" x="913.8" y="388.27"/><line style="stroke:#181818;stroke-width:0.5;" x1="913.8" x2="1091.382" y1="414.5669" y2="414.5669"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="122.3975" x="941.3923" y="406.2651">awaiting-decision</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="157.582" x="918.8" y="430.7055">do / the Assignee answers</text></g><g id="Ready"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="109.6191" x="947.78" y="530.53"/><line style="stroke:#181818;stroke-width:0.5;" x1="947.78" x2="1057.3991" y1="556.8269" y2="556.8269"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="40.1201" x="982.5295" y="548.5251">ready</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="89.6191" x="952.78" y="572.9655">(the plan area)</text></g><ellipse cx="403.59" cy="555.67" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="403.59" cy="555.67" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><!--link Before to Accepting--><g class="link" data-entity-1="Before" data-entity-2="Accepting" data-source-line="29" data-uid="lnk2" id="link_Before_Accepting"><path d="M614.59,57.41 C614.59,93.53 614.59,155.05 614.59,191.29" fill="none" id="Before-to-Accepting" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="614.59,197.29,618.59,188.29,614.59,192.29,610.59,188.29,614.59,197.29" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.4536" x="699.4775" y="100.3369">request the acceptance check</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="364.2285" x="615.59" y="115.4697">[every sub-issue is closed, no check after the last close,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="350.8413" x="622.2836" y="130.6025">the follow-up notes are written, cumin has a free slot]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="168.4351" x="713.4867" y="145.7353">/ cumin starts the Planner</text></g><!--link Accepting to AwaitingAcceptance--><g class="link" data-entity-1="Accepting" data-entity-2="AwaitingAcceptance" data-source-line="30" data-uid="lnk3" id="link_Accepting_AwaitingAcceptance"><path d="M456.8,239.66 C376.9,250.88 290.9,268.89 262.59,296.27 C237.99,320.06 233.495,355.4301 233.385,381.8301" fill="none" id="Accepting-to-AwaitingAcceptance" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="233.36,387.83,237.3975,378.8467,233.3808,382.83,229.3975,378.8134,233.36,387.83" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="148.8335" x="358.3573" y="309.3369">ask for the acceptance</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="338.3682" x="263.59" y="324.4697">[an acceptance check comment after the last close,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.667" x="348.9406" y="339.6025">every sub-issue is closed]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.4072" x="382.5705" y="354.7353">/ cumin notifies</text></g><!--link Accepting to PlanReview--><g class="link" data-entity-1="Accepting" data-entity-2="PlanReview" data-source-line="31" data-uid="lnk4" id="link_Accepting_PlanReview"><path d="M613.32,248.26 C612.66,262.31 611.92,280.27 611.59,296.27 C611.02,323.82 610.83,330.72 611.59,358.27 C611.86,367.96 612.0511,372.6302 612.5911,381.9002" fill="none" id="Accepting-to-PlanReview" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="612.94,387.89,616.4098,378.6726,612.6492,382.8985,608.4234,379.1378,612.94,387.89" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="149.354" x="711.0358" y="309.3369">ask for the plan review</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="338.3682" x="616.5287" y="324.4697">[an acceptance check comment after the last close,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="346.2456" x="612.59" y="339.6025">an open sub-issue, each open one has one risk label]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.4072" x="735.5092" y="354.7353">/ cumin notifies</text></g><!--link Accepting to Accepting--><g class="link" data-entity-1="Accepting" data-entity-2="Accepting" data-source-line="32" data-uid="lnk5" id="link_Accepting_Accepting"><path d="M772.54,205.49 C793.39,208.44 807.21,214.2 807.21,222.77 C807.21,231.34 799.3308,236.2595 778.4808,239.2095" fill="none" id="Accepting-to-Accepting" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="772.54,240.05,782.0116,242.7497,777.4907,239.3495,780.8909,234.8286,772.54,240.05" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="236.6216" x="843.0948" y="197.3369">request the acceptance check again</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="296.3911" x="813.21" y="212.4697">[no Planner runs, no question, first time, and:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="268.2393" x="827.2859" y="227.6025">no check comment, or an open sub-issue</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.5679" x="863.1216" y="242.7353">without exactly one risk label]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.603" x="857.104" y="257.8681">/ cumin starts the Planner again</text></g><!--link Accepting to Decision--><g class="link" data-entity-1="Accepting" data-entity-2="Decision" data-source-line="33" data-uid="lnk6" id="link_Accepting_Decision"><path d="M772.5,241.13 C850.77,252.71 934.66,270.6 963.59,296.27 C990,319.7 997.9416,355.612 1000.6916,382.152" fill="none" id="Accepting-to-Decision" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" poin