<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="555px" preserveAspectRatio="none" style="width:1180px;height:555px;background:#FFFFFF;" version="1.1" viewBox="0 0 1180 555" width="1180px" zoomAndPan="magnify"><defs/><g><g id="Ready"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="378.3594" x="461.24" y="103"/><line style="stroke:#181818;stroke-width:0.5;" x1="461.24" x2="839.5994" y1="129.2969" y2="129.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="40.1201" x="630.3596" y="120.9951">ready</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="358.3594" x="466.24" y="145.4355">do / cumin waits until the repository can take another issue</text></g><g id="Implementing"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="186.5059" x="232.17" y="301.13"/><line style="stroke:#181818;stroke-width:0.5;" x1="232.17" x2="418.6759" y1="327.4269" y2="327.4269"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="97.1797" x="276.8331" y="319.1251">implementing</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="166.5059" x="237.17" y="343.5655">do / the Implementer works</text></g><g id="Checking"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="118.8418" x="7" y="499.26"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="125.8418" y1="525.5569" y2="525.5569"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="62.6377" x="35.1021" y="517.2551">checking</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="98.8418" x="12" y="541.6955">(the check area)</text></g><g id="Decision"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="177.582" x="669.63" y="499.26"/><line style="stroke:#181818;stroke-width:0.5;" x1="669.63" x2="847.212" y1="525.5569" y2="525.5569"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="122.3975" x="697.2223" y="517.2551">awaiting-decision</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="157.582" x="674.63" y="541.6955">do / the Assignee answers</text></g><ellipse cx="650.42" cy="16" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><!--link *start* to Ready--><g class="link" data-entity-1=".start." data-entity-2="Ready" data-source-line="20" data-uid="lnk3" id="link_.start._Ready"><path d="M650.42,26.39 C650.42,43.14 650.42,72.67 650.42,96.73" fill="none" id="*start*-to-Ready" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="650.42,102.73,654.42,93.73,650.42,97.73,646.42,93.73,650.42,102.73" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="158.1519" x="651.42" y="69.0669">a Maintainer adds ready</text></g><!--link Ready to Implementing--><g class="link" data-entity-1="Ready" data-entity-2="Implementing" data-source-line="21" data-uid="lnk4" id="link_Ready_Implementing"><path d="M581.43,153.71 C560.68,162.09 538.18,172.17 518.42,183.26 C456.04,218.3 394.9653,266.514 358.5753,296.904" fill="none" id="Ready-to-Implementing" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="353.97,300.75,363.4419,298.0512,357.8077,297.545,358.3139,291.9109,353.97,300.75" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.3047" x="642.9137" y="196.3269">request the implementation</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="429.292" x="519.42" y="211.4597">[a Maintainer added ready, the repository can take another issue,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="289.3008" x="589.4156" y="226.5925">no owner-task, and: the blockers are closed,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="353.8057" x="557.1632" y="241.7253">or the only open blocker waits for the merge decision]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.8965" x="632.6178" y="256.8581">/ cumin starts the Implementer</text></g><!--link Implementing to Checking--><g class="link" data-entity-1="Implementing" data-entity-2="Checking" data-source-line="22" data-uid="lnk5" id="link_Implementing_Checking"><path d="M231.83,338.29 C165.35,348.26 84.32,365.55 63.42,392.26 C39.64,422.67 46.9098,464.564 55.7198,493.274" fill="none" id="Implementing-to-Checking" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="57.48,499.01,58.6638,489.2325,56.0132,494.23,51.0157,491.5794,57.48,499.01" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.7476" x="219.2235" y="420.3269">wait for the checks</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="433.3545" x="64.42" y="435.4597">[the Implementer run has ended, the implementation is complete]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.6489" x="153.7728" y="450.5925">/ cumin links the pull request if needed</text></g><!--link Implementing to Implementing--><g class="link" data-entity-1="Implementing" data-entity-2="Implementing" data-source-line="23" data-uid="lnk6" id="link_Implementing_Implementing"><path d="M419.09,307.28 C439.15,309.17 453.67,315.5 453.67,326.26 C453.67,337.03 445.1235,342.7972 425.0635,344.6872" fill="none" id="Implementing-to-Implementing" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="419.09,345.25,428.4255,348.3881,424.068,344.781,427.6751,340.4234,419.09,345.25" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.4727" x="577.3524" y="308.3269">request the implementation again</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="457.8374" x="459.67" y="323.4597">[the Implementer run has ended, the implementation is not complete,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="148.7319" x="614.2227" y="338.5925">no question, first time]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.0645" x="567.0565" y="353.7253">/ cumin starts the Implementer again</text></g><!--link Implementing to Decision--><g class="link" data-entity-1="Implementing" data-entity-2="Decision" data-source-line="24" data-uid="lnk7" id="link_Implementing_Decision"><path d="M418.83,346.64 C448.27,356.41 479.15,370.9 502.42,392.26 C530.25,417.81 509.22,445.29 538.42,469.26 C574.98,499.28 619.7889,512.201 663.3389,518.351" fill="none" id="Implementing-to-Decision" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="669.28,519.19,660.9277,513.9708,664.3291,518.4909,659.8091,521.8922,669.28,519.19" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="160.6782" x="663.7611" y="405.3269">stop the implementation</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="409.3604" x="539.42" y="420.4597">[the Implementer run has ended, and: the Implementer asked,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="351.019" x="568.5907" y="435.5925">or the implementation is not complete after the retry,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.3003" x="604.95" y="450.7253">or the conflict resolution changed nothing]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.4072" x="693.8966" y="465.8581">/ cumin notifies</text></g><!--link Decision to Ready--><g class="link" data-entity-1="Decision" data-entity-2="Ready" data-source-line="25" data-uid="lnk8" id="link_Decision_Ready"><path d="M847.58,509.38 C892.39,500.33 940,486.92 953.42,469.26 C1030.35,368.07 1035.02,280.73 953.42,183.26 C937.13,163.8 897.1286,152.253 845.8086,144.263" fill="none" id="Decision-to-Ready" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="839.88,143.34,848.1575,148.6769,844.8205,144.1092,849.3882,140.7721,839.88,143.34" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="158.1519" x="1013.88" y="330.8269">a Maintainer adds ready</text></g><!--SRC=[dLDDRzim3BtxLn3PeTiG9_SS1XJRiEsmowvf3ef4suHjoHDb6Fxte-IFkccn5iqXi2ZoyV4zwWvqtvBD1-ThXXn2XS111MHm1IWBr7ODjcWbHawEp3q2sPHuSoTr9HwoExYV82GP53JgYWt8zGyAF_lh7WPF8Q25WKBb-W2xnE0OIte-xWwmCmwEEs0rCWoLWudRt3CXJqs2LvPffhN0da3f53gNlVBc0aV1K64Q4un3FaXfwTKuanHspfOCmScuJbfuK1vLRF47hK5_0j_BSDfJ5_ZeKomtf0IZvGDN8EYHcNSkHD7IDtPEg3a_7hAi8eE0RHT6C3ZX2C4ic_hlf9aPTw1O-ibNblxX1565cVQWA33qDb1p0mzQF0ggnfLyScW5NoqYMwOUlpQ1R7jOEaRyDIvuIVqLJrUewmNhwto03z_JBri39_WOSL9salFJYg3YC9AJ6zJ48aI2-ZOVikLZI-UUcKgBSKOUq0kRy-SBvFaNMBHIy5kHx27PQ9yn37wZPSoy6TNZtnuvlB363_PyYuPcWjk_JVpzWxKEt23LUL1Sx-NQd5BjjN6wbWcY9g0RnsWas_bqwMmpWklaQSnfi-_5VD-YBn4MsIuFTbaFKTPBterpJzsD6cpiYSWhSBA9PV1Rx-FYL-9Et7cpV-dDoyFJBeO2RWWrPEk9JzStpIes5I0k2jHpQc-s1rGflhoNgzYqyfriIdtaTWy5-TYHMdnLsed4yoasoyl1TIzlrol4rrrvqe_hxQRyV