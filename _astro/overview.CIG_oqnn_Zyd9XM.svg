<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="328px" preserveAspectRatio="none" style="width:1104px;height:328px;background:#FFFFFF;" version="1.1" viewBox="0 0 1104 328" width="1104px" zoomAndPan="magnify"><defs/><g><!--entity Decide--><g class="entity" data-entity="Decide" data-source-line="6" data-uid="ent0002" id="entity_Decide"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="197.29" x="94.9" y="7"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="177.29" x="104.9" y="29.9951">a person needs to decide</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="137.4297" x="104.9" y="46.292">(an awaiting- state)</text></g><!--entity Wrong--><g class="entity" data-entity="Wrong" data-source-line="7" data-uid="ent0003" id="entity_Wrong"><rect fill="#F1F1F1" height="85.1875" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="373.0967" x="7" y="94.71"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="137.7373" x="17" y="117.7051">something is wrong</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="353.0967" x="17" y="134.002">(no permission, no Assignee, an unreadable issue,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="259.7451" x="17" y="150.2989">an unread usage, a failed tool check,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="160.542" x="17" y="166.5957">no ruleset, failed polls)</text></g><!--entity Limit--><g class="entity" data-entity="Limit" data-source-line="8" data-uid="ent0004" id="entity_Limit"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="226.9648" x="80.07" y="215.15"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="206.9648" x="90.07" y="238.1451">a usage reaches its threshold</text></g><!--entity Waits--><g class="entity" data-entity="Waits" data-source-line="9" data-uid="ent0005" id="entity_Waits"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="220.3135" x="83.39" y="286.15"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="200.3135" x="93.39" y="309.1451">no issue cumin can move on</text></g><!--entity Notify--><g class="entity" data-entity="Notify" data-source-line="11" data-uid="ent0006" id="entity_Notify"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="246.2969" x="441.1" y="159"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="82.9473" x="451.1" y="181.9951">notify once:</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="226.2969" x="451.1" y="198.292">a link and one line of the reason</text></g><!--entity GitHub--><g class="entity" data-entity="GitHub" data-source-line="12" data-uid="ent0007" id="entity_GitHub"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="229.5693" x="869.39" y="159"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="209.5693" x="879.39" y="181.9951">the issue and the pull request</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="197.4629" x="879.39" y="198.292">hold the details and the talk</text></g><!--link Decide to Notify--><g class="link" data-entity-1="Decide" data-entity-2="Notify" data-source-line="14" data-uid="lnk8" id="link_Decide_Notify"><path d="M292.56,50.77 C321.32,57.43 352.46,66.17 380.1,77.