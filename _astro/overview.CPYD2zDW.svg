<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="561px" preserveAspectRatio="none" style="width:2103px;height:561px;background:#FFFFFF;" version="1.1" viewBox="0 0 2103 561" width="2103px" zoomAndPan="magnify"><defs/><g><g id="Reviewing"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="123.6582" x="991.57" y="7"/><line style="stroke:#181818;stroke-width:0.5;" x1="991.57" x2="1115.2282" y1="33.2969" y2="33.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="68.2568" x="1019.2707" y="24.9951">reviewing</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="103.6582" x="996.57" y="49.4355">(the review area)</text></g><g id="MergeDecision"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="273.0957" x="916.85" y="164.27"/><line style="stroke:#181818;stroke-width:0.5;" x1="916.85" x2="1189.9457" y1="190.5669" y2="190.5669"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="172.9561" x="966.9198" y="182.2651">awaiting-merge-decision</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="253.0957" x="921.85" y="206.7055">do / the Assignee reviews the pull request</text></g><g id="Merging"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="231.4414" x="373.67" y="327.4"/><line style="stroke:#181818;stroke-width:0.5;" x1="373.67" x2="605.1114" y1="353.6969" y2="353.6969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="58.543" x="460.1192" y="345.3951">merging</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="211.4414" x="378.67" y="369.8355">do / cumin merges the pull request</text></g><g id="Implementing"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="178.7891" x="961" y="505.53"/><line style="stroke:#181818;stroke-width:0.5;" x1="961" x2="1139.7891" y1="531.8269" y2="531.8269"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="97.1797" x="1001.8047" y="523.5251">implementing</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="158.7891" x="966" y="547.9655">(the implementation area)</text></g><g id="Checking"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="178.7891" x="7" y="505.53"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="185.7891" y1="531.8269" y2="531.8269"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="62.6377" x="65.0757" y="523.5251">checking</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="158.7891" x="12" y="547.9655">(the implementation area)</text></g><g id="AwaitingBase"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="325.2793" x="1462.75" y="327.4"/><line style="stroke:#181818;stroke-width:0.5;" x1="1462.75" x2="1788.0293" y1="353.6969" y2="353.6969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="166.7627" x="1542.0083" y="345.3951">awaiting-blocker-merge</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="305.2793" x="1467.75" y="369.8355">no one works; the pull request of the blocker waits</text></g><g id="Decision"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="177.582" x="1449.6" y="505.53"/><line style="stroke:#181818;stroke-width:0.5;" x1="1449.6" x2="1627.182" y1="531.8269" y2="531.8269"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="122.3975" x="1477.1923" y="523.5251">awaiting-decision</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="157.582" x="1454.6" y="547.9655">do / the Assignee answers</text></g><ellipse cx="381.39" cy="530.67" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="381.39" cy="530.67" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><!--link Reviewing to Merging--><g class="link" data-entity-1="Reviewing" data-entity-2="Merging" data-source-line="29" data-uid="lnk2" id="link_Reviewing_Merging"><path d="M991.27,38.71 C860.41,51.83 563.28,89.36 500.39,164.27 C461.66,210.42 471.7699,281.8233 481.1299,321.1233" fill="none" id="Reviewing-to-Merging" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="482.52,326.96,484.326,317.2781,481.3616,322.096,476.5437,319.1316,482.52,326.96" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="102.1338" x="649.211" y="178.9669">start the merge</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="397.7759" x="501.39" y="194.0997">[the Reviewer run has ended, APPROVE on the head commit,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="372.7534" x="513.9012" y="209.2325">the required checks passed, risk low, no base to wait for]</text></g><!--link Reviewing to MergeDecision--><g class="link" data-entity-1="Reviewing" data-entity-2="MergeDecision" data-source-line="30" data-uid="lnk3" id="link_Reviewing_MergeDecision"><path d="M1053.39,57.74 C1053.39,86.81 1053.39,128.89 1053.39,157.91" fill="none" id="Reviewing-to-MergeDecision" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1053.39,163.91,1057.39,154.91,1053.39,158.91,1049.39,154.91,1053.39,163.91" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173.8496" x="1121.1483" y="100.3369">ask for the merge decision</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="209.9995" x="1103.0733" y="115.4697">[the same, risk medium or high]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="307.3662" x="1054.39" y="130.6025">/ cumin asks the Assignee for a review, notifies</text></g><!--link MergeDecision to Merging--><g class="link" data-entity-1="MergeDecision" data-entity-2="Merging" data-source-line="31" data-uid="lnk4" id="link_MergeDecision_Merging"><path d="M916.49,210.7 C832.61,223.46 737.71,238.59 718.39,244.53 C650.66,265.39 582.5154,299.6332 537.5454,324.2032" fill="none" id="MergeDecision-to-Merging" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="532.28,327.08,542.0959,326.275,536.6678,324.6827,538.2602,319.2546,532.28,327.08" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="102.1338" x="820.4637" y="257.5969">start the merge</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.2813" x="719.39" y="272.7297">[the Assignee's APPROVE on the head commit,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.6914" x="779.1849" y="287.8625">the required checks passed]</text></g><!--link MergeDecision to Implementing--><g class="link" data-entity-1="MergeDecision" data-entity-2="Implementing" data-source-line="32" data-uid="lnk5" id="link_MergeDecision_Implementing"><path d="M1053.18,214.8 C1052.63,277.4 1051.2129,437.1402 1050.6629,499.4902" fill="none" id="MergeDecision-to-Implementing" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1050.61,505.49,1054.6892,496.5256,1050.6541,500.4902,1046.6895,496.4551,1050.61,505.49" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.2085" x="1141.2098" y="334.5969">request an assignee review fix</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375.248" x="1053.19" y="349.7297">[the Assignee's REQUEST_CHANGES on the head commit,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="253.8364" x="1113.8958" y="364.8625">after the last awaiting-merge-decision]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="336.1338" x="1072.7471" y="379.9953">/ cumin starts the Implementer in the same session</text></g><!--link Reviewing to AwaitingBase--><g class="link" data-entity-1="Reviewing" data-entity-2="AwaitingBase" data-source-line="33" data-uid="lnk6" id="link_Reviewing_AwaitingBase"><path d="M1115.43,32.51 C1182.11,34.3 1289.44,44.48 1370.39,87.27 C1482.85,146.7 1571.5857,268.9819 1606.7457,322.2719" fill="none" id="Reviewing-to-AwaitingBase" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1610.05,327.28,1608.4323,317.5649,1607.2964,323.1065,1601.7548,321.9706,1610.05,327.28" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="109.9033" x="1587.0713" y="178.9669">wait for the base</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="237.0659" x="1523.49" y="194.0997">[the same, but the base is not main,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133.5293" x="1575.2583" y="209.2325">or a blocker is open]</text></g><!--link AwaitingBase to Implementing--><g class="link" data-entity-1="AwaitingBase" data-entity-2="Implementing" data-source-line="34" data-uid="lnk7" id="link_AwaitingBase_Implementing"><path d="M1492.41,378.08 C1469.39,386.6 1446.93,398.08 1428.39,413.53 C1404.58,433.39 1421.55,457.4 1396.39,475.53 C1356.45,504.34 1234.4843,517.9369 1145.9143,524.3469" fill="none" id="AwaitingBase-to-Implementing" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1139.93,524.78,1149.1953,528.1199,1144.917,524.4191,1148.6178,520.1408,1139.93,524.78" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.8423" x="1495.5358" y="426.5969">update onto the default branch</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="274.1362" x="1460.3888" y="441.7297">[the base is main, every blocker is closed,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="302.5293" x="1446.1922" y="456.8625">the head lacks the merge commit of the base]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="336.1338" x="1429.39" y="471.9953">/ cumin starts the Implementer in the same session</text></g><!--link AwaitingBase to Decision--><g class="link" data-entity-1="AwaitingBase" data-entity-2="Decision" data-source-line="35" data-uid="lnk8" id="link_AwaitingBase_Decision"><path d="M1732.02,378.04 C1748.75,386.56 1763.94,398.05 1774.39,413.53 C1789.82,436.37 1791.56,453.98 1774.39,475.53 C1755.96,498.67 1692.4057,511.9248 1633.5557,519.8948" fill="none" id="AwaitingBase-to-Decision" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1627.61,520.7,1637.0654,523.456,1632.5648,520.029,1635.9918,515.5283,1627.61,520.7" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="160.6782" x="1861.1132" y="426.5969">stop the implementation</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.0186" x="1829.943" y="441.7297">[the base closed without a merge,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="307.6646" x="1787.62" y="456.8625">or the base merged but the base branch stays]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.2075" x="1852.8485" y="471.9953">/ cumin comments, notifies</text></g><!--link Merging to Merging--><g class="link" data-entity-1="Merging" data-entity-2="Merging" data-source-line="36" data-uid="lnk9" id="link_Merging_Merging"><path d="M605.36,337.65 C625.84,339.61 640.12,344.57 640.12,352.53 C640.12,360.5 631.8127,364.8884 611.3327,366.8484" fill="none" id="Merging-to-Merging" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="605.36,367.42,614.7001,370.5444,610.3373,366.9437,613.938,362.5808,605.36,367.42" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="42.2563" x="795.6105" y="342.0969">merge</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="341.2373" x="646.12" y="357.2297">[not merged, the merge conditions hold, no conflict]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="246.1558" x="693.6608" y="372.3625">/ cumin merges the approved commit</text></g><!--link Merging to *end*--><g class="link" data-entity-1="Merging" data-entity-2=".end." data-source-line="37" data-uid="lnk11" id="link_Merging_.end."><path d="M417.15,378.11 C401.75,386.83 387.42,398.39 378.39,413.53 C357.94,447.83 369.0573,492.8464 375.9873,514.0664" fill="none" id="Merging-to-*end*" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="377.85,519.77,378.8584,509.9729,376.2978,515.017,371.2536,512.4564,377.85,519.77" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="151.1187" x="437.3155" y="434.0969">close the merged issue</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="60.6519" x="482.5489" y="449.2297">[merged]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="266.9697" x="379.39" y="464.3625">/ cumin closes the issue if GitHub did not</text></g><!--link Merging to Checking--><g class="link" data-entity-1="Merging" data-entity-2="Checking" data-source-line="38" data-uid="lnk12" id="link_Merging_Checking"><path d="M373.41,357.49 C276.97,363.33 149.97,377.78 114.39,413.53 C90.65,437.4 89.4482,472.7683 92.0182,499.1483" fill="none" id="Merging-to-Checking" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="92.6,505.12,95.7085,495.7746,92.1152,500.1436,87.7462,496.5503,92.6,505.12" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.8477" x="165.7682" y="441.5969">go back to the checks</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.604" x="115.39" y="456.7297">[not merged, a merge condition fails]</text></g><!--link Merging to Implementing--><g class="link" data-entity-1="Merging" data-entity-2="Implementing" data-source-line="39" data-uid="lnk13" id="link_Merging_Implementing"><path d="M588.03,378.13 C610.15,386.81 632.38,398.34 650.39,413.53 C674.75,434.08 660.03,457.64 686.39,475.53 C729.88,505.04 861.7932,518.5816 954.8132,524.7716" fill="none" id="Merging-to-Implementing" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="960.8,525.17,952.0855,520.5812,955.811,524.838,951.5543,528.5636,960.8,525.17" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.2729" x="764.3204" y="434.0969">request a conflict resolution</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.8154" x="731.0492" y="449.2297">[the merge conditions hold, a conflict]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="336.1338" x="687.39" y="464.3625">/ cumin starts the Implementer in the same session</text></g><!--link Merging to Decision--><g class="link" data-entity-1="Merging" data-entity-2="Decision" data-source-line="40" data-uid="lnk14" id="link_Merging_Decision"><path d="M605.35,358.05 C741.61,364.8 958.49,380.44 1032.39,413.53 C1070.02,430.38 1063.88,458.44 1101.39,475.53 C1161.57,502.96 1333.9919,517.6628 1443.3619,524.5528" fill="none" id="Merging-to-Decision" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1449.35,524.93,1440.6193,520.3721,1444.3599,524.6156,1440.1163,528.3562,1449.35,524.93" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="99.9312" x="1194.9896" y="426.5969">stop the merge</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="285.1304" x="1102.39" y="441.7297">[the merge was refused for another reason,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.3901" x="1146.7601" y="456.8625">or the issue cannot be closed]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.2075" x="1156.3514" y="471.9953">/ cumin comments, notifies</text></g><!--SRC=[dLPDZzis4BthLmpSmwQ5F-vRe82J6aaFQPDDaykkKT3YI28iaGg7MjN_liCFoPBjBDBiPQqH-URDcpUaxY3l6gLNlR57WXMu2e6SS4XW2X0QLDFMsA3cc3ByIDGXA1qMDcZBiBp4TNO7sxYJru20MXom1jxnLhbttM49lLNEeOPUkSfq3XOXySPlwMYpMCD26jWiWCI9eAyCH4efLK2EIPmLcbHYCy3U