 the Implementer in the same session</text></g><!--link Merging to Decision--><g class="link" data-entity-1="Merging" data-entity-2="Decision" data-source-line="40" data-uid="lnk14" id="link_Merging_Decision"><path d="M609.39,384.9 C744.7,391.74 959.2,407.45 1032.39,440.26 C1070.02,457.13 1063.97,484.97 1101.39,502.26 C1155.41,527.23 1307.3174,542.3631 1408.3974,550.0831" fill="none" id="Merging-to-Decision" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1414.38,550.54,1405.7107,545.8662,1409.3945,550.1592,1405.1015,553.843,1414.38,550.54" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="99.9312" x="1194.9896" y="453.3269">stop the merge</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="285.1304" x="1102.39" y="468.4597">[the merge was refused for another reason,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.3901" x="1146.7601" y="483.5925">or the issue cannot be closed]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.2075" x="1156.3514" y="498.7253">/ cumin comments, notifies</text></g><!--SRC=[bLRVR-Cs37xtNq5a3xqCST9js31qm83i5lGEM6zTRzjB6nIAJJj2R2adofVrln_rox7JzDRb9HObVIG_VgHz0KNNIfKVjDaHv62t26I5HG9TWL0Wsts3BIgsISrBeWv1Ad-mHLFxupNEimjOXfjy1WGqOeCDy8rhQTzrcnaSZBGM5HoatUhEmiGxNhWh7IqcSvYK6XOJ8F54SDXg2255LnuvEB56A98ncWHx1QBmflkw4wPSmu8nX0tPGQcHvdorDk8f1idHQLKJMCrPQdPXG1WKpiKTgXBD5PXE0HL6xYqjZBVbfHICqTASji3eBZAZjNLS-MVSQmvDcwTvbcrbYO3jtZv1YG670yoou7zYyBF4WrJr10InpxY2hrR-bnqjL_0cW3k3ZtBQeuY3O2fKdVjQv2KMajYBnxnnfb-Z9Hkj6DEnxODU4ibQON90thZlceODdpeaspjpFbB0D-4vY_y9CF3jW_a2K2-gXFP-OEWP61aZ2ITo79DHRB7O9SYtST73zORNGFMyRXfTxBZoFYKFl8nRlmZ2RBXWOALPyXYa-zEp_9DC8YQuk_JSvQY8VVs-M3hkY0CQnZgg9iz_XcDns8UnnwPzKFS3IHNQKM6nzCq9ozlRkz__NiqUL3ZpgPE6zpoxT3oSzYNjN2Do4q4g_MDAuT7j4fzaObBMt75XS5JIC2TlRbPtrwlyyfjlf-i