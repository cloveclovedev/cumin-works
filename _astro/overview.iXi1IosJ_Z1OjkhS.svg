 textLength="284.5337" x="1716.34" y="475.8269">stop (the implementation area, IMPL-008.6)</text></g><!--link Merging to Merging--><g class="link" data-entity-1="Merging" data-entity-2="Merging" data-source-line="36" data-uid="lnk9" id="link_Merging_Merging"><path d="M609.36,364.38 C629.84,366.34 644.12,371.3 644.12,379.26 C644.12,387.23 635.8127,391.6184 615.3327,393.5784" fill="none" id="Merging-to-Merging" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="609.36,394.15,618.7001,397.2744,614.3373,393.6737,617.938,389.3108,609.36,394.15" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="42.2563" x="799.6105" y="368.8269">merge</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="341.2373" x="650.12" y="383.9597">[not merged, the merge conditions hold, no conflict]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="246.1558" x="697.6608" y="399.0925">/ cumin merges the approved commit</text></g><!--link Merging to *end*--><g class="link" data-entity-1="Merging" data-entity-2=".end." data-source-line="37" data-uid="lnk11" id="link_Merging_.end."><path d="M417.72,404.83 C402.1,413.51 387.62,425.05 378.39,440.26 C357.69,474.41 368.9336,519.511 375.9336,540.771" fill="none" id="Merging-to-*end*" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="377.81,546.47,378.7947,536.6705,376.2463,541.7208,371.196,539.1724,377.81,546.47" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="151.1187" x="437.3155" y="460.8269">close the merged issue</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="60.6519" x="482.5489" y="475.9597">[merged]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spaci