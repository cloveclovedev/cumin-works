="396.5655">do / cumin merges the pull request</text></g><g id="Implementing"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="178.7891" x="961" y="532.26"/><line style="stroke:#181818;stroke-width:0.5;" x1="961" x2="1139.7891" y1="558.5569" y2="558.5569"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="97.1797" x="1001.8047" y="550.2551">implementing</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="158.7891" x="966" y="574.6955">(the implementation area)</text></g><g id="Checking"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="178.7891" x="7" y="532.26"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="185.7891" y1="558.5569" y2="558.5569"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="62.6377" x="65.0757" y="550.2551">checking</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="158.7891" x="12" y="574.6955">(the implementation area)</text></g><g id="AwaitingBase"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="325.2793" x="1462.75" y="354.13"/><line style="stroke:#181818;stroke-width:0.5;" x1="1462.75" x2="1788.0293" y1="380.4269" y2="380.4269"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="166.7627" x="1542.0083" y="372.1251">awaiting-blocker-merge</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="305.2793" x="1467.75" y="396.5655">no one works; the pull request of the blocker waits</text></g><g id="Decision"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="177.582" x="1414.6" y="532.26"/><line style="stroke:#181818;stroke-width:0.5;" x1="1414.6" x2="1592.182" y1="558.5569" y2="558.5569"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="122.3975" x="1442.1923" y="550.2551">awaiting-decision</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="157.582" x="1419.6" y="574.6955">do / the Assignee answers</text></g><ellipse cx="381.39" cy="557.4" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="381.39" cy="557.4" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><!--link Reviewing to Merging--><g class="link" data-entity-1="Reviewing" data-entity-2="Merging" data-source-line="29" data-uid="lnk2" id="link_Reviewing_Merging"><path d="M956.24,38.27 C868.93,48.46 709.17,78.3 606.39,164.26 C544.84,215.75 513.8687,303.7581 501.2887,348.0681" fill="none" id="Reviewing-to-Merging" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="499.65,353.84,505.956,346.2746,501.0156,349.0301,498.2601,344.0897,499.65,353.84" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="102.1338" x="684.7584" y="177.3269">start the merge</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="247.8442" x="611.9032" y="192.4597">[the review completed with APPROVE,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.7114" x="632.4696" y="207.5925">the required checks completed,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251.7861" x="609.9322" y="222.7253">the risk is not in merge_decision_risks,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="256.8706" x="607.39" y="237.8581">no blocker to merge first (MERGE-012)]</text></g><!--link Reviewing to MergeDecision--><g class="link" data-entity-1="Reviewing" data-entity-2="MergeDecision" data-source-line="30" data-uid="lnk3" id="link_Reviewing_MergeDecision"><path d="M1018.39,57.65 C1018.39,89.62 1018.39,139.23 1018.39,171.21" fill="none" id="Reviewing-to-MergeDecision" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1018.39,177.21,1022.39,168.21,1018.39,172.21,1014.39,168.21,1018.39,177.21" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173.8496" x="1096.0792" y="100.3269">ask for the merge decision</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="327.228" x="1019.39" y="115.4597">[the same, but the risk is in merge_decision_risks]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="307.3662" x="1029.3209" y="130.5925">/ cumin asks the Assignee for a review, notifies</text></g><!--link MergeDecision to Merging--><g class="link" data-entity-1="MergeDecision" data-entity-2="Merging" data-source-line="31" data-uid="lnk4" id="link_MergeDecision_Merging"><path d="M896.53,228.33 C828.63,242.57 751.32,259.89 718.39,271.26 C653.18,293.79 587.1734,326.9364 542.6934,350.8764" fill="none" id="MergeDecision-to-Merging" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="537.41,353.72,547.2308,352.9768,541.8128,351.3503,543.4393,345.9323,537.41,353.72" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="102.1338" x="820.4637" y="284.3269">start the merge</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.2813" x="719.39" y="299.4597">[the Assignee's APPROVE on the head commit,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.6509" x="767.7052" y="314.5925">the required checks completed]</text></g><!--link MergeDecision to Implementing--><g class="link" data-entity-1="MergeDecision" data-entity-2="Implementing" data-source-line="32" data-uid="lnk5" id="link_MergeDecision_Implementing"><path d="M1022.47,228.4 C1024.47,241.16 1026.79,257.02 1028.39,271.26 C1039.22,367.47 1045.984,476.5594 1048.754,525.9394" fill="none" id="MergeDecision-to-Implementing" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1049.09,531.93,1052.5797,522.7201,1048.81,526.9378,1044.5922,523.1682,1049.09,531.93" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.2085" x="1130.0798" y="361.3269">request an assignee review fix</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375.248" x="1042.06" y="376.4597">[the Assignee's REQUEST_CHANGES on the head commit,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="253.8364" x="1102.7658" y="391.5925">after the last awaiting-merge-decision]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="336.1338" x="1061.6171" y="406.7253">/ cumin starts the Implementer in the same session</text></g><!--link Reviewing to AwaitingBase--><g class="link" data-entity-1="Reviewing" data-entity-2="AwaitingBase" data-source-line="33" data-uid="lnk6" id="link_Reviewing_AwaitingBase"><path d="M1080.59,38.25 C1164.53,45.99 1308.95,62.43 1355.39,87.26 C1478.16,152.91 1572.1371,291.0352 1607.6571,348.5452" fill="none" id="Reviewing-to-AwaitingBase" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1610.81,353.65,1609.4839,343.8908,1608.1826,349.396,1602.6774,348.0947,1610.81,353.65" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.6689" x="1529.5" y="192.3269">wait for the blocke