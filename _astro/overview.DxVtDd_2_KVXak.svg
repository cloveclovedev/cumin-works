<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="361px" preserveAspectRatio="none" style="width:1090px;height:361px;background:#FFFFFF;" version="1.1" viewBox="0 0 1090 361" width="1090px" zoomAndPan="magnify"><defs/><g><!--entity Turn--><g class="entity" data-entity="Turn" data-source-line="6" data-uid="ent0002" id="entity_Turn"><rect fill="#F1F1F1" height="68.8906" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="358.3447" x="7" y="7"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="287.8955" x="17" y="29.9951">an issue enters a state of a person's turn</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="338.3447" x="17" y="46.292">(awaiting-plan-review, awaiting-merge-decision,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="282.1738" x="17" y="62.5889">awaiting-acceptance, awaiting-decision)</text></g><!--entity Cannot--><g class="entity" data-entity="Cannot" data-source-line="7" data-uid="ent0003" id="entity_Cannot"><rect fill="#F1F1F1" height="68.8906" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="330.7822" x="20.78" y="111"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="193.0537" x="30.78" y="133.9951">cumin cannot take an issue</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="310.7822" x="30.78" y="150.292">(a label it does not take, no single Assignee,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="211.8115" x="30.78" y="166.5889">an issue it cannot read whole)</text></g><!--entity Stop--><g class="entity" data-entity="Stop" data-source-line="8" data-uid="ent0004" id="entity_Stop"><rect fill="#F1F1F1" height="68.8906" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="247.5137" x="62.42" y="215"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="174.1934" x="72.42" y="237.9951">cumin stops agent starts</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="227.5137" x="72.42" y="254.292">(a usage limit, an unread usage,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="218.3398" x="72.42" y="270.5889">a failed tool check, failed polls)</text></g><!--entity Waits--><g class="entity" data-entity="Waits" data-source-line="9" data-uid="ent0005" id="entity_Waits"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="282.3291" x="45.01" y="319.29"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="262.3291" x="55.01" y="342.2851">nothing goes on without a Maintainer</text></g><!--entity Notify--><g class="entity" data-entity="Notify" data-source-line="11" data-uid="ent0006" id="entity_Notify"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="246.2969" x="426.34" y="171.14"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="82.9473" x="436.34" y="194.1351">notify once:</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="226.2969" x="436.34" y="210.432">a link and one line of the reason</text></g><!--entity GitHub--><g class="entity" data-entity="GitHub" data-source-line="12" data-uid="ent0007" id="entity_GitHub"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="229.5693" x="854.64" y="171.14"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="209.5693" x="864.64" y="194.1351">the issue and the pull request</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="197.4629" x="864.64" y="210.432">hold the details and the talk</text></g><!--link Turn to Notify--><g class="link" data-entity-1="Turn" data-entity-2="Notify" data-source-line="14" data-uid="lnk8" id="link_Turn_Notify"><path d="M319.26,76.23 C334.98,81.47 350.65,87.23 365.34,93.44 C416.7,115.17 466.7909,144.7 503.0009,167.63" fill="none" id="Turn-to-Notify" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="508.07,170.84,502.6064,162.6456,503.8457,168.165,498.3263,169.4044,508.07,170.84" style="stroke:#181818;stroke-width:1;"/></g><!--link Cannot to Notify--><g class="link" data-entity-1="Cannot" data-entity-2="Notify" data-source-line="15" data-uid="lnk9" id="link_Cannot_Notify"><path d="M351.97,169.16 C376.91,172.75 396.3212,175.5452 420.1512,178.9752" fill="none" id="Cannot-to-Notify" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="426.09,179.83,417.7517,174.5886,421.141,179.1177,416.6119,182.507,426.09,179.83" style="stroke:#181818;stroke-width:1;"/></g><!--link Stop to Notify--><g class="link" data-entity-1="Stop" data-entity-2="Notify" data-source-line="16" data-uid="lnk10" id="link_Stop_Notify"><path d="M310.26,231.73 C347.58,226.36 382.6212,221.315 419.9212,215.945" fill="none" id="Stop-to-Notify" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="425.86,215.09,416.3819,212.4133,420.911,215.8025,417.5218,220.3317,425.86,215.09" style="stroke:#181818;stroke-width:1;"/></g><!--link Waits to Notify--><g class="link" data-entity-1="Waits" data-entity-2="Notify" data-source-line="17" data-uid="lnk11" id="link_Waits_Notify"><path d="M306.06,318.9 C326.15,314.21 346.58,308.46 365.34,301.44 C418.26,281.65 469.0019,251.1743 504.8919,227.4943" fill="none" id="Waits-to-Notify" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="509.9,224.19,500.1849,225.8077,505.7266,226.9436,504.5907,232.4853,509.9,224.19" style="stroke:#181818;stroke-width:1;"/></g><!--link Notify to GitHub--><g class="link" data-entity-1="Notify" data-entity-2="GitHub" data-source-line="18" data-uid="lnk12" id="link_Notify_GitHub"><path d="M673.06,197.44 C730.39,197.44 792.24,197.44 848.45,197.44" fill="none" id="Notify-to-GitHub" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="854.45,197.44,845.45,193.44,849.45,197.44,845.45,201.44,854.45,197.44" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="120.6626" x="703.64" y="193.5069">the reader goes to</text></g><!--SRC=[PLF1hjD03BpdAwntAKXDkVU0X1222nm0YKilVXitiRBrXhL3zVuUxouf4HoYRYRsp7YyFK1ORopzFULPeOVxHD8Wa6HyPT8JVC0mGS1L2LWtV80aWKxT0RwI39JFa5S13PaNqpUvOlt0E6QywKadG0ER279A1kdQphGaPKlvvTHraQvUaI3pE1aCd2aO9-cwSa0P8y4JYZlGbO34A2iWgA5HuKDO74boKB0roqLUuHtPMCP-YIXzfbzCzoCyq1lbaVg10glB72_o-88XqEAIWNRbM-7h9q25xownDzOY2oYU3XZE19lLOWGYFbC4zh4IrGHhpT5Fe5mPtgdoA4J5npQar_zXp8I3xoP5QlBlA_o_0RMqU2gZnrEIoQPLVbM78FADxLYChL89Arm4uOeSVQEMKeGmKPYF6xIa6BM9VdFolQGxcDmyZ6Mc971dcz9gledFo6B-KAwDFpn2xVvfvUjBlK7deXzPPZTMxbJnAVJtXg3ljB9ygJrxbbBGaYgjvMrPO_IUdokfNSJpQl10xYRgeymmpfNp8zkdzRdhoZgXxzzk8YtVFLA6tx_NcVP0-wb8OuNpDe7_4rf8bhhV]--></g></svg>