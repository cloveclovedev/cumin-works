<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="405px" preserveAspectRatio="none" style="width:440px;height:405px;background:#FFFFFF;" version="1.1" viewBox="0 0 440 405" width="440px" zoomAndPan="magnify"><defs/><g><g id="Work"><rect fill="#EEEEEE" height="64.2344" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="232.8125" x="15.43" y="7"/><line style="stroke:#181818;stroke-width:0.5;" x1="15.43" x2="248.2425" y1="33.2969" y2="33.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="104.0361" x="79.8182" y="24.9951">a state in work</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="212.8125" x="20.43" y="49.4355">(planning, implementing, checking,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="187.4355" x="20.43" y="63.4043">reviewing, merging, accepting)</text></g><g id="Decision"><rect fill="#F1F1F1" height="64.2344" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="249.6758" x="7" y="208.23"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="256.6758" y1="234.5269" y2="234.5269"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="122.3975" x="70.6392" y="226.2251">awaiting-decision</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="229.6758" x="12" y="250.6655">do / the Assignee reads the comment,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="196.002" x="12" y="264.6343">chooses, and writes the decision</text></g><g id="Ready"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="246.1191" x="8.78" y="349.46"/><line style="stroke:#181818;stroke-width:0.5;" x1="8.78" x2="254.8991" y1="375.7569" y2="375.7569"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="40.1201" x="111.7795" y="367.4551">ready</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="226.1191" x="13.78" y="391.8955">(each area decides what comes next)</text></g><!--link Work to Decision--><g class="link" data-entity-1="Work" data-entity-2="Decision" data-source-line="17" data-uid="lnk2" id="link_Work_Decision"><path d="M131.84,71.68 C131.84,108.99 131.84,164.68 131.84,201.93" fill="none" id="Work-to-Decision" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="131.84,207.93,135.84,198.93,131.84,202.93,127.84,198.93,131.84,207.93" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="28.0757" x="268.391" y="114.2969">stop</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="299.1777" x="132.84" y="129.4297">[the agent asked, or cumin stopped the work]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="283.4609" x="140.6984" y="144.5625">/ the comment has the reason, the choices,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.2617" x="161.798" y="159.6953">and what the Assignee does for each</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.4072" x="232.2253" y="174.8281">/ cumin notifies</text></g><!--link Decision to Ready--><g class="link" data-entity-1="Decision" data-entity-2="Ready" data-source-line="18" data-uid="lnk3" id="link_Decision_Ready"><path d="M131.84,272.69 C131.84,296.06 131.84,321.54 131.84,343.09" fill="none" id="Decision-to-Ready" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="131.84,349.09,135.84,340.09,131.84,344.09,