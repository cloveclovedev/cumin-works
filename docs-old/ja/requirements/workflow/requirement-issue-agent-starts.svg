ze="13" lengthAdjust="spacing" textLength="188.7729" x="469.06" y="872.0669">a Maintainer closes the issue</text></g><!--link Decision to Ready--><g class="link" data-entity-1="Decision" data-entity-2="Ready" data-source-line="34" data-uid="lnk21" id="link_Decision_Ready"><path d="M1161.19,788.54 C1200.59,770.5 1247.06,739.4 1247.06,693 C1247.06,340 1247.06,340 1247.06,340 C1247.06,278.3 773.631,236.7773 656.581,227.4373" fill="none" id="Decision-to-Ready" style="stroke:#888888;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#888888" points="650.6,226.96,659.2533,231.6632,655.5842,227.3577,659.8897,223.6886,650.6,226.96" style="stroke:#888888;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="158.1519" x="1248.06" y="521.0669">a Maintainer adds ready</text></g><g class="legend" data-source-line="36"><rect fill="#DDDDDD" height="140.375" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="654.8066" x="733.4052" y="945"/><text fill="#D32F2F" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="30.2969" x="738.4052" y="962.9951">Red</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="570.2813" x="768.7021" y="962.9951">: cumin starts an agent. Before every start, cumin decides from the quota usage.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="588.1162" x="738.4052" y="979.292">At a limit, cumin starts nothing, changes no label for that start, and counts nothing;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="391.1592" x="738.4052" y="995.5889">the issue keeps its state, and a later poll decides again.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="644.8066" x="738.4052" y="1011.8857">Gray: cumin starts no agent (a label, a comment, a notification). Dashed: a Maintainer acts.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="738.4052" y="1028.1826">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="522.1289" x="738.4052" y="1044.4795">While cumin stops after the current runs (cumin stop --after-current-runs):</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="525.916" x="738.4052" y="1060.7764">cumin takes no red transition; the issue keeps its state until the next start.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="260.6816" x="738.4052" y="1077.0732">cumin still takes the gray transitions.</text></g><!--SRC=[jLPBQzmm4BxhLmpj8ScoTY2zb4q8f8IK7Web57e8EIZsx5giB3cIdAt_VKSFFzPvj2Hf8B2IPhxvvfknHWTGjBLGiDDcQo43wxX32teD70pUjy9WZSg1iBR55UmgKLJW35TMEA6LzGx60LV0DsItP0VWAko0Iqd-lFGhk6-ruz1QCe6rCDOjoQ44fHKIC3Y-HUMX9IOsrkd60byxD06WQ8tnB4ohR4uXVj9UOkg1lCcK4pSOzWW_f39990k9PD4vRzfQdfAPx8AzuZL6RrlfdVAHhb6LQ5O-CjZ2YCRPOnFsibBmZU6rpMq5t0K0exNp0SDlR3GHqgRB6Qj4YO1rupeeCU8GKyO23_XmQIXNE5GwPDLQaFmEvT47u1R2MM_e9Ut2zhN_rMytaYibr2QS_4YB_f3lEEcYDfctoWm-2DmDXjTXsPkAkf51fXxhssHZm2iAR0QBYtxrA5oquwh0YQ5VFh8iiH2Mz8ZvfWLZDujRoBBpf43KABlv-3dyBKjkAonlwJn80IlgsEzSA4V_r3QyB6tem6xkwLscUP5dpSqs5MriUUAIFWmM8n32vQUJgvEhvPsM8N8lDK6S5LfgiqeMvnu8RUmAsqZXpew3mJaRVFO8ZRNmYTWjh7LiVLyqY4NRSvqn6ShmCfMn9b1KM6oVPFNw9EaI8FN_acfVOCBpt_depIOYlALQ-p3lBDGUb_yF_qA7y3lTfci7QvBTUzZsBjvmberCzc36pt3MQ2EbVTVtIN3M6S-GUwervaXiai5RkkGfcCcbuY-VsPLII6rfFdZCe34RwBxcLc8IQMAMOCIcSWpcOYuMrrWk5hrYgs4oqhYrmxpDuGjI0McsFA3fukaocVfRbOODh8skvsCufu0N90T8KOl18u4hxIhIa7OhhZReD-90Ihr2mou5yiEtqAqQdKu9U108jeWqnuMpSLf71mhA_M1lDBqHUfAXFJohhuPtgpcVc2mSyiY3S2XixIlgVr9eiHO5zoFrA8VBK8Avy8MZbmFX__h7PmOSZZOqXO9HbWmoRt2q8hHeunymWQR1Sl8GENrU2I3DX8oF3loTzCm7G4k7Ci5w6tfdTDCNJiweSsB_i3y0]--></g></svg>