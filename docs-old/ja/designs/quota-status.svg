.6289" x="223.8418" y="663.1035">&lt;repository&gt; #&lt;issue&gt; &lt;status label&gt;, one line for each issue</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="12.2754" x="223.8418" y="677.0723">or</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="29.9355" x="223.8418" y="691.041">none</text><rect fill="#F1F1F1" height="75.875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="402.6289" x="213.8418" y="723.8711"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="149.1152" x="223.8418" y="745.0098">Waiting for a Maintainer:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="382.6289" x="223.8418" y="758.9785">&lt;repository&gt; #&lt;issue&gt; &lt;status label&gt;, one line for each issue</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="12.2754" x="223.8418" y="772.9473">or</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="29.9355" x="223.8418" y="786.916">none</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="354.8867" x="237.7129" y="868.1484"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="223.3477" x="247.7129" y="889.2871">Issues that cumin cannot read in full:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="334.8867" x="247.7129" y="903.2559">&lt;repository&gt; #&lt;issue&gt; &lt;limit&gt;, one line for each limit</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="167.8359" x="247.7129" y="917.2246">(the issue is in no other list)</text><polygon fill="#F1F1F1" points="336.1287,819.7461,494.1838,819.7461,506.1838,831.7461,494.1838