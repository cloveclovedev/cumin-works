l="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="352.8369" x="992.31" y="674.872">number, author, head commit, branch, mergeable</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="308.3213" x="1014.5678" y="691.1689">labels (up to 100), check results (up to 100)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="136.7119" x="1100.3725" y="707.4657">reviews (up to 100)</text><line style="stroke:#181818;stroke-width:0.5;" x1="986.31" x2="1351.1469" y1="712.7675" y2="712.7675"/></g><g class="entity" data-entity="commit" data-source-line="16" data-uid="ent0010" id="entity_commit"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="153.6104" x="1091.92" y="805.77"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="92.3193" x="1122.5655" y="820.7651">head commit</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="139.6104" x="1098.92" y="837.062">oid, committedDate</text><line style="stroke:#181818;stroke-width:0.5;" x1="1092.92" x2="1244.5304" y1="842.3638" y2="842.3638"/></g><g class="entity" data-entity="GMN17" data-source-line="27" data-uid="ent0018" id="entity_GMN17"><path d="M1504.35,811.93 L1504.35,852.1956 A0,0 0 0 0 1504.35,852.1956 L1941.1024,852.1956 A0,0 0 0 0 1941.1024,852.1956 L1941.1024,821.93 L1931.1024,811.93 L1651.37,811.93 L1330.46,729.18 L1643.37,811.93 L1504.35,811.93 A0,0 0 0 0 1504.35,811.93" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1931.1024,811.93 L1931.1024,821.93 L1941.1024,821.93 L1931.1024,811.93" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="337.7524" x="1510.35" y="828.9969">Closed and merged pull requests are not read here.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="415.7524" x="1510.35" y="844.1297">write the follow-up note reads merged pull requests separately.</text></g><g class="entity" data-entity="GMN20" data-source-line="31" data-uid="ent0021" id="entity_GMN20"><path d="M6,306.59 L6,361.9884 A0,0 0 0 0 6,361.9884 L307.4585,361.9884 A0,0 0 0 0 307.4585,361.9884 L307.4585,338.29 L432.97,334.29 L307.4585,330.29 L307.4585,316.59 L297.4585,306.59 L6,306.59 A0,0 0 0 0 6,306.59" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M297.4585,306.59 L297.4585,316.59 L307.4585,316.59 L297.4585,306.59" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.1162" x="12" y="323.6569">The time that cumin/status/checking</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="280.4585" x="12" y="338.7897">was last added comes from the label times</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175.3984" x="12" y="353.9225">query, not from this query.</text></g><g class="entity" data-entity="GMN23" data-source-line="36" data-uid="ent0024" id="entity_GMN23"><path d="M840.97,283.89 L840.97,330.29 L806.55,334.29 L840.97,338.29 L840.97,384.6869 A0,0 0 0 0 840.97,384.6869 L1080.4881,384.6869 A0,0 0 0 0 1080.4881,384.6869 L1080.4881,293.89 L1070.4881,283.89 L840.97,283.89 A0,0 0 0 0 840.97,283.89" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1070.4881,283.89 L1070.4881,293.89 L1080.4881,293.89 L1070.4881,283.89" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.0151" x="846.97" y="300.9569">When an issue exceeds a limit</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.9448" x="846.97" y="316.0897">of either query, the poll leaves</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.5181" x="846.97" y="331.2225">its requirement issue out, with all</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="214.1763" x="846.97" y="346.3553">its sub-issues, logs the issue and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.3989" x="846.97" y="361.4881">the limit, and goes on with the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="171.2217" x="846.97" y="376.621">other issues. It is no error.</text></g><!--link repo to req--><g class="link" data-entity-1="repo" data-entity-2="req" data-source-line="19" data-uid="lnk11" id="link_repo_req"><path codeLine="19" d="M619.73,77.77 C619.73,97.89 619.73,124.97 619.73,147.95" fill="none" id="repo-to-req" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="619.73,153.95,623.73,144.95,619.73,148.95,615.73,144.95,619.73,153.95" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="40.168" x="620.73" y="120.3669">issues</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="8.271" x="610.643" y="97.2023">1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="78.8696" x="532.8109" y="143.1358">10 per page</text></g><!--link req to sub--><g class="link" data-entity-1="req" data-entity-2="sub" data-source-line="20" data-uid="lnk12" id="link_req_sub"><path codeLine="20" d="M619.73,207.33 C619.73,235.31 619.73,273.75 619.73,301.68" fill="none" id="req-to-sub" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="619.73,307.68,623.73,298.68,619.73,302.68,615.73,298.68,61