<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="527px" preserveAspectRatio="none" style="width:886px;height:527px;background:#FFFFFF;" version="1.1" viewBox="0 0 886 527" width="886px" zoomAndPan="magnify"><defs/><g><!--entity run--><g class="entity" data-entity="run" data-source-line="10" data-uid="ent0002" id="entity_run"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="115.4434" x="259.51" y="7"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="70.9229" x="269.51" y="29.9951">cumin run</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="95.4434" x="269.51" y="46.292">(poll, actions)</text></g><!--entity status--><g class="entity" data-entity="status" data-source-line="11" data-uid="ent0003" id="entity_status"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="110.4395" x="410.01" y="15.15"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="90.4395" x="420.01" y="38.1451">cumin status</text></g><!--entity setup--><g class="entity" data-entity="setup" data-source-line="12" data-uid="ent0004" id="entity_setup"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="106.5771" x="555.94" y="15.15"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="86.5771" x="565.94" y="38.1451">cumin setup</text></g><!--entity client--><g class="entity" data-entity="client" data-source-line="13" data-uid="ent0005" id="entity_client"><rect fill="#F1F1F1" height="68.8906" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="188.0273" x="371.21" y="159.25"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="67.8809" x="381.21" y="182.2451">AppClient</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="168.0273" x="381.21" y="198.542">internal/platform/github</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="133.0137" x="381.21" y="214.8389">REST and GraphQL</text></g><!--entity api--><g class="entity" data-entity="api" data-source-line="14" data-uid="ent0006" id="entity_api"><path d="M306.3658,425.5348 C308.0729,420.9085 312.4381,419.2003 315.9211,423.669 C319.1718,418.5322 324.7037,417.8099 327.8026,423.8306 C331.768,418.3365 335.3144,418.1736 339.4182,423.6845 C342.2097,418.0417 345.3256,418.1387 349.4334,422.3462 C353.4519,416.021 358.9927,417.1421 361.7683,423.5502 C365.3667,418.8281 369.6194,418.8201 372.3573,424.432 C377.0009,418.6342 380.5585,419.448 383.8616,425.7107 C386.7463,419.8921 391.1781,420.324 394.5121,425.266 C403.8779,424.4612 407.4455,432.2575 404.0479,439.817 C409.8882,449.712 407.0359,456.0717 395.1896,456.6705 C391.7985,460.9116 387.2263,460.5321 384.8289,455.5538 C381.7689,460.801 376.9972,460.9987 373.2546,456.3524 C370.137,461.1584 365.6971,460.9955 362.4195,456.5396 C358.97,462.2484 353.5453,463.6772 349.3512,457.3479 C346.4295,462.6956 341.9787,461.5084 339.3821,457.0185 C335.79,461.9795 330.8889,463.0882 327.2327,457.0895 C323.8272,461.5127 319.4418,462.0259 316.9285,456.1931 C314.0175,462.7477 308.2341,461.4971 304.9113,456.6262 C296.1217,452.6432 294.8128,447.4604 300.8413,439.8768 C295.5209,432.7285 297.4437,427.1968 306.3658,425.5348" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="75.1133" x="311.67" y="444.3051">GitHub API</text></g><g class="entity" data-entity="GMN11" data-source-line="22" data-uid="ent0012" id="entity_GMN11"><path d="M594.61,120.6 L594.61,189.69 L559.52,193.69 L594.61,197.69 L594.61,266.7953 A0,0 0 0 0 594.61,266.7953 L879.8375,266.7953 A0,0 0 0 0 879.8375,266.7953 L879.8375,130.6 L869.8375,120.6 L594.61,120.6 A0,0 0 0 0 594.61,120.6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M869.8375,120.6 L869.8375,130.6 L879.8375,130.6 L869.8375,120.6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.3564" x="600.61" y="137.6669">A try that gets no answer</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.2876" x="600.61" y="152.7997">ends with an error at the deadline.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251.5703" x="600.61" y="167.9325">A read (GET, GraphQL query) that fails</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.1284" x="600.61" y="183.0653">with a network error or a 5xx answer</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.8145" x="600.61" y="198.1981">is sent again: up to 3 retries,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.2275" x="600.61" y="213.331">2 seconds apart, one warn log line each.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.0693" x="600.61" y="228.4638">A write is sent once.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.9419" x="600.61" y="243.5966">After the last try, the error</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.2197" x="600.61" y="258.7294">is a temporary error (IsTemporary).</text></g><g class="entity" data-entity="GMN14" data-source-line="34" data-uid="ent0015" id="entity_GMN14"><path d="M6,120.6 L6,266.7953 A0,0 0 0 0 6,266.7953 L336.4546,266.7953 A0,0 0 0 0 336.4546,266.7953 L336.4546,197.69 L370.73,193.69 L336.4546,189.69 L336.4546,130.6 L326.4546,120.6 L6,120.6 A0,0 0 0 0 6,120.6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M326.4546,120.6 L326.4546,130.6 L336.4546,130.6 L326.4546,120.6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.4272" x="12" y="137.6669">An answer of a full primary rate limit</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309.4546" x="12" y="152.7997">(REST: 403 or 429, GraphQL: 200 with an error,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.2466" x="12" y="167.9325">both with x-ratelimit-remaining: 0)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="285.8159" x="12" y="183.0653">returns a RateLimitError with the reset time</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="274.9868" x="12" y="198.1981">of x-ratelimit-reset, and one warn log line.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.0771" x="12" y="213.331">It is not sent again at once.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.7515" x="12" y="228.4638">Until the reset time, a call of the same</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.5981" x="12" y="243.5966">installation returns that error</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124.522" x="12" y="258.7294">and sends nothing.</text></g><g class="entity" data-entity="GMN17" data-source-line="46" data-uid="ent0018" id="entity_GMN17"><path d="M436.9,358.79 L436.9,520.1181 L725.5616,520.1181 L725.5616,368.79 L715.5616,358.79 L436.9,358.79" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M715.5616,358.79 L715.5616,368.79 L725.5616,368.79 L715.5616,358.79" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.7466" x="442.9" y="375.8569">An answer of a secondary rate limit</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="267.6616" x="442.9" y="390.9897">(REST: 403 or 429, GraphQL: 200 or 403,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.9614" x="442.9" y="406.1225">with a message "secondary rate limit"</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.0518" x="442.9" y="421.2553">or the header retry-after)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="214.5889" x="442.9" y="436.3881">returns a RateLimitError at once,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.771" x="442.9" y="451.521">and one warn log line.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.582" x="442.9" y="466.6538">The wait is retry-after, else 1 minute.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.9673" x="442.9" y="481.7866">During the wait, a call of the same</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.5981" x="442.9" y="496.9194">installation returns that error</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124.522" x="442.9" y="512.0522">and sends nothing.</text></g><!--link run to client--><g class="link" data-entity-1="run" data-entity-2="client" data-source-line="16" data-uid="lnk7" id="link_run_client"><path d="M341.01,59.75 C366.17,86.68 401.9129,124.9366 429.6729,154.6366" fill="none" id="run-to-client" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="433.77,159.02,430.5467,149.7135,430.3558,155.3672,424.7021,155.1763,433.77,159.02" style="stroke:#181818;stroke-width:1;"/></g><!--link status to client--><g class="link" data-entity-1="status" data-entity-2="client" data-source-line="17" data-uid="lnk8" id="link_status_client"><path d="M465.23,51.86 C465.23,77.63 465.23,120.2 465.23,153.01" fill="none" id="status-to-client" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="465.23,159.01,469.23,150.01,465.23,154.01,461.23,150.01,465.23,159.01" style="stroke:#181818;stroke-width:1;"/></g><!--link setup to client--><g class="link" data-entity-1="setup" data-entity-2="client" data-source-line="18" data-uid="lnk9" id="link_setup_client"><path d="M593.27,51.86 C569.83,77.63 529.7162,121.7605 499.8862,154.5705" fill="none" id="setup-to-client" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="495.85,159.01,504.864,155.0416,499.2135,155.3105,498.9447,149.66,495.85,159.01" style="stroke:#181818;stroke-width:1;"/></g><!--link client to api--><g class="link" data-entity-1="client" data-entity-2="api" data-source-line="19" data-uid="lnk10" id="link_client_api"><path d="M449.1,228.59 C425.01,279.22 382.8587,367.7924 362.4487,410.6724" fill="none" id="client-to-api" style="stroke:#FF0000;stroke-width:2;"/><polygon fill="#FF0000" points="359.87,416.09,367.3497,409.6827,362.0189,411.5753,360.1263,406.2445,359.87,416.09" style="stroke:#FF0000;stroke-width:2;"/><text fill="#FF0000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.3896" x="422.4381" y="309.8569">every try ends</text><text fill="#FF0000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="108.9258" x="415.17" y="324.9897">after 30 seconds</text></g><!--link client to GMN17--><g class="link" data-entity-1="client" data-entity-2="GMN17" data-source-line="46" data-uid="lnk19" id="link_client_GMN17"><path d="M490.4,228.39 C504.03,247.71 520.44,272.82 532.23,296.79 C541.76,316.18 550.26,337.88 557.39,358.37" fill="none" id="client-GMN17" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/></g><!--SRC=[jLN1Rjj83BtxAuZieGaWEMxI7ceK0O9jDXkWM7IpwQdfWPOeQT3HZ3gawkJlovcHKZi9WhtqOC0cEUJZc_V6hw0QU-DWwyCtXXBe1uLxgD1Qy0r8Ht1fvEzn0vKrv0J8rGpO20L0g0bhQnmLYrVwA-WlFO423HhBqFYGe-nTZW_8J0o6WMClRD6u0j3Lu7oQgNqiuG-jsP0UfmGW49E0c9uY98HcL713C3qgqe12O4rl17HSFGRZsdXAEsqn1kC9figxUhzygHKVl2wlIDQPXBBIaSk-Ba3yO2f8i1yH48zTAmaKrX161rm5CmWVXnGhQuDjm9wNt84kdE1xBpENWGRFHdouNoxuct43QZ5mXxNVHk0DMgQTJ4qDZbR-yax-GTsVqN7954opM0Ig15rh2Gxo5IgSMtSuU6kLqqgCTtnq0CWnyRIQ1MNabCzVdoaX6OTS4R_j5fmFmv-9Zrjdd8h1eJqUB8fUMd_S6kd6pQsxllZl9jtkPS2X-_TZQfLfN5JMZpKSJDoUVxfAIHoCBgQqbkNPN9dHxKKYcjt0fCtoon-1wcBZRVrLazeCrl2-yjQ7jIREihP5Fr75jsudbHLzkfgamk-FK-viiN1U5HDCswLBd0O2dAS-ITKj2KS1wzriAMWkUMIh96W8A8JeWwo5sJ3Br24Pvl3ougQO6OBleq8ysd6H5kPEu4YYIQU6oLjlx-v-JTrprHgK8V5mgaCa6E92AqxcxPGQ35Aem4bT4XnOtqB41OHLby5jWz75vwRULHbquYckOf4bSb2aNmbK1e4Wr0y-HBjbh8TNV3E7ZfOBIduNchYrr3oYrarBlMXtBJoC0bl3czLffEFDoRi77jTmibhjNq4aOECraA9tPUoK6fM1UcLCxRU6rP5MAMDZS76HQwtv66ikqXxfvFwBfEKASh-RvlAZzeJUoE2LH99qyvtRYlAO6VxinDX7KxJTtfFCc2ORfzwmwZgr-WFg99tvEY8AJdBKWPsk-8HzfKHy_nB_ppsU_uFy65oT5h_qsnCpjlfsFDVm81APXTMfAtHsrErzcNpvugLCr1NJjizoVjDH_ZTGvdVw5a3wtC9hqCTkb5JvuU4F91tu7SJ_1000]--></g></svg>