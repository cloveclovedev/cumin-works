<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="563px" preserveAspectRatio="none" style="width:1202px;height:563px;background:#FFFFFF;" version="1.1" viewBox="0 0 1202 563" width="1202px" zoomAndPan="magnify"><defs/><g><!--entity request--><g class="entity" data-entity="request" data-source-line="7" data-uid="ent0002" id="entity_request"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="246.6182" x="81.95" y="167.89"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="151.8535" x="91.95" y="190.8851">a request to an agent</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="226.6182" x="91.95" y="207.182">(at a poll, or at the end of a run)</text></g><!--entity tools--><g class="entity" data-entity="tools" data-source-line="8" data-uid="ent0003" id="entity_tools"><rect fill="#F1F1F1" height="68.8906" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="245.1758" x="82.67" y="7"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="200.1631" x="92.67" y="29.9951">tool checks of the repository</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="156.7207" x="92.67" y="46.292">(run once in each poll,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="225.1758" x="92.67" y="62.5889">the failed ones kept in memory)</text></g><!--entity check--><g class="entity" data-entity="check" data-source-line="9" data-uid="ent0004" id="entity_check"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="232.5088" x="7" y="344.02"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.0283" x="17" y="367.0151">PermitStart</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="212.5088" x="17" y="383.312">(pure function, the one check)</text></g><!--entity caller--><g class="entity" data-entity="caller" data-source-line="10" data-uid="ent0005" id="entity_caller"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="147.1553" x="387.68" y="344.02"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="74.0469" x="397.68" y="367.0151">startAgent</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="127.1553" x="397.68" y="383.312">(takes the permit)</text></g><!--entity start--><g class="entity" data-entity="start" data-source-line="11" data-uid="ent0006" id="entity_start"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="143.1426" x="494.68" y="505.15"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="87.3838" x="504.68" y="528.1451">Agents.Start</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="123.1426" x="504.68" y="544.442">(starts the agent)</text></g><!--entity other--><g class="entity" data-entity="other" data-source-line="12" data-uid="ent0007" id="entity_other"><rect fill="#FFE4E1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="204.6797" x="568.91" y="176.04"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="184.6797" x="578.91" y="199.0351">other code of the package</text></g><g class="entity" data-entity="GMN15" data-source-line="24" data-uid="ent0016" id="entity_GMN15"><path d="M914.59,327.48 L914.59,413.1441 A0,0 0 0 0 914.59,413.1441 L1195.9264,413.1441 A0,0 0 0 0 1195.9264,413.1441 L1195.9264,337.48 L1185.9264,327.48 L965.95,327.48 L709.83,212.68 L957.95,327.48 L914.59,327.48 A0,0 0 0 0 914.59,327.48" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1185.9264,327.48 L1185.9264,337.48 L1195.9264,337.48 L1185.9264,327.48" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.8843" x="920.59" y="344.5469">A test reads the source of the package</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183.8535" x="920.59" y="359.6797">and fails for each red arrow.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="260.3364" x="920.59" y="374.8125">Other methods of Agents, a comparison</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.814" x="920.59" y="389.9453">with nil, and an assignment to the field</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.8203" x="920.59" y="405.0781">stay allowed.</text></g><!--link tools to request--><g class="link" data-entity-1="tools" data-entity-2="request" data-source-line="14" data-uid="lnk8" id="link_tools_request"><path d="M205.25,76.27 C205.25,103.88 205.25,136.29 205.25,161.44" fill="none" id="tools-to-request" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="205.25,167.44,209.25,158.44,205.25,162.44,201.25,158.44,205.25,167.44" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="110.4492" x="206.25" y="118.9569">the failed checks</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="108.1514" x="207.3989" y="134.0897">of the repository</text></g><!--link request to check--><g class="link" data-entity-1="request" data-entity-2="check" data-source-line="15" data-uid="lnk9" id="link_request_check"><path d="M81.58,216.07 C64.6,224.15 49.25,235.26 38.25,250.48 C26.02,267.42 29.46,278.53 38.25,297.48 C46.96,316.23 58.4169,328.2909 74.4169,340.1309" fill="none" id="request-to-check" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="79.24,343.7,74.3848,335.131,75.2208,340.7258,69.6261,341.5618,79.24,343.7" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="122.5034" x="39.25" y="263.5469">stop request read?</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="89.0894" x="55.957" y="278.6797">quota allows?</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.3784" x="43.3125" y="293.8125">tool checks pass?</text></g><!--link check to request--><g class="link" data-entity-1="check" data-entity-2="request" data-source-line="16" data-uid="lnk10" id="link_check_request"><path d="M140.11,343.65 C148.55,330.22 158.58,313.3 166.25,297.48 C178.54,272.17 187.7049,247.616 194.9049,226.606" fill="none" id="check-to-request" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="196.85,220.93,190.1484,228.1472,195.2291,225.66,197.7163,230.7407,196.85,220.93" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="74.312" x="202.067" y="271.0469">StartPermit</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.146" x="187.15" y="286.1797">(granted or not)</text></g><!--link request to caller--><g class="link" data-entity-1="request" data-entity-2="caller" data-source-line="17" data-uid="lnk11" id="link_request_caller"><path d="M251.77,220.91 C267.4,229.91 284.79,240.31 300.25,250.48 C324.93,266.7 383.0411,310.1653 422.5211,339.9653" fill="none" id="request-to-caller" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="427.31,343.58,422.5364,334.9653,423.3192,340.5677,417.7168,341.3505,427.31,343.58" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="68.4341" x="365.27" y="278.5469">the permit</text></g><!--link caller to start--><g class="link" data-entity-1="caller" data-entity-2="start" data-source-line="18" data-uid="lnk12" id="link_caller_start"><path d="M457.23,396.88 C455.07,419.27 455.38,451.8 470.25,475.15 C478.01,487.31 484.3825,493.9033 496.6925,501.6533" fill="none" id="caller-to-start" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="501.77,504.85,496.2848,496.67,497.5387,502.1861,492.0226,503.44,501.77,504.85" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="83.5669" x="516.312" y="456.2169">the only call,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173.6909" x="471.25" y="471.3497">only with a granted permit</text></g><!--link other to start--><g class="link" data-entity-1="other" data-entity-2="start" data-source-line="20" data-uid="lnk13" id="link_other_start"><path d="M674.82,212.8 C683.28,259.41 700.22,388.32 649.25,475.15 C642.24,487.09 636.4405,493.5509 624.9905,501.4909" fill="none" id="other-to-start" style="stroke:#FF0000;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#FF0000" points="620.06,504.91,629.7352,503.0684,624.1688,502.0608,625.1764,496.4944,620.06,504.91" style="stroke:#FF0000;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.4702" x="685.29" y="367.3769">refused: a call, a method value,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="166.8418" x="705.1042" y="382.5097">a copy of the field Agents</text></g><!--link other to caller--><g cla