<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="482px" preserveAspectRatio="none" style="width:684px;height:482px;background:#FFFFFF;" version="1.1" viewBox="0 0 684 482" width="684px" zoomAndPan="magnify"><defs/><g><!--entity request--><g class="entity" data-entity="request" data-source-line="8" data-uid="ent0002" id="entity_request"><rect fill="#F1F1F1" height="68.8906" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="241.2861" x="7" y="7"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="119.3008" x="17" y="29.9951">request the split,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="221.2861" x="17" y="46.292">the implementation, the review</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="132.3164" x="17" y="62.5889">(internal/workflow)</text></g><!--entity cleanup--><g class="entity" data-entity="cleanup" data-source-line="9" data-uid="ent0003" id="entity_cleanup"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="190.4609" x="283.41" y="15.15"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="170.4609" x="293.41" y="38.1451">cleanup of closed issues</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="132.3164" x="293.41" y="54.442">(internal/workflow)</text></g><!--entity workspace--><g class="entity" data-entity="workspace" data-source-line="10" data-uid="ent0004" id="entity_workspace"><rect fill="#F1F1F1" height="68.8906" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="208.7471" x="148.27" y="167.97"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="77.3418" x="158.27" y="190.9651">Workspace</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="188.0908" x="158.27" y="207.262">internal/agent/worktree.go</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="188.7471" x="158.27" y="223.5589">Prepare, Remove, Head, ...</text></g><!--entity git--><g class="entity" data-entity="git" data-source-line="11" data-uid="ent0005" id="entity_git"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="282.3018" x="111.49" y="391.62"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="18.2656" x="121.49" y="414.6151">git</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="262.3018" x="121.49" y="430.912">(clone, fetch, worktree, rev-parse, ...)</text></g><g class="entity" data-entity="GMN9" data-source-line="18" data-uid="ent0010" id="entity_GMN9"><path d="M391.9,136.89 L391.9,198.42 L357.29,202.42 L391.9,206.42 L391.9,267.9525 A0,0 0 0 0 391.9,267.9525 L677.3814,267.9525 A0,0 0 0 0 677.3814,267.9525 L677.3814,146.89 L667.3814,136.89 L391.9,136.89 A0,0 0 0 0 391.9,136.89" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M667.3814,136.89 L667.3814,146.89 L677.3814,146.89 L667.3814,136.89" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.5962" x="397.9" y="153.9569">A command that does not end</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.6724" x="397.9" y="169.0897">gets SIGTERM at the deadline.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="220.5049" x="397.9" y="184.2225">git then removes its lock files and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="236.0376" x="397.9" y="199.3553">the directory of an unfinished clone.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.4814" x="397.9" y="214.4881">The error names the command and says</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="166.207" x="397.9" y="229.621">that the deadline passed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.0439" x="397.9" y="244.7538">The caller handles it</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.1631" x="397.9" y="259.8866">as any failed git command.</text></g><g class="entity" data-entity="GMN12" data-source-line="29" data-uid="ent0013" id="entity_GMN12"><path d="M428.8,359.95 L428.8,413.92 L394.04,417.92 L428.8,421.92 L428.8,475.8797 A0,0 0 0 0 428.8,475.8797 L654.4929,475.8797 A0,0 0 0 0 654.4929,475.8797 L654.4929,369.95 L644.4929,359.95 L428.8,359.95 A0,0 0 0 0 428.8,359.95" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M644.4929,359.95 L644.4929,369.95 L654.4929,369.95 L644.4929,359.95" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="136.0176" x="434.8" y="377.0169">A child process of git</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.6929" x="434.8" y="392.1497">can keep the output pipe open.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.3154" x="434.8" y="407.2825">2 seconds after the deadline,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.5869" x="434.8" y="422.4153">git is killed, the pipe is closed,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.2432" x="434.8" y="437.5481">and the command returns.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.3418" x="434.8" y="452.681">Prepare removes the directory</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="138.5249" x="434.8" y="467.8138">of a clone that failed.</text></g><!--link request to workspace--><g class="link" data-entity-1="request" data-entity-2="workspace" data-source-line="13" data-uid="lnk6" id="link_request_workspace"><path d="M154.15,76.16 C175.29,103.04 201.0614,135.8134 222.2514,162.7634" fill="none" id="request-to-workspace" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="225.96,167.48,223.5416,157.9327,222.8695,163.5495,217.2527,162.8774,225.96,167.48" style="stroke:#181818;stroke-width:1;"/></g><!--link cleanup to workspace--><g class="link" data-entity-1="cleanup" data-entity-2="workspace" data-source-line="14" data-uid="lnk7" id="link_cleanup_workspace"><path d="M358.4,67.98 C336.97,95.02 306.7754,133.1067 283.1554,162.9267" fill="none" id="cleanup-to-workspace" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="279.43,167.63,288.1537,163.0586,282.5345,163.7106,281.8826,158.0914,279.43,167.63" style="stroke:#181818;stroke-width:1;"/></g><!--link workspace to git--><g class="link" data-entity-1="workspace" data-entity-2="git" data-source-line="15" data-uid="lnk8" id="link_workspace_git"><path d="M252.64,237.25 C252.64,280.05 252.64,346.8 252.64,385.29" fill="none" id="workspace-to-git" style="stroke:#FF0000;stroke-width:2;"/><polygon fill="#FF0000" points="252.64,391.29,256.64,382.29,252.64,386.29,248.64,382.29,252.64,391.29" style="stroke:#FF0000;stroke-width:2;"/><text fill="#FF0000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.2334" x="253.64" y="311.0169">every git command ends</text><text fill="#FF0000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.1406" x="284.6864" y="326.1497">after 5 minutes</text></g><!--SRC=[TLHDRzGm4BtlhnYLGq5AKWc9IuKg8V5v0A5IYGFBmTYJPBJEs7YShlhl6JlxaHOuhEBrl7bvy_oSIx3pH0pxa7O2BU0zfWSOA8CDqsJOGUWXZrW1u2YXpK4Ho4x0z1aJcCqbE3JE4sEdwxT1AP7pDPX17ssQkPjS0pb4iX3u7tIbxLOfCLs3ma5iefZbAjMzrf4Pafcaan5ChlqfX7oKbZ06eOL7TiJHA1XaD2xiYGVeZHTSLHpsPlRvVU3ynKm8ObXQmKJzPbC46HuymaN2tpFAyZg9ddApvRAcANei0vfCWPk3X7l2_PQV4wibRFnL6R3tOV_Y0ep0WMjDRpqQdcCPmleWw8145FH_aaF7ckHxERPeB6xvr5HThwqv8NP3sF9NjSWaRDJaATphywEULmDTrrNY_P5bJQqPK2agZHNVOxPZ0qVIfWpSAgLWPLdqQKSnS76jRMzMlCTX7- -ULj3-U9RGDR-2TpyLKl9t3Qzjy25TQ-7cxrYM06vv1Ld2-0eqpND6UNrLIpUR3OUi1qJ3M0DpVZl0cnDR7ZLNBg20eWktLWVC0jy-VRXxT_lv6Bjppg6gqJrMBugf0gHu7-mEUlBwrrIMsdMwDYh0CCpS4vECUkRLty9sfpXCAIHWpQJKlgEwyXFp89NkYHA8HZGyHmfhl5SRHctnLPBkcwBbGQ-1od9h4xkDJbecngSk3RLH_Hd9EuWfM1Gv5wmEiKECLKcOSvmpH8gwZiX5oaiGjE7yZLWhRWxUaS2ELArRhb3j9pbSXW9Q3kPiGy8y9vR2VmZqoVf7Bckz-BnukpYsp7wUzmy0]--></g></svg>