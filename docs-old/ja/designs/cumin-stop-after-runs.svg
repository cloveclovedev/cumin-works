<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="793px" preserveAspectRatio="none" style="width:805px;height:793px;background:#FFFFFF;" version="1.1" viewBox="0 0 805 793" width="805px" zoomAndPan="magnify"><defs/><g><ellipse cx="205.8691" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="268.0273" x="71.8555" y="50"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="248.0273" x="81.8555" y="71.1387">Operator: cumin stop --after-current-runs</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="187.5488" x="112.0947" y="103.9688"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="138.457" x="122.0947" y="125.1074">write stop-request.json</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="167.5488" x="122.0947" y="139.0762">(state directory of the Host)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="149.9727" x="130.8828" y="215.9063"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="129.9727" x="140.8828" y="237.0449">poll: read the request</text><path d="M420.7383,259.875 L420.7383,386.9375 L400.7383,390.9375 L420.7383,394.9375 L420.7383,522 A0,0 0 0 0 420.7383,522 L767.0049,522 A0,0 0 0 0 767.0049,522 L767.0049,269.875 L757.0049,259.875 L420.7383,259.875 A0,0 0 0 0 420.7383,259.875" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M757.0049,259.875 L757.0049,269.875 L767.0049,269.875 L757.0049,259.875" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.3555" x="426.7383" y="276.9419">Every start of an agent passes one check.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="301.3867" x="426.7383" y="292.0747">While cumin stops, the check gives no permit:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="303.856" x="426.7383" y="307.2075">no agent starts, no label changes for the start,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.457" x="426.7383" y="322.3403">and nothing is counted. This holds for every</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="289.7705" x="426.7383" y="337.4731">request to an agent, at a poll and at the end</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="54.9644" x="426.7383" y="352.606">of a run:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251.7036" x="426.7383" y="367.7388">split, acceptance check, claim, review,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258.3687" x="426.7383" y="382.8716">check fix, conflict resolution, review fix,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258.1274" x="426.7383" y="398.0044">fix of the review of a Maintainer, cause,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.9941" x="426.7383" y="413.1372">and the second request of the split,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="316.8115" x="426.7383" y="428.27">of the acceptance check, of the implementation,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.6479" x="426.7383" y="443.4028">of the review, and of the cause.</text><line style="stroke:#181818;stroke-width:1;" x1="420.7383" x2="767.0049" y1="451.4688" y2="451.4688"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.9531" x="426.7383" y="468.5356">The agent runs that are going on end</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="240.6777" x="426.7383" y="483.6685">by themselves. What follows the end</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.5234" x="426.7383" y="498.8013">of a run and needs no agent still runs:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="325.2666" x="426.7383" y="513.9341">verify done, labels, merge, stops for a Maintainer.</text><rect fill="#F1F1F1" height="75.875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="389.7383" x="11" y="353"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="222.7617" x="21" y="374.1387">apply the actions that need no agent</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="313.9863" x="21" y="388.1074">(requirement issue labels, labels of the pull request,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="369.7383" x="21" y="402.0762">merge after an approval of a Maintainer, close after a merge,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="290.9063" x="21" y="416.0449">stops for a Maintainer, follow-up notes, cleanup)</text><polygon fill="#F1F1F1" points="205.8691,171.9063,217.8691,183.9063,205.8691,195.9063,193.8691,183.9063,205.8691,171.9063" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="93.0386,545.8989,318.6997,545.8989,330.6997,558.7036,318.6997,571.5083,93.0386,571.5083,81.0386,558.7036,93.0386,545.8989" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="225.6611" x="93.0386" y="556.1094">a run in progress before or after the poll,</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="154.6284" x="93.0386" y="568.9141">or one that the poll started?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="113.7061" x="330.6997" y="543.3047">yes: wait for the end</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="124.5342" x="330.6997" y="556.1094">of a run or the interval</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="174.1191" x="118.8096" y="612.9072"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="154.1191" x="128.8096" y="634.0459">remove stop-request.json</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="176.0352" x="117.8516" y="666.876"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="156.0352" x="127.8516" y="688.0146">log "stopped", exit code 0</text><path d="M236.8691,710.8447 L236.8691,742.1104 L216.8691,746.1104 L236.8691,750.1104 L236.8691,781.376 A0,0 0 0 0 236.8691,781.376 L522.9409,781.376 A0,0 0 0 0 522.9409,781.376 L522.9409,720.8447 L512.9409,710.8447 L236.8691,710.8447 A0,0 0 0 0 236.8691,710.8447" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M512.9409,710.8447 L512.9409,720.8447 L522.9409,720.8447 L512.9409,710.8447" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.0718" x="242.8691" y="727.9116">SIGTERM keeps its meaning at any time:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.9023" x="242.8691" y="743.0444">cancel the runs and stop at once.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.2432" x="242.8691" y="758.1772">A request that is found at the start</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163.2046" x="242.8691" y="773.3101">of cumin run is removed.</text><ellipse cx="205.8691" cy="746.1104" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="205.8691" cy="746.1104" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="205.8691" x2="205.8691" y1="30" y2="50"/><polygon fill="#181818" points="201.8691,40,205.8691,50,209.8691,40,205.8691,44" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="205.8691" x2="205.8691" y1="83.9688" y2="103.9688"/><polygon fill="#181818" points="201.8691,93.9688,205.8691,103.9688,209.8691,93.9688,205.8691,97.9688" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="205.8691" x2="205.8691" y1="249.875" y2="353"/><polygon fill="#181818" points="201.8691,343,205.8691,353,209.8691,343,205.8691,347" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="205.8691" x2="205.8691" y1="195.9063" y2="215.9063"/><polygon fill="#181818" points="201.8691,205.9063,205.8691,215.9063,209.8691,205.9063,205.8691,209.9063" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="330.6997" x2="779.0049" y1="558.7036" y2="558.7036"/><polygon fill="#181818" points="775.0049,366.8555,779.0049,356.8555,783.0049,366.8555,779.0049,362.8555" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="779.0049" x2="779.0049" y1="183.9063" y2="558.7036"/><line style="stroke:#181818;stroke-width:1;" x1="779.0049" x2="217.8691" y1="183.9063" y2="183.9063"/><polygon fill="#181818" points="227.8691,179.9063,217.8691,183.9063,227.8691,187.9063,223.8691,183.9063" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="205.8691" x2="205.8691" y1="428.875" y2="545.8989"/><polygon fill="#181818" points="201.8691,535.8989,205.8691,545.8989,209.8691,535.8989,205.8691,539.8989" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="205.8691" x2="205.8691" y1="151.9063" y2="171.9063"/><polygon fill="#181818" points="201.8691,161.9063,205.8691,171.9063,209.8691,161.9063,205.8691,165.9063" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="205.8691" x2="205.8691" y1="571.5083" y2="612.9072"/><polygon fill="#181818" points="201.8691,602.9072,205.8691,612.9072,209.8691,602.9072,205.8691,606.9072" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="209.8691" y="592.813">no</text><line style="stroke:#181818;stroke-width:1;" x1="205.8691" x2="205.8691" y1="646.876" y2="666.876"/><polygon fill="#181818" points="201.8691,656.876,205.8691,666.876,209.8691,656.876,205.8691,660.876" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="205.8691" x2="205.8691" y1="700.8447" y2="735.1104"/><polygon fill="#181818" points="201.8691,725.1104,205.8691,735.1104,209.8691,725.1104,205.8691,729.1104" style="stroke:#181818;stroke-width:1;"/><!--SRC=[TLLDRzGm4BtdLuouq4f9uBoLG4Xy7W09Ad7XuiQJnDInWyVPfV-UcR6pBL0ghPhOy_7cpPl9KnYsnGKunNHBq46U4IZ75SoOCUdhiAM48KFQ0Xsg-UY2enb93SoqNuC9bjrDoWGXGi2J1eOR76D2S1dmbylKDq_XTUH8x5SZTWCRz8jjWPEx0M9u38ha4ESl62ocWxm33ScjcPubFUkiCrCo2_KqWyd5AyOCSIpFk4PoEQQxlg5R5rR3na2piV7amWIZyOGFRYoEPlFvRGpvaraOa0dK4IOtDeqMsXm-hvWCHzovKSnTfwYxIbudoA-QmocvNAhg4lxSa7B_W