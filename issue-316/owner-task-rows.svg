<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="359px" preserveAspectRatio="none" style="width:1700px;height:359px;background:#FFFFFF;" version="1.1" viewBox="0 0 1700 359" width="1700px" zoomAndPan="magnify"><defs/><g><rect fill="none" height="337.8198" style="stroke:#000000;stroke-width:1.5;" width="1678.9736" x="11" y="11"/><path d="M593.4688,11 L593.4688,20.2969 L583.4688,30.2969 L11,30.2969" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="572.4688" x="14" y="24.9951">The way out of cumin/status/reviewing: every poll, and the end of a Reviewer run</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="235.4609" x="737.7563" y="40.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="215.4609" x="747.7563" y="61.4355">Read the issue again, with the facts</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="268.4961" x="721.2388" y="94.2656"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="248.4961" x="731.2388" y="115.4043">Decide with the pure function ReviewEnd</text><polygon fill="#F1F1F1" points="33,148.2344,234.502,148.2344,246.502,160.2344,234.502,172.2344,33,172.2344,21,160.2344,33,148.2344" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="137.751" y="182.4448">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="201.502" x="33" y="164.0425">A question comment after the label?</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="113.1875" x="77.1572" y="203.9448"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="93.1875" x="87.1572" y="225.0835">stop the review</text><ellipse cx="133.751" cy="283.9136" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="133.751" cy="283.9136" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="326.5071,148.2344,537.7683,148.2344,549.7683,160.2344,537.7683,172.2344,326.5071,172.2344,314.5071,160.2344,326.5071,148.2344" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="436.1377" y="182.4448">no</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="211.2612" x="326.5071" y="164.0425">An open pull request closes the issue?</text><path d="M627.7734,214.1831 L627.7734,237.8823 L607.7734,241.8823 L627.7734,245.8823 L627.7734,269.5815 A0,0 0 0 0 627.7734,269.5815 L944.5552,269.5815 A0,0 0 0 0 944.5552,269.5815 L944.5552,224.1831 L934.5552,214.1831 L627.7734,214.1831 A0,0 0 0 0 627.7734,214.1831" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M934.5552,214.1831 L934.5552,224.1831 L944.5552,224.1831 L934.5552,214.1831" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="295.7817" x="633.7734" y="231.25">The Maintainer adds this condition to the row</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="240.6777" x="633.7734" y="246.3828">"stop the review" of issue-states.md.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152.2104" x="633.7734" y="261.5156">Today no row covers it.</text><rect fill="#FFE5E5" height="75.875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="351.2715" x="256.502" y="203.9448"/><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="110.502" x="266.502" y="225.0835">stop the review:</text><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="263.2793" x="266.502" y="239.0522">not exactly one risk label: that reason;</text><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="271.2246" x="266.502" y="253.021">else: the pull request is no longer open.</text><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="331.2715" x="266.502" y="266.9897">cumin/status/awaiting-decision, comment, notify</text><ellipse cx="432.1377" cy="325.8198" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="432.1377" cy="325.8198" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="976.5552,148.2344,1120.0869,148.2344,1132.0869,160.2344,1120.0869,172.2344,976.5552,172.2344,964.5552,160.2344,976.5552,148.2344" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="1052.321" y="182.4448">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="143.5317" x="976.5552" y="164.0425">The head commit moved?</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="151.8594" x="972.3914" y="203.9448"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="131.8594" x="982.3914" y="225.0835">go back to the checks</text><ellipse cx="1048.321" cy="283.9136" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="1048.321" cy="283.9136" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="1196.29,148.2344,1356.6494,148.2344,1368.6494,160.2344,1356.6494,172.2344,1196.29,172.2344,1184.29,160.2344,1196.29,148.2344" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="51.5679" x="1280.4697" y="182.4448">APPROVE</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="160.3594" x="1196.29" y="164.0425">Review on the head commit?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="29.3047" x="1368.6494" y="157.6401">other</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="268.7656" x="1142.0869" y="203.9448"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="185.1738" x="1152.0869" y="225.0835">DecideMerge: start the merge,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="164.291" x="1152.0869" y="239.0522">ask for the merge decision,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="248.7656" x="1152.0869" y="253.021">go back to the checks, or stop the review</text><ellipse cx="1276.4697" cy="311.8511" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="1276.4697" cy="311.8511" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="259.1211" x="1420.8525" y="214.5112"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="239.1211" x="1430.8525" y="235.6499">request a review fix, request the cause,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="199.8633" x="1430.85