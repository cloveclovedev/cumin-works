<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="602px" preserveAspectRatio="none" style="width:1411px;height:602px;background:#FFFFFF;" version="1.1" viewBox="0 0 1411 602" width="1411px" zoomAndPan="magnify"><defs/><g><rect fill="none" height="538.3003" style="stroke:#000000;stroke-width:1.5;" width="1389.1382" x="11" y="11"/><path d="M375.8467,11 L375.8467,20.2969 L365.8467,30.2969 L11,30.2969" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="354.8467" x="14" y="24.9951">At every poll, for an issue in cumin/status/merging</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="145.918" x="627.6101" y="40.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="125.918" x="637.6101" y="61.4355">Read the issue again</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="151.8594" x="624.6394" y="142.668"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="131.8594" x="634.6394" y="163.8066">go back to the checks</text><ellipse cx="700.5691" cy="216.1523" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="700.5691" cy="216.1523" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="606.3091,94.2656,794.8291,94.2656,806.8291,106.2656,794.8291,118.2656,606.3091,118.2656,594.3091,106.2656,606.3091,94.2656" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="704.5691" y="128.4761">no</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="188.52" x="606.3091" y="110.0737">The conditions of the merge hold?</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="314.5801" x="543.2791" y="269.1523"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="294.5801" x="553.2791" y="290.291">Wait 5 seconds after an earlier merge of this poll</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="251.5859" x="574.7761" y="323.1211"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="172.6699" x="584.7761" y="344.2598">cumin-core sends the merge</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="231.5859" x="584.7761" y="358.2285">with sha = the approved head commit</text><polygon fill="#F1F1F1" points="36.2751,391.0586,277.4319,391.0586,289.4319,403.0586,277.4319,415.0586,36.2751,415.0586,24.2751,403.0586,36.2751,391.0586" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="160.8535" y="425.269">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="241.1567" x="36.2751" y="406.8667">Merged, a lost answer, a temporary failure?</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="271.707" x="21" y="446.769"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="169.8516" x="31" y="467.9077">Keep cumin/status/merging.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="251.707" x="31" y="481.8765">The next poll reads the pull request again</text><polygon fill="#F1F1F1" points="361.7925,391.0586,547.3853,391.0586,559.3853,403.0586,547.3853,415.0586,361.7925,415.0586,349.7925,403.0586,361.7925,391.0586" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="458.5889" y="425.269">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="185.5928" x="361.7925" y="406.8667">405 "Base branch was modified"?</text><path d="M626.4707,446.769 L626.4707,478.0347 L606.4707,482.0347 L626.4707,486.0347 L626.4707,517.3003 A0,0 0 0 0 626.4707,517.3003 L942.8335,517.3003 A0,0 0 0 0 942.8335,517.3003 L942.8335,456.769 L932.8335,446.769 L626.4707,446.769 A0,0 0 0 0 626.4707,446.769" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M932.8335,446.769 L932.8335,456.769 L942.8335,456.769 L932.8335,446.769" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.3511" x="632.4707" y="463.8359">This issue records the red answer as a row</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="295.3628" x="632.4707" y="478.9688">of measured-constraints.md, next to row 124</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="214.7539" x="632.4707" y="494.1016">(405 of a conflict or of a ruleset).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.7212" x="632.4707" y="509.2344">The code already does this.</text><rect fill="#FFE5E5" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="303.7637" x="302.707" y="458.0659"/><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="283.7637" x="312.707" y="479.2046">Keep cumin/status/merging, no comment.</text><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="247.8574" x="312.707" y="493.1733">The next poll sends the merge again</text><polygon fill="#F1F1F1" points="974.8335,391.0586,1151.4351,391.0586,1163.4351,403.0586,1151.4351,415.0586,974.8335,415.0586,962.8335,403.0586,974.8335,391.0586" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="1067.1343" y="425.269">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="176.6016" x="974.8335" y="406.8667">Conflict? (405, mergeable false)</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="1163.4351" y="400.4644">no</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="188.252" x="969.0083" y="446.769"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="168.252" x="979.0083" y="467.9077">request a conflict resolution</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="206.7031" x="1183.4351" y="454.6636"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="96.2871" x="1193.4351" y="475.8022">stop the merge:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="186.7031" x="1193.4351" y="489.771">cumin/status/awaiting-decision</text><ellipse cx="700.5691" cy="580.3003" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="700.5691" cy="580.3003" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="700.5691" x2="700.5691" y1="176.6367" y2="205.1523"/><polygon fill="#181818" points="696.5691,195.1523,700.5691,205.1523,704.5691,195.1523,700.5691,199.1523" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="700