<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="359px" preserveAspectRatio="none" style="width:1695px;height:359px;background:#FFFFFF;" version="1.1" viewBox="0 0 1695 359" width="1695px" zoomAndPan="magnify"><defs/><g><rect fill="none" height="337.8198" style="stroke:#000000;stroke-width:1.5;" width="1673.5781" x="11" y="11"/><path d="M593.4688,11 L593.4688,20.2969 L583.4688,30.2969 L11,30.2969" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="572.4688" x="14" y="24.9951">The way out of cumin/status/reviewing: every poll, and the end of a Reviewer run</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="235.4609" x="735.0586" y="40.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="215.4609" x="745.0586" y="61.4355">Read the issue again, with the facts</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="268.4961" x="718.541" y="94.2656"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="248.4961" x="728.541" y="115.4043">Decide with the pure function ReviewEnd</text><polygon fill="#F1F1F1" points="33,148.2344,234.502,148.2344,246.502,160.2344,234.502,172.2344,33,172.2344,21,160.2344,33,148.2344" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="137.751" y="182.4448">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="201.502" x="33" y="164.0425">A question comment after the label?</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="113.1875" x="77.1572" y="203.9448"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="93.1875" x="87.1572" y="225.0835">stop the review</text><ellipse cx="133.751" cy="283.9136" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="133.751" cy="283.9136" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="326.5071,148.2344,537.7683,148.2344,549.7683,160.2344,537.7683,172.2344,326.5071,172.2344,314.5071,160.2344,326.5071,148.2344" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="436.1377" y="182.4448">no</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="211.2612" x="326.5071" y="164.0425">An open pull request closes the issue?</text><path d="M627.7734,214.1831 L627.7734,237.8823 L607.7734,241.8823 L627.7734,245.8823 L627.7734,269.5815 A0,0 0 0 0 627.7734,269.5815 L939.1597,269.5815 A0,0 0 0 0 939.1597,269.5815 L939.1597,224.1831 L929.1597,214.1831 L627.7734,214.1831 A0,0 0 0 0 627.7734,214.1831" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M929.1597,214.1831 L929.1597,224.1831 L939.1597,224.1831 L929.1597,214.1831" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="194.543" x="633.7734" y="231.25">This issue builds the red step.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261.3838" x="633.7734" y="246.3828">Today ReviewEnd decides nothing here,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="290.3862" x="633.7734" y="261.5156">and the issue keeps cumin/status/reviewing.</text><rect fill="#FFE5E5" height="75.875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="351.2715" x="256.502" y="203.9448"/><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="110.502" x="266.502" y="225.0835">stop the review:</text><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="263.2793" x="266.502" y="239.0522">not exactly one risk label: that reason;</text><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="271.2246" x="266.502" y="253.021">else: the pull request is no longer open.</text><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="331.2715" x="266.502" y="266.9897">cumin/status/awaiting-decision, comment, notify</text><ellipse cx="432.1377" cy="325.8198" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="432.1377" cy="325.8198" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="971.1597,148.2344,1114.6914,148.2344,1126.6914,160.2344,1114.6914,172.2344,971.1597,172.2344,959.1597,160.2344,971.1597,148.2344" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="1046.9255" y="182.4448">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="143.5317" x="971.1597" y="164.0425">The head commit moved?</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="151.8594" x="966.9958" y="203.9448"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="131.8594" x="976.9958" y="225.0835">go back to the checks</text><ellipse cx="1042.9255" cy="283.9136" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="1042.9255" cy="283.9136" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="1190.8945,148.2344,1351.2539,148.2344,1363.2539,160.2344,1351.2539,172.2344,1190.8945,172.2344,1178.8945,160.2344,1190.8945,148.2344" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="51.5679" x="1275.0742" y="182.4448">APPROVE</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="160.3594" x="1190.8945" y="164.0425">Review on the head commit?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="29.3047" x="1363.2539" y="157.6401">other</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="268.7656" x="1136.6914" y="203.9448"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="185.1738" x="1146.6914" y="225.0835">DecideMerge: start the merge,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="164.291" x="1146.6914" y="239.0522">ask for the merge decision,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="248.7656" x="1146.6914" y="253.021">go back to the checks, or stop the review</text><ellipse cx="1271.0742" cy="311.8511" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="1271.0742" cy="311.8511" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="259.1211" x="1415.457" y="214.5112"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="239.1211" x="1425.457" y="235.6499">request a review fix, request the cause,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="199.8633" x="1425.457" y="249.6187">request the review again, or stop</text><ellipse cx="1545.0176" cy="308.4487" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="1545.0176" cy="308.4487" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="852.7891" x2="852.7891" y1="74.2656" y2="94.2656"/><polygon fill="#181818" points="848.7891,84.2656,852.7891,94.2656,856.7891,84.2656,852.7891,88.2656" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="133.751" x2="133.751" y1="237.9136" y2="272.9136"/><polygon fill="#181818" points="129.751,262.9136,133.751,272.9136,137.751,262.9136,133.751,266.9136" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="432.1377" x2="432.1377" y1="279.8198" y2="314.8198"/><polygon fill="#181818" points="428.1377,304.8198,432.1377,314.8198,436.1377,304.8198,432.1377,308.8198" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="1042.9255" x2="1042.9255" y1="237.9136" y2="272.9136"/><polygon fill="#181818" points="1038.9255,262.9136,1042.9255,272.9136,1046.9255,262.9136,1042.9255,266.9136" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="1271.0742" x2="1271.0742" y1="265.8511" y2="300.8511"/><polygon fill="#181818" points="1267.0742,290.8511,1271.0742,300.8511,1275.0742,290.8511,1271.0742,294.8511" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="1545.0176" x2="1545.0176" y1="262.4487" y2="297.4487"/><polygon fill="#181818" points="1541.0176,287.4487,1545.0176,297.4487,1549.0176,287.4487,1545.0176,291.4487" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="133.751" x2="133.751" y1="172.2344" y2="203.9448"/><polygon fill="#181818" points="129.751,193.9448,133.751,203.9448,137.751,193.9448,133.751,197.9448" style="stroke:#181818;stroke