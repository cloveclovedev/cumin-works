y="110.0737">The conditions of the merge hold?</text><path d="M651.8955,265.4219 L651.8955,289.1211 L631.8955,293.1211 L651.8955,297.1211 L651.8955,320.8203 A0,0 0 0 0 651.8955,320.8203 L1010.5083,320.8203 A0,0 0 0 0 1010.5083,320.8203 L1010.5083,275.4219 L1000.5083,265.4219 L651.8955,265.4219 A0,0 0 0 0 651.8955,265.4219" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1000.5083,265.4219 L1000.5083,275.4219 L1010.5083,275.4219 L1000.5083,265.4219" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="337.6128" x="657.8955" y="282.4888">This issue adds the acceptance test of the red step:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.1309" x="657.8955" y="297.6216">two merges in one poll, the second one</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="292.3096" x="657.8955" y="312.7544">starts after the wait. The code already waits.</text><rect fill="#FFE5E5" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="229.5254" x="402.3701" y="269.1523"/><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="209.5254" x="412.3701" y="290.291">Wait 5 seconds after an earlier</text><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="208.9395" x="412.3701" y="304.2598">merge of this poll (MergeWait)</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="251.5859" x="391.3398" y="340.8203"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="172.6699" x="401.3398" y="361.959">cumin-core sends the merge</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="231.5859" x="401.3398" y="375.9277">with sha = the approved head commit</text><polygon fill="#F1F1F1" points="36.2751,408.7578,277.4319,408.7578,289.4319,420.7578,277.4319,432.7578,36.2751,432.7578,24.2751,420.7578,36.2751,408.7578" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="160.8535" y="442.9683">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="241.1567" x="36.2751" y="424.5659">Merged, a lost answer, a temporary failure?</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="271.707" x="21" y="465.5625"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="169.8516" x="31" y="486.7012">Keep cumin/status/merging.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="251.707" x="31" y="500.6699">The next poll reads the pull request again</text><polygon fill="#F1F1F1" points="346.5376,408.7578,532.1304,408.7578,544.1304,420.7578,532.1304,432.7578,346.5376,432.7578,334.5376,420.7578,346.5376,408.7578" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="443.334" y="442.9683">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="185.5928" x="346.5376" y="424.5659">405 "Base branch was modified"?</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="273.2539" x="302.707" y="465.5625"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="253.2539" x="312.707" y="486.7012">Keep cumin/status/merging, no comment.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="220.6992" x="312.707" y="500.6699">The next poll sends the merge again</text><polygon fill="#F1F1F1" points="607.9609,408.7578,784.5625,408.7578,796.5625,420.7578,784.5625,432.7578,607.9609,432.7578,595.9609,420.7578,607.9609,408.7578" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="700.2617" y="442.9683">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="176.6016" x="607.9609" y="424.5659">Conflict? (405, mergeable false)</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="796.5625" y="418.1636">no</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="188.252" x="602.1357" y="465.5625"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="168.252" x="612.1357" y="486.7012">request a conflict resolution</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="206.7031" x="816.5625" y="462.1602"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="96.2871" x="826.5625" y="483.2988">stop the merge:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="186.7031" x="826.5625" y="497.2676">cumin/status/awaiting-decision</text><ellipse cx="517.1328" cy="576.5" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="517.1328" cy="576.5" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="517.1328" x2="517.1328" y1="176.6367" y2="205.1523"/><polygon fill="#181818" points="513.1328,195.1523,517.1328,205.1523,521.1328,195.1523,517.1328,199.1523" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="