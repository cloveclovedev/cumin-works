<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="623px" preserveAspectRatio="none" style="width:536px;height:623px;background:#FFFFFF;" version="1.1" viewBox="0 0 536 623" width="536px" zoomAndPan="magnify"><defs/><g><ellipse cx="149.2031" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="232.666" x="32.8701" y="50"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="212.666" x="42.8701" y="71.1387">poll of every target repository ends</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="107.8496" x="95.2783" y="153.9805"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="87.8496" x="105.2783" y="175.1191">clear the mark</text><ellipse cx="149.2031" cy="227.0625" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="149.2031" cy="227.0625" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="75.9441,103.9688,222.4622,103.9688,234.4622,116.7734,222.4622,129.5781,75.9441,129.5781,63.9441,116.7734,75.9441,103.9688" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="153.2031" y="139.7886">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="146.5181" x="75.9441" y="114.1792">the poll decided an action,</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="97.2651" x="75.9441" y="126.9839">or an agent runs?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="234.4622" y="114.1792">no</text><path d="M307.4063,270.0625 L307.4063,301.3281 L287.4063,305.3281 L307.4063,309.3281 L307.4063,340.5938 A0,0 0 0 0 307.4063,340.5938 L524.6821,340.5938 A0,0 0 0 0 524.6821,340.5938 L524.6821,280.0625 L514.6821,270.0625 L307.4063,270.0625 A0,0 0 0 0 307.4063,270.0625" fill="#FFFFFF" style="stroke:#181818;stroke-width:0.5;"/><path d="M514.6821,270.0625 L514.6821,280.0625 L524.6821,280.0625 L514.6821,270.0625" fill="#FFFFFF" style="stroke:#181818;stroke-width:0.5;"/><text fill="#D62728" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="196.2759" x="313.4063" y="287.1294">This issue adds this check.</text><text fill="#D62728" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="180.083" x="313.4063" y="302.2622">yes: no waiting notification.</text><text fill="#D62728" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.022" x="313.4063" y="317.395">The quota notification already</text><text fill="#D62728" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="116.9746" x="313.4063" y="332.5278">named the cause.</text><rect fill="#FFFFFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="276.4063" x="11" y="281.3594"/><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="256.4063" x="21" y="302.498">does an issue wait only for the quota,</text><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="87.2871" x="21" y="316.4668">in any state?</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="106.2441" x="96.0811" y="410.6055"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="86.2441" x="106.0811" y="431.7441">no notification</text><ellipse cx="149.2031" cy="483.6875" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="149.2031" cy="483.6875" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="66.3486,360.5938,232.0576,360.5938,244.0576,373.3984,232.0576,386.2031,66.3486,386.2031,54.3486,373.3984,66.3486,360.5938" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="153.2031" y="396.4136">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="165.709" x="66.3486" y="370.8042">an issue that cumin moves on</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="143.7573" x="66.3486" y="383.6089">without the Owner exists?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="244.0576" y="370.8042">no</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="257.6621" x="20.3721" y="536.6875"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="237.6621" x="30.3721" y="557.8262">notify the Owner once that cumin waits</text><ellipse cx="149.2031" cy="601.6563" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="149.2031" cy="601.6563" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="149.2031" x2="149.2031" y1="30" y2="50"/><polygon fill="#181818" points="145.2031,40,149.2031,50,153.2031,40,149.2031,44" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="149.2031" x2="149.2031" y1="187.9492" y2="216.0625"/><polygon fill="#181818" points="145.2031,206.0625,149.2031,216.0625,153.2031,206.0625,149.2031,210.0625" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1