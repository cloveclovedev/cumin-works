<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="531px" preserveAspectRatio="none" style="width:655px;height:531px;background:#FFFFFF;" version="1.1" viewBox="0 0 655 531" width="655px" zoomAndPan="magnify"><defs/><g><ellipse cx="159.4951" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="253.4961" x="32.7471" y="50"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="233.4961" x="42.7471" y="71.1387">Owner: cumin stop --after-current-runs</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="211.8652" x="53.5625" y="147.9688"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="191.8652" x="63.5625" y="169.1074">poll, or the end of an agent run,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="180.1582" x="63.5625" y="183.0762">decides a request to an agent</text><path d="M327.9902,205.9063 L327.9902,244.7383 L307.9902,248.7383 L327.9902,252.7383 L327.9902,291.5703 A0,0 0 0 0 327.9902,291.5703 L617.5532,291.5703 A0,0 0 0 0 617.5532,291.5703 L617.5532,215.9063 L607.5532,205.9063 L327.9902,205.9063 A0,0 0 0 0 327.9902,205.9063" fill="#FFFFFF" style="stroke:#181818;stroke-width:0.5;"/><path d="M607.5532,205.9063 L607.5532,215.9063 L617.5532,215.9063 L607.5532,205.9063" fill="#FFFFFF" style="stroke:#181818;stroke-width:0.5;"/><text fill="#D62728" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="234.127" x="333.9902" y="222.9731">This issue builds this one place.</text><text fill="#D62728" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="268.563" x="333.9902" y="238.106">While cumin stops after the current runs:</text><text fill="#D62728" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.9712" x="333.9902" y="253.2388">no agent starts, no label changes,</text><text fill="#D62728" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.3833" x="333.9902" y="268.3716">nothing is counted. Every request,</text><text fill="#D62728" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="227.6841" x="333.9902" y="283.5044">also the second acceptance check.</text><rect fill="#FFFFFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="296.9902" x="11" y="224.7695"/><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="276.9902" x="21" y="245.9082">one check before every start of an agent</text><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="270.6094" x="21" y="259.877">(before the label change and the count)</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="242.7617" x="38.1143" y="311.5703"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="222.7617" x="48.1143" y="332.709">apply the actions that need no agent</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="200.7012" x="48.1143" y="346.6777">(labels, comments, merge, close)</text><polygon fill="#F1F1F1" points="159.4951,103.9688,171.4951,115.9688,159.4951,127.9688,147.4951,115.9688,159.4951,103.9688" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="109.7292,379.5078,209.261,379.5078,221.261,391.5078,209.261,403.5078,109.7292,403.5078,97.7292,391.5078,109.7292,379.5078" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="99.5317" x="109.7292" y="395.3159">a run in progress?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="221.261" y="388.9136">yes</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="248.4746" x="35.2578" y="444.9067"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="228.4746" x="45.2578" y="466.0454">remove stop-request.json, exit code 0</text><ellipse cx="159.4951" cy="509.8755" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="159.4951" cy="509.8755" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="159.4951" x2="159.4951" y1="30" y2="50"/><polygon fill="#181818" points="155.4951,40,159.4951,50,163.4951,40,159.4951,44" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="159.4951" x2="159.4951" y1="195.9063" y2="224.7695"/><polygon fill="#181818" points="155.4951,214.7695,159.4951,224.7695,163.4951,214.7695,159.4951,218.7695" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="159.4951" x2="159.4951" y1="272.707" y2="311.5703"/><polygon fill="#181818" points="155.4951,301.5703,159.4951,311.5703,163.4951,301.5703,159.4951,305.5703" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="159.4951" x2="159.4951" y1="127.9688" y2="147.9688"/><polygon fill="#181818" points="155.4951,137.9688,159.4951,147.9688,163.4951,137.9688,159.4951,141.9688" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="221.261" x2="629.5532" y1="391.5078" y2="391.5078"/><polygon fill="#181818" points="625.5532,258.7383,629.5532,248.7383,633.5532,258.7383,629.5532,254.7383" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="6