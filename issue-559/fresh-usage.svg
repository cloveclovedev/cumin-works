<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="658px" preserveAspectRatio="none" style="width:616px;height:658px;background:#FFFFFF;" version="1.1" viewBox="0 0 616 658" width="616px" zoomAndPan="magnify"><defs/><g><ellipse cx="225.3945" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="169.9648" x="140.4121" y="50"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="149.9648" x="150.4121" y="71.1387">an agent start is decided</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="165.4004" x="142.6943" y="152.3711"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="145.4004" x="152.6943" y="173.5098">no start, no minimal run</text><ellipse cx="225.3945" cy="225.8555" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="225.3945" cy="225.8555" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="101.6418,103.9688,349.1472,103.9688,361.1472,115.9688,349.1472,127.9688,101.6418,127.9688,89.6418,115.9688,101.6418,103.9688" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="229.3945" y="138.1792">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="247.5054" x="101.6418" y="119.7769">stopped, and the next try time is still ahead?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="361.1472" y="113.3745">no</text><path d="M367.4814,268.8555 L367.4814,300.1211 L347.4814,304.1211 L367.4814,308.1211 L367.4814,339.3867 A0,0 0 0 0 367.4814,339.3867 L604.3018,339.3867 A0,0 0 0 0 604.3018,339.3867 L604.3018,278.8555 L594.3018,268.8555 L367.4814,268.8555 A0,0 0 0 0 367.4814,268.8555" fill="#FFFFFF" style="stroke:#181818;stroke-width:0.5;"/><path d="M594.3018,268.8555 L594.3018,278.8555 L604.3018,278.8555 L594.3018,268.8555" fill="#FFFFFF" style="stroke:#181818;stroke-width:0.5;"/><text fill="#D62728" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="186.2212" x="373.4814" y="285.9224">This issue adds this step.</text><text fill="#D62728" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.8203" x="373.4814" y="301.0552">yes: no minimal run, decide from</text><text fill="#D62728" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.3784" x="373.4814" y="316.188">the stored usage.</text><text fill="#D62728" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.583" x="373.4814" y="331.3208">no: one minimal run, as today.</text><rect fill="#FFFFFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="244.1738" x="103.3076" y="280.1523"/><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="224.1738" x="113.3076" y="301.291">is the stored usage new enough?</text><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="198.0645" x="113.3076" y="315.2598">(read at most 5 minutes ago)</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="202.3262" x="124.2314" y="359.3867"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="167.7012" x="134.2314" y="380.5254">minimal run of Claude Code</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="182.3262" x="134.2314" y="394.4941">(only when the usage is older)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="264.9629" x="92.9131" y="427.3242"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="244.9629" x="102.9131" y="448.4629">store the usage and the time of the read</text><polygon fill="#F1F1F1" points="167.0698,481.293,283.7192,481.293,295.7192,493.293,283.7192,505.293,167.0698,505.293,155.0698,493.293,167.0698,481.293" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="116.6494" x="167.0698" y="497.1011">a window at its limit?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="136.0615" y="490.6987">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="295.7192" y="490.6987">no</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="189.4648" x="11" y="515.293"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="106.2246" x="21" y="536.4316">stop agent starts,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="169.4648" x="21" y="550.4004">notify once for each window</text><ellipse cx="105.7324" cy="594.2305" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="105.7324" cy="594.2305" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="249.1836" x="220.4648" y="515.293"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="229.1836" x="230.4648" y="536.4316">change the label, then start the agent</text><ellipse cx="225.3945" cy="636.2305" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="225.3945" cy="636.2305" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="225.3945" x2="225.3945" y1="30" y2="50"/><polygon fill="#181818" points="221.3945,40,225.3945,50,229.3945,40,225.3945,44" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="225.3945" x2="225.3945" y1="186.3398" y2="214.8555"/><polygon fill="#181818" points="221.3945,204.8555,225.3945,214.8555,229.3945,204.8555,225.3945,208.8555" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="225.3945" x2="225.3945" y1="127.9688" y2="152.3711"/><polygon fill="#181818" points="221.3945,142.3711,225.3945,152.3711,229.3945,142.3711,225.3945,146.3711" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="361.1472" x2="373.1472" y1="115.9688" y2="115.9688"/><polygon fill="#181818" points="369.1472,184.8555,373.1472,194.8555,377.1472,184.8555,373.1472,188.8555" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="373.1472" x2="373.1472" y1="115.9688" y2="258.8555"/><line style="stroke:#181818;stroke-width:1;" x1="373.1472" x2="225.3945" y1="258.8555" y2="258.8555"/><line style="stroke:#181818;stroke-width:1;" x1="225.3945" x2="225.3945" y1="258.8555" y2="280.1523"/><polygon fill="#181818" points="221.3945,270.1523,225.3945,280.1523,229.3945,270.1523,225.3945,274.1523" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="225.3945" x2="225.3945" y1="83.9688" y2="103.9688"/><polygon fill="#181818" points="221.3945,93.9688,225.3945,103.9688,229.3945,93.9688,225.3945,97.9688" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="225.3945" x2="225.3945" y1="328.0898" y2="359.3867"/><polygon fill="#181818" points="221.3945,349.3867,225.3945,359.386