<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="599px" preserveAspectRatio="none" style="width:616px;height:599px;background:#FFFFFF;" version="1.1" viewBox="0 0 616 599" width="616px" zoomAndPan="magnify"><defs/><g><ellipse cx="165.6086" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><path d="M333.8313,45.6875 L333.8313,76.9531 L313.8313,80.9531 L333.8313,84.9531 L333.8313,116.2188 A0,0 0 0 0 333.8313,116.2188 L604.8147,116.2188 A0,0 0 0 0 604.8147,116.2188 L604.8147,55.6875 L594.8147,45.6875 L333.8313,45.6875 A0,0 0 0 0 333.8313,45.6875" fill="#FFFFFF" style="stroke:#181818;stroke-width:0.5;"/><path d="M594.8147,45.6875 L594.8147,55.6875 L604.8147,55.6875 L594.8147,45.6875" fill="#FFFFFF" style="stroke:#181818;stroke-width:0.5;"/><text fill="#D62728" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="218.0737" x="339.8313" y="62.7544">This issue: every start passes</text><text fill="#D62728" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="249.9834" x="339.8313" y="77.8872">the quota check, in the one place.</text><text fill="#D62728" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="181.9175" x="339.8313" y="93.02">Today: only a new start and</text><text fill="#D62728" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="116.4287" x="339.8313" y="108.1528">a second request.</text><rect fill="#FFFFFF" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="296.4453" x="17.386" y="50"/><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="240.791" x="27.386" y="71.1387">any request to an agent is decided:</text><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="276.4453" x="27.386" y="85.1074">a new start, the next request of an issue</text><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="193.5703" x="27.386" y="99.0762">in work, or a second request</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="266.0879" x="32.5647" y="136.2188"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="246.0879" x="42.5647" y="157.3574">one check before every start of an agent</text><rect fill="#FFFFFF" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="240.875" x="45.1711" y="238.5898"/><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="121.7461" x="55.1711" y="259.7285">stop agent starts:</text><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="220.875" x="55.1711" y="273.6973">no agent, no label change, no count.</text><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="152.4902" x="55.1711" y="287.666">The issue keeps its state.</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="230.2285" x="50.4944" y="326.4648"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="210.2285" x="60.4944" y="347.6035">notify the Owner once for one limit</text><ellipse cx="165.6086" cy="391.4336" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="165.6086" cy="391.4336" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="32,190.1875,299.2173,190.1875,311.2173,202.1875,299.2173,214.1875,32,214.1875,20,202.1875,32,190.1875" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="169.6086" y="224.3979">no</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="267.2173" x="32" y="205.9956">usage read, and both windows under their limit?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="311.2173" y="199.5933">yes</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="239.0059" x="46.1057" y="444.4336"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="219.0059" x="56.1057" y="465.5723">change the label, count the request,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="121.0488" x="56.1057" y="479.541">then start the agent</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="192.9277" x="69.1448" y="512.3711"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="172.9277" x="79.1448" y="533.5098">the run ends: store its usage</text><ellipse cx="165.6086" cy="577.3398" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="165.6086" cy="577.3398" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="165.6086" x2="165.6086" y1="30" y2="50"/><polygon fill="#181818" points="161.6086,40,165.6086,50,169.6086,40,165.6086,44" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="165.6086" x2="165.6086" y1="111.9063" y2="136.2188"/><polygon fill="#181818" points="161.6086,126.2188,165.6086,136.2188,169.6086,126.2188,165.6086,130.2188" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="165.6086" x2="165.6086" y1="300.4961" y2="326.4648"/><polygon fill="#181818" points="161.6086,316.4648,165.6086,326.4648,169.6086,316.4648,165.6086,320.4648" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="165.6086" x2="165.6086" y1="360.4336" y2="380.4336"/><polygon fill="#181818" points="161.6086,370.4336,165.6086,380.4336,169.6086,370.4336,165.6086,374.4336" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="165.6086" x2="165.6086" y1="214.1875" y2="238.5898"/><polygon fill="#181818" points="161.6086,228.5898,165.6086,238.5898,169.6086,228.5898,165.6086,232.5898" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="311.2173" x2="323.2173" y1="202.1875" y2="202.1875"/><polygon fill="#181818" points="319.2173,310.4961,323.2173,320.4961,327.2173,310.4961,323.2173,314.4961" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="323.2173" x2="323.2173" y1="202.1875" y2="424.4336"/><line style="stroke:#181818;stroke-width:1;" x1="323.2173" x2="165.6086" y1="424.4336" y2="424.4336"/><line style="stroke:#181818;stroke-width:1;" x1="165.6086" x2="165.6086" y1="424.4336" y2="444.4336"/><polygon fill="#181818" points="161.6086,434.4336,165.6086,444.4336,169.6086,434.4336,165.6086,438.4336" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="165.6086" x2="165.6086" y1="170.1875" y2="190.1875"/><polygon fill="#181818" points="161.6086,180.1875,165.6086,190.1875,169.6086,180.1875,165.6086,184.1875" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="165.6086" x2="165.6086" y1="492.3711" y2="512.3711"/><polygon fill="#181818" points="161.6086,502.3711,165.6086,512.3711,169.6086,502.3711,165.6086,506.3711" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="165.6086" x2="165.6086" y1="546.3398" y2="566.3398"/><polygon fill="#181818" points="161.6086,556.3398,165.6086,566.3398,169.6086,556.3398,165.6086,560.3398"