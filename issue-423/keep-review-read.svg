<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="513px" preserveAspectRatio="none" style="width:1411px;height:513px;background:#FFFFFF;" version="1.1" viewBox="0 0 1411 513" width="1411px" zoomAndPan="magnify"><defs/><g><ellipse cx="384.9155" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="158.4336" x="305.6987" y="50"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="138.4336" x="315.6987" y="71.1387">The Reviewer run ends</text><polygon fill="#F1F1F1" points="364.7551,147.9688,405.0759,147.9688,417.0759,159.9688,405.0759,171.9688,364.7551,171.9688,352.7551,159.9688,364.7551,147.9688" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="40.3208" x="364.7551" y="163.7769">Result?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="42.9365" x="309.8186" y="157.3745">blocked</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="27.4517" x="417.0759" y="157.3745">done</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="172.9941" x="11" y="181.9688"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="152.9941" x="21" y="203.1074">I10: read the issue again,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="144.8789" x="21" y="217.0762">hand back to the Owner</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="169.8242" x="597.4219" y="181.9688"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="149.8242" x="607.4219" y="203.1074">Read the snapshot again</text><polygon fill="#F1F1F1" points="274.1689,249.9063,434.5283,249.9063,446.5283,261.9063,434.5283,273.9063,274.1689,273.9063,262.1689,261.9063,274.1689,249.9063" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="51.5679" x="358.3486" y="284.1167">APPROVE</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="160.3594" x="274.1689" y="265.7144">Review on the head commit?</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="320.709" x="193.9941" y="306.7109"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="300.709" x="203.9941" y="327.8496">I6, I7: read the snapshot and the required checks,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="294.4395" x="203.9941" y="341.8184">decide on the merge (the merge call: next issue)</text><polygon fill="#F1F1F1" points="663.7561,249.9063,775.3728,249.9063,787.3728,261.9063,775.3728,273.9063,663.7561,273.9063,651.7561,261.9063,663.7561,249.9063" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="111.6167" x="663.7561" y="265.7144">REQUEST_CHANGES</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="27.4409" x="787.3728" y="259.312">none</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="369.7227" x="534.7031" y="293.9063"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="349.7227" x="544.7031" y="315.0449">I5: label cumin/status/implementing, ask the Implementer</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="248.4961" x="544.7031" y="329.0137">I8: ask the Reviewer to explain the cause</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="246.248" x="914.4258" y="303.3086"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="176.1211" x="924.4258" y="324.4473">Ask the Reviewer once more,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="226.248" x="924.4258" y="338.416">then hand back to the Owner (row I5)</text><polygon fill="#F1F1F1" points="384.9155,380.6484,396.9155,392.6484,384.9155,404.6484,372.9155,392.6484,384.9155,380.6484" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="384.9155,103.9688,396.9155,115.9688,384.9155,127.9688,372.9155,115.9688,384.9155,103.9688" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="236.6169,424.6484,533.2141,424.6484,545.2141,436.6484,533.2141,448.6484,236.6169,448.6484,224.6169,436.6484,236.6169,424.6484" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="388.9155" y="458.8589">no</text><text fill="#D62728" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="296.5972" x="236.6169" y="440.4565">A read of GitHub failed for a temporary reason?</text><text fill="#D62728" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="545.2141" y="434.0542">yes</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="230.0586" x="1170.6738" y="259.8398"/><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="210.0586" x="1180.6738" y="280.9785">Keep the step. The label stays.</text><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="176.0156" x="1180.6738" y="294.9473">Run it again from its start</text><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="91.5293" x="1180.6738" y="308.916">at a later poll</text><ellipse cx="384.9155" cy="491.3589" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="384.9155" cy="491.3589" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="384.9155" x2="384.9155" y1="30" y2="50"/><polygon fill="#181818" points="380.9155,40,384.9155,50,388.9155,40,384.9155,44" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="354.3486" x2="354.3486" y1="273.9063" y2="306.7109"/><polygon fill="#181818" points="350.3486,296.7109,354.3486,306.7109,358.3486,296.7109,354.3486,300.7109" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="354.3486" x2="354.3486" y1="354.6484" y2="374.6484"/><polygon fill="#181818" points="350.3486,364.6484,354.3486,374.6484,358.3486,364.6484,354.3486,368.6484" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="719.5645" x2="719.5645" y1="273.9063" y2="293.9063"/><polygon fill="#181818" points="715.5645,283.9063,719.5645,293.9063,723.5645,283.9063,719.5645,287.9063" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="719.5645" x2="719.5645" y1="341.8438" y2="374.6484"/><polygon fill="#181818" points="715.5645,364.6484,719.5645,374.6484,723.5645,364.6484,719.5645,368.6484" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="446.5283" x2="651.7561" y1="261.9063" y2="261.9063"/><polygon fill="#181818" points="641.7561,257.9063,651.7561,261.9063,641.7561,265.9063,645.7561,261.9063" style="stroke:#181818;stroke-width:1;"/><line