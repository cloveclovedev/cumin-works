<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="547px" preserveAspectRatio="none" style="width:745px;height:547px;background:#FFFFFF;" version="1.1" viewBox="0 0 745 547" width="745px" zoomAndPan="magnify"><defs/><g><ellipse cx="258.1455" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="211.25" x="152.5205" y="50"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="191.25" x="162.5205" y="71.1387">The Planner run ends with done</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="228.1191" x="144.0859" y="147.9688"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="208.1191" x="154.0859" y="169.1074">Read the requirement issue again,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="110.2617" x="154.0859" y="183.0762">with its sub-issues</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="212.0996" x="152.0957" y="215.9063"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="192.0996" x="162.0957" y="237.0449">Decision (pure function, no I/O):</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="137.8418" x="162.0957" y="251.0137">one sub-issue or more,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="131.9648" x="162.0957" y="264.9824">one risk label on each</text><polygon fill="#F1F1F1" points="235.9333,312.8125,280.3577,312.8125,292.3577,324.8125,280.3577,336.8125,235.9333,336.8125,223.9333,324.8125,235.9333,312.8125" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="44.4243" x="235.9333" y="328.6206">Passed?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="204.925" y="322.2183">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="292.3577" y="322.2183">no</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="242.4102" x="11" y="346.8125"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="118.1484" x="21" y="367.9512">Change the label to</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="222.4102" x="21" y="381.9199">cumin/status/awaiting-owner-review,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="197.0391" x="21" y="395.8887">or to cumin/status/implementing</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="221.3516" x="273.4102" y="346.8125"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="201.3516" x="283.4102" y="367.9512">Hand back to the Owner (row R2)</text><polygon fill="#F1F1F1" points="258.1455,414.7188,270.1455,426.7188,258.1455,438.7188,246.1455,426.7188,258.1455,414.7188" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="258.1455,103.9688,270.1455,115.9688,258.1455,127.9688,246.1455,115.9688,258.1455,103.9688" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="112.9595,458.7188,403.3315,458.7188,415.3315,470.7188,403.3315,482.7188,112.9595,482.7188,100.9595,470.7188,112.9595,458.7188" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="262.1455" y="492.9292">no</text><text fill="#D62728" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="290.3721" x="112.9595" y="474.5269">A call to GitHub failed for a temporary reason?</text><text fill="#D62728" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="415.3315" y="468.1245">yes</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="230.0586" x="504.7617" y="254.8906"/><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="210.0586" x="514.7617" y="276.0293">Keep the step. The label stays.</text><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="176.0156" x="514.7617" y="289.998">Run it again from its start</text><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="162.9551" x="514.7617" y="303.9668">at a poll 5 minutes later</text><ellipse cx="258.1455" cy="525.4292" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="258.1455" cy="525.4292" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="258.1455" x2="258.1455" y1="30" y2="50"/><polygon fill="#181818" points="254.1455,40,258.1455,50,262.1455,40,258.1455,44" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="258.1455" x2="258.1455" y1="195.9063" y2="215.9063"/><polygon fill="#181818" points="254.1455,205.9063,258.1455,215.9063,262.1455,205.9063,258.1455,209.9063" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="223.9333" x2="132.2051" y1="324.8125" y2="324.8125"/><line style="stroke:#181818;stroke-width:1;" x1="132.2051" x2="132.2051" y1="324.8125" y2="346.8125"/><polygon fill="#181818