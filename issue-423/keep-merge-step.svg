<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="554px" preserveAspectRatio="none" style="width:792px;height:554px;background:#FFFFFF;" version="1.1" viewBox="0 0 792 554" width="792px" zoomAndPan="magnify"><defs/><g><ellipse cx="276.957" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="301.6133" x="126.1504" y="50"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="175.7109" x="136.1504" y="71.1387">The pull request is approved,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="281.6133" x="136.1504" y="85.1074">risk/low, and the required checks pass (I6, I12)</text><rect fill="none" height="393.1406" style="stroke:#000000;stroke-width:1.5;" width="770.2422" x="11" y="107.9375"/><path d="M189.7246,107.9375 L189.7246,117.2344 L179.7246,127.2344 L11,127.2344" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="168.7246" x="14" y="121.9326">Merge step (I6, and I12)</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="260.9258" x="146.4941" y="188.2344"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="240.9258" x="156.4941" y="209.373">cumin-core merges with merge_method</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="228.7031" x="156.4941" y="223.3418">and sha = the approved head commit</text><polygon fill="#F1F1F1" points="253.2813,256.1719,300.6328,256.1719,312.6328,268.1719,300.6328,280.1719,253.2813,280.1719,241.2813,268.1719,253.2813,256.1719" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="47.3516" x="253.2813" y="271.98">Merged?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="227.5796" y="265.5776">no</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="312.6328" y="265.5776">yes</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="243.8223" x="23" y="290.1719"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="223.6113" x="33" y="311.3105">Conflict: the Implementer resolves it.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="223.8223" x="33" y="325.2793">Head moved, or another 4xx answer:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="114.8555" x="33" y="339.248">stop step, as today</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="205.3145" x="306.3457" y="290.1719"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="185.3145" x="316.3457" y="311.3105">Wait a short time (10 seconds)</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="244.3613" x="286.8223" y="359.1406"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="224.3613" x="296.8223" y="380.2793">Read the issue; close it as completed</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="146.8828" x="296.8223" y="394.248">when GitHub left it open</text><polygon fill="#F1F1F1" points="276.957,413.0781,288.957,425.0781,276.957,437.0781,264.957,425.0781,276.957,413.0781" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="276.957,144.2344,288.957,156.2344,276.957,168.2344,264.957,156.2344,276.957,144.2344" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="76.4407,457.0781,477.4734,457.0781,489.4734,469.0781,477.4734,481.0781,76.4407,481.0781,64.4407,469.0781,76.4407,457.0781" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="280.957" y="491.2886">no</text><text fill="#D62728" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="401.0327" x="76.4407" y="472.8862">The merge, the read, or the close failed for a temporary reason?</text><text fill="#D62728" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="489.4734" y="466.4839">yes</text><rect fill="#F1F1F1" height="75.875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="230.0586" x="541.1836" y="267.2188"/><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="210.0586" x="551.1836" y="288.3574">Keep the step. The label stays.</text><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="182.2383" x="551.1836" y="302.3262">Run it again at a later poll.</text><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="198.9902" x="551.1836" y="316.2949">A pull request that is merged</text><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="175.752" x="551.1836" y="330.2637">already counts as merged</text><ellipse cx="276.957" cy="532.0781" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="276.957" cy="532.0781" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="276.957" x2="276.957" y1="30" y2="50"/><polygon fill="#181818" points="272.957,40,276.957,50,280.957,40,276.957,44" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="409.0029" x2="409.0029" y1="324.1406" y2="359.1406"/><polygon fill="#181818" points="405.0029,349.1406,409.0029,359.1406,413.0029,349.1406,409.0029,353.1406" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="241.2813" x2="144.9111" y1="268.1719" y2="268.1719"/><line style="stroke:#181818;stroke-width:1;" x1="144.9111" x2="144.9111" y1="268.1719" y2="290.1719"/><polygon fill="#181818" points="140.9111,280.1719,144.9111,290.1719,148.9111,280.1719,144.9111,284.1719" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="312.6328" x2="409.0029" y1="268.1719" y2="268.1719"/><line style="stroke:#181818;stroke-width:1;" x1="409.0029" x2="409.0029" y1="268.1719" y2="290.1719"/><polygon fill="#181818" points="405.0029,280.1719,409.0029,290.1719,413.0029,280.1719,409.0029,284.1719" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="144.9111" x2="144.9111" y1="352.0781" y2="425.0781"/><line style="stroke:#181818;stroke-width:1;" x1="144.9111" x2="264.957" y1="425.0781" y2="425.0781"/><polygon fill="#181818" points="254.957,421.0781,264.957,425.0781,254.957,429.0781,258.957,425.0781" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="409.0029" x2="409.0029" y1="407.0781" y2="425.0781"/><line style="stroke:#181818;stroke-width:1;" x1="409.0029" x2="288.957" y1="425.0781" y2="425.0781"/><polygon fill="#181818" points="298.957,421.0781,288.957,425.0781,298.957,429.0781,294.957,425.0781" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="276.957" x2="276.957" y1="236.1719" y2="256.1719"/><polygon fill="#181818" points="272.957,246.1719,276.957,256.1719,280.957,246.1719,276.957,250.1719" st