<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="469px" preserveAspectRatio="none" style="width:1003px;height:469px;background:#FFFFFF;" version="1.1" viewBox="0 0 1003 469" width="1003px" zoomAndPan="magnify"><defs/><g><!--entity req--><g class="entity" data-entity="req" data-source-line="5" data-uid="ent0002" id="entity_req"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="300.7178" x="319.51" y="7"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="169.3809" x="329.51" y="29.9951">requirement documents</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="280.7178" x="329.51" y="46.292">(setting, action, notification, status line)</text></g><!--entity cfg--><g class="entity" data-entity="cfg" data-source-line="6" data-uid="ent0003" id="entity_cfg"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="258.5127" x="655.61" y="7"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="131.0107" x="665.61" y="29.9951">.cumin/config.toml</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="238.5127" x="665.61" y="46.292">(the tool checks of the repository)</text></g><!--entity parse--><g class="entity" data-entity="parse" data-source-line="7" data-uid="ent0004" id="entity_parse"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="214.9609" x="519.39" y="136.6"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="194.9609" x="529.39" y="159.5951">config: read the tool checks</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="156.5771" x="529.39" y="175.892">(command, time limit)</text></g><!--entity run--><g class="entity" data-entity="run" data-source-line="8" data-uid="ent0005" id="entity_run"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="265.3213" x="363.21" y="266.19"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="134.6201" x="373.21" y="289.1851">run the tool checks</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="245.3213" x="373.21" y="305.482">(agent environment, once per poll)</text></g><!--entity permit--><g class="entity" data-entity="permit" data-source-line="9" data-uid="ent0006" id="entity_permit"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="229.7402" x="7" y="410.79"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.0283" x="17" y="433.7851">PermitStart</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="209.7402" x="17" y="450.082">(the one check before a start)</text></g><!--entity notify--><g class="entity" data-entity="notify" data-source-line="10" data-uid="ent0007" id="entity_notify"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="247.459" x="272.14" y="410.79"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="78.7295" x="282.14" y="433.7851">notification</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="227.459" x="282.14" y="450.082">(once, names each failed check)</text></g><!--entity status--><g class="entity" data-entity="status" data-source-line="11" data-uid="ent0008" id="entity_status"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="131.6719" x="555.03" y="410.79"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.5479" x="565.03" y="433.7851">monitor file</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="111.6719" x="565.03" y="450.082">-&gt; cumin status</text></g><!--entity launchd--><g class="entity" data-entity="launchd" data-source-line="12" data-uid="ent0009" id="entity_launchd"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#D62728;stroke-width:2;" width="189.1006" x="713.32" y="266.19"/><text fill="#D62728" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="146.6992" x="723.32" y="289.1851">cumin setup launchd</text><text fill="#D62728" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="169.1006" x="723.32" y="305.482">(the PATH that it writes)</text></g><g class="entity" data-entity="GMN17" data-source-line="22" data-uid="ent0018" id="entity_GMN17"><path d="M721.23,416.95 L721.23,457.2156 A0,0 0 0 0 721.23,457.2156 L996.5044,457.2156 A0,0 0 0 0 996.5044,457.2156 L996.5044,426.95 L986.5044,416.95 L855.96,416.95 L816.99,318.98 L847.96,416.95 L721.23,416.95 A0,0 0 0 0 721.23,416.95" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M986.5044,416.95 L986.5044,426.95 L996.5044,426.95 L986.5044,416.95" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.8389" x="727.23" y="434.0169">A failed check or a missing command</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.2744" x="727.23" y="449.1497">(agent CLI, git): name it, write nothing.</text></g><!--link req to parse--><g class="link" data-entity-1="req" data-entity-2="parse" data-source-line="14" data-uid="lnk10" id="link_req_parse"><path d="M501.26,59.82 C528.56,82 563.254,110.1956 590.604,132.4256" fill="none" id="req-to-parse" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="595.26,136.21,590.7989,127.4294,591.38,133.0563,585.7531,133.6374,595.26,136.21" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.3076" x="558.77" y="102.6669">names the setting</text></g><!--link cfg to parse--><g class="link" data-entity-1="cfg" data-entity-2="parse" data-source-line="15" data-uid="lnk11" id="link_cfg_parse"><path d="M753.28,59.82 C725.81,82 690.8781,110.2106 663.3481,132.4406" fill="none" id="cfg-to-parse" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="658.68,136.21,668.1951,133.6679,662.5701,133.0688,663.1692,127.4438,658.68,136.21" style="stroke:#181818;stroke-width:1;"/></g><!--link parse to run--><g class="link" data-entity-1="parse" data-entity-2="run" data-source-line="16" data-uid="lnk12" id="link_parse_run"><path d="M600.68,189.41 C577.83,211.66 549.1478,239.5933 526.3178,261.8333" fill="none" id="parse-to-run" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="522.02,266.02,531.2579,262.6051,525.6015,262.531,525.6756,256.8747,522.02,266.02" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="70.3003" x="570.21" y="232.2569">the checks</text></g><!--link run to permit--><g class="link" data-entity-1="run" data-entity-2="permit" data-source-line="17" data-uid="lnk13" id="link_run_permit"><path d="M418.16,319.16 C391.62,328.2 361.84,338.64 334.87,348.79 C282.88,368.35 230.0786,390.0787 187.6286,407.9787" fill="none" id="run-to-permit" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="182.1,410.31,191.947,410.4988,186.7072,408.3673,188.8387,403.1274,182.1,410.31" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.2109" x="339.4088" y="361.8569">a check fails:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="92.2886" x="335.87" y="376.9897">start no agent</text></g><!--link run to notify--><g class="link" data-entity-1="run" data-entity-2="notify" data-source-line="18" data-uid="lnk14" id="link_run_notify"><path d="M477.99,318.98 C459.9,344.78 435.5355,379.5279 417.3755,405.4179" fill="none" id="run-to-notify" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="413.93,410.33,422.373,405.2589,416.8012,406.2366,415.8235,400.6649,413.93,410.33" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="84.208" x="455.83" y="369.3569">begins to fail</text></g><!--link run to status--><g class="link" data-entity-1="run" data-entity-2="status" data-source-line="19" data-uid="lnk15" id="link_run_status"><path d="M521.35,319.27 C530.21,328.45 540.12,338.95 548.87,348.79 C566.89,369.04 582.6415,388.1531 596.8015,405.7731" fill="none" id="run-to-status" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="600.56,410.45,598.0402,400.9289,597.4279,406.5526,591.8043,405.9403,600.56,410.45" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="110.4492" x="576.22" y="369.3569">the failed checks</text></g><!--link parse to launchd--><g class="link" data-entity-1="parse" data-entity-2="launchd" data-source-line="20" data-uid="lnk16" id="link_parse_launchd"><path d="M663.06,189.41 C694.53,211.59 734.9857,240.1134 766.5257,262.3434" fill="none" id="parse-to-launchd" style="stroke:#D62728;stroke-width:2;"/><polygon fill="#D62728" points="771.43,265.8,766.378,257.3456,767.3431,262.9195,761.7692,263.8846,771.43,265.8" style="stroke:#D62728;stroke-width:2;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="109.8335" x="72