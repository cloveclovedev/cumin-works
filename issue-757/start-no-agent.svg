<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="501px" preserveAspectRatio="none" style="width:684px;height:501px;background:#FFFFFF;" version="1.1" viewBox="0 0 684 501" width="684px" zoomAndPan="magnify"><defs/><g><!--entity tools--><g class="entity" data-entity="tools" data-source-line="6" data-uid="ent0002" id="entity_tools"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#D62728;stroke-width:2;" width="265.3213" x="141.98" y="7.4"/><text fill="#D62728" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="134.6201" x="151.98" y="30.3951">run the tool checks</text><text fill="#D62728" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="245.3213" x="151.98" y="46.692">(agent environment, once per poll)</text></g><!--entity request--><g class="entity" data-entity="request" data-source-line="7" data-uid="ent0003" id="entity_request"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="246.6182" x="151.33" y="153.4"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="151.8535" x="161.33" y="176.3951">a request to an agent</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="226.6182" x="161.33" y="192.692">(at a poll, or at the end of a run)</text></g><!--entity check--><g class="entity" data-entity="check" data-source-line="8" data-uid="ent0004" id="entity_check"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="232.5088" x="80.39" y="297.99"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.0283" x="90.39" y="320.9851">PermitStart</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="212.5088" x="90.39" y="337.282">(pure function, the one check)</text></g><!--entity caller--><g class="entity" data-entity="caller" data-source-line="9" data-uid="ent0005" id="entity_caller"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="147.1553" x="425.07" y="297.99"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="74.0469" x="435.07" y="320.9851">startAgent</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="127.1553" x="435.07" y="337.282">(takes the permit)</text></g><!--entity start--><g class="entity" data-entity="start" data-source-line="10" data-uid="ent0006" id="entity_start"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="143.1426" x="427.07" y="442.59"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="87.3838" x="437.07" y="465.5851">Agents.Start</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="123.1426" x="437.07" y="481.882">(starts the agent)</text></g><g class="entity" data-entity="GMN13" data-source-line="20" data-uid="ent0014" id="entity_GMN13"><path d="M441.96,6 L441.96,29.7 L407.68,33.7 L441.96,37.7 L441.96,61.3984 A0,0 0 0 0 441.96,61.3984 L677.3267,61.3984 A0,0 0 0 0 677.3267,61.3984 L677.3267,16 L667.3267,6 L441.96,6 A0,0 0 0 0 441.96,6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M667.3267,6 L667.3267,16 L677.3267,16 L667.3267,6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205.4863" x="447.96" y="23.0669">A failed check stops every start</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="214.3667" x="447.96" y="38.1997">of the repository. Label changes,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.625" x="447.96" y="53.3325">comments, merges go on.</text></g><!--link tools to request--><g class="link" data-entity-1="tools" data-entity-2="request" data-source-line="12" data-uid="lnk7" id="link_tools_request"><path d="M274.64,60.44 C274.64,86.65 274.64,121.05 274.64,147.17" fill="none" id="tools-to-request" style="stroke:#D62728;stroke-width:2;"/><polygon fill="#D62728" points="274.64,153.17,278.64,144.17,274.64,148.17,270.64,144.17,274.64,153.17" style="stroke:#D62728;stroke-width:2;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="110.4492" x="275.64" y="104.4669">the failed checks</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="108.1514" x="276.7889" y="119.5997">of the repository</text></g><!--link request to check--><g class="link" data-entity-1="request" data-entity-2="check" data-source-line="13" data-uid="lnk8" id="link_request_check"><path d="M151.15,194.17 C98.56,202.69 45.64,215.98 29.64,235.99 C6,265.57 32.1686,284.3807 74.1986,298.1607" fill="none" id="request-to-check" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="79.9,300.03,72.5941,293.4252,75.1488,298.4723,70.1017,301.027,79.9,300.03" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="122.5034" x="30.64" y="249.0569">stop request read?</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="89.0894" x="47.347" y="264.1897">quota allows?</text></g><!--link request to check--><g class="link" data-entity-1="request" data-entity-2="check" data-source-line="14" data-uid="lnk9" id="link_request_check"><path d="M221.03,206.39 C210.04,214.28 199.92,224.1 193.64,235.99 C183.66,254.9 184.3724,273.5828 188.1224,291.8328" fill="none" id="request-to-check-1" style="stroke:#D62728;stroke-width:2;"/><polygon fill="#D62728" points="189.33,297.71,191.4367,288.0891,188.3236,292.8123,183.6004,289.6993,189.33,297.71" style="stroke:#D62728;stroke-width:2;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.3784" x="194.64" y="256.5569">tool checks pass?</text></g><!--link check to request--><g class="link" data-entity-1="check" data-entity-2="request" data-source-line="15" data-uid="lnk10" id="link_check_request"><path d="M281.5,297.65 C294.26,290.11 305.77,280.42 313.64,267.99 C326.08,248.36 316.968,228.7992 302.788,210.8392" fill="none" id="check-to-request" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="299.07,206.13,301.5076,215.6724,302.1684,210.0543,307.7865,210.7151,299.07,206.13" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="74.312" x="334.587" y="249.0569">StartPermit</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.146" x="319.67" y="264.1897">(granted or not)</text></g><!--link request to caller--><g class="link" data-entity-1="request" data-entity-2="caller" data-source-line="16" data-uid="lnk11" id="link_request_caller"><path d="M376.39,206.38 C396.12,214.03 415.85,223.75 432.64,235.99 C455.06,252.34 470.292,273.2797 481.892,292.6897" fill="none" id="request-to-caller" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="484.97,297.84,483.7866,288.0625,482.405,293.5481,476.9195,292.1665,484.97,297.84" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="68.4341" x="465.23" y="256.5569">the permit</text></g><!--link caller to start--><g class="link" data-entity-1="caller" data-entity-2="start" data-source-line="17" data-uid="lnk12" id="link_caller_start"><path d="M498.64,350.78 C498.64,376.58 498.64,410.24 498.64,4