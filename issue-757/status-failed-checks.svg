<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="469px" preserveAspectRatio="none" style="width:820px;height:469px;background:#FFFFFF;" version="1.1" viewBox="0 0 820 469" width="820px" zoomAndPan="magnify"><defs/><g><!--entity req--><g class="entity" data-entity="req" data-source-line="5" data-uid="ent0002" id="entity_req"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="300.7178" x="219.51" y="7"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="169.3809" x="229.51" y="29.9951">requirement documents</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="280.7178" x="229.51" y="46.292">(setting, action, notification, status line)</text></g><!--entity cfg--><g class="entity" data-entity="cfg" data-source-line="6" data-uid="ent0003" id="entity_cfg"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="258.5127" x="555.61" y="7"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="131.0107" x="565.61" y="29.9951">.cumin/config.toml</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="238.5127" x="565.61" y="46.292">(the tool checks of the repository)</text></g><!--entity parse--><g class="entity" data-entity="parse" data-source-line="7" data-uid="ent0004" id="entity_parse"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="214.9609" x="419.39" y="136.6"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="194.9609" x="429.39" y="159.5951">config: read the tool checks</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="156.5771" x="429.39" y="175.892">(command, time limit)</text></g><!--entity run--><g class="entity" data-entity="run" data-source-line="8" data-uid="ent0005" id="entity_run"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="265.3213" x="263.21" y="266.19"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="134.6201" x="273.21" y="289.1851">run the tool checks</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="245.3213" x="273.21" y="305.482">(agent environment, once per poll)</text></g><!--entity permit--><g class="entity" data-entity="permit" data-source-line="9" data-uid="ent0006" id="entity_permit"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="229.7402" x="7" y="410.79"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.0283" x="17" y="433.7851">PermitStart</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="209.7402" x="17" y="450.082">(the one check before a start)</text></g><!--entity notify--><g class="entity" data-entity="notify" data-source-line="10" data-uid="ent0007" id="entity_notify"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="247.459" x="272.14" y="410.79"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="78.7295" x="282.14" y="433.7851">notification</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="227.459" x="282.14" y="450.082">(once, names each failed check)</text></g><!--entity status--><g class="entity" data-entity="status" data-source-line="11" data-uid="ent0008" id="entity_status"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#D62728;stroke-width:2;" width="131.6719" x="555.03" y="4