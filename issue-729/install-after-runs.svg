<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 500" width="660" height="500" font-family="sans-serif"><defs><marker id="ak" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222222"/></marker><marker id="ar" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#D62728"/></marker></defs><rect width="660" height="500" fill="#FFFFFF"/><rect x="150" y="15" width="360" height="50" rx="4" fill="#F5F5F5" stroke="#222222" stroke-width="1.2"/><text x="330.0" y="36.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">Maintainer / Operator, Claude Code session</text><text x="330.0" y="52.0" text-anchor="middle" font-size="13" fill="#222222">skills host, session-start, watch</text><rect x="20" y="140" width="180" height="56" rx="4" fill="#F5F5F5" stroke="#222222" stroke-width="1.2"/><text x="110.0" y="164.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">cumin status</text><text x="110.0" y="180.0" text-anchor="middle" font-size="13" fill="#222222">is cumin running</text><rect x="240" y="140" width="180" height="56" rx="4" fill="#F5F5F5" stroke="#D62728" stroke-width="3"/><text x="330.0" y="164.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#D62728">scripts/install.sh</text><text x="330.0" y="180.0" text-anchor="middle" font-size="13" fill="#D62728">replace the binary</text><rect x="460" y="140" width="180" height="56" rx="4" fill="#F5F5F5" stroke="#222222" stroke-width="1.2"/><text x="550.0" y="164.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">scripts/live-scenario.sh</text><text x="550.0" y="180.0" text-anchor="middle" font-size="13" fill="#222222">live scenario E2E-1</text><rect x="20" y="380" width="180" height="56" rx="4" fill="#FFFBE6" stroke="#222222" stroke-width="1.2"/><text x="110.0" y="404.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">monitor.json</text><text x="110.0" y="420.0" text-anchor="middle" font-size="13" fill="#222222">~/.local/state/cumin/</text><rect x="240" y="380" width="180" height="56" rx="4" fill="#F5F5F5" stroke="#222222" stroke-width="1.2"/><text x="330.0" y="404.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">cumin run</text><text x="330.0" y="420.0" text-anchor="middle" font-size="13" fill="#222222">LaunchAgent</text><polyline points="240,65 130,140" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#ak)"/><text x="150" y="100" text-anchor="start" font-size="12" fill="#222222">call</text><polyline points="110,196 110,380" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#ak)"/><text x="118" y="300" text-anchor="start" font-size="12" fill="#222222">read</text><polyline points="240,408 200,408" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#ak)"/><text x="205" y="400" text-anchor="start" font-size="12" fill="#222222">write</text><polyline points="330,196 330,380" fill="none" stroke="#D62728" stroke-width="3" marker-end="url(#ar)"/><text x="338" y="270" text-anchor="start" font-size="12" font-weight="bold" fill="#D62728">--after-current-runs:</text><text x="338" y="285" text-anchor="start" font-size="12" font-weight="bold" fill="#D62728">stop after the runs,</text><text x="338" y="300" text-anchor="start" font-size="12" font-weight="bold" fill="#D62728">install, restart</text><polyline points="240,178 200,178" fill="none" stroke="#D62728" stroke-width="3" marker-end="url(#ar)"/><text x="205" y="215" font-size="13" font-weight="bold" fill="#D62728">check two polls</text><polyline points="550,140 550,112 150,112 150,140" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#ak)"/><text x="390" y="128" text-anchor="start" font-size="12" fill="#222222">check two polls</text><polyline points="480,196 420,385" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#ak)"/><text x="470" y="240" text-anchor="start" font-size="12" fill="#222222">stop, start,</text><text x="470" y="255" text-anchor="start" font-size="12" fill="#222222">start again</text><polyline points="330,65 330,140" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#ak)"/><polyline points="440,65 530,140" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#ak)"/><text x="20" y="462" font-size="13" font-weight="bold" fill="#D62728">install.sh --after-current-runs replaces the binary</text><text x="20" y="479" font-size="13" font-weight="bold" fill="#D62728">without ending an agent run.</text></svg>
