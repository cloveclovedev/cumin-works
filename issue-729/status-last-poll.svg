<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 500" width="660" height="500" font-family="sans-serif"><defs><marker id="ak" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222222"/></marker><marker id="ar" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#D62728"/></marker></defs><rect width="660" height="500" fill="#FFFFFF"/><rect x="20" y="20" width="200" height="50" rx="4" fill="#F5F5F5" stroke="#222222" stroke-width="1.2"/><text x="120.0" y="49.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">cumin run (Go)</text><rect x="440" y="20" width="200" height="50" rx="4" fill="#F5F5F5" stroke="#222222" stroke-width="1.2"/><text x="540.0" y="41.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">menu bar app (Swift)</text><text x="540.0" y="57.0" text-anchor="middle" font-size="13" fill="#222222">tools/status-bar/</text><rect x="240" y="150" width="190" height="56" rx="4" fill="#FFFBE6" stroke="#222222" stroke-width="1.2"/><text x="335.0" y="174.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">monitor.json</text><text x="335.0" y="190.0" text-anchor="middle" font-size="13" fill="#222222">~/.local/state/cumin/</text><rect x="20" y="290" width="200" height="56" rx="4" fill="#F5F5F5" stroke="#222222" stroke-width="1.2"/><text x="120.0" y="322.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">cumin status</text><rect x="440" y="290" width="200" height="56" rx="4" fill="#F5F5F5" stroke="#222222" stroke-width="1.2"/><text x="540.0" y="322.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">GitHub</text><rect x="20" y="420" width="200" height="44" rx="4" fill="#F5F5F5" stroke="#222222" stroke-width="1.2"/><text x="120.0" y="446.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">caller: terminal or script</text><polyline points="120,70 290,150" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#ak)"/><text x="20" y="105" text-anchor="start" font-size="12" fill="#222222">write: after every poll,</text><text x="20" y="120" text-anchor="start" font-size="12" fill="#222222">at the end of a run</text><polyline points="540,70 380,150" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#ak)"/><text x="480" y="115" text-anchor="start" font-size="12" fill="#222222">read every 5 s</text><polyline points="220,318 440,318" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#ak)"/><text x="290" y="335" text-anchor="start" font-size="12" fill="#222222">read: labels</text><polyline points="140,290 300,206" fill="none" stroke="#D62728" stroke-width="3" marker-end="url(#ar)"/><text x="20" y="245" text-anchor="start" font-size="12" font-weight="bold" fill="#D62728">read: last poll and its age,</text><text x="20" y="260" text-anchor="start" font-size="12" font-weight="bold" fill="#D62728">its errors, agents that cumin holds</text><polyline points="120,346 120,420" fill="none" stroke="#222222" stroke-width="1.2" marker-end="url(#ak)"/><text x="132" y="378" text-anchor="start" font-size="12" fill="#222222">report, exit code</text><text x="240" y="440" font-size="13" font-weight="bold" fill="#D62728">cumin status becomes the first reader of the monitor file in cumin.</text></svg>
