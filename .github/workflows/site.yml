name: site

# Publishes the site of the documents on GitHub Pages on every push to main
# that changes the documents or the site, and once a day for the dashboard.
# Before the build, cumin-trace trace reads the issues on GitHub for the
# dashboard. A failed step fails the job, and the published site stays as it was.
#
# GitHub can delay or drop a scheduled run when the load is high, mostly at
# the start of an hour. The minute 42 avoids the start of the hour.
# 19:42 UTC is 4:42 in Japan time: the dashboard is fresh before the day starts.
on:
  push:
    branches:
      - main
    paths:
      - 'docs/ja/**'
      - 'site/**'
      - '.cumin-trace.toml'
      - '.github/workflows/site.yml'
  schedule:
    - cron: '42 19 * * *'
  workflow_dispatch:

# The trace reads the issues and their sub-issues and milestones.
permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  site-build:
    name: site-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The trace reads the git history of the requirements.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: npm ci
        run: npm --prefix site ci
      - name: Download cumin-trace
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v0.1.1
        run: |
          dir="$RUNNER_TEMP/cumin-trace"
          gh release download "$VERSION" --repo cloveclovedev/cumin-trace --dir "$dir" \
            --pattern cumin-trace-linux-amd64 --pattern checksums.txt
          cd "$dir"
          grep ' cumin-trace-linux-amd64$' checksums.txt | sha256sum --check -
          chmod +x cumin-trace-linux-amd64
      - name: cumin-trace trace
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/cumin-trace/cumin-trace-linux-amd64" trace > site/trace.json'
      # check-site builds the site, then checks the pages.
      - name: Build and check the site
        run: npm --prefix site run check-site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  site-deploy:
    name: site-deploy
    needs: site-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time. A newer push waits; a running one is not cancelled.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
