<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="488px" preserveAspectRatio="none" style="width:737px;height:488px;background:#FFFFFF;" version="1.1" viewBox="0 0 737 488" width="737px" zoomAndPan="magnify"><defs/><g><rect fill="none" height="20.9531" style="stroke:none;stroke-width:1;" width="704.7554" x="15" y="12.7451"/><ellipse cx="266.0684" cy="48.6982" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="266.0684,78.6982,266.0684,78.6982,278.0684,90.6982,266.0684,102.6982,266.0684,102.6982,254.0684,90.6982,266.0684,78.6982" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="124.1689" x="129.8994" y="88.104">start of work, or asked</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="50.0801" x="278.0684" y="88.104">watching</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="233.0762" x="21" y="112.6982"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="159.5449" x="31" y="133.8369">list the issues that wait for</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="213.0762" x="31" y="147.8057">a decision of the Assignee, as trees</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="241.0449" x="274.0762" y="112.6982"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="156.8965" x="284.0762" y="133.8369">read GitHub at an interval</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="221.0449" x="284.0762" y="147.8057">until a new issue waits for a decision</text><rect fill="#F1F