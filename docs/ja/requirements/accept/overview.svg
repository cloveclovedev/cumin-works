<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="601px" preserveAspectRatio="none" style="width:1371px;height:601px;background:#FFFFFF;" version="1.1" viewBox="0 0 1371 601" width="1371px" zoomAndPan="magnify"><defs/><g><g id="Before"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="361.0791" x="381.05" y="7"/><line style="stroke:#181818;stroke-width:0.5;" x1="381.05" x2="742.1291" y1="33.2969" y2="33.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="341.0791" x="391.05" y="24.9951">planning, implementing, or awaiting-plan-review</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="89.6191" x="386.05" y="49.4355">(the plan area)</text></g><g id="Accepting"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="315.2422" x="403.97" y="212.64"/><line style="stroke:#181818;stroke-width:0.5;" x1="403.97" x2="719.2122" y1="238.9369" y2="238.9369"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="68.6123" x="527.2849" y="230.6351">accepting</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="295.2422" x="408.97" y="255.0755">do / the Planner checks the requirement on main</text></g><g id="AwaitingAcceptance"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="261.8398" x="142.67" y="403.27"/><line style="stroke:#181818;stroke-width:0.5;" x1="142.67" x2="404.5098" y1="429.5669" y2="429.5669"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="145.4141" x="200.8829" y="421.2651">awaiting-acceptance</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="241.8398" x="147.67" y="445.7055">do / the Assignee accepts or sends back</text></g><g id="PlanReview"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="166.5762" x="478.3" y="403.27"/><line style="stroke:#181818;stroke-width:0.5;" x1="478.3" x2="644.8762" y1="429.5669" y2="429.5669"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="146.5762" x="488.3" y="421.2651">awaiting-plan-review</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="89.6191" x="483.3" y="445.7055">(the plan area)</text></g><g id="Implementing"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="117.1797" x="7" y="545.53"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="124.1797" y1="571.8269" y2="571.8269"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="97.1797" x="17" y="563.5251">implementing</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="89.6191" x="12" y="587.9655">(the plan area)</text></g><g id="Decision"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="177.582" x="939.8" y="403.27"/><line style="stroke:#181818;stroke-width:0.5;" x1="939.8" x2="1117.382" y1="429.5669" y2="429.5669"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="122.3975" x="967.3923" y="421.2651">awaiting-decision</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="157.582" x="944.8" y="445.7055">do / the Assignee answers</text></g><g id="Ready"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="109.6191" x="973.78" y="545.53"/><line style="stroke:#181818;stroke-width:0.5;" x1="973.78" x2="1083.3991" y1="571.8269" y2="571.8269"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="40.1201" x="1008.5295" y="563.5251">ready</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="89.6191" x="978.78" y="587.9655">(the plan area)</text></g><ellipse cx="482.59" cy="570.67" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="482.59" cy="570.67" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><!--link Before to Accepting--><g class="link" data-entity-1="Before" data-entity-2="Accepting" data-source-line="29" data-uid="lnk2" id="link_Before_Accepting"><path d="M561.59,57.7 C561.59,96.94 561.59,167.34 561.59,206.44" fill="none" id="Before-to-Accepting" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="561.59,212.44,565.59,203.44,561.59,207.44,557.59,203.44,561.59,212.44" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.4536" x="686.0678" y="100.3369">request the acceptance check</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="443.4092" x="562.59" y="115.4697">[every implementation issue is closed, no check after the last close,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.9087" x="681.8402" y="130.6025">the follow-up notes are written,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.4844" x="664.5524" y="145.7353">below the limit of issues in progress]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="168.4351" x="700.0771" y="160.8681">/ cumin starts the Planner</text></g><!--link Accepting to AwaitingAcceptance--><g class="link" data-entity-1="Accepting" data-entity-2="AwaitingAcceptance" data-source-line="30" data-uid="lnk3" id="link_Accepting_AwaitingAcceptance"><path d="M403.54,254.81 C365.87,265.62 328.76,283.12 301.59,311.27 C277.82,335.89 273.1473,371.0206 272.7673,397.1406" fill="none" id="Accepting-to-AwaitingAcceptance" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="272.68,403.14,276.8105,394.1991,272.7527,398.1405,268.8113,394.0828,272.68,403.14" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="148.8335" x="351.5971" y="324.3369">ask for the acceptance</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.9292" x="313.5492" y="339.4697">[the acceptance check completed,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="246.8477" x="302.59" y="354.6025">every implementation issue is closed]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.4072" x="375.8102" y="369.7353">/ cumin notifies</text></g><!--link Accepting to PlanReview--><g class="link" data-entity-1="Accepting" data-entity-2="PlanReview" data-source-line="31" data-uid="lnk4" id="link_Accepting_PlanReview"><path d="M560.32,263.26 C559.66,277.31 558.92,295.27 558.59,311.27 C558.02,338.82 557.83,345.72 558.59,373.27 C558.86,382.96 559.0511,387.6302 559.5911,396.9002" fill="none" id="Accepting-to-PlanReview" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="559.94,402.89,563.4098,393.6726,559.6492,397.8985,555.4234,394.1378,559.94,402.89" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="149.354" x="697.6261" y="324.3369">ask for the plan review</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.9292" x="659.8385" y="339.4697">[the acceptance check completed,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="425.4263" x="559.59" y="354.6025">an open implementation issue, each open one has one risk label]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.4072" x="722.0995" y="369.7353">/ cumin notifies</text></g><!--link Accepting to Accepting--><g class="link" data-entity-1="Accepting" data-entity-2="Accepting" data-source-line="32" data-uid="lnk5" id="link_Accepting_Accepting"><path d="M719.54,220.49 C740.39,223.44 754.21,229.2 754.21,237.77 C754.21,246.34 746.3308,251.2595 725.4808,254.2095" fill="none" id="Accepting-to-Accepting" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="719.54,255.05,729.0116,257.7497,724.4907,254.3495,727.8909,249.8286,719.54,255.05" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="236.6216" x="825.2703" y="212.3369">request the acceptance check again</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="366.7422" x="760.21" y="227.4697">[the Planner run has ended, no question, first time, and:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="347.4199" x="769.8711" y="242.6025">no check comment, or an open implementation issue</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.5679" x="845.2972" y="257.7353">without exactly one risk label]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.603" x="839.2796" y="272.8681">/ cumin starts the Planner again</text></g><!--link Accepting to Decision--><g class="link" data-entity-1="Accepting" data-entity-2="Decision" data-source-line="33" data-uid="lnk6" id="link_Accepting_Decision"><path d="M719.49,248.69 C824.14,258.36 949.31,276.84 989.59,311.27 C1016.43,334.21 1024.2765,370.2584 1026.8865,396.9684" fill="none" id="Accepting-to-Decision" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1027.47,402.94,1030.5758,393.5937,1026.9837,397.9637,1022.6137,394.3717,1027.47,402.94" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.8271" x="1105.7952" y="324.3369">stop the acceptance check</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="340.4375" x="1022.99" y="339.4697">[the Planner run has ended, and: the Planner asked,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.0435" x="1080.687" y="354.6025">or the same failure after the retry]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.4072" x="1143.0051" y="369.7353">/ cumin notifies</text></g><!--link AwaitingAcceptance to *end*--><g class="link" data-entity-1="AwaitingAcceptance" data-entity-2=".end." data-source-line="34" data-uid="lnk8" id="link_AwaitingAcceptance_.end."><path d="M394.66,453.92 C412.43,461.33 429.47,470.98 443.59,483.53 C466.89,504.26 475.873,535.7947 479.583,553.7047" fill="none" id="AwaitingAcceptance-to-*end*" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="480.8,559.58,482.8913,549.9557,479.7858,554.6839,475.0576,551.5785,480.8,559.58" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.3882" x="466.86" y="504.0969">the Assignee closes the issue</text></g><!--link AwaitingAcceptance to Implementing--><g class="link" data-entity-1="AwaitingAcceptance" data-entity-2="Implementing" data-source-line="35" data-uid="lnk9" id="link_AwaitingAcceptance_Implementing"><path d="M142.39,449.6 C106.17,457.99 73.72,469.19 62.59,483.53 C49.2,50