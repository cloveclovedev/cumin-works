<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="601px" preserveAspectRatio="none" style="width:1270px;height:601px;background:#FFFFFF;" version="1.1" viewBox="0 0 1270 601" width="1270px" zoomAndPan="magnify"><defs/><g><g id="Before"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="361.0791" x="359.05" y="7"/><line style="stroke:#181818;stroke-width:0.5;" x1="359.05" x2="720.1291" y1="33.2969" y2="33.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="341.0791" x="369.05" y="24.9951">planning, implementing, or awaiting-plan-review</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="89.6191" x="364.05" y="49.4355">(the plan area)</text></g><g id="Accepting"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="315.2422" x="381.97" y="212.64"/><line style="stroke:#181818;stroke-width:0.5;" x1="381.97" x2="697.2122" y1="238.9369" y2="238.9369"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="68.6123" x="505.2849" y="230.6351">accepting</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="295.2422" x="386.97" y="255.0755">do / the Planner checks the requirement on main</text></g><g id="AwaitingAcceptance"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="261.8398" x="142.67" y="403.27"/><line style="stroke:#181818;stroke-width:0.5;" x1="142.67" x2="404.5098" y1="429.5669" y2="429.5669"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="145.4141" x="200.8829" y="421.2651">awaiting-acceptance</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="241.8398" x="147.67" y="445.7055">do / the Assignee accepts or sends back</text></g><g id="PlanReview"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="166.5762" x="456.3" y="403.27"/><line style="stroke:#181818;stroke-width:0.5;" x1="456.3" x2="622.8762" y1="429.5669" y2="429.5669"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="146.5762" x="466.3" y="421.2651">awaiting-plan-review</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="89.6191" x="461.3" y="445.7055">(the plan area)</text></g><g id="Implementing"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="117.1797" x="7" y="545.53"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="124.1797" y1="571.8269" y2="571.8269"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="97.1797" x="17" y="563.5251">implementing</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="89.6191" x="12" y="587.9655">(the plan area)</text></g><g id="Decision"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="177.582" x="838.8" y="403.27"/><line style="stroke:#181818;stroke-width:0.5;" x1="838.8" x2="1016.382" y1="429.5669" y2="429.5669"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="122.3975" x="866.3923" y="421.2651">awaiting-decision</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="157.582" x="843.8" y="445.7055">do / the Assignee answers</text></g><g id="Ready"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="109.6191" x="872.78" y="545.53"/><line style="stroke:#181818;stroke-width:0.5;" x1="872.78" x2="982.3991" y1="571.8269" y2="571.8269"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="40.1201" x="907.5295" y="563.5251">ready</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="89.6191" x="877.78" y="587.9655">(the plan area)</text></g><ellipse cx="482.59" cy="570.67" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="482.59" cy="570.67" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><!--link Before to Accepting--><g class="link" data-entity-1="Before" data-entity-2="Accepting" data-source-line="29" data-uid="lnk2" id="link_Before_Accepting"><path d="M539.59,57.7 C539.59,96.94 539.59,167.34 539.59,206.44" fill="none" id="Before-to-Accepting" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="539.59,212.44,543.59,203.44,539.59,207.44,535.59,203.44,539.59,212.44" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.4536" x="624.4775" y="100.3369">request the acceptance check</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="364.2285" x="540.59" y="115.4697">[every sub-issue is closed, no check after the last close,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.9087" x="620.2499" y="130.6025">the follow-up notes are written,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.4844" x="602.9621" y="145.7353">below the limit of issues in progress]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="168.4351" x="638.4867" y="160.8681">/ cumin starts the Planner</text></g><!--link Accepting to AwaitingAcceptance--><g class="link" data-entity-1="Accepting" data-entity-2="AwaitingAcceptance" data-source-line="30" data-uid="lnk3" id="link_Accepting_AwaitingAcceptance"><path d="M381.77,261.77 C351.86,272.57 323.22,288.32 301.59,311.27 C278.26,336.02 273.452,370.7212 272.922,396.7812" fill="none" id="Accepting-to-AwaitingAcceptance" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="272.8,402.78,276.9822,393.8632,272.9017,397.781,268.9838,393.7005,272.8,402.78" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="148.8335" x="340.6379" y="324.3369">ask for the acceptance</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.9292" x="302.59" y="339.4697">[the acceptance check completed,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.667" x="331.2211" y="354.6025">every sub-issue is closed]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.4072" x="364.851" y="369.7353">/ cumin notifies</text></g><!--link Accepting to PlanReview--><g class="link" data-entity-1="Accepting" data-entity-2="PlanReview" data-source-line="31" data-uid="lnk4" id="link_Accepting_PlanReview"><path d="M538.32,263.26 C537.66,277.31 536.92,295.27 536.59,311.27 C536.02,338.82 535.83,345.72 536.59,373.27 C536.86,382.96 537.0511,387.6302 537.5911,396.9002" fill="none" id="Accepting-to-PlanReview" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="537.94,402.89,541.4098,393.6726,537.6492,397.8985,533.4234,394.1378,537.94,402.89" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="149.354" x="636.0358" y="324.3369">ask for the plan review</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.9292" x="598.2482" y="339.4697">[the acceptance check completed,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="346.2456" x="537.59" y="354.6025">an open sub-issue, each open one has one risk label]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.4072" x="660.5092" y="369.7353">/ cumin notifies</text></g><!--link Accepting to Accepting--><g class="link" data-entity-1="Accepting" data-entity-2="Accepting" data-source-line="32" data-uid="lnk5" id="link_Accepting_Accepting"><path d="M697.54,220.49 C718.39,223.44 732.21,229.2 732.21,237.77 C732.21,246.34 724.3308,251.2595 703.4808,254.2095" fill="none" id="Accepting-to-Accepting" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="697.54,255.05,707.0116,257.7497,702.4907,254.3495,705.8909,249.8286,697.54,255.05" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="236.6216" x="803.2703" y="212.3369">request the acceptance check again</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="366.7422" x="738.21" y="227.4697">[the Planner run has ended, no question, first time, and:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="268.2393" x="787.4615" y="242.6025">no check comment, or an open sub-issue</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.5679" x="823.2972" y="257.7353">without exactly one risk label]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.603" x="817.2796" y="272.8681">/ cumin starts the Planner again</text></g><!--link Accepting to Decision--><g class="link" data-entity-1="Accepting" data-entity-2="Decision" data-source-line="33" data-uid="lnk6" id="link_Accepting_Decision"><path d="M697.5,256.13 C775.77,267.71 859.66,285.6 888.59,311.27 C915,334.7 922.9416,370.612 925.6916,397.152" fill="none" id="Accepting-to-Decision" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="926.31,403.12,929.3611,393.7557,925.7947,398.1466,921.4037,394.5802,926.31,403.12" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.8271" x="1004.5152" y="324.3369">stop the acceptance check</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="340.4375" x="921.71" y="339.4697">[the Planner run has ended, and: the Planner asked,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.0435" x="979.407" y="354.6025">or the same failure after the retry]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.4072" x="1041.7251" y="369.7353">/ cumin notifies</text></g><!--link AwaitingAcceptance to *end*--><g class="link" data-entity-1="AwaitingAcceptance" data-entity-2=".end." data-source-line="34" data-uid="lnk8" id="link_AwaitingAcceptance_.end."><path d="M394.66,453.92 C412.43,461.33 429.47,470.98 443.59,483.53 C466.89,504.26 475.873,535.7947 479.583,553.7047" fill="none" id="AwaitingAcceptance-to-*end*" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="480.8,559.58,482.8913,549.9557,479.7858,554.6839,475.0576,551.5785,480.8,559.58" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.3882" x="466.86" y="504.0969">the Assignee closes the issue</text></g><!--link AwaitingAcceptance to Implementing--><g class="link" data-entity-1="AwaitingAcceptance" data-entity-2="Implementing" data-source-line="35" data-uid="lnk9" id="link_AwaitingAcceptance_Implementing"><path d="M142.39,449.6 C106.17,457.99 73.72,469.19 62.59,483.53 C49.2,500.79 50.5388,520.576 55.4688,539.386" fill="none" id="AwaitingAcceptance-to-Implementing" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="56.99,545.19,58.5775,535.4699,55.7223,540.3534,50.8389,537.4982,56.99,545.19" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="66.2886" x="218.3744" y="496.5969">send back</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375.8574" x="63.59" y="511.7297">[the Assignee adds ready to a new implementation issue]</text></g><!--link Decision to Ready--><g class="link" data-entity-1="Decision" data-entity-2="Ready" data-source-line="36" data-uid="lnk10" id="link_Decision_Ready"><path d="M927.59,453.83 C927.59,479.42 927.59,513.39 927.59,539.04" fill="none" id="Decision-to-Ready" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="927.59,545.04,931.59,536.04,927.59,540.04,923.59,536.04,927.59,545.04" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="247.2158" x="928.59" y="504.0969">the Assignee answers and adds ready</text></g><!--SRC=[ZLLDRzim3BtxLn3PeTiG9_SS1cJOiEqszDhaeDYCBSIMF56kvty_Yh8TvwjhBxLOwV4zyf5zWgojjKaxwqu4AVWIWRpoI62FeC3XdrOxhD5uq4GjWZPoIMKPDbwPJEuNk4gUO1kVyaL-MQa3Lc0D_D3-PtjOGkUqzsYWqxwqhOU5P5w79osj5ojOv1RM2o3L4tIbXSXfo2V8CObtof3sch4vqm2xOKOIUYbQvV8zh1b3-IWFSekqugU5K_r0ajbPKn1u2yfOJk50ELGXnJEQ7Dq6N6k0CgSRJsidiJJNYZ5gMb49Z1wOEMjzA9PyOsEPcdNzAabAdIDWtVWUSemuJ319Olv5KobZj2cMeEkcaXBBoJAHJkbmICETrE6hncu1Yk0h7gr3-F1TVfBXk86F8NcuB1e-JJbYbnX9Nc_7Kp9zyTjGTI7_En3YCcGbPbpugEVSVgvjhVIP_qJoR8MOPOXlft1o6vhdtHBfmk3eAGeL82utmK5bfzjyrqK9l9_bE1Lc5dfSd7dP1UZNB311NGJVgFJ8BiTC4_TP4ByDXsJykA_RK8UE9Ym6pdjv_no-9YhnT8V3u8Cq_GBppeRk8VdhUPN-ximBlgBZQMWFwJ3P15bb2VCb61jlWJfwTaG0g1GZoT-NEnC2HrjLjalRXc-7VS5Snc7a6s6yklXGrre6HBB8G3VE5Ww9zZkp7YQKfJjFSn_EJ2h2xdb8qObvk2k5hEsUPCXiwALdWJlpKFoC4-lIHurqnUJ2N7C6qf9epFTGuCksuOKuaLW2ggoCGMiGIdP0-Eqq9v5z-dzox-q_g8A7UQ0vJd