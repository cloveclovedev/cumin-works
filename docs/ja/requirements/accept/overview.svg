rce-line="30" data-uid="lnk3" id="link_Accepting_AwaitingAcceptance"><path d="M342.77,261.77 C312.86,272.57 284.22,288.32 262.59,311.27 C239.26,336.02 234.452,370.7212 233.922,396.7812" fill="none" id="Accepting-to-AwaitingAcceptance" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="233.8,402.78,237.9822,393.8632,233.9017,397.781,229.9838,393.7005,233.8,402.78" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="148.8335" x="301.6379" y="324.3369">ask for the acceptance</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.9292" x="263.59" y="339.4697">[the acceptance check completed,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.667" x="292.2211" y="354.6025">every sub-issue is closed]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.4072" x="325.851" y="369.7353">/ cumin notifies</text></g><!--link Accepting to PlanReview--><g class="link" data-entity-1="Accepting" data-entity-2="PlanReview" data-source-line="31" data-uid="lnk4" id="link_Accepting_PlanReview"><path d="M499.32,263.26 C498.66,277.31 497.92,295.27 497.59,311.27 C497.02,338.82 496.83,345.72 497.59,373.27 C497.86,382.96 498.0511,387.6302 498.5911,396.9002" fill="none" id="Accepting-to-PlanReview" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="498.94,402.89,502.4098,393.6726,498.6492,397.8985,494.4234,394.1378,498.94,402.89" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="149.354" x="597.0358" y="324.3369">ask for the plan review</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.9292" x="559.2482" y="339.4697">[the acceptance check completed,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="346.2456" x="498.59" y="354.6025">an open sub-issue, each open one has one risk label]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.4072" x="621.5092" y="369.7353">/ cumin notifies</text></g><!--link Accepting to Accepting--><g class="link" data-entity-1="Accepting" data-entity-2="Accepting" data-source-line="32" data-uid="lnk5" id="link_Accepting_Accepting"><path d="M658.54,220.49 C679.39,223.44 693.21,229.2 693.21,237.77 C693.21,246.34 685.3308,251.2595 664.4808,254.2095" fill="none" id="Accepting-to-Accepting" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="658.54,255.05,668.0116,257.7497,663.4907,254.3495,666.8909,249.8286,658.54,255.05" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="236.6216" x="764.2703" y="212.3369">request the acceptance check again</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="366.7422" x="699.21" y="227.4697">[the Planner run has ended, no question, first time, and:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="268.2393" x="748.4615" y="242.6025">no check comment, or an open sub-issue</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.5679" x="784.2972" y="257.7353">without exactly one risk label]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.603" x="778.2796" y="272.8681">/ cumin starts the Planner again</text></g><!--link Accepting to Decision--><g class="link" data-entity-1="Accepting" data-entity-2="Decision" data-source-line="33" data-uid="lnk6" id="link_Accepting_Decision"><path d="M658.5,256.13 C736.77,267.71 820.66,285.6 849.59,311.27 C876,334.7 883.9416,370.612 886.6916,397.152" fill="none" id="Accepting-to-Decision" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="887.31,403.12,890.3611,393.7557,886.7947,398.1466,882.4037,394.5802,887.31,403.12" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.8271" x="965.5152" y="324.3369">stop the acceptance check</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="340.4375" x="882.71" y="339.4697">[the Planner run has ended, and: the Planner asked,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.0435" x="940.407" y="354.6025">or the same failure after the retry]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.4072" x="1002.7251" y="369.7353">/ cumin notifies</text></g><!--link AwaitingAcceptance to *end*--><g class="link" data-entity-1="AwaitingAcceptance" data-entity-2=".end." data-source-line="34" data-uid="lnk8" id="link_AwaitingAcceptance_.end."><path d="M319.6,453.95 C335.92,461.5 351.87,471.19 364.59,483.53 C386.86,505.13 396.1617,535.9412 400.2117,553.6412" fill="none" id="AwaitingAcceptance-to-*end*" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="401.55,559.49,403.4418,549.8245,400.4348,554.616,395.6433,551.6089,401.55,559.49" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.3882" x="387.32" y="504.0969">the Assignee closes the issue</text></g><!--link AwaitingAcceptance to Implementing--><g class="link" data-entity-1="AwaitingAcceptance" data-entity-2="Implementing" data-source-line="35" data-uid="lnk9" id="link_AwaitingAcceptance_Implementing"><path d="M103.54,448.68 C85.97,456.75 70.08,467.98 58.59,483.53 C45.58,501.15 47.8655,520.971 53.7955,539.661" fill="none" id="AwaitingAcceptanc