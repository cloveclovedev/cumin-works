<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="601px" preserveAspectRatio="none" style="width:1231px;height:601px;background:#FFFFFF;" version="1.1" viewBox="0 0 1231 601" width="1231px" zoomAndPan="magnify"><defs/><g><g id="Before"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="361.0791" x="320.05" y="7"/><line style="stroke:#181818;stroke-width:0.5;" x1="320.05" x2="681.1291" y1="33.2969" y2="33.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="341.0791" x="330.05" y="24.9951">planning, implementing, or awaiting-plan-review</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="89.6191" x="325.05" y="49.4355">(the plan area)</text></g><g id="Accepting"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="315.2422" x="342.97" y="212.64"/><line style="stroke:#181818;stroke-width:0.5;" x1="342.97" x2="658.2122" y1="238.9369" y2="238.9369"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="68.6123" x="466.2849" y="230.6351">accepting</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="295.2422" x="347.97" y="255.0755">do / the Planner checks the requirement on main</text></g><g id="AwaitingAcceptance"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="261.8398" x="103.67" y="403.27"/><line style="stroke:#181818;stroke-width:0.5;" x1="103.67" x2="365.5098" y1="429.5669" y2="429.5669"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="145.4141" x="161.8829" y="421.2651">awaiting-acceptance</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="241.8398" x="108.67" y="445.7055">do / the Assignee accepts or sends back</text></g><g id="PlanReview"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="166.5762" x="417.3" y="403.27"/><line style="stroke:#181818;stroke-width:0.5;" x1="417.3" x2="583.8762" y1="429.5669" y2="429.5669"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="146.5762" x="427.3" y="421.2651">awaiting-plan-review</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="89.6191" x="422.3" y="445.7055">(the plan area)</text></g><g id="Implementing"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="117.1797" x="7" y="545.53"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="124.1797" y1="571.8269" y2="571.8269"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="97.1797" x="17" y="563.5251">implementing</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="89.6191" x="12" y="587.9655">(the plan area)</text></g><g id="Decision"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="177.582" x="799.8" y="403.27"/><line style="stroke:#181818;stroke-width:0.5;" x1="799.8" x2="977.382" y1="429.5669" y2="429.5669"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="122.3975" x="827.3923" y="421.2651">awaiting-decision</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="157.582" x="804.8" y="445.7055">do / the Assignee answers</text></g><g id="Ready"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="109.6191" x="833.78" y="545.53"/><line style="stroke:#181818;stroke-width:0.5;" x1="833.7