<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="423px" preserveAspectRatio="none" style="width:970px;height:423px;background:#FFFFFF;" version="1.1" viewBox="0 0 970 423" width="970px" zoomAndPan="magnify"><defs/><g><g id="Starting"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="338.0293" x="165.73" y="107.27"/><line style="stroke:#181818;stroke-width:0.5;" x1="165.73" x2="503.7593" y1="133.5669" y2="133.5669"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="125.9727" x="271.7583" y="125.2651">starting new work</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="318.0293" x="170.73" y="149.7055">do / cumin starts ready issues when it has a free slot</text></g><g id="Stopped"><rect fill="#F1F1F1" height="64.2344" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="258.623" x="205.43" y="279.54"/><line style="stroke:#181818;stroke-width:0.5;" x1="205.43" x2="464.053" y1="305.8369" y2="305.8369"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="134.3604" x="267.5613" y="297.5351">new starts stopped</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="238.623" x="210.43" y="321.9755">do / cumin lets the runs that go on end,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="138.8379" x="210.43" y="335.9443">and starts nothing new</text></g><g class="entity" data-entity="Q4" data-source-line="18" data-uid="ent0004" id="entity_Q4"><path d="M379.58,6 L379.58,46.2656 L963.8964,46.2656 L963.8964,16 L953.8964,6 L379.58,6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M953.8964,6 L953.8964,16 L963.8964,16 L953.8964,6" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="563.3164" x="385.58" y="23.0669">tell the Owner that cumin waits, in both states: [nothing can go on without the Owner,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="372.6836" x="385.58" y="38.1997">no agent runs] / cumin tells the Owner once that it waits.</text></g><ellipse cx="334.74" cy="26.14" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><!--link *start* to Starting--><g class="link" data-entity-1=".start." data-entity-2="Starting" data-source-line="13" data-uid="lnk3" id="link_.start._Starting"><path d="M334.74,36.39 C334.74,52.04 334.74,78.23 334.74,100.79" fill="none" id="*start*-to-Starting" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="334.74,106.79,338.74,97.79,334.74,101.79,330.74,97.79,334.74,106.79" style="stroke:#181818;stroke-width:1;"/></g><!--link Starting to Stopped--><g class="link" data-entity-1="Starting" data-entity-2="Stopped" data-source-line="14" data-uid="lnk4" id="link_Starting_Stopped"><path d="M165.59,143.63 C103.29,151.23 43.14,164.47 23.74,187.54 C6,208.62 6.23,228.26 23.74,249.54 C47.07,277.9 124.6863,292.6407 199.3163,300.8907" fill="none" id="Starting-to-Stopped" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="205.28,301.55,196.774,296.5853,200.3103,301.0006,195.895,304.5369,205.28,301.55" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.2612" x="107.761" y="200.6069">stop new starts</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="266.3032" x="24.74" y="215.7397">[cumin reads a quota window at its limit,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="169.6665" x="73.0584" y="230.8725">or cannot read the usage]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.4531" x="71.665" y="246.0053">/ cumin notifies the Owner</text></g><!--link Stopped to Starting--><g class="link" data-entity-1="Stopped" data-entity-2="Starting" data-source-line="15" data-uid="lnk5" id="link_Stopped_Starting"><path d="M332.9,279.26 C332.42,269.72 331.98,259.2 331.74,249.54 C331.06,221.99 330.98,215.08 331.74,187.54 C332.01,177.84 332.2015,173.1799 332.7415,163.8999" fill="none" id="Stopped-to-Starting" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="333.09,157.91,328.5739,166.6624,332.7995,162.9016,336.5604,167.1272,333.09,157.91" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="121.2021" x="393.9346" y="208.1069">resume new starts</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.1577" x="348.4568" y="223.2397">the Owner allows the 5h window</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.5913" x="332.74" y="238.3725">[the weekly window is under its limit]</text></g><!--link Stopped to Starting--><g class="link" data-entity-1="Stopped" data-entity-2="Starting" data-source-line="16" data-uid="lnk6" id="link_Stopped_Starting"><path d="M464.25,293.21 C515.26,283.45 565.36,269.21 580.74,249.54 C597.71,227.83 598,209.01 580.74,187.54 C569.34,173.35 545.183,163.9802 509.893,156.0202" fill="none" id="Stopped-to-Starting-1" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="504.04,154.7,511.9393,160.5823,508.9175,155.8002,513.6996,152.7783,504.04,154.7" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="121.2021" x="654.3083" y="208.1069">resume new starts</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="240.6587" x="594.58" y="223.2397">[the time of cumin's next try passed,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.6392" x="600.0898" y="238.3725">both windows are under their limit]</text></g><g class="legend" data-source-line="20"><rect fill="#DDDDDD" height="42.5938" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="503.1104" x="441.7861" y="360.7744"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="487.4092" x="446.7861" y="378.7695">This machine has one instance for one cumin, not one for each issue.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="493.1104" x="446.7861" y="395.0664">It lives on the Host (the latest quota reading of cumin), not on GitHub.</text></g><!--SRC=[bLCxSzim3DxvAt1PdFHiPMcN35sRJhq-Dji3Oy4MBnAe4b1L__i296KxlIwT1542lWS-hk0m3O5WZkcLOGFI8R1uGOZ7-Ya8Ot-4Oqn0EDlN90ptFwSe_g797Ra6IPuuI8Z4rXsO9zpaOTmChLk1J_ZtJz85Xi4Vka2u1efYXvvASwCztv1QJ4-G9W8-f30AFwPyjcc3FoK_SCCTUCb4KYmJSerZLAIOperpNMWHS1Zb32sMEKh1kQBrBeiATCeApOixy0pVwwbR2dY2Di9ZDQOwaT2tvqAOOUxG78DEspqS4wgTVPGBq8s3B74SiQr8kNRr-HQdH_qxAvh82jLwYX09r8RrZZoroqZrhwigdDk-syDcy_4VAihfWcGyRZQxess1DLqceYnt3jJ6sNpMF40VXY2AhPauUBArsT-PvCJ-XFiTBUprOpW6B0g-p8JfelAMdH99oDE0RwXSUi3tVPpBa0zTPQDKxNr6VEtF2qFDqsJnkFBS_mTW7YXXkEP_fRRYRurNEiFecT4yVr6ZAo3dM1T8RGvf0NMgN3SksFTNxMLzzSvvfRW6hVAuSbEUOBjiKPsjYvw3T76IwnYbG17KQ9ASYlqbB0PtuxLs7x20QYepOfCJz_MzSptgW1PIE7NY07xStCKSuAZFGChBPjZzjuCCKwygbMFKdkN60dmMTU0NMdlcyHnPuDwgtWHA3PG5nbGkFZyiC-5JaEVffN7AhJ1qVm00]--></g></svg>