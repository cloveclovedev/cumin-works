<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="408px" preserveAspectRatio="none" style="width:931px;height:408px;background:#FFFFFF;" version="1.1" viewBox="0 0 931 408" width="931px" zoomAndPan="magnify"><defs/><g><g id="Starting"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="338.0293" x="233.39" y="107.27"/><line style="stroke:#181818;stroke-width:0.5;" x1="233.39" x2="571.4193" y1="133.5669" y2="133.5669"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="125.9727" x="339.4183" y="125.2651">starting new work</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="318.0293" x="238.39" y="149.7055">do / cumin starts ready issues when it has a free slot</text></g><g id="Stopped"><rect fill="#F1F1F1" height="64.2344" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="258.623" x="273.09" y="264.54"/><line style="stroke:#181818;stroke-width:0.5;" x1="273.09" x2="531.713" y1="290.8369" y2="290.8369"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="134.3604" x="335.2213" y="282.5351">new starts stopped</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="238.623" x="278.09" y="306.9755">do / cumin lets the runs that go on end,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="138.8379" x="278.09" y="320.9443">and starts nothing new</text></g><g class="entity" data-entity="Q4" data-source-line="18" data-uid="ent0004" id="entity_Q4"><path d="M447.57,6 L447.57,46.2656 L845.2463,46.2656 L845.2463,16 L835.2463,6 L447.57,6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M835.2463,6 L835.2463,16 L845.2463,16 L835.2463,6" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="376.6763" x="453.57" y="23.0669">Q4, in both states: [nothing can go on without the Owner,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="372.6836" x="453.57" y="38.1997">no agent runs] / cumin tells the Owner once that it waits.</text></g><ellipse cx="402.4" cy="26.14" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><!--link *start* to Starting--><g class="link" data-entity-1=".start." data-entity-2="Starting" data-source-line="13" data-uid="lnk3" id="link_.start._Starting"><path d="M402.4,36.39 C402.4,52.04 402.4,78.23 402.4,100.79" fill="none" id="*start*-to-Starting" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="402.4,106.79,406.4,97.79,402.4,101.79,398.4,97.79,402.4,106.79" style="stroke:#181818;stroke-width:1;"/></g><!--link Starting to Stopped--><g class="link" data-entity-1="Starting" data-entity-2="Stopped" data-source-line="14" data-uid="lnk4" id="link_Starting_Stopped"><path d="M233.22,140.96 C162.46,148 91.51,161.55 69.4,187.54 C6,262.08 148.0711,285.2559 266.6811,292.4659" fill="none" id="Starting-to-Stopped" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="272.67,292.83,263.9293,288.2913,267.6792,292.5266,263.4439,296.2766,272.67,292.83" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="288.939" x="70.4" y="200.6069">Q1 [cumin reads a quota window at its limit,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="169.6665" x="130.0362" y="215.7397">or cannot read the usage]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.4531" x="128.6429" y="230.8725">/ cumin notifies the Owner</text></g><!--link Stopped to Starting--><g class="link" data-entity-1="Stopped" data-entity-2="Starting" data-source-line="15" data-uid="lnk5" id="link_Stopped_Starting"><path d="M400.57,264.26 C400.09,254.72 399.64,244.2 399.4,234.54 C398.89,213.65 398.83,208.42 399.4,187.54 C399.67,177.84 399.855,173.1795 400.405,163.8995" fill="none" id="Stopped-to-Starting" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="400.76,157.91,396.2345,166.6576,400.4642,162.9012,404.2205,167.1309,400.76,157.91" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234.7935" x="404.7989" y="208.1069">Q2 the Owner allows the 5h window</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.5913" x="400.4" y="223.2397">[the weekly window is under its limit]</text></g><!--link Stopped to Starting--><g class="link" data-entity-1="Stopped" data-entity-2="Starting" data-source-line="16" data-uid="lnk6" id="link_Stopped_Starting"><path d="M532.1,280.76 C611.08,266.3 689.54,238.71 648.4,187.54 C637,173.35 612.853,163.9798 577.553,156.0198" fill="none" id="Stopped-to-Starting-1" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="571.7,154.7,579.5997,160.5818,576.5775,155.7999,581.3594,152.7777,571.7,154.7" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.2944" x="660.7" y="208.1069">Q3 [the time of cumin's next try passed,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.6392" x="677.5276" y="223.2397">both windows are under their limit]</text></g><g class="legend" data-source-line="20"><rect fill="#DDDDDD" height="42.5938" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="503.1104" x="402.8841" y="345.7744"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="487.4092" x="407.8841" y="363.7695">This machine has one instance for one cumin, not one for each issue.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="493.1104" x="407.8841" y="380.0664">It lives on the Host (the latest quota reading of cumin), not on GitHub.</text></g><!--SRC=[TLCzSzim3DtvAzvbSTApbMkRBXwwDfrwRhlP7XWBjdYHI9M4glhV5o0bsxrB9q4WWVS1S873q3cFCSJNX1Mu8IIsJ0Z7wSXnelQ8OuZmDEffv8JxNqDW-r1XynuSi7dI0fVIGAjSdwgkDWlOIE1eVNBiWazwYHkNqDb3upmjuGDhqlfIN4dDT_8rnJNYu94EqVMS7cFEhMfdJz5sgKeDB6UsCPGEEQO-25A8vygOnjK4wde-ewRIHoWOK-JTPHtEdx8ebNy7c_1Zofevm1frmEFanIG-agtFXN32s92QX4RABOwHnC4sy0NenhJ4eU-fdf1oRARllpWjoUsiQF0QYDPJGF0G6vOxRtqzjnJ_cac5CTjtUwnMdzzGKR8painiMu1KYTBEqyJeV1r6TLQ6ZjPrZWLD1d-mNWUbjpEj8TaJxNT-vYk7xkYeSFusUeeNNRTy5Fh3zGvisuQn57rg9lITt-h_IFJQdcT6iZ63Bi2Lr_w_01-H6x3hhaky4AFeZonCFAEtAP6w-2BMJG0fBsg1a68NPn0ZocI6cwSbH6QkAEkzndQsNioPfZCwRiB0LuM2uWF4AyzvbFlBX9dQziOkgJvG6RIiqcX5PvNNPFDaJ4lIe4PqfuODyFFc0UMj2_9rNdXf3tsdciWmq_lo9KrICpypu2kBoD-avPd7SqYCUurQ5SZJJkZCLULivSFS4rySFmylbH5kXQ7v2m00]--></g></svg>