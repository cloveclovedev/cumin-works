<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="393px" preserveAspectRatio="none" style="width:889px;height:393px;background:#FFFFFF;" version="1.1" viewBox="0 0 889 393" width="889px" zoomAndPan="magnify"><defs/><g><g id="Starting"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="338.0293" x="158.15" y="107.27"/><line style="stroke:#181818;stroke-width:0.5;" x1="158.15" x2="496.1793" y1="133.5669" y2="133.5669"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="125.9727" x="264.1783" y="125.2651">starting new work</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="318.0293" x="163.15" y="149.7055">do / cumin starts ready issues when it has a free slot</text></g><g id="Stopped"><rect fill="#F1F1F1" height="64.2344" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="258.623" x="197.85" y="249.54"/><line style="stroke:#181818;stroke-width:0.5;" x1="197.85" x2="456.473" y1="275.8369" y2="275.8369"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="134.3604" x="259.9813" y="267.5351">new starts stopped</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="238.623" x="202.85" y="291.9755">do / cumin lets the runs that go on end,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="138.8379" x="202.85" y="305.9443">and starts nothing new</text></g><g class="entity" data-entity="Q4" data-source-line="18" data-uid="ent0004" id="entity_Q4"><path d="M371.93,6 L371.93,46.2656 L798.3929,46.2656 L798.3929,16 L788.3929,6 L371.93,6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M788.3929,6 L788.3929,16 L798.3929,16 L788.3929,6" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="350.1304" x="377.93" y="23.0669">In both states: [nothing can go on without the Owner,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="405.4629" x="377.93" y="38.1997">no agent runs] / cumin tells the Owner once that it waits (Q4).</text></g><ellipse cx="327.16" cy="26.14" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><!--link *start* to Starting--><g class="link" data-entity-1=".start." data-entity-2="Starting" data-source-line="13" data-uid="lnk3" id="link_.start._Starting"><path d="M327.16,36.39 C327.16,52.04 327.16,78.23 327.16,100.79" fill="none" id="*start*-to-Starting" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="327.16,106.79,331.16,97.79,327.16,101.79,323.16,97.79,327.16,106.79" style="stroke:#181818;stroke-width:1;"/></g><!--link Starting to Stopped--><g class="link" data-entity-1="Starting" data-entity-2="Stopped" data-source-line="14" data-uid="lnk4" id="link_Starting_Stopped"><path d="M157.89,143.51 C95.25,151.09 34.67,164.35 15.16,187.54 C6,198.42 6.12,208.55 15.16,219.54 C38.62,248.04 116.7656,262.7869 191.7456,270.9969" fill="none" id="Starting-to-Stopped" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="197.71,271.65,189.1989,266.6942,192.7397,271.1058,188.3281,274.6466,197.71,271.65" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="267.2427" x="16.16" y="200.6069">[cumin reads a quota window at its limit]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205.2324" x="47.1651" y="215.7397">/ cumin notifies the Owner (Q1)</text></g><!--link Stopped to Starting--><g class="link" data-entity-1="Stopped" data-entity-2="Starting" data-source-line="15" data-uid="lnk5" id="link_Stopped_Starting"><path d="M325.21,249.19 C324.33,231.15 323.59,208.07 324.16,187.54 C324.43,177.84 324.6215,173.1799 325.1615,163.8999" fill="none" id="Stopped-to-Starting" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="325.51,157.91,320.9939,166.6624,325.2195,162.9016,328.9804,167.1272,325.51,157.91" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.1577" x="357.2664" y="200.6069">the Owner allows the 5h window</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="276.3706" x="325.16" y="215.7397">[the weekly window is under its limit] (Q2)</text></g><!--link Stopped to Starting--><g class="link" data-entity-1="Stopped" data-entity-2="Starting" data-source-line="16" data-uid="lnk6" id="link_Stopped_Starting"><path d="M456.59,276.33 C551.08,268.37 654.81,246.53 606.16,187.54 C590.7,168.79 551.7512,157.4195 502.4012,149.3395" fill="none" id="Stopped-to-Starting-1" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="496.48,148.37,504.7154,153.7716,501.4143,149.1779,506.008,145.8768,496.48,148.37" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="240.6587" x="630.4399" y="200.6069">[the time of cumin's next try passed,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="262.4185" x="619.56" y="215.7397">both windows are under their limit] (Q3)</text></g><g class="legend" data-source-line="20"><rect fill="#DDDDDD" height="42.5938" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="581.2246" x="282.7538" y="330.7744"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="571.2246" x="287.7538" y="348.7695">PROPOSAL. This machine has one instance for one cumin, not one for each issue.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="493.1104" x="287.7538" y="365.0664">It lives on the Host (the latest quota reading of cumin), not on GitHub.</text></g><!--SRC=[TLCzRzim4DtvAnwos2vY1MdJnKE1Jas00ewJRhO7nZfRH2HI9KzL_Uzx92LR1Tf9z9btx-CUPpXqZR7edNyFMEBvPVsyVltwVGMk284r4znnk6GuK7t4qNbOwkE_dWFcFpl7Ub5WSmzss3p41XD2HylK7ugcL3DeJs2lRJ1id0tn4bSceD67obYwXNKSYzhcva9wNiYMv5VmdKKuUDDokFEfjYoDFddTX29Kq9pOUfSdf3ErJf2SFnTALQOaKDFo6INbEK91gIpl9kamzfH4HIDke0DUXweQ3rYXTBWRl1Z4UzBbEHCEw2kA9g6ITesZ9t6mTdm1cfWMsBKjbGDIEglX-pTEJN8xAUfiF8ZMauEp41jkTrRRSXmf_bM32gMs7_POBh_yGqMkZaZRZ19bHCvfbUYDBLqVRPMDepQDuVtEZem4nnmDPLRhtfB7V7E_kD2Vmc8rkQNhslMvxNCrWEpiDlxkYTxhymWigUZYaYVm0l7nln1f19lc6jMPs46_9HR-Z5Q7GD6hDp5eW0WfZXb4ces_mdnQA2KIPLrF5gabfrXWHeSFaj6yXDvmvJg-YXGOww1FP3bjR7zP95DTJprpza1vdvAONaUfyyt3eaYHs3meLPDCAU7DgMA5oyiiy6FoR5BMd7oD5PfnP7oTiP1GXrTbSvcaPtnSm1EBw5yKsnEjHnSOytYgeruUmX2Z4KMFrYx6cVXc-B5xAvImp5pL7m00]--></g></svg>