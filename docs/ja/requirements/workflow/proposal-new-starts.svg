<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="379px" preserveAspectRatio="none" style="width:777px;height:379px;background:#FFFFFF;" version="1.1" viewBox="0 0 777 379" width="777px" zoomAndPan="magnify"><defs/><g><g id="Starting"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="267.6523" x="148.4" y="107.27"/><line style="stroke:#181818;stroke-width:0.5;" x1="148.4" x2="416.0523" y1="133.5669" y2="133.5669"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="125.9727" x="219.2398" y="125.2651">starting new work</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="247.6523" x="153.4" y="149.7055">do / start ready issues when a slot is free</text></g><g id="Stopped"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="312.248" x="126.1" y="249.53"/><line style="stroke:#181818;stroke-width:0.5;" x1="126.1" x2="438.348" y1="275.8269" y2="275.8269"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="134.3604" x="215.0438" y="267.5251">new starts stopped</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="292.248" x="131.1" y="291.9655">do / finish the runs that go on, start nothing new</text></g><g class="entity" data-entity="Q4" data-source-line="18" data-uid="ent0004" id="entity_Q4"><path d="M326.8,6 L326.8,46.2656 L733.6486,46.2656 L733.6486,16 L723.6486,6 L326.8,6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M723.6486,6 L723.6486,16 L733.6486,16 L723.6486,6" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="350.1304" x="332.8" y="23.0669">In both states: [nothing can go on without the Owner,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="385.8486" x="332.8" y="38.1997">no agent runs] / tell the Owner once that cumin waits (Q4).</text></g><ellipse cx="282.22" cy="26.14" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><!--link *start* to Starting--><g class="link" data-entity-1=".start." data-entity-2="Starting" data-source-line="13" data-uid="lnk3" id="link_.start._Starting"><path d="M282.22,36.39 C282.22,52.04 282.22,78.23 282.22,100.78" fill="none" id="*start*-to-Starting" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="282.22,106.78,286.22,97.78,282.22,101.78,278.22,97.78,282.22,106.78" style="stroke:#181818;stroke-width:1;"/></g><!--link Starting to Stopped--><g class="link" data-entity-1="Starting" data-entity-2="Stopped" data-source-line="14" data-uid="lnk4" id="link_Starting_Stopped"><path d="M148,148.51 C100.31,156.86 54.79,169.35 40.22,187.53 C6,230.26 54.3204,250.8311 120.0504,261.7011" fill="none" id="Starting-to-Stopped" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="125.97,262.68,117.7432,257.2652,121.037,261.8642,116.438,265.158,125.97,262.68" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.2598" x="41.22" y="200.5969">[a quota window is at its limit]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="150.5093" x="64.5952" y="215.7297">/ notify the Owner (Q1)</text></g><!--link Stopped to Starting--><g class="link" data-entity-1="Stopped" data-entity-2="Starting" data-source-line="15" data-uid="lnk5" id="link_Stopped_Starting"><path d="M280.58,249.16 C280.03,239.88 279.49,229.23 279.22,219.53 C278.83,205.32 278.83,201.75 279.22,187.53 C279.49,177.84 279.675,173.1795 280.225,163.8995" fill="none" id="Stopped-to-Starting" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="280.58,157.91,276.0545,166.6576,280.2842,162.9012,284.0405,167.1309,280.58,157.91" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.1577" x="292.3345" y="200.5969">the Owner allows the 5h window</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="236.3867" x="280.22" y="215.7297">[weekly window under its limit] (Q2)</text></g><!--link Stopped to Starting--><g class="link" data-entity-1="Stopped" data-entity-2="Starting" data-source-line="16" data-uid="lnk6" id="link_Stopped_Starting"><path d="M438.52,262 C502.53,250.93 554.67,229.4 521.22,187.53 C507.02,169.75 468.8349,158.4441 422.3349,150.0641" fill="none" id="Stopped-to-Starting-1" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="416.43,149,424.5779,154.5328,421.3507,149.8868,425.9967,146.6596,416.43,149" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.7451" x="545.276" y="200.5969">[the time of the next try passed,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="236.9771" x="532.66" y="215.7297">both windows under their limit] (Q3)</text></g><g class="legend" data-source-line="20"><rect fill="#DDDDDD" height="42.5938" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="581.2246" x="170.4124" y="316.7956"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="571.2246" x="175.4124" y="334.7907">PROPOSAL. This machine has one instance for one cumin, not one for each issue.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="427.7451" x="175.4124" y="351.0876">It lives on the Host (the latest quota reading), not on GitHub.</text></g><!--SRC=[TPF1Rjim38RlUW