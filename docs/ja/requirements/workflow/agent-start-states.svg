<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="469px" preserveAspectRatio="none" style="width:1000px;height:469px;background:#FFFFFF;" version="1.1" viewBox="0 0 1000 469" width="1000px" zoomAndPan="magnify"><defs/><g><g id="Starting"><rect fill="#F1F1F1" height="64.2344" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="292.584" x="188.22" y="107.26"/><line style="stroke:#181818;stroke-width:0.5;" x1="188.22" x2="480.804" y1="133.5569" y2="133.5569"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="106.4424" x="281.2908" y="125.2551">starting agents</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="272.584" x="193.22" y="149.6955">do / cumin starts the agent of each transition</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="113.168" x="193.22" y="163.6643">that requests work</text></g><g id="Stopped"><rect fill="#F1F1F1" height="64.2344" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="305.9199" x="181.55" y="293.5"/><line style="stroke:#181818;stroke-width:0.5;" x1="181.55" x2="487.4699" y1="319.7969" y2="319.7969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="145.8652" x="261.5773" y="311.4951">agent starts stopped</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="238.623" x="186.55" y="335.9355">do / cumin lets the runs that go on end,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="285.9199" x="186.55" y="349.9043">and starts no agent. Every issue keeps its state</text></g><g class="entity" data-entity="Q4" data-source-line="18" data-uid="ent0004" id="entity_Q4"><path d="M379.2,6 L379.2,46.2656 L993.8265,46.2656 L993.8265,16 L983.8265,6 L379.2,6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M983.8265,6 L983.8265,16 L993.8265,16 L983.8265,6" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="563.3164" x="385.2" y="23.0669">tell the Owner that cumin waits, in both states: [nothing can go on without the Owner,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="593.6265" x="385.2" y="38.1997">no agent runs, no issue waits only for the quota] / cumin tells the Owner once that it waits.</text></g><ellipse cx="334.51" cy="26.13" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><!--link *start* to Starting--><g class="link" data-entity-1=".start." data-entity-2="Starting" data-source-line="13" data-uid="lnk3" id="link_.start._Starting"><path d="M334.51,36.61 C334.51,52.06 334.51,77.32 334.51,101.14" fill="none" id="*start*-to-Starting" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="334.51,107.14,338.51,98.14,334.51,102.14,330.51,98.14,334.51,107.14" style="stroke:#181818;stroke-width:1;"/></g><!--link Starting to Stopped--><g class="link" data-entity-1="Starting" data-entity-2="Stopped" data-source-line="14" data-uid="lnk4" id="link_Starting_Stopped"><path d="M187.74,151.51 C117.94,160.17 45.05,175.31 23.51,201.5 C6,222.78 6,242.22 23.51,263.5 C44.4,288.89 107.5997,303.1196 175.4097,311.8996" fill="none" id="Starting-to-Stopped" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="181.36,312.67,172.9481,307.5474,176.4014,312.028,171.9209,315.4812,181.36,312.67" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="110.9443" x="102.1894" y="214.5669">stop agent starts</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="266.3032" x="24.51" y="229.6997">[cumin reads a quota window at its limit,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="169.6665" x="72.8284" y="244.8325">or cannot read the usage]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.4531" x="71.435" y="259.9653">/ cumin notifies the Owner</text></g><!--link Stopped to Starting--><g class="link" data-entity-1="Stopped" data-entity-2="Starting" data-source-line="15" data-uid="lnk5" id="link_Stopped_Starting"><path d="M332.67,293.22 C332.19,283.68 331.75,273.16 331.51,263.5 C330.83,235.95 330.83,229.04 331.51,201.5 C331.75,191.83 331.8885,187.3024 332.3685,177.7624" fill="none" id="Stopped-to-Starting" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="332.67,171.77,328.2228,180.5576,332.4187,176.7637,336.2127,180.9596,332.67,171.77" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="131.8853" x="388.363" y="222.0669">resume agent starts</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.1577" x="348.2268" y="237.1997">the Owner allows the 5h window</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.5913" x="332.51" y="252.3325">[the weekly window is under its limit]</text></g><!--link Stopped to Starting--><g class="link" data-entity-1="Stopped" data-entity-2="Starting" data-source-line="16" data-uid="lnk6" id="link_Stopped_Starting"><path d="M487.76,302.26 C529.85,292.82 567.53,280.09 580.51,263.5 C597.48,241.79 597.48,223.2 580.51,201.5 C566.85,184.03 531.7071,172.1058 486.9971,162.5358" fill="none" id="Stopped-to-Starting-1" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="481.13,161.28,489.0934,167.0751,486.0193,162.3265,490.7679,159.2523,481.13,161.28" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="131.8853" x="648.6267" y="222.0669">resume agent starts</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="240.6587" x="594.24" y="237.1997">[the time of cumin's next try passed,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.6392" x="599.7498" y="252.3325">both windows are under their limit]</text></g><g class="legend" data-source-line="20"><rect fill="#DDDDDD" height="75.1875" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="609.293" x="365.5335" y="374.7344"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="487.4092" x="370.5335" y="392.7295">This machine has one instance for one cumin, not one for each issue.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="493.1104" x="370.5335" y="409.0264">It lives on the Host (the latest quota reading of cumin), not on GitHub.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="599.293" x="370.5335" y="425.3232">While agent starts are stopped, cumin still takes every transition that starts no agent</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="376.79" x="370.5335" y="441.6201">(a label, a comment, a notification, a merge, a close).</text></g><!--SRC=[bLGzSzim3DtvAt1PalHiPMcN3DrwJQTUF-uwn1uO2RPufaY5XABwtnS0ATl9PUbaY2JUUtW0V0tjDBW0Sqo736kW7Y6J9OIugrUECleTx69QRXDbkRPx31pTF4-Hx6sZjne39Hko8nU3FdGvJxXMsDmCdRa6c_3j8-fTXi6slGkuWX19AK99RZZd9uOEqpsaAK1kaniftoKzMtVExfCTSfDxiAH2KYm86kCOcIccOsDCxpe474OwGeS5XoKOKwg-ql9SsDVghi1c-5NFp1B0FNGHxgf1rH5XqYIXHIxaei9De9w59NoUCFDRiVj4MP8gIgOuZjXLNerD_NtDwh5oiXyICFm-GWp0bgmsmOPkWGonw6hWomkcOt4K3eXZbkQMVXlp-64Bw_NdTwejfui6KGYNcZVXiKXAQBiCjWx1x48NP-c7a7WtE69TF4Mj3T9UUQq5J