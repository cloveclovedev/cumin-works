e:#888888;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.6758" x="1175.06" y="521.0669">the Owner adds ready</text></g><g class="legend" data-source-line="35"><rect fill="#DDDDDD" height="140.375" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="640.2939" x="661.4418" y="945"/><text fill="#D32F2F" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="30.2969" x="666.4418" y="962.9951">Red</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="570.2813" x="696.7387" y="962.9951">: cumin starts an agent. Before every start, cumin decides from the quota usage.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="588.1162" x="666.4418" y="979.292">At a limit, cumin starts nothing, changes no label for that start, and counts nothing;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="391.1592" x="666.4418" y="995.5889">the issue keeps its state, and a later poll decides again.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="630.2939" x="666.4418" y="1011.8857">Gray: cumin starts no agent (a label, a comment, a notification). Dashed: the Owner acts.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="666.4418" y="1028.1826">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="522.1289" x="666.4418" y="1044.4795">While cumin stops after the current runs (cumin stop --after-current-runs):</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="525.916" x="666.4418" y="1060.7764">cumin takes no red transition; the issue keeps its state until the next start.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="260.6816" x="666.4418" y="1077.0732">cumin still takes the gray transitions.</text></g><!--SRC=[hLPDJnin4BtxLupe0OYoYqGlLK18L8YgfrQeKW-8WxCxoLhnselj9Tr_t_77VYI4bXPoMe_Vl9bvutXy34LR2mLRRJOMCh2EExIWLy31u6Ch3DQe70XhMrp0jX951SvmPOKJMbdlO1nm1NnDk3ax1bTX1rnAykUbNy5Zgns7rX84Li9ODoU74fHMICJW-0QLfvQOih5EDnRuog4914LhZC_2jChc5E87sLAcdiX3fZbnWy56_A6KII5PA2IBpddJrlA2OB8BUCLhZDwsqblb8zsXAj4iV6ImXH6DisScsB9IyBNXjSrj1Tm50gErym73DpQQ4jAconchH8c0TUCwA37oKAQCXJpWwCPGhN2YTAYgjI3v4kNf4N0BOQy7UacxOBxpNxsvaLmfeTPXvtjQz9jyoqaNjSuyAZFu970x0E_2ieUAkf51ffxhwyGmy1K5DWFYkbyz2nTnN1Ku0VhbCsI9XR2aHwmtBHYxdpr0bbqb1Q96sVs7J-4tBxcji7oW_I05B8BgtxQApWmlInkENxVlvl7JeiYjvcQJEZQUTqea_IjOf2U6cu_dj-UtywMM8MolCr5S5bfgiqY8Aq-4DXu9sqZXBiy2u8eDFZi9ZOqWBcutaqgSXjYnOFCTtE7OIsbenfzp6Zi3HON5vc1w_ryjNGLSgB_KtBUP-Fo_VUAzqcOKW4sqUKiJT-3lBzm-_QjwovUwJVS6rgIOzxNjCbvHbeqvxH2E_wD3XoLckElxFhNkTVM5x0wrzHdJReSd1RsbmuTe9fU4lqocLqGXjQNBtXk2tcp8_9-l62QHPby9Hgmhns1VrDdi3ilPh5TkCSmu6fnsc9mvV4RIXQR44vekxiuJrD-FD3PWPNIzFr1p2dXDGe0KjHWy4hdIhYBro5fnjKPlYACbjO36LWhansYXMpKwNH3ne0vi46aY2sVZt8qE59Jx4TreclPzak6O-Ao-6DujzlE9nS89ZtaG3uMjVI_z9uKMAr5mFnnFSxW9-k-eNZXw013vprU-5k1anD0m2Q0i0J8FE5qGMyJuTqZ8qM0vUKzSl2m3a612nhS3_afYvWEXfKsPQ3s6dWlTzA6ICpesyV2mtm00]--></g></svg>