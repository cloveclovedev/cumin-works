271" x="667.06" y="755.0669">stop the acceptance check</text></g><!--link Acceptance to Implementing--><g class="link" data-entity-1="Acceptance" data-entity-2="Implementing" data-source-line="31" data-uid="lnk17" id="link_Acceptance_Implementing"><path d="M249.58,788.55 C246.17,769.18 240.94,738.58 237.06,712 C231.02,670.56 225.9314,627.7812 222.9114,601.3612" fill="none" id="Acceptance-to-Implementing" style="stroke:#888888;stroke-width:1;"/><polygon fill="#888888" points="222.23,595.4,219.278,604.796,222.7978,600.3677,227.2262,603.8875,222.23,595.4" style="stroke:#888888;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="214.335" x="238.06" y="696.5669">mark the requirement as in work</text></g><!--link Acceptance to *end*--><g class="link" data-entity-1="Acceptance" data-entity-2=".end." data-source-line="32" data-uid="lnk19" id="link_Acceptance_.end."><path d="M253.06,829.44 C253.06,851.91 253.06,882.06 253.06,899.68" fill="none" id="Acceptance-to-*end*" style="stroke:#888888;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#888888" points="253.06,905.68,257.06,896.68,253.06,900.68,249.06,896.68,253.06,905.68" style="stroke:#888888;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188.7729" x="254.06" y="872.0669">a Maintainer closes the issue</text></g><!--link Decision to Ready--><g class="link" data-entity-1="Decision" data-entity-2="Ready" data-source-line="33" data-uid="lnk20" id="link_Decision_Ready"><path d="M922.19,788.54 C961.59,770.5 1008.06,739.4 1008.06,693 C1008.06,340 1008.06,340 1008.06,340 C1008.06,269.45 760.5853,237.0339 678.4153,228.1639" fill="none" id="Decision-to-Ready" style="stroke:#888888;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#888888" points="672.45,227.52,680.9687,232.4628,677.4211,228.0566,681.8273,224.509,672.45,227.52" style="stroke:#888888;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="158.1519" x="1009.06" y="521.0669">a Maintainer adds ready</text></g><g class="legend" data-source-line="35"><rect fill="#DDDDDD" height="140.375" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="654.8066" x="494.4052" y="945"/><text fill="#D32F2F" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="30.2969" x="499.4052" y="962.9951">Red</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="570.2813" x="529.7021" y="962.9951">: cumin starts an agent. Before every start, cumin decides from the quota usage.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="588.1162" x="499.4052" y="979.292">At a limit, cumin starts nothing, changes no label for that start, and counts nothing;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="391.1592" x="499.4052" y="995.5889">the issue keeps its state, and a later poll decides again.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="644.8066" x="499.4052" y="1011.8857">Gray: cumin starts no agent (a label, a comment, a notification). Dashed: a Maintainer acts.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="499.4052" y="1028.1826">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="522.1289" x="499.4052" y="1044.4795">While cumin stops after the current runs (cumin stop --after-current-runs):</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="525.916" x="499.4052" y="1060.7764">cumin takes no red transition; the issue keeps its state until the next start.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="260.6816" x="499.4052" y="1077.0732">cumin still takes the gray transitions.</text></g><!--SRC=[hLPBJzmm4BxxLupe0LXjWaGlrOAGg11L3vKgLAa7nC4ainjh7JlO3jly-uuVUMnuj0AGaDRsDz_CV3Fn-12AjXOATjfiBMHW7NTeGQ-1Wy67LXYiKJaGrhQuWbqbYWgSuSeA9xIoti0uu0huXd1BTWYkmWwub6JFIx-2XrOx3gqb2Ao5iMv91YKehP28mV4jAayjCKLZdMuiyBL34mYArXWVXMcLpSd5BzfBaNeY3vd6n0s6FU8FgKmIoK8YMJJEcxQMPmIJNS0hNcEqjfNUAU_f1bM9PkKzWosCQ9mzCM4lAmNV65xRt5R0NI0mMZllCFp6HbD0sdGvOvKe4R1kN0SbHXwAbB4G1nnS6SeLZfGEMRKM9Bz7UNm0t48uwu5UqYvit_XV_NOZkL92RSB9pxJe3_cEaovgatbKPl1Hu6u0teHb3nLr8uDCFTVtoSR0LnJO38ZBVlN4NSHnLU04w9TFa2KMmf8UCT-qOEnsSGTPTf4KY1fbjv- -XBzboMs5vHsT1obWHHtxWmlbw9_QXfUb3HtOpIszoJGligovsQQYZIrFiQGFWqKFn73r-VJwz7fvhsNmt4jD5EU5bjgi4kB24w6DNM4RATpvIG1SiC5cBw2n5ZuHkuMrZgtlYmQnQ7kciqY6ChmUobWJA2eijiz6zVOawH8WzV-HQbzWulFV-MZD9YAyfrfxy8-NQax_IX7vlMxJpO0rAUCjR7iVBo7BnaZsQCOlPTOBOqZxfX-JuAnuBmJtNFNcJ6oImNiA-HpDvBltzyFigo-ajdI5UywWCHl2VSl5mIJIK2l1Y4tb6Cp5N2nki5miUiLMm_2YYMY7aPZ3LwG2qlN_YAQBfyi4zHSVpGDO6rtF9sLE3Yz93f2Y5eD58bVQLQGXxLPSRT1ln9cHUeNcKNBavsEXMpKQdH7n811i4MdK2cVZG8q6v9JxsTje6kDzaA4zV5JV3EzMytXYid34Onp4GsvhNr7_aroBjIYudth7ELo54io5BnmDT-B__Pyl0JWQCJGe0YXBWCm3ZbV45Z7-ZH72D5XEtWfdBoi1f9cGyLs0VvAU-K1ewL0cMe-Xfq0tVOJaZ3edzW_x2m00]--></g></svg>