<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="594px" preserveAspectRatio="none" style="width:832px;height:594px;background:#FFFFFF;" version="1.1" viewBox="0 0 832 594" width="832px" zoomAndPan="magnify"><defs/><g><ellipse cx="318.1882" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="293.8496" x="171.2634" y="50"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="273.8496" x="181.2634" y="71.1387">read .cumin/config.toml of the default branch</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="135.3887" x="250.4939" y="103.9688"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="115.3887" x="260.4939" y="125.1074">run the tool checks</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="294.4531" x="170.9617" y="157.9375"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="274.4531" x="180.9617" y="179.0762">read the open issues, their labels, sub-issues,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="265.1074" x="180.9617" y="193.0449">blockers, pull requests, reviews, and checks</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="295.7949" x="170.2908" y="225.875"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="275.7949" x="180.2908" y="247.0137">skip each issue that cumin cannot read whole</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="76.418" x="180.2908" y="260.9824">(notify once)</text><path d="M447.6394,297.6484 L447.6394,313.7813 L427.6394,317.7813 L447.6394,321.7813 L447.6394,337.9141 A0,0 0 0 0 447.6394,337.9141 L820.0964,337.9141 A0,0 0 0 0 820.0964,337.9141 L820.0964,307.6484 L810.0964,297.6484 L447.6394,297.6484 A0,0 0 0 0 447.6394,297.6484" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M810.0964,297.6484 L810.0964,307.6484 L820.0964,307.6484 L810.0964,297.6484" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251.145" x="453.6394" y="314.7153">The same facts give the same actions.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="351.457" x="453.6394" y="329.8481">The same decision runs right after an agent run ends.</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="218.9023" x="208.7371" y="293.8125"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="198.9023" x="218.7371" y="314.9512">decide the actions from the facts</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="174.9609" x="218.7371" y="328.9199">and from the agents that run</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="269.7793" x="183.2986" y="361.75"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="214.0898" x="193.2986" y="382.8887">take the actions that start no agent</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="249.7793" x="193.2986" y="396.8574">(labels, comments, notifications, merges)</text><polygon fill="#F1F1F1" points="169.6533,429.6875,466.7231,429.6875,478.7231,441.6875,466.7231,453.6875,169.6533,453.6875,157.6533,441.6875,169.6533,429.6875" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="297.0698" x="169.6533" y="445.4956">agent starts stopped by a usage limit or a tool check?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="138.645" y="439.0933">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="478.7231" y="439.0933">no</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="273.3066" x="11" y="463.6875"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="253.3066" x="21" y="484.8262">start no agent; every issue keeps its state</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="288.4121" x="344.5171" y="463.6875"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="236.7832" x="354.5171" y="484.8262">start the agents, in the order of priority</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="268.4121" x="354.5171" y="498.7949">and of the issue number, up to the free slots</text><polygon fill="#F1F1F1" points="318.1882,517.625,330.1882,529.625,318.1882,541.625,306.1882,529.625,318.1882,517.625" style="stroke:#181818;stroke-width:0.5;"/><ellipse cx="318.1882" cy="572.625" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="318.1882" cy="572.625" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="318.1882" x2="318.1882" y1="30" y2="50"/><polygon fill="#181818" points="314.1882,40,318.1882,50,322.1882,40,318.1882,44" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="318.1882" x2="318.1882" y1="83.9688" y