<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="724px" preserveAspectRatio="none" style="width:1634px;height:724px;background:#FFFFFF;" version="1.1" viewBox="0 0 1634 724" width="1634px" zoomAndPan="magnify"><defs/><g><g id="Ready"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="203.4043" x="1101.58" y="103"/><line style="stroke:#181818;stroke-width:0.5;" x1="1101.58" x2="1304.9843" y1="129.2969" y2="129.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="40.1201" x="1183.2221" y="120.9951">ready</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="183.4043" x="1106.58" y="145.4355">do / cumin waits for a free slot</text></g><g id="Implementing"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="186.5059" x="543.03" y="286.13"/><line style="stroke:#181818;stroke-width:0.5;" x1="543.03" x2="729.5359" y1="312.4269" y2="312.4269"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="97.1797" x="587.6931" y="304.1251">implementing</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="166.5059" x="548.03" y="328.5655">do / the Implementer works</text></g><g id="Checking"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="241.7539" x="332.41" y="482.63"/><line style="stroke:#181818;stroke-width:0.5;" x1="332.41" x2="574.1639" y1="508.9269" y2="508.9269"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="62.6377" x="421.9681" y="500.6251">checking</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="221.7539" x="337.41" y="525.0655">do / GitHub runs the required checks</text></g><g id="Decision"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="177.582" x="821.5" y="668.26"/><line style="stroke:#181818;stroke-width:0.5;" x1="821.5" x2="999.082" y1="694.5569" y2="694.5569"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="122.3975" x="849.0923" y="686.2551">awaiting-decision</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="157.582" x="826.5" y="710.6955">do / the Assignee answers</text></g><g id="Reviewing"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="123.6582" x="213.46" y="668.26"/><line style="stroke:#181818;stroke-width:0.5;" x1="213.46" x2="337.1182" y1="694.5569" y2="694.5569"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="68.2568" x="241.1607" y="686.2551">reviewing</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="103.6582" x="218.46" y="710.6955">(the review area)</text></g><g id="MergeDecision"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="192.9561" x="539.81" y="103"/><line style="stroke:#181818;stroke-width:0.5;" x1="539.81" x2="732.7661" y1="129.2969" y2="129.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="172.9561" x="549.81" y="120.9951">awaiting-merge-decision</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="102.7148" x="544.81" y="145.4355">(the merge area)</text></g><ellipse cx="1203.29" cy="16" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><!--link *start* to Ready--><g class="link" data-entity-1=".start." data-entity-2="Ready" data-source-line="26" data-uid="lnk3" id="lin