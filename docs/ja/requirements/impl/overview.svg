<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="555px" preserveAspectRatio="none" style="width:1050px;height:555px;background:#FFFFFF;" version="1.1" viewBox="0 0 1050 555" width="1050px" zoomAndPan="magnify"><defs/><g><g id="Ready"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="203.4043" x="455.72" y="103"/><line style="stroke:#181818;stroke-width:0.5;" x1="455.72" x2="659.1243" y1="129.2969" y2="129.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="40.1201" x="537.3621" y="120.9951">ready</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="183.4043" x="460.72" y="145.4355">do / cumin waits for a free slot</text></g><g id="Implementing"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="186.5059" x="174.17" y="301.13"/><line style="stroke:#181818;stroke-width:0.5;" x1="174.17" x2="360.6759" y1="327.4269" y2="327.4269"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="97.1797" x="218.8331" y="319.1251">implementing</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="166.5059" x="179.17" y="343.5655">do / the Implementer works</text></g><g id="Checking"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="118.8418" x="7" y="499.26"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="125.8418" y1="525.5569" y2="525.5569"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="62.6377" x="35.1021" y="517.2551">checking</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="98.8418" x="12" y="541.6955">(the check area)</text></g><g id="Decision"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="177.582" x="570.63" y="499.26"/><line style="stroke:#181818;stroke-width:0.5;" x1="570.63" x2="748.212" y1="525.5569" y2="525.5569"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="122.3975" x="598.2223" y="517.2551">awaiting-decision</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="157.582" x="575.63" y="541.6955">do / the Assignee answers</text></g><ellipse cx="557.42" cy="16" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><!--link *start* to Ready--><g class="link" data-entity-1=".start." data-entity-2="Ready" data-source-line="20" data-uid="lnk3" id="link_.start._Ready"><path d="M557.42,26.39 C557.42,43.14 557.42,72.67 557.42,96.73" fill="none" id="*start*-to-Ready" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="557.42,102.73,561.42,93.73,557.42,97.73,553.42,93.73,557.42,102.73" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="158.1519" x="558.42" y="69.0669">a Maintainer adds ready</text></g><!--link Ready to Implementing--><g class="link" data-entity-1="Ready" data-entity-2="Implementing" data-source-line="21" data-uid="lnk4" id="link_Ready_Implementing"><path d="M514.38,153.75 C499.07,162.76 481.82,173.22 466.42,183.26 C406.35,222.47 343.6817,268.2056 304.7517,297.2056" fill="none" id="Ready-to-Implementing" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="299.94,300.79,309.5471,298.6213,303.9497,297.803,304.768,292.2057,299.94,300.79" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.3047" x="553.1705" y="196.3269">request the implementation</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="316.1641" x="486.2408" y="211.4597">[cumin handles the ready, cumin has a free slot,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="289.3008" x="499.6724" y="226.5925">no owner-task, and: the blockers are closed,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="353.8057" x="467.42" y="241.7253">or the only open blocker waits for the merge decision]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.8965" x="542.8746" y="256.8581">/ cumin starts the Implementer</text></g><!--link Implementing to Checking--><g class="link" data-entity-1="Implementing" data-entity-2="Checking" data-source-line="22" data-uid="lnk5" id="link_Implementing_Checking"><path d="M173.68,333.14 C132.94,340.92 88.81,357.53 63.42,392.26 C40.78,423.24 47.5392,464.4961 55.9692,493.0161" fill="none" id="Implementing-to-Checking" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="57.67,498.77,58.9548,489.0053,56.2527,493.9751,51.2829,491.273,57.67,498.77" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.7476" x="184.0479" y="420.3269">wait for the checks</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="363.0034" x="64.42" y="435.4597">[no Implementer runs, the implementation is complete]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.6489" x="118.5972" y="450.5925">/ cumin links the pull request if needed</text></g><!--link Implementing to Implementing--><g class="link" data-entity-1="Implementing" data-entity-2="Implementing" data-source-line="23" data-uid="lnk6" id="link_Implementing_Implementing"><path d="M361.09,307.28 C381.15,309.17 395.67,315.5 395.67,326.26 C395.67,337.03 387.1235,342.7972 367.0635,344.6872" fill="none" id="Implementing-to-Implementing" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="361.09,345.25,370.4255,348.3881,366.068,344.781,369.6751,340.4234,361.09,345.25" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.4727" x="484.1768" y="308.3269">request the implementation again</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="387.4863" x="401.67" y="323.4597">[no Implementer runs, the implementation is not complete,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="148.7319" x="521.0472" y="338.5925">no question, first time]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.0645" x="473.8809" y="353.7253">/ cumin starts the Implementer again</text></g><!--link Implementing to Decision--><g class="link" data-entity-1="Implementing" data-entity-2="Decision" data-source-line="24" data-uid="lnk7" id="link_Implementing_Decision"><path d="M360.97,350.2 C386.43,359.93 412.45,373.5 432.42,392.26 C459.95,418.14 439.64,444.79 468.42,469.26 C496.77,493.38 529.3315,505.5307 564.2815,512.9707" fill="none" id="Implementing-to-Decision" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="570.15,514.22,562.1801,508.4338,565.2596,513.1789,560.5144,516.2584,570.15,514.22" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="160.6782" x="564.5904" y="405.3269">stop the implementation</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="339.0093" x="475.4249" y="420.4597">[no Implementer runs, and: the Implementer asked,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="351.019" x="469.42" y="435.5925">or the implementation is not complete after the retry,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.3003" x="505.7794" y="450.7253">or the conflict resolution changed nothing]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.4072" x="594.7259" y="465.8581">/ cumin notifies</text></g><!--link Decision to Ready--><g class="link" data-entity-1="Decision" data-entity-2="Ready" data-source-line="25" data-uid="lnk8" id="link_Decision_Ready"><path d="M748.52,515.14 C777.81,507.7 807.44,494.04 825.42,469.26 C900.08,366.39 905.91,281.64 825.42,183.26 C804.34,157.5 731.8852,144.3649 665.2852,137.1649" fill="none" id="Decision-to-Ready" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="659.32,136.52,667.8379,141.4642,664.291,137.0574,668.6978,133.5105,659.32,136.52" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="158.1519" x="884.62" y="330.8269">a Maintainer adds ready</text></g><!--SRC=[bLCzZzim3DtzAuXqkBQ8apr3WKDRj1swT4qoA1Pj2vP5LvHX-D-NaZ_ETnUqrmo1HP6FZ-zH3r3qhN7vGBvXo27K21nKG0OgGJamRMUnHISnGt9axX6CIualxgIkmaFs08yJX2I30gjkQ46klvdmlR_jOV0c17Gmc51J7s2N61nZIS_7tG5sck2u0rOZmr0JJDpcdWbvQXAyScncMWli2LIHGkUgLrvVuIWOAanZWYRaWvHMNeqpIM57hc889EEIjF2WFAhOuXSwZVu4lfVX2c-wm4UVOhasIZ1QFd0DWXwPUQ8GHKlVs95G8pyUigms6W7RBeoWSS8HWbaszTz9CptkGB7qawyi_SC9eWepxK6Pm52IK8FIewXWAQm0gmt6LGddnoQGRGyBQgIuncNWfF2ALzHOD0lMv_a0xxwcNxO6Jl0-ugJi9Dc75K55mfAJQomCox09wijyo9QFBPr7PbCv6Kqy7T0Bc_F7A-Jv9rZqKF1J6Taruw95MZFuZLunyyMe7d_toE7EgbxSUHAsLavRsVN9Cy7PmtB1Mwtt5-S8Q93MUL3Sx8McFgMocwMY4S9H0YWiCMh95glY9Jax0dMoxNFQnifutwAl41QLhXUtE2v2-i0lZNfkPXnvuqP4Ne6JAonp2ksjqxBAlB_tUEK55HH30JSqh77DnABhhLqLDIM8LHhrQq9lzW1K9LR-7qDvdolBoPA4BhTxA8sFVKoB_vHnQlsQ-sOlEL1tVt7kqbstuLaNRhQxyFTnG9MnPbh4uCUdke9SQKqH9Cva-rHSoE9Mg2D2BUmt4ql4b0RvwP6zvGtz0G00]--></g