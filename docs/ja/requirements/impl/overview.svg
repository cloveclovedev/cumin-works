="Implementing-to-Checking" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="535.48,482.26,545.3288,482.2177,540.0403,480.2097,542.0483,474.9212,535.48,482.26" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.7476" x="747.4979" y="397.8269">wait for the checks</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="363.0034" x="627.87" y="412.9597">[no Implementer runs, the implementation is complete]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.6489" x="682.0472" y="428.0925">/ cumin links the pull request if needed</text></g><!--link Checking to Implementing--><g class="link" data-entity-1="Checking" data-entity-2="Implementing" data-source-line="31" data-uid="lnk8" id="link_Checking_Implementing"><path d="M332.13,502.16 C196.74,492.75 6,464.16 83.29,377.26 C113.24,343.59 387.0583,324.7958 536.7783,316.9058" fill="none" id="Checking-to-Implementing" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="542.77,316.59,533.572,313.0692,537.7769,316.8531,533.993,321.0581,542.77,316.59" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124.0078" x="154.5522" y="390.3269">request a check fix</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.5322" x="84.29" y="405.4597">[a required check failed, below the limit]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.8965" x="115.1079" y="420.5925">/ cumin starts the Implementer</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.105" x="152.0036" y="435.7253">in the same session</text></g><!--link Checking to Implementing--><g class="link" data-entity-1="Checking" data-entity-2="Implementing" data-source-line="34" data-uid="lnk11" id="link_Checking_Implementing"><path d="M419.03,482.42 C405.86,470.99 392.32,456.16 385.29,439.26 C374.69,413.83 368.42,399.05 385.29,377.26 C404.81,352.04 473.7495,335.7937 536.6795,325.4437" fill="none" id="Checking-to-Implementing-1" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="542.6,324.47,533.0702,321.9836,537.6663,325.2814,534.3685,329.8776,542.6,324.47" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.2729" x="396.6018" y="390.3269">request a conflict resolution</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.7324" x="388.372" y="405.4597">[GitHub returns CONFLICTING]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.8965" x="386.29" y="420.5925">/ cumin starts the Implementer</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.105" x="423.1858" y="435.7253">in the same session</text></g><!--link Implementing to Implementing--><g class="link" data-entity-1="Implementing" data-entity-2="Implementing" data-source-line="29" data-uid="lnk6" id="link_Implementing_Implementing"><path d="M729.95,293.64 C750.02,295.4 764.54,301.27 764.54,311.26 C764.54,321.26 755.9971,326.6059 735.9271,328.3659" fill="none" id="Implementing-to-Implementing" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="729.95,328.89,739.265,332.0885,734.9309,328.4532,738.5662,324.1191,729.95,328.89" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.4727" x="853.0468" y="293.3269">request the implementation again</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="387.4