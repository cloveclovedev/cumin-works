="369.8355">do / cumin merges the pull request</text></g><g id="Implementing"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="178.7891" x="961" y="505.53"/><line style="stroke:#181818;stroke-width:0.5;" x1="961" x2="1139.7891" y1="531.8269" y2="531.8269"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="97.1797" x="1001.8047" y="523.5251">implementing</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="158.7891" x="966" y="547.9655">(the implementation area)</text></g><g id="Checking"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="178.7891" x="7" y="505.53"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="185.7891" y1="531.8269" y2="531.8269"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="62.6377" x="65.0757" y="523.5251">checking</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="158.7891" x="12" y="547.9655">(the implementation area)</text></g><g id="AwaitingBase"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="270.8398" x="1461.97" y="327.4"/><line style="stroke:#181818;stroke-width:0.5;" x1="1461.97" x2="1732.8098" y1="353.6969" y2="353.6969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="98.0615" x="1548.3592" y="345.3951">awaiting-base</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="250.8398" x="1466.97" y="369.8355">no one works; the base pull request waits</text></g><g id="Decision"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="177.582" x="1449.6" y="505.53"/><line style="stroke:#181818;stroke-width:0.5;" x1="1449.6" x2="1627.182" y1="531.8269" y2="531.8269"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="122.3975" x="1477.1923" y="523.5251">awaiting-decision</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="157.582" x="1454.6" y="547.9655">do / the Assignee answers</text></g><ellipse cx="381.39" cy="530.67" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="381.39" cy="530.67" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><!--link Reviewing to Merging--><g class="link" data-entity-1="Reviewing" data-entity-2="Merging" data-source-line="29" data-uid="lnk2" id="link_Reviewing_Merging"><path d="M985.14,39.91 C859.33,54.94 581.46,95.28 519.39,164.27 C478.67,209.53 482.4611,281.5804 488.1111,321.1104" fill="none" id="Reviewing-to-Merging" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="488.96,327.05,491.6463,317.5746,488.2525,322.1003,483.7268,318.7065,488.96,327.05" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="102.1338" x="655.6998" y="178.9669">start the merge</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="327.4248" x="543.0543" y="194.0997">[no Reviewer runs, APPROVE on the head commit,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="372.7534" x="520.39" y="209.2325">the required checks passed, risk low, no base to wait for]</text></g><!--link Reviewing to MergeDecision--><g class="link" data-entity-1="Reviewing" data-entity-2="MergeDecision" data-source-line="30" data-uid="lnk3" id="link_Reviewing_MergeDecision"><path d="M1047.39,57.74 C1047.39,86.81 1047.39,128.89 1047.39,157.91" fill="none" id="Reviewing-to-MergeDecision" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1047.39,163.91,1051.39,154.91,1047.39,158.91,1043.39,154.91,1047.39,163.91" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173.8496" x="1115.1483" y="100.3369">ask for the merge decision</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="209.9995" x="1097.0733" y="115.4697">[the same, risk medium or high]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="307.3662" x="1048.39" y="130.6025">/ cumin asks the Assignee for a review, notifies</text></g><!--link MergeDecision to Merging--><g class="link" data-entity-1="MergeDecision" data-entity-2="Merging" data-source-line="31" data-uid="lnk4" id="link_MergeDecision_Merging"><path d="M910.68,211.06 C828.86,223.74 737.18,238.65 718.39,244.53 C651.73,265.41 584.873,299.6127 540.733,324.1727" fill="none" id="MergeDecision-to-Merging" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="535.49,327.09,545.2994,326.2094,539.8592,324.6589,541.4097,319.2187,535.49,327.09" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="102.1338" x="820.4637" y="257.5969">start the merge</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.2813" x="719.39" y="272.7297">[the Assignee's APPROVE on the head commit,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.6914" x="779.1849" y="287.8625">the required checks passed]</text></g><!--link MergeDecision to Implementing--><g class="link" data-entity-1="MergeDecision" data-entity-2="Implementing" data-source-line="32" data-uid="lnk5" id="link_MergeDecision_Implementing"><path d="M1047.61,214.8 C1048.16,277.4 1049.5771,437.1402 1050.1271,499.4902" fill="none" id="MergeDecision-to-Implementing" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1050.18,505.49,1054.1005,496.4551,1050.1359,500.4902,1046.1008,496.5256,1050.18,505.49" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.2085" x="1138.1098" y="334.5969">request an assignee review fix</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375.248" x="1050.09" y="349.7297">[the Assignee's REQUEST_CHANGES on the head commit,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="253.8364" x="1110.7958" y="364.8625">after the last awaiting-merge-decision]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="336.1338" x="1069.6471" y="379.9953">/ cumin starts the Implementer in the same session</text></g><!--link Reviewing to AwaitingBase--><g class="link" data-entity-1="Reviewing" data-entity-2="AwaitingBase" data-source-line="33" data-uid="lnk6" id="link_Reviewing_AwaitingBase"><path d="M1109.7,38.82 C1189.26,46.92 1321.73,63.48 1364.39,87.27 C1470.97,146.7 1549.9237,268.8033 1580.9137,322.0933" fill="none" id="Reviewing-to-AwaitingBase" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1583.93,327.28,1582.8634,317.4891,1581.4164,322.9577,1575.9478,321.5108,1583.93,327.28" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="109.9033" x="1570.0713" y="178.9669">wait for the base</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="237.0659" x="1506.49" y="194.0997">[the same, but the base is not main,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133.5293" x="1558.2583" y="209.2325">or a blocker is open]</text></g><!--link AwaitingBase to Implementing--><g class="link" data-entity-1="AwaitingBase" data-entity-2="Implementing" data-source-line="34" data-uid="lnk7" id="link_AwaitingBase_Implementing"><path d="M1489.79,378.07 C1467.77,386.67 1445.98,398.18 1428.39,413.53 C1405.04,433.93 1421.55,457.4 1396.39,475.53 C1356.45,504.34 1234.4843,517.9369 1145.9143,524.3469" fill="none" id="AwaitingBase-to-Implementing" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1139.93,524.78,1149.1953,528.1199,1144.917,524.4191,1148.6178,520.1408,1139.93,524.78" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.8423" x="1495.5358" y="426.5969">update onto the default branch</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="274.1362" x="1460.3888" y="441.7297">[the base is main, every blocker is closed,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="302.5293" x="1446.1922" y="456.8625">the head lacks the merge commit of the base]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="336.1338" x="1429.39" y="471.9953">/ cumin starts the Implementer in the same session</text></g><!--link AwaitingBase to Decision--><g class="link" data-entity-1="AwaitingBase" data-entity-2="Decision" data-source-line="35" data-uid="lnk8" id="link_AwaitingBase_Decision"><path d="M1731.14,378.02 C1748.09,386.6 1763.34,398.11 1774.39,413.53 C1790.45,435.93 1791.56,453.98 1774.39,475.53 C1755.96,498.67 1692.4057,511.9248 1633.5557,519.8948" fill="none" id="AwaitingBase-to-Decision" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1627.61,520.7,1637.0654,523.456,1632.5648,520.029,1635.9918,515.5283,1627.61,520.7" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="160.6782" x="1861.3432" y="426.5969">stop the implementation</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.0186" x="1830.173" y="441.7297">[the base closed without a merge,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="307.6646" x="1787.85" y="456.8625">or the base merged but the base branch stays]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.2075" x="1853.0785" y="471.9953">/ cumin comments, notifies</text></g><!--link Merging to Merging--><g class="link" data-entity-1="Merging" data-entity-2="Merging" data-source-line="36" data-uid="lnk9" id="link_Merging_Merging"><path d="M609.36,337.65 C629.84,339.61 644.12,344.57 644.12,352.53 C644.12,360.5 635.8127,364.8884 615.3327,366.8484" fill="none" id="Merging-to-Merging" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="609.36,367.42,618.7001,370.5444,614.3373,366.9437,617.938,362.5808,609.36,367.42" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="42.2563" x="799.6105" y="342.0969">merge</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="341.2373" x="650.12" y="357.2297">[not merged, the merge conditions hold, no conflict]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="246.1558" x="697.6608" y="372.3625">/ cumin merges the approved commit</text></g><!--link Merging to *end*--><g class="link" data-entity-1="Merging" data-entity-2=".end." data-source-line="37" data-uid="lnk11" id="link_Merging_.end."><path d="M417.72,378.1 C402.1,386.78 387.62,398.32 378.39,413.53 C357.69,447.68 368.9336,492.781 375.9336,514.041" fill="none" id="Merging-to-*end*" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="377.81,519.74,378.7947,509.9405,376.2463,514.9908,371.196,51