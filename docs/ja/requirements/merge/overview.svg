mmit,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="253.8364" x="147.0958" y="364.8625">after the last awaiting-merge-decision]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="336.1338" x="105.9471" y="379.9953">/ cumin starts the Implementer in the same session</text></g><!--link Merging to Merging--><g class="link" data-entity-1="Merging" data-entity-2="Merging" data-source-line="30" data-uid="lnk6" id="link_Merging_Merging"><path d="M711.36,337.65 C731.84,339.61 746.12,344.57 746.12,352.53 C746.12,360.5 737.8127,364.8884 717.3327,366.8484" fill="none" id="Merging-to-Merging" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="711.36,367.42,720.7001,370.5444,716.3373,366.9437,719.938,362.5808,711.36,367.42" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="42.2563" x="901.6105" y="342.0969">merge</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="341.2373" x="752.12" y="357.2297">[not merged, the merge conditions hold, no conflict]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="246.1558" x="799.6608" y="372.3625">/ cumin merges the approved commit</text></g><!--link Merging to *end*--><g class="link" data-entity-1="Merging" data-entity-2=".end." data-source-line="31" data-uid="lnk8" id="link_Merging_.end."><path d="M711.59,354.28 C835.51,357.42 1021.27,369.61 1075.39,413.53 C1108.51,440.41 1114.0562,490.175 1114.9962,513.285" fill="none" id="Merging-to-*end*" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1115.24,519.28,1118.8709,510.1249,1115.0368,514.2841,1110.8775,510.45,1115.24,519.28" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="