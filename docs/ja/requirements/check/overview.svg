<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="550px" preserveAspectRatio="none" style="width:798px;height:550px;background:#FFFFFF;" version="1.1" viewBox="0 0 798 550" width="798px" zoomAndPan="magnify"><defs/><g><g id="Implementing"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="178.7891" x="218.17" y="149.26"/><line style="stroke:#181818;stroke-width:0.5;" x1="218.17" x2="396.9591" y1="175.5569" y2="175.5569"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="97.1797" x="258.9747" y="167.2551">implementing</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="158.7891" x="223.17" y="191.6955">(the implementation area)</text></g><g id="Checking"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="241.7539" x="186.69" y="321.53"/><line style="stroke:#181818;stroke-width:0.5;" x1="186.69" x2="428.4439" y1="347.8269" y2="347.8269"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="62.6377" x="276.2481" y="339.5251">checking</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="221.7539" x="191.69" y="363.9655">do / GitHub runs the required checks</text></g><g id="Decision"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="177.582" x="78.78" y="493.79"/><line style="stroke:#181818;stroke-width:0.5;" x1="78.78" x2="256.362" y1="520.0869" y2="520.0869"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="122.3975" x="106.3723" y="511.7851">awaiting-decision</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="157.582" x="83.78" y="536.2255">do / the Assignee answers</text></g><g id="Reviewing"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="123.6582" x="490.74" y="493.79"/><line style="stroke:#181818;stroke-width:0.5;" x1="490.74" x2="614.3982" y1="520.0869" y2="520.0869"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="68.2568" x="518.4407" y="511.7851">reviewing</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="103.6582" x="495.74" y="536.2255">(the review area)</text></g><g id="MergeDecision"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="192.9561" x="211.09" y="7"/><line style="stroke:#181818;stroke-width:0.5;" x1="211.09" x2="404.0461" y1="33.2969" y2="33.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="172.9561" x="221.09" y="24.9951">awaiting-merge-decision</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="102.7148" x="216.09" y="49.4355">(the merge area)</text></g><!--link Implementing to Checking--><g class="link" data-entity-1="Implementing" data-entity-2="Checking" data-source-line="23" data-uid="lnk2" id="link_Implementing_Checking"><path d="M217.89,186.54 C165.51,195.11 106.61,208.99 90.57,229.53 C73.6,251.24 73.6,269.81 90.57,291.53 C103.42,307.98 137.8595,318.9587 180.3095,327.5587" fill="none" id="Implementing-to-Checking" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="186.19,328.75,178.1634,323.0426,181.2896,327.7572,176.575,330.8833,186.19,328.75" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.7476" x="115.707" y="257.5969">wait for the checks</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength