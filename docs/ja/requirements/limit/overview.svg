<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="357px" preserveAspectRatio="none" style="width:774px;height:357px;background:#FFFFFF;" version="1.1" viewBox="0 0 774 357" width="774px" zoomAndPan="magnify"><defs/><g><g id="Starting"><rect fill="#F1F1F1" height="64.2344" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="292.584" x="134.8" y="87"/><line style="stroke:#181818;stroke-width:0.5;" x1="134.8" x2="427.384" y1="113.2969" y2="113.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="106.4424" x="227.8708" y="104.9951">starting agents</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="272.584" x="139.8" y="129.4355">do / cumin starts the agent of each transition</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="119.6367" x="139.8" y="143.4043">that starts an agent</text></g><g id="Stopped"><rect fill="#F1F1F1" height="78.2031" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="331.3555" x="115.41" y="273.24"/><line style="stroke:#181818;stroke-width:0.5;" x1="115.41" x2="446.7655" y1="299.5369" y2="299.5369"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="145.8652" x="208.1551" y="291.2351">agent starts stopped</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="311.3555" x="120.41" y="315.6755">do / the running agents end; cumin starts no agent.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="164.2734" x="120.41" y="329.6443">Every issue keeps its state.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="220.7695" x="120.41" y="343.613">Transitions that start no agent go on</text></g><ellipse cx="281.09" cy="16" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><!--link *start* to Starting--><g class="link" data-entity-1=".start." data-entity-2="Starting" data-source-line="14" data-uid="lnk3" id="link_.start._Starting"><path d="M281.09,26.33 C281.09,39.93 281.09,59.82 281.09,80.65" fill="none" id="*start*-to-Starting" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="281.09,86.65,285.09,77.65,281.09,81.65,277.09,77.65,281.09,86.65" style="stroke:#181818;stroke-width:1;"/></g><!--link Starting to Stopped--><g class="link" data-entity-1="Starting" data-entity-2="Stopped" data-source-line="15" data-uid="lnk4" id="link_Starting_Stopped"><path d="M134.4,138.84 C84.84,148.4 38.19,162.15 23.09,181.24 C6,202.85 6.28,221.41 23.09,243.24 C36.1,260.12 67.2465,272.2155 109.2965,282.6455" fill="none" id="Starting-to-Stopped" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="115.12,284.09,107.3477,278.041,110.2671,282.8863,105.4217,285.8057,115.12,284.09" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="110.9443" x="75.4679" y="194.3069">stop agent starts</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.5869" x="58.6466" y="209.4397">[a usage is at its limit,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.7002" x="24.09" y="224.5725">or cumin cannot read the usage]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.8779" x="63.0011" y="239.7053">/ cumin notifies once</text></g><!--link Stopped to Starting--><g class="link" data-entity-1="Stopped" data-entity-2="Starting" data-source-line="16" data-uid="lnk5" id="link_Stopped_Starting"><path d="M279.1,272.81 C278.68,263.16 278.3,252.82 278.09,243.24 C277.49,215.69 277.42,208.78 278.09,181.24 C278.33,171.57 278.4788,167.0524 278.9588,157.5024" fill="none" id="Stopped-to-Starting" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="279.26,151.51,274.8133,160.2979,279.009,156.5037,282.8032,160.6994,279.26,151.51" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="131.8853" x="334.4511" y="201.8069">resume agent starts</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.6074" x="279.09" y="216.9397">[the Operator allows the 5-hour limit,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.4268" x="286.1803" y="232.0725">the weekly usage is under its limit]</text></g><!--link Stopped to Starting--><g class="link" data-entity-1="Stopped" data-entity-2="Starting" data-source-line="17" data-uid="lnk6" id="link_Stopped_Starting"><path d="M447.17,280.95 C483.55,270.85 514.67,258.26 526.09,243.24 C542.77,221.3 543.06,202.95 526.09,181.24 C512.57,163.92 477.9249,152.0562 433.6449,142.4962" fill="none" id="Stopped-to-Starting-1" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="427.78,141.23,435.7332,147.0392,432.6674,142.2852,437.4214,139.2194,427.78,141.23" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="131.8853" x="586.927" y="201.8069">resume agent starts</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.7451" x="546.9971" y="216.9397">[the time of the next try passed,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.3193" x="539.71" y="232.0725">both usages are under their limits]</text></g><!--SRC=[bLCzRzmm3DtzAuWi0OhpPSfo1GfqA99E0PfkPm-AJTl2sPGXqdNltvUI_75NTEbacHJv7X-V7g6Q1alvxFo58GVf45YC8BWcfS0AOzz0utpCcXP9mXql31FLcC8JQm9wE-Zr