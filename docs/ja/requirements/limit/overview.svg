<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="357px" preserveAspectRatio="none" style="width:826px;height:357px;background:#FFFFFF;" version="1.1" viewBox="0 0 826 357" width="826px" zoomAndPan="magnify"><defs/><g><g id="Starting"><rect fill="#F1F1F1" height="64.2344" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="292.584" x="134.8" y="87"/><line style="stroke:#181818;stroke-width:0.5;" x1="134.8" x2="427.384" y1="113.2969" y2="113.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="106.4424" x="227.8708" y="104.9951">starting agents</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="272.584" x="139.8" y="129.4355">do / cumin starts the agent of each transition</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="119.6367" x="139.8" y="143.4043">that starts an agent</text></g><g id="Stopped"><rect fill="#F1F1F1" height="78.2031" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="331.3555" x="115.41" y="273.24"/><line style="stroke:#181818;stroke-width:0.5;" x1="115.41" x2="446.7655" y1="299.5369" y2="299.5369"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="145.8652" x="208.1551" y="291.2351">agent starts stopped</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="311.3555" x="120.41" y="315.6755">do / the running agents end; cumin starts no agent.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="164.2734" x="120.41" y="329.6443">Every issue keeps its state.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="220.7695" x="120.41" y="343.613">Transitions that start no agent go on</text></g><ellipse cx="281.09" cy="16" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><!--link *start* to Starting--><g class="link" data-entity-1=".start." data-entity-2="Starting" data-source-line="14" data-uid="lnk3" id="link_.start._Starting"><path d="M281.09,26.33 C281.09,39.93 281.09,59.82 281.09,80.65" fill="none" id="*start*-to-Starting" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="281.09,86.65,285.09,77.65,281.09,81.65,277.09,77.65,281.09,86.65" style="stroke:#181818;stroke-width:1;"/></g><!--link Starting to Stopped--><g class="link" data-entity-1="Starting" data-entity-2="Stopped" data-source-line="15" data-uid="lnk4" id="link_Starting_Stopped"><path d="M134.4,138.84 C84.84,148.4 38.19,162.15 23.09,181.24 C6,202.85 6.28,221.41 23.09,243.24 C36.1,260.12 67.2465,272.2155 109.2965,282.6455" fill="none" id="Starting-to-Stopped" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="115.12,284.09,107.3477,278.041,110.2671,282.8863,105.4217,285.8057,115.12,284.09" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="110.9443" x="75.4679" y="194.3069">stop agent starts</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.4995" x="42.1903" y="209.4397">[a usage is at its threshold,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.7002" x="24.09" y="224.5725">or cumin cannot read the usage]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.8779" x="63.0011" y="239.7053">/ cumin notifies once</text></g><!--link Stopped to Starting--><g class="link" data-entity-1="Stopped" data-entity-2="Starting" data-source-line="16" data-uid="lnk5" id="link_Stopped_Starting"><path d="M279.1,272.81 C278.68,263.16 278.3,252.82 278.09,243.24 C277.49,215.69 277.42,208.78 278.09,181.24 C278.33,171.57 278.4788,167.0524 278.9588,157.5024" fill="none" id="Stopped-to-Starting" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="279.26,151.51,274.8133,160.2979,279.009,156.5037,282.8032,160.6994,279.26,151.51" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="131.8853" x="343.8171" y="201.8069">resume agent starts</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.6074" x="288.456" y="216.9397">[the Operator allows the 5-hour limit,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261.3394" x="279.09" y="232.0725">the weekly usage is under its threshold]</text></g><!--link Stopped to Starting--><g class="link" data-entity-1="Stopped" data-entity-2="Starting" data-source-line="17" data-uid="lnk6" id="link_Stopped_Starting"><path d="M447.02,285.42 C491.63,274.9 531.36,260.96 545.09,243.24 C561.97,221.45 562.24,202.81 545.09,181.24 C529.25,161.3 485.502,148.3799 433.472,138.8599" fill="none" id="Stopped-to-Starting-1" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="427.57,137.78,435.7031,143.3345,432.4883,138.6799,437.143,135.4652,427.57,137.78" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="131.8853" x="622.5233" y="201.8069">resume agent starts</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205.3403" x="585.7958" y="216.9397">[cumin reads the usages again,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.2319" x="558.85" y="232.0725">both usages are under their thresholds]</text></g><!--SRC=[bPCzZzim38Pt_mhYbWEAE3TrIO427OfUfmFQRh47dStOGcpA4AaQ-VUb97yaHPTEbacHVFYIUeOcZ9RAsVahGmdI8x0OGN2Nx08hZCC5Biudh-cG9DxnmX2enMmEh0u