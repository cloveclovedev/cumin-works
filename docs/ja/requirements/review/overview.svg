<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="444px" preserveAspectRatio="none" style="width:1554px;height:444px;background:#FFFFFF;" version="1.1" viewBox="0 0 1554 444" width="1554px" zoomAndPan="magnify"><defs/><g><g id="Checking"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="178.7891" x="533" y="7"/><line style="stroke:#181818;stroke-width:0.5;" x1="533" x2="711.7891" y1="33.2969" y2="33.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="62.6377" x="591.0757" y="24.9951">checking</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="158.7891" x="538" y="49.4355">(the implementation area)</text></g><g id="Reviewing"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="274.7305" x="485.03" y="182.63"/><line style="stroke:#181818;stroke-width:0.5;" x1="485.03" x2="759.7605" y1="208.9269" y2="208.9269"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="68.2568" x="588.2668" y="200.6251">reviewing</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="254.7305" x="490.03" y="225.0655">do / the Reviewer reviews the pull request</text></g><g id="Implementing"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="178.7891" x="7" y="388.26"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="185.7891" y1="414.5569" y2="414.5569"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="97.1797" x="47.8047" y="406.2551">implementing</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="158.7891" x="12" y="430.6955">(the implementation area)</text></g><g id="Decision"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="177.582" x="533.6" y="388.26"/><line style="stroke:#181818;stroke-width:0.5;" x1="533.6" x2="711.182" y1="414.5569" y2="414.5569"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="122.3975" x="561.1923" y="406.2551">awaiting-decision</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="157.582" x="538.6" y="430.6955">do / the Assignee answers</text></g><g id="Merge"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="274.7207" x="1045.03" y="388.26"/><line style="stroke:#181818;stroke-width:0.5;" x1="1045.03" x2="1319.7507" y1="414.5569" y2="414.5569"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="254.7207" x="1055.03" y="406.2551">merging or awaiting-merge-decision</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="102.7148" x="1050.03" y="430.6955">(the merge area)</text></g><!--link Checking to Reviewing--><g class="link" data-entity-1="Checking" data-entity-2="Reviewing" data-source-line="23" data-uid="lnk2" id="link_Checking_Reviewing"><path d="M532.69,57.53 C519.5,64.97 507.62,74.66 499.39,87.26 C487.98,104.76 489.03,116.13 499.39,134.26 C511.51,155.46 527.2021,168.2824 548.4521,179.4824" fill="none" id="Checking-to-Reviewing" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="553.76,182.28,547.6632,174.5451,549.3368,179.9487,543.9331,181.6222,553.76,182.28" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="122.5796" x="538.2919" y="100.3269">request the review</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.3833" x="500.39" y="115.4597">[every required check passed]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.5054" x="509.829" y="130.5925">/ cumin starts the Reviewer</text></g><!--link Reviewing to Checking--><g class="link" data-entity-1="Reviewing" data-entity-2="Checking" data-source-line="25" data-uid="lnk4" id="link_Reviewing_Checking"><path d="M661.83,182.4 C677.89,170.14 694.69,153.73 703.39,134.26 C711.92,115.19 713.24,105.69 703.39,87.26 C696.94,75.18 691.3932,68.7453 680.0832,60.9153" fill="none" id="Reviewing-to-Checking" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="675.15,57.5,680.2729,65.9117,679.261,60.346,684.8266,59.3341,675.15,57.5" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.8477" x="842.6516" y="100.3269">go back to the checks</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="405.5708" x="711.29" y="115.4597">[the Reviewer run has ended, and: the head commit changed,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="306.1982" x="760.9763" y="130.5925">or APPROVE but a required check did not pass]</text></g><!--link Reviewing to Implementing--><g class="link" data-entity-1="Reviewing" data-entity-2="Implementing" data-source-line="24" data-uid="lnk3" id="link_Reviewing_Implementing"><path d="M484.61,209.94 C351.14,214.2 161.74,229.53 111.39,281.26 C84.06,309.34 85.6115,352.4938 90.2815,381.9838" fill="none" id="Reviewing-to-Implementing" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="91.22,387.91,93.7631,378.3951,90.438,382.9715,85.8615,379.6464,91.22,387.91" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.2256" x="212.2577" y="294.3269">request a review fix</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="328.9609" x="112.39" y="309.4597">[the Reviewer run has ended, REQUEST_CHANGES</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.4966" x="156.1222" y="324.5925">on the head commit, below the limit]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.8965" x="175.4222" y="339.7253">/ cumin starts the Implementer</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.105" x="212.318" y="354.8581">in the same session</text></g><!--link Reviewing to Reviewing--><g class="link" data-entity-1="Reviewing" data-entity-2="Reviewing" data-source-line="26" data-uid="lnk5" id="link_Reviewing_Reviewing"><path d="M759.99,199.49 C780.71,200.77 794.76,203.53 794.76,207.76 C794.76,212 786.6986,214.39 765.9786,215.67" fill="none" id="Reviewing-to-Reviewing" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="759.99,216.04,769.2195,219.4775,764.9805,215.7317,768.7262,211.4927,759.99,216.04" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.7476" x="919.604" y="189.8269">request the review again</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="400.4355" x="800.76" y="204.9597">[the Reviewer run has ended, no review on the head commit,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="148.7319" x="926.6118" y="220.0925">no question, first time]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="219.6733" x="891.1411" y="235.2253">/ cumin starts the Reviewer again</text></g><!--link Reviewing to Reviewing--><g class="link" data-entity-1="Reviewing" data-entity-2="Reviewing" data-source-line="27" data-uid="lnk6" id="link_Reviewing_Reviewing"><path d="M760.22,193.28 C935.5,185.34 1206.76,190.17 1206.76,207.76 C1206.76,225.36 941.4939,230.4615 766.2139,222.5215" fill="none" id="Reviewing-to-Reviewing-1" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="760.22,222.25,769.0298,226.6532,765.2149,222.4763,769.3918,218.6614,760.22,222.25" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="117.4253" x="1318.5278" y="182.3269">request the cause</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="328.9609" x="1212.76" y="197.4597">[the Reviewer run has ended, REQUEST_CHANGES</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.9395" x="1272.7707" y="212.5925">at the limit, no cause comment]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.5054" x="1287.4878" y="227.7253">/ cumin starts the Reviewer</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.105" x="1312.688" y="242.8581">in the same session</text></g><!--link Reviewing to Decision--><g class="link" data-entity-1="Reviewing" data-entity-2="Decision" data-source-line="28" data-uid="lnk7" id="link_Reviewing_Decision"><path d="M523.43,233.37 C499.82,244.12 477.42,259.45 463.39,281.26 C444.88,310.05 443.47,330.44 463.39,358.26 C479.77,381.14 500.6341,392.8103 527.4541,400.5303" fill="none" id="Reviewing-to-Decision" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="533.22,402.19,525.6776,395.8566,528.4151,400.8069,523.4647,403.5444,533.22,402.19" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="145.6279" x="526.9239" y="309.3269">stop at the round limit</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.6958" x="464.39" y="324.4597">[the Reviewer wrote the cause comment]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.4072" x="549.5343" y="339.5925">/ cumin notifies</text></g><!--link Reviewing to Decision--><g class="link" data-entity-1="Reviewing" data-entity-2="Decision" data-source-line="29" data-uid="lnk8" id="link_Reviewing_Decision"><path d="M686.53,233.29 C707.17,244.6 727.71,260.28 739.39,281.26 C756.04,311.16 757.83,329.43 739.39,358.26 C731.44,370.71 725.0072,377.3419 712.1272,384.7719" fill="none" id="Reviewing-to-Decision-1" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="706.93,387.77,716.7246,386.7377,711.261,385.2716,712.7271,379.808,706.93,387.77" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.9531" x="884.3625" y="294.3269">stop the review</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="362.5781" x="753.55" y="309.4597">[the Reviewer run has ended, and: the Reviewer asked,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="181.3589" x="844.1596" y="324.5925">or no review after the retry,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309.9878" x="779.8452" y="339.7253">or not exactly one risk label, or no pull request]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.4072" x="884.6354" y="354.8581">/ cumin notifies</text></g><!--link Reviewing to Merge--><g class="link" data-entity-1="Reviewing" data-entity-2="Merge" data-source-line="30" data-uid="lnk9" id="link_Reviewing_Merge"><path d="M759.97,213.88 C888.48,221.24 1068.62,238.96 1124.39,281.26 C1158.61,307.21 117