<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="445px" preserveAspectRatio="none" style="width:1461px;height:445px;background:#FFFFFF;" version="1.1" viewBox="0 0 1461 445" width="1461px" zoomAndPan="magnify"><defs/><g><g id="Checking"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="178.7891" x="545" y="7"/><line style="stroke:#181818;stroke-width:0.5;" x1="545" x2="723.7891" y1="33.2969" y2="33.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="62.6377" x="603.0757" y="24.9951">checking</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="158.7891" x="550" y="49.4355">(the implementation area)</text></g><g id="Reviewing"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="274.7305" x="497.03" y="175.13"/><line style="stroke:#181818;stroke-width:0.5;" x1="497.03" x2="771.7605" y1="201.4269" y2="201.4269"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="68.2568" x="600.2668" y="193.1251">reviewing</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="254.7305" x="502.03" y="217.5655">do / the Reviewer reviews the pull request</text></g><g id="Implementing"><rect fill="#EEEEEE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="178.7891" x="7" y="381.42"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="185.7891" y1="407.7169" y2="407.7169"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="97.1797" x="47.8047" y="399.4151">implementing</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="158.7891" x="12" y="423.8555">(the implementation area)</text></g><g id="Decision"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="177.582" x="545.6" y="381.42"/><line style="stroke:#181818;stroke-width:0.5;" x1="545.6" x2="723.182" y1="407.7169" y2="407.7169"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="122.3975" x="573.1923" y="399.4151">awaiting-decision</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="157.582" x="550.6" y="423.8555">do / the Assignee answers</text></g><g id="Merge"><rect fill="#EEEEEE" height="66.5625" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="264.8496" x="1083.97" y="373.27"/><line style="stroke:#181818;stroke-width:0.5;" x1="1083.97" x2="1348.8196" y1="415.8638" y2="415.8638"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="244.8496" x="1093.97" y="391.2651">merging, awaiting-merge-decision,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="185.5342" x="1093.97" y="407.562">or awaiting-blocker-merge</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="102.7148" x="1088.97" y="432.0024">(the merge area)</text></g><!--link Checking to Reviewing--><g class="link" data-entity-1="Checking" data-entity-2="Reviewing" data-source-line="23" data-uid="lnk2" id="link_Checking_Reviewing"><path d="M544.63,52.34 C527.2,60.27 511.06,71.46 500.39,87.27 C488.71,104.58 489.31,116.56 500.39,134.27 C511.58,152.13 523.8754,162.4929 542.7254,172.0229" fill="none" id="Checking-to-Reviewing" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="548.08,174.73,541.8529,167.0996,543.6179,172.4741,538.2434,174.239,548.08,174.73" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="122.5796" x="550.7716" y="100.3369">request the review</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.3428" x="501.39" y="115.4697">[every required check completed]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.5054" x="522.3087" y="130.6025">/ cumin starts the Reviewer</text></g><!--link Reviewing to Checking--><g class="link" data-entity-1="Reviewing" data-entity-2="Checking" data-source-line="25" data-uid="lnk4" id="link_Reviewing_Checking"><path d="M687.24,174.8 C703.07,164.65 718.56,151.21 727.39,134.27 C737.05,115.74 737.81,105.38 727.39,87.27 C720.32,74.96 714.3171,68.4031 702.2371,60.7431" fill="none" id="Reviewing-to-Checking" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="697.17,57.53,702.6286,65.7278,701.3926,60.2076,706.9128,58.9716,697.17,57.53" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.8477" x="867.2816" y="100.3369">go back to the checks</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="405.5708" x="735.92" y="115.4697">[the Reviewer run has ended, and: the head commit changed,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="377.3301" x="750.0404" y="130.6025">or APPROVE but the required checks have not completed]</text></g><!--link Reviewing to Implementing--><g class="link" data-entity-1="Reviewing" data-entity-2="Implementing" data-source-line="24" data-uid="lnk3" id="link_Reviewing_Implementing"><path d="M496.81,209.54 C350.7,219.69 137.06,238.97 110.39,266.27 C80.84,296.51 83.9219,344.0877 89.6119,375.2377" fill="none" id="Reviewing-to-Implementing" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="90.69,381.14,93.0077,371.5677,89.7915,376.2214,85.1379,373.0053,90.69,381.14" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.2256" x="206.1827" y="279.3369">request a review fix</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="318.811" x="111.39" y="294.4697">[the review completed with REQUEST_CHANGES,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.7148" x="219.9381" y="309.6025">below the limit]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.8965" x="169.3473" y="324.7353">/ cumin starts the Implementer</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.105" x="206.243" y="339.8681">in the same session</text></g><!--link Reviewing to Reviewing--><g class="link" data-entity-1="Reviewing" data-entity-2="Reviewing" data-source-line="26" data-uid="lnk5" id="link_Reviewing_Reviewing"><path d="M771.99,185 C792.71,187.36 806.76,192.45 806.76,200.27 C806.76,208.09 798.6718,212.5038 777.9518,214.8538" fill="none" id="Reviewing-to-Reviewing" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="771.99,215.53,781.3834,218.4903,776.9581,214.9665,780.4819,210.5412,771.99,215.53" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.7476" x="931.604" y="182.3369">request the review again</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="400.4355" x="812.76" y="197.4697">[the Reviewer run has ended, no review on the head commit,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="148.7319" x="938.6118" y="212.6025">no question, first time]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="219.6733" x="903.1411" y="227.7353">/ cumin starts the Reviewer again</text></g><!--link Reviewing to Decision--><g class="link" data-entity-1="Reviewing" data-entity-2="Decision" data-source-line="27" data-uid="lnk6" id="link_Reviewing_Decision"><path d="M504.23,225.75 C484.24,235.19 466.07,248.24 453.39,266.27 C433.71,294.26 433.52,315.41 453.39,343.27 C474.53,372.89 504.8644,387.175 539.3344,395.415" fill="none" id="Reviewing-to-Decision" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="545.17,396.81,537.3466,390.8271,540.307,395.6475,535.4866,398.6079,545.17,396.81" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="145.6279" x="538.9154" y="286.8369">stop at the round limit</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="314.6787" x="454.39" y="301.9697">[the review completed with REQUEST_CHANGES</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="76.3306" x="573.5641" y="317.1025">at the limit]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.4072" x="561.5257" y="332.2353">/ cumin notifies</text></g><!--link Reviewing to Decision--><g class="link" data-entity-1="Reviewing" data-entity-2="Decision" data-source-line="28" data-uid="lnk7" id="link_Reviewing_Decision"><path d="M725.29,225.87 C744.31,235.36 762.02,248.4 773.39,266.27 C791.77,295.14 792,314.54 773.39,343.27 C761.61,361.47 748.5496,371.868 728.8496,381.038" fill="none" id="Reviewing-to-Decision-1" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="723.41,383.57,733.2574,383.3983,727.943,381.46,729.8813,376.1456,723.41,383.57" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.9531" x="919.0725" y="279.3369">stop the review</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="362.5781" x="788.26" y="294.4697">[the Reviewer run has ended, and: the Reviewer asked,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="181.3589" x="878.8696" y="309.6025">or no review after the retry,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309.9878" x="814.5552" y="324.7353">or not exactly one risk label, or no pull request]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.4072" x="919.3454" y="339.8681">/ cumin notifies</text></g><!--link Reviewing to Merge--><g class="link" data-entity-1="Reviewing" data-entity-2="Merge" data-source-line="29" data-uid="lnk8" id="link_Reviewing_Merge"><path d="M772.11,202.89 C906.96,207.14 1100.48,221.22 1159.39,266.27 C1192.81,291.82 1205.6958,334.4116 1211.4358,366.8916" fill="none" id="Reviewing-to-Merge" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1212.48,372.8,1214.8527,363.2412,1211.6099,367.8763,1206.9748,364.6334,1212.48,372.8" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="247.8442" x="1205.78" y="301.8369">[the review completed with APPROVE,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.6509" x="1225.8767" y="316.9697">the required checks completed]</text></g><!--SRC=[bLLDRzim3BtxLn3PeHkGZtiE0u8kQ7VOrgNRBainA1PZ2x6bJ9Jh-j-FaYp72Ogsww6mAV6zHpxIkOAygPMUjSOU26RWIWHomY61sOFGeEfZXJLgZYd3hqGDWjBXeiL7XQs_N-0yku9LJELB8A0IEwo0KswKksrsKsYjSWurjCgLfd4m2SmBdzBGOZA7YJImc029Zg0j3KHDFLT0ZYJE2asgbvDWbo3o4FfTDCBA1rWmXd2nF906QSwfXHLTBvBL6LqGECDb6gQm82mAJx51BT4kmJOQABVgw6XXGsmcbM2CckPK0gE7BXZZVBDYHuw6fHdRpREiL181wwFhG6B4OO5P5ladUOdvGUbY0eBWkd-1T-lmbms19Rpto1S-UAaV1gXeHCBQfBTiU68KtzoWCGQvt9X58NXigee3VniaDy0Ed0dvyo