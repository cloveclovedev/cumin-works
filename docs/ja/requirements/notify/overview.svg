<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="344px" preserveAspectRatio="none" style="width:1090px;height:344px;background:#FFFFFF;" version="1.1" viewBox="0 0 1090 344" width="1090px" zoomAndPan="magnify"><defs/><g><!--entity Decide--><g class="entity" data-entity="Decide" data-source-line="6" data-uid="ent0002" id="entity_Decide"><rect fill="#F1F1F1" height="68.8906" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="358.3447" x="7" y="7"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="177.29" x="17" y="29.9951">a person needs to decide</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="338.3447" x="17" y="46.292">(awaiting-plan-review, awaiting-merge-decision,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="282.1738" x="17" y="62.5889">awaiting-acceptance, awaiting-decision)</text></g><!--entity Wrong--><g class="entity" data-entity="Wrong" data-source-line="7" data-uid="ent0003" id="entity_Wrong"><rect fill="#F1F1F1" height="85.1875" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="357.8799" x="7.23" y="110.85"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="137.7373" x="17.23" y="133.8451">something is wrong</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="310.7822" x="17.23" y="150.142">(a label it does not take, no single Assignee,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="337.8799" x="17.23" y="166.4389">an issue it cannot read whole, an unread usage,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="218.3398" x="17.23" y="182.7357">a failed tool check, failed polls)</text></g><!--entity Limit--><g class="entity" data-entity="Limit" data-source-line="8" data-uid="ent0004" id="entity_Limit"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="187.624" x="92.36" y="231.29"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="167.624" x="102.36" y="254.2851">a usage limit is reached</text></g><!--entity Waits--><g class="entity" data-entity="Waits" data-source-line="9" data-uid="ent0005" id="entity_Waits"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="167.3076" x="102.52" y="302.29"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="147.3076" x="112.52" y="325.2851">no issue to take next</text></g><!--entity Notify--><g class="entity" data-entity="Notify" data-source-line="11" data-uid="ent0006" id="entity_Notify"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="246.2969" x="426.34" y="175.14"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="82.9473" x="436.34" y="198.1351">notify once:</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="226.2969" x="436.34" y="214.432">a link and one line of the reason</text></g><!--entity GitHub--><g class="entity" data-entity="GitHub" data-source-line="12" data-uid="ent0007" id="entity_GitHub"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="229.5693" x="854.64" y="175.14"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="209.5693" x="864.64" y="198.1351">the issue and the pull request</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="197.4629" x="864.64" y="214.432">hold the details and the talk</text></g><!--link Decide to Notify--><g class="link" data-entity-1="Decide" data-entity-2="Notify" data-source-line="14" data-uid="lnk8" id="link_Decide_Notify"><path d="M320.31,76.32 C335.7,81.51 351,87.24 365.34,93.44 C417.69,116.09 468.559,147.4249 504.629,171.3349" fill="none" id="Decide-to-Notify" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="509.63,174.65,504.3385,166.3434,505.4625,171.8874,499.9184,173.0114,509.63,174.65" style="stroke:#181818;stroke-width:1;"/></g><!--link Wrong to Notify--><g class="link" data-entity-1="Wrong" data-entity-2="Notify" data-source-line="15" data-uid="lnk9" id="link_Wrong_Notify"><path d="M365.45,177.13 C385.92,179.84 400.4722,181.78 419.9722,184.37" fill="none" id="Wrong-to-Notify" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="425.92,185.16,417.525,180.0098,420.9635,184.5017,416.4717,187.9402,425.92,185.16" style="stroke:#181818;stroke-width:1;"/></g><!--link Limit to Notify--><g class="link" data-entity-1="Limit" data-entity-2="Notify" data-source-line="16" data-uid="lnk10" id="link_Limit_Notify"><path d="M280.22,237.08 C324.65,231.18 372.4723,224.8307 420.1623,218.4907" fill="none" id="Limit-to-Notify" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="426.11,217.7,416.6614,214.9209,421.1536,218.3589,417.7156,222.8512,426.11,217.7" style="stroke:#181818;stroke-width:1;"/></g><!--link Waits to Notify--><g class="link" data-entity-1="Waits" data-entity-2="Notify" data-source-line="17" data-uid="lnk11" id="link_Waits_Notify"><path d="M270.25,308.32 C300.58,302.8 334.89,295.26 365.34,285.44 C412.12,270.35 457.3749,249.2558 493.5149,230.8258" fill="none" id="Waits-to-Notify" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="498.86,228.1,489.0252,228.6253,494.4058,230.3715,492.6595,235.7521,498.86,228.1" style="stroke:#181818;stroke-width:1;"/></g><!--link Notify to GitHub--><g class="link" data-entity-1="Notify" data-entity-2="GitHub" data-source-line="18" data-uid="lnk12" id="link_Notify_GitHub"><path d="M673.06,201.44 C730.39,201.44 792.24,201.44 848.45,201.44" fill="none" id="Notify-to-GitHub" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="854.45,201.44,845.45,197.44,849.45,201.44,845.45,205.44,854.45,201.44" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="120.6626" x="703.64" y="197.5069">the reader goes to</text></g><!--SRC=[LL8nZjmm3Epz2kAQIu3rfjyYG804boAu8asQRNGIroOiYpvHZdE_3od12szZo-FXS3ZKC_XrfjHld2U17hOHKuCWSQ4RePpXX_CZUBSA0icE1-3ayTmzmszC0VC5yff0VAQbo9TSiJwG6xARvImZk09bHCZC1VZMphYmKE7ySUwwY3TbC6GQnWA1Clf2dBhE3YuD4U79mO9PMCqX1Z5sG4y1h-cJsnmLIaE_H9VwZ7y9jnFSqHdpWBsnHKLFrtJ_uxp7HHjuFD1tukSdS0BVQvEZ4U4PowXCIsJBd0Qp0D6zOGHI-umrAIXkKjt485GhludGeExDGT9YMT7utYLZPtH1Ty3Hl2HOKmLMSKCjW9kZgCaNvWX-H3-TTcZX6AMv_MDs7bEh2X1frbPgM5MrEbJsBmEFRFNQR6cwvbwp_bUQi8OZtIDNxy97lGaNynSfJMhSxeQrqyTzqqxNLbLUQyrHnGYjfPNQrxB6g3NlAqgv9isZmG6BJYjtMd5ngfelL7wkRrtN5WLz_tLlKyCu0dNU1uPDTGJQgo9D5oxx37gdOR3L5kx-0m00]--></g></svg>