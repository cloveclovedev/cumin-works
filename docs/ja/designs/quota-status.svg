.6289" x="223.8418" y="663.1035">&lt;repository&gt; #&lt;issue&gt; &lt;status label&gt;, one line for each issue</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="12.2754" x="223.8418" y="677.0723">or</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="29.9355" x="223.8418" y="691.041">none</text><rect fill="#F1F1F1" height="75.875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="402.6289" x="213.8418" y="723.8711"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="149.1152" x="223.8418" y="745.0098">Waiting for a Maintainer:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="382.6289" x="223.8418" y="758.9785">&lt;repository&gt; #&lt;issue&gt; &lt;status label&gt;, one line for each issue</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="12.2754" x="223.8418" y="772.9473">or</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="29.9355" x="223.8418" y="786.916">none</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="228.5" x="300.9063" y="868.1484"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="132.8262" x="310.9063" y="889.2871">Repositories not read:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="208.5" x="310.9063" y="903.2559">&lt;repository&gt;: not read: &lt;reason&gt;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="136.4648" x="310.9063" y="917.2246">(the exit code is not 0)</text><polygon fill="#F1F1F1" points="341.6931,819.7461,488.6194,819.7461,500.6194,831.7461,488.6194,843.7461,341.6931,843.7461,329.6931,831.7461,341.6931,81