ect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="431.791" x="11" y="219.875"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="114.2578" x="21" y="241.0137">agent starts: go on</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="12.2754" x="21" y="254.9824">or</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="411.791" x="21" y="268.9512">agent starts: stopped by the &lt;window&gt; window, next try at &lt;time&gt;</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="281.252" x="462.791" y="137.9688"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="73.7578" x="472.791" y="159.1074">not read yet</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="261.252" x="472.791" y="173.0762">(no line of a window, no line "agent starts")</text><polygon fill="#F1F1F1" points="415.1563,287.7813,427.1563,299.7813,415.1563,311.7813,403.1563,299.7813,415.1563,287.7813" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="341.2168" x="244.5479" y="380.1836"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="31.3242" x="254.5479" y="401.3223">Stop:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="321.2168" x="254.5479" y="415.291">stopping after the current runs, requested at &lt;time&gt;</text><polygon fill="#F1F1F1" points="298.1631,331.7813,532.1494,331.7813,544.1494,343.7813,532.1494,355.7813,298.1631,355.7813,286.1631,343.7813,298.1631,331.7813" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-si