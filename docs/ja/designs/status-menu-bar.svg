.7539 A2.5,2.5 0 0 0 6,362.2539" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M132.1426,359.7539 L132.1426,367.2539 A2.5,2.5 0 0 0 134.6426,369.7539 L142.1426,369.7539" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="104.3643" x="16" y="382.749">status-bar.json</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="116.1426" x="16" y="399.0459">~/.config/cumin/</text></g><!--entity app--><g class="entity" data-entity="app" data-source-line="14" data-uid="ent0008" id="entity_app"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="168.4902" x="357.83" y="359.7539"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="148.4902" x="367.83" y="382.749">menu bar app (Swift)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="114.5293" x="367.83" y="399.0459">tools/status-bar/</text></g><!--entity bar--><g class="entity" data-entity="bar" data-source-line="15" data-uid="ent0009" id="entity_bar"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="141.9395" x="243.1" y="563.4539"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="121.9395" x="253.1" y="586.449">macOS menu bar</text></g><!--entity statuscmd--><g class="entity" data-entity="statuscmd" data-source-line="16" data-uid="ent0010" id="entity_statuscmd"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="145.2275" x="177.46" y="367.9039"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="125.2275" x="187.46" y="390.899">cumin status (Go)</text></g><g class="entity" data-entity="GMN27" data-source-line="29" data-uid="ent0028" id="entity_GMN27"><path d="M560.94,335.6539 L560.94,436.4508 L851.2012,436.4508 L851.2012,345.6539 L841.2012,335.6539 L560.94,335.6539" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M841.2012,335.6539 L841.2012,345.6539 L851.2012,345.6539 L841.2012,335.6539" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="269.2612" x="566.94" y="352.7208">The only contract between the two parts.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183.7646" x="566.94" y="367.8536">cumin run is the only writer.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201.2588" x="566.94" y="382.9864">cumin run never reads the file.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258.7939" x="566.94" y="398.1193">cumin status reads it for its report only.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.5566" x="566.94" y="413.2521">No token, key, webhook address,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115.6606" x="566.94" y="428.3849">or usage number.</text></g><g class="entity" data-entity="GMN30" data-source-line="38" data-uid="ent0031" id="entity_GMN30"><path d="M441.12,561.4639 L441.12,601.7295 L689.0297,601.7295 L689.0297,571.4639 L679.0297,561.4639 L441.12,561.4639" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M679.0297,561.4639 L679.0297,571.4639 L689.0297,571.4639 L679.0297,561.4639" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.9097" x="447.12" y="578.5308">No network call, no Keychain read,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.2485" x="447.12" y="593.6636">no third-party dependency.</text></g><!--reverse link github to run--><g class="link" data-entity-1="github" data-entity-2="run" data-source-line="18" data-uid="lnk12" id="link_github_run"><path d="M325.7,30.9139 C343.5,30.9139 358.94,30.9139 378.87,30.9139" fill="none" id="github-backto-run" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="319.7,30.9139,328.7,34.9139,324.7,30.9139,328.7,26.9139,319.7,30.9139" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="23.4292" x="337.77" y="23.9808">poll</text></g><!--link run to status--><g class="link" data-entity-1="run" data-entity-2="status" data-source-line="19" data-uid="lnk13" id="link_run_status"><path d="M442.07,49.4039 C442.07,79.4239 442.07,134.8639 442.07,169.7239" fill="none" id="run-to-status" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="442.07,175.7239,446.07,166.7239,442.07,170.7239,438.07,166.7239,442.07,175.7239" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="145.2915" x="443.07" y="97.1308">write a temporary file,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="88.2959" x="471.5678" y="112.2636">then rename:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="103.5366" x="463.9474" y="127.3964">after every poll,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="121.8687" x="454.7814" y="142.5293">at the end of a run</text></g><!--reverse link status to app--><g class="link" data-entity-1="status" data-entity-2="app" data-source-line="20" data-uid="lnk15" id="link_status_app"><path d="M442.07,235.0039 C442.07,269.6339 442.07,324.9739 442.07,359.5339" fill="