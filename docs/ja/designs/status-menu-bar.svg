.7539 A2.5,2.5 0 0 0 6,407.2539" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M132.1426,404.7539 L132.1426,412.2539 A2.5,2.5 0 0 0 134.6426,414.7539 L142.1426,414.7539" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="104.3643" x="16" y="427.749">status-bar.json</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="116.1426" x="16" y="444.0459">~/.config/cumin/</text></g><!--entity app--><g class="entity" data-entity="app" data-source-line="14" data-uid="ent0008" id="entity_app"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="168.4902" x="357.83" y="404.7539"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="148.4902" x="367.83" y="427.749">menu bar app (Swift)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="114.5293" x="367.83" y="444.0459">tools/status-bar/</text></g><!--entity bar--><g class="entity" data-entity="bar" data-source-line="15" data-uid="ent0009" id="entity_bar"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="141.9395" x="243.1" y="608.4539"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="121.9395" x="253.1" y="631.449">macOS menu bar</text></g><!--entity statuscmd--><g class="entity" data-entity="statuscmd" data-source-line="16" data-uid="ent0010" id="entity_statuscmd"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="145.2275" x="177.46" y="412.9039"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="125.2275" x="187.46" y="435.899">cumin status (Go)</text></g><g class="entity" data-entity="GMN27" data-source-line="29" data-uid="ent0028" id="entity_GMN27"><path d="M560.94,380.6539 L560.94,481.4508 L851.2012,481.4508 L851.2012,390.6539 L841.2012,380.6539 L560.94,380.6539" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M841.2012,380.6539 L841.2012,390.6539 L851.2012,390.6539 L841.2012,380.6539" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="269.2612" x="566.94" y="397.7208">The only contract between the two parts.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183.7646" x="566.94" y="412.8536">cumin run is the only writer.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201.2588" x="566.94" y="427.9864">cumin run never reads the file.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258.7939" x="566.94" y="443.1193">cumin status reads it for its report only.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.5566" x="566.94" y="458.2521">No token, key, webhook address,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115.6606" x="566.94" y="473.3849">or usage number.</text></g><g class="entity" data-entity="GMN30" data-source-line="38" data-uid="ent0031" id="entity_GMN30"><path d="M441.12,606.4639 L441.12,646.7295 L689.0297,646.7295 L689.0297,616.4639 L679.0297,606.4639 L441.12,606.4639" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M679.0297,606.4639 L679.0297,616.4639 L689.0297,616.4639 L679.0297,606.4639" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.9097" x="447.12" y="623.5308">No network call, no Keychain read,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.2485" x="447.12" y="638.6636">no third-party dependency.</text></g><!--reverse link github to run--><g class="link" data-entity-1="github" data-entity-2="run" data-source-line="18" data-uid="lnk12" id="link_github_run"><path d="M325.7,30.9139 C343.5,30.9139 358.94,30.9139 378.87,30.9139" fill="none" id="github-backto-run" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="319.7,30.9139,328.7,34.9139,324.7,30.9139,328.7,26.9139,319.7,30.9139" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="23.4292" x="337.77" y="23.9808">poll</text></g><!--link run to status--><g class="link" data-entity-1="run" data-entity-2="status" data-source-line="19" data-uid="lnk13" id="link_run_status"><path d="M442.07,49.2639 C442.07,84.5139 442.07,158.6639 442.07,199.8639" fill="none" id="run-to-status" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="442.07,205.8639,446.07,196.8639,442.07,200.8639,438.07,196.8639,442.07,205.8639" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="145.2915" x="458.4155" y="97.1308">write a temporary file,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="88.2959" x="486.9133" y="112.2636">then rename:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="99.4043" x="481.3591" y="127.3964">after every poll</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175.9824" x="443.07" y="142.5293">(with the failed tool checks</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.3721" x="467.3752" y="157.6621">of each repository),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="121.8687" x="470.1269" y="172.7949">at the end of a run</text></g><!--reverse link status to app--><g class="link" data-entity-1="status" data-entity-2="app" data-source-line="20" data-uid="lnk15" id="link_status_app"><path d="M442.07,265.0739 C442.07,302.7639 442.07,366.6339 442.07,404.3339" fill="none" id="status-backto-app" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="442.07,259.0739,438.07,268.0739,442.07,264.0739,446.07,268.0739,442.07,259.0739" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="93.7295" x="443.07" y="324.2208">read every 5 s</text></g><!--reverse link status to statuscmd--><g class="link" data-entity-1="status" data-entity-2="statuscmd" data-source-line="21" data-uid="lnk17" id="link_status_statuscmd"><path d="M353.1507,259.8132 C335.8907,267.6832 324.39,275.4439 311.07,288.6539 C275.58,323.8639 259.39,383.0839 253.24,412.4439" fill="none" id="status-backto-statuscmd" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="358.61,257.3239,348.7616,257.4183,354.0606,259.3983,352.0806,264.6973,358.61,257.3239" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.4663" x="313.7267" y="301.7208">read at every call:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="121.7798" x="312.07" y="316.8536">last poll, its errors,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="117.8633" x="314.0283" y="331.9864">failed tool checks,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="44.3257" x="350.7971" y="347.1193">agents</text></g><!--reverse link statuscmd to Operator--><g class="link" data-entity-1="statuscmd" data-entity-2="Operator" data-source-line="22" data-uid