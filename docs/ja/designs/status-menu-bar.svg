gthAdjust="spacing" textLength="216.5566" x="480.94" y="368.1193">No token, key, webhook address,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115.6606" x="480.94" y="383.2521">or usage number.</text></g><g class="entity" data-entity="GMN24" data-source-line="33" data-uid="ent0025" id="entity_GMN24"><path d="M312.12,483.3239 L312.12,523.5895 L560.0297,523.5895 L560.0297,493.3239 L550.0297,483.3239 L312.12,483.3239" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M550.0297,483.3239 L550.0297,493.3239 L560.0297,493.3239 L550.0297,483.3239" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.9097" x="318.12" y="500.3908">No network call, no Keychain read,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.2485" x="318.12" y="515.5236">no third-party dependency.</text></g><!--reverse link github to run--><g class="link" data-entity-1="github" data-entity-2="run" data-source-line="16" data-uid="lnk10" id="link_github_run"><path d="M371.7,30.9139 C389.5,30.9139 404.94,30.9139 424.87,30.9139" fill="none" id="github-backto-run" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="365.7,30.9139,374.7,34.9139,370.7,30.9139,374.7,26.9139,365.7,30.9139" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="23.4292" x="383.77" y="23.9808">poll</text></g><!--link run to status--><g class="link" data-entity-1="run" data-entity-2="status" data-source-line="17" data-uid="lnk11" id="link_run_status"><path d="M488.07,49.4139 C488.07,79.4239 488.07,134.8739 488.07,169.7239" fill="none" id="run-to-status" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="488.07,175.7239,492.07,166.7239,488.07,170.7239,484.07,166.7239,488.07,175.7239" sty