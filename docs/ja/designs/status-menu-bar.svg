,2.5 0 0 0 6,324.6939" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M132.1426,322.1939 L132.1426,329.6939 A2.5,2.5 0 0 0 134.6426,332.1939 L142.1426,332.1939" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="104.3643" x="16" y="345.189">status-bar.json</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="116.1426" x="16" y="361.4859">~/.config/cumin/</text></g><!--entity app--><g class="entity" data-entity="app" data-source-line="14" data-uid="ent0008" id="entity_app"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="168.4902" x="271.83" y="322.1939"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="148.4902" x="281.83" y="345.189">menu bar app (Swift)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="114.5293" x="281.83" y="361.4859">tools/status-bar/</text></g><!--entity bar--><g class="entity" data-entity="bar" data-source-line="15" data-uid="ent0009" id="entity_bar"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="141.9395" x="212.1" y="518.3239"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="121.9395" x="222.1" y="541.319">macOS menu bar</text></g><g class="entity" data-entity="GMN22" data-source-line="26" data-uid="ent0023" id="entity_GMN22"><path d="M474.94,305.6539 L474.94,391.318 A0,0 0 0 0 474.94,391.318 L765.2012,391.318 A0,0 0 0 0 765.2012,391.318 L765.2012,315.6539 L755.2012,305.6539 L585.41,305.6539 L511.67,229.1239 L577.41,305.6539 L474.94,305.6539 A0,0 0 0 0 474.94,305.6539" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M755.2012,305.6539 L755.2012,315.6539 L765.2012,315.6539 L755.2012,305.6539" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="269.2612" x="480.94" y="322.7208">The only contract between the two parts.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183.7646" x="480.94" y="337.8536">cumin run is the only writer.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175.3032" x="480.94" y="352.9864">cumin never reads the file.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.5566" x="480.94" y="368.1193">No token, key, webhook address,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115.6606" x="480.94" y="383.2521">or usage number.</text></g><g class="entity" data-entity="GMN25" data-source-line="34" data-uid="ent0026" id="entity_GMN25"><path d="M410.12,516.3339 L410.12,556.5995 L658.0297,556.5995 L658.0297,526.3339 L648.0297,516.3339 L410.12,516.3339" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M648.0297,516.3339 L648.0297,526.3339 L658.0297,526.3339 L648.0297,516.3339" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.9097" x="416.12" y="533.4008">No network call, no Keychain read,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.2485" x="416.12" y="548.5336">no third-party dependency.</text></g><!--reverse link github to run--><g class="link" data-entity-1="github" data-entity-2="run" data-source-line="17" data-uid="lnk11" id="link_github_run"><path d="M371.7,30.9139 C389.5,30.9139 404.94,30.9139 424.87,30.9139" fill="none" id="github-backto-run" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="365.7,30.9139,374.7,34.9139,370.7,30.9139,