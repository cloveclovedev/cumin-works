ill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="113.9355" x="48" y="314.396">poll the repository:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="197.5547" x="48" y="328.3647">read the snapshot, decide, apply</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="171.9102" x="60.8223" y="374.4722"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="151.9102" x="70.8223" y="395.6108">keep the time of the poll,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="135.7676" x="70.8223" y="409.5796">its result, and whether</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="110.6074" x="70.8223" y="423.5483">an issue is in work</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="136.4609" x="349.6206" y="293.2573"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="116.4609" x="359.6206" y="314.396">skip the repository:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="84.7793" x="359.6206" y="328.3647">no GitHub call</text><polygon fill="#F1F1F1" points="282.3142,442.3784,294.3142,454.3784,282.3142,466.3784,270.3142,454.3784,282.3142,442.3784" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="218.8655,201.9375,345.7629,201.9375,357.7629,213.9375,345.7629,225.9375,218.8655,225.9375,206.8655,213.9375,218.8655,201.9375" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="286.3142" y="236.1479">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="126.8975" 