ont-size="11" lengthAdjust="spacing" textLength="13.7017" x="396.2241" y="114.1792">no</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="187.7012" x="146.0415" y="280.0625"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="167.7012" x="156.0415" y="301.2012">minimal run of Claude Code</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="100.1836" x="156.0415" y="315.1699">(read the usage)</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="219.2246" x="130.2798" y="396.4023"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="75.6914" x="140.2798" y="417.541">Q1: no start;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="199.2246" x="140.2798" y="431.5098">notify once until a read succeeds</text><ellipse cx="239.8921" cy="476.8711" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="239.8921" cy="476.8711" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="206.1213,348,273.6628,348,285.6628,360,273.6628,372,206.1213,372,194.1213,360,206.1213,348" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="243.8921" y="382.2104">no</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="67.5415" x="206.1213" y="363.8081">usage read?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="285.6628" y="357.4058">yes</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="211.5313" x="134.1265" y="529.8711"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="191.5313" x="144.1265" y="551.0098">store the usage, its reset times,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="147" x="144.1265" y="564.9785">and the time of the read</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="291.3125" x="94.2358" y="597.8086"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="271.3125" x="104.2358" y="618.9473">5h limit = threshold of the current time band</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="238.6348" x="104.2358" y="632.916">(100% while the allowance of Q2 holds)</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="269.8027" x="104.9907" y="665.7461"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="149.0215" x="114.9907" y="686.8848">weekly limit = pace limit</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="249.8027" x="114.9907" y="700.8535">target x min(1, (elapsed + lead) / 7 days)</text><polygon fill="#F1F1F1" points="146.2256,733.6836,333.5586,733.6836,345.5586,746.4883,333.5586,759.293,146.2256,759.293,134.2256,746.4883,146.2256,733.6836" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="117.7505" x="146.2256" y="743.894">5h usage &gt;= 5h limit</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="187.333" x="146.2256" y="756.6987">or weekly usage &gt;= weekly limit?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="115.2173" y="743.894">yes</text><text fill="#000000" font-family="sa