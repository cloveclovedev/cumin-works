<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="422px" preserveAspectRatio="none" style="width:684px;height:422px;background:#FFFFFF;" version="1.1" viewBox="0 0 684 422" width="684px" zoomAndPan="magnify"><defs/><g><!--entity request--><g class="entity" data-entity="request" data-source-line="8" data-uid="ent0002" id="entity_request"><rect fill="#F1F1F1" height="68.8906" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="241.2861" x="7" y="7"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="119.3008" x="17" y="29.9951">request the split,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="221.2861" x="17" y="46.292">the implementation, the review</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="132.3164" x="17" y="62.5889">(internal/workflow)</text></g><!--entity cleanup--><g class="entity" data-entity="cleanup" data-source-line="9" data-uid="ent0003" id="entity_cleanup"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="190.4609" x="283.41" y="15.15"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="170.4609" x="293.41" y="38.1451">cleanup of closed issues</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="132.3164" x="293.41" y="54.442">(internal/workflow)</text></g><!--entity workspace--><g class="entity" data-entity="workspace" data-source-line="10" data-uid="ent0004" id="entity_workspace"><rect fill="#F1F1F1" height="68.8906" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="208.7471" x="148.27" y="152.84"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="77.3418" x="158.27" y="175.8351">Workspace</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="188.0908" x="158.27" y="192.132">internal/agent/worktree.go</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="188.7471" x="158.27" y="208.4289">Prepare, Remove, Head, ...</text></g><!--entity git--><g class="entity" data-entity="git" data-source-line="11" data-uid="ent0005" id="entity_git"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="282.3018" x="111.49" y="346.22"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="18.2656" x="121.49" y="369.2151">git</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="262.3018" x="121.49" y="385.512">(clone, fetch, worktree, rev-parse, ...)</text></g><g class="entity" data-entity="GMN9" data-source-line="18" data-uid="ent0010" id="entity_GMN9"><path d="M391.9,136.89 L391.9,183.29 L357.29,187.29 L391.9,191.29 L391.9,237.6869 A0,0 0 0 0 391.9,237.6869 L677.3814,237.6869 A0,0 0 0 0 677.3814,237.6869 L677.3814,146.89 L667.3814,136.89 L391.9,136.89 A0,0 0 0 0 391.9,136.89" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M667.3814,136.89 L667.3814,146.89 L677.3814,146.89 L667.3814,136.89" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.5962" x="397.9" y="153.9569">A command that does not end</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="155.9873" x="397.9" y="169.0897">is killed at the deadline.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.4814" x="397.9" y="184.2225">The error names the command and says</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="166.207" x="397.9" y="199.3553">that the deadline passed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.0439" x="397.9" y="214.4881">The caller handles it</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.1631" x="397.9" y="229.621">as any failed git command.</text></g><g class="entity" data-entity="GMN12" data-source-line="27" data-uid="ent0013" id="entity_GMN12"><path d="M428.8,329.69 L428.8,368.52 L394.04,372.52 L428.8,376.52 L428.8,415.3541 A0,0 0 0 0 428.8,415.3541 L654.4929,415.3541 A0,0 0 0 0 654.4929,415.3541 L654.4929,339.69 L644.4929,329.69 L428.8,329.69 A0,0 0 0 0 428.8,329.69" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M644.4929,329.69 L644.4929,339.69 L654.4929,339.69 L644.4929,329.69" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="136.0176" x="434.8" y="346.7569">A child process of git</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.6929" x="434.8" y="361.8897">can keep the output pipe open.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.3154" x="434.8" y="377.0225">2 seconds after the deadline,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="113.9658" x="434.8" y="392.1553">the pipe is closed</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.2432" x="434.8" y="407.2881">and the command returns.</text></g><!--link request to workspace--><g class="link" data-entity-1="request" data-entity-2="workspace" data-source-line="13" data-uid="lnk6" id="link_request_workspace"><path d="M156.95,76.17 C177.01,99.25 199.5646,125.2009 219.5846,148.2409" fill="none" id="request-to-workspace" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="223.52,152.77,220.6363,143.3528,220.2405,148.9958,214.5975,148.6,223.52,152.77" style="stroke:#181818;stroke-width:1;"/></g><!--link cleanup to workspace--><g class="link" data-entity-1="cleanup" data-entity-2="workspace" data-source-line="14" data-uid="lnk7" id="link_cleanup_workspace"><path d="M356.12,68.16 C335.52,91.68 308.8642,122.1074 286.2742,147.8874" fill="none" id="cleanup-to-workspace" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="282.32,152.4,291.2598,148.2672,285.6152,148.6395,285.2429,142.9949,282.32,152.4" style="stroke:#181818;stroke-width:1;"/></g><!--link workspace to git--><g class="link" data-entity-1="workspace" data-entity-2="git" data-source-line="15" data-uid="lnk8" id="link_workspace_git"><path d="M252.64,221.89 C252.64,257.64 252.64,307.4 252.64,339.81" fill="none" id="workspace-to-git" style="stroke:#FF0000;stroke-width:2;"/><polygon fill="#FF0000" points="252.64,345.81,256.64,336.81,252.64,340.81,248.64,336.81,252.64,345.81" style="stroke:#FF0000;stroke-width:2;"/><text fill="#FF0000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.2334" x="253.64" y="280.7569">every git command ends</text><text fill="#FF0000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.1406" x="284.6864" y="295.8897">after 5 minutes</text></g><!--SRC=[TPDDYzj038Rl-HLYUzWMR2yKUWdBGg6KdaefXHwQ7jGPnHuobgQZyORzzzLCaetxTGYUMD8phwJNj-2MEJ0S9HyKUg17oaymXW9EvXdPW-oXJDGIm8TCheXb47i5t1VAW9jRy8G-1gR1pk_4aCHb2pZQeyyB3xFle4WA3eJ_WQjbdmr9UGkM3kfoI4NlSdlN-u1Znba7dG1BgyyYvI8jKn8D9uuU0YUqPD09lHm3Zx37gBIAUDhZ4ijxuV8HPm95rbufX_rcKmKXZv7W9jFFXVHqdQOOIhVZUWvpYbGRn1A4kxE4nq377RyCR2DXZ7UrmNsKuwiRG8KpQurtaP2NL9jmKPGy15LB-Z_aNB66VArhI-Xenyz5RUgjj6IYOPGTVx8HOQREXZpBepq_sBuw68QXWOyNoXfj7Z0f9eqjVq_5JHrSe5rjk3UaKgESz5b57U1fQdt_iE9UcltzxVC9-cylCldkXqJ_tLAg_xPmxoHAtbhWuMzRLWFkU9LoCkCRC3SlXVJ-heKUDXkMOWiAuzGCSxqTuEqphKpcAo-aODcLRT6W