 of an agent:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="284.7813" x="302" y="289.7231">at a quota limit (stop agent starts), no label</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="227.4238" x="302" y="304.856">change and no request (quota.md)</text><g class="message" data-participant-1="claim" data-participant-2="gh"><polygon fill="#181818" points="612.9702,335.0547,622.9702,339.0547,612.9702,343.0547,616.9702,339.0547" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="291.9282" x2="618.9702" y1="339.0547" y2="339.0547"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309.042" x="298.9282" y="333.9888">change the label to cumin/status/implementing</text></g><path d="M296,352.0547 L296,392.0547 L508,392.0547 L508,362.0547 L498,352.0547 L296,352.0547" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M498,352.0547 L498,362.0547 L508,362.0547 L498,352.0547" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="171.793" x="302" y="369.1216">No request when the label</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.1216" x="302" y="384.2544">does not change (principle 3)</text><g class="message" data-participant-1="claim" data-participant-2="claim"><line style="stroke:#181818;stroke-width:1;" x1="291.9282" x2="333.9282" y1="418.4531" y2="418.4531"/><line style="stroke:#181818;stroke-width:1;" x1="333.9282" x2="333.9282" y1="418.4531" y2="431.4531"/><line style="stroke:#181818;stroke-width:1;" x1="292.9282" x2="333.9282" y1="431.4531" y2="431.4531"/><polygon fill="#181818" points="302.9282,427.4531,292.9282,431.4531,302.9282,435.4531,298.9282,431.4531" style="stroke:#181818;stroke-width:1;"/><text fill="