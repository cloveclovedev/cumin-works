<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="793px" preserveAspectRatio="none" style="width:779px;height:793px;background:#FFFFFF;" version="1.1" viewBox="0 0 779 793" width="779px" zoomAndPan="magnify"><defs/><g><ellipse cx="197.2822" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="253.4961" x="70.5342" y="50"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="233.4961" x="80.5342" y="71.1387">Owner: cumin stop --after-current-runs</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="187.5488" x="103.5078" y="103.9688"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="138.457" x="113.5078" y="125.1074">write stop-request.json</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="167.5488" x="113.5078" y="139.0762">(state directory of the Host)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="149.9727" x="122.2959" y="215.9063"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="129.9727" x="132.2959" y="237.0449">poll: read the request</text><path d="M403.5645,259.875 L403.5645,386.9375 L383.5645,390.9375 L403.5645,394.9375 L403.5645,522 A0,0 0 0 0 403.5645,522 L741.376,522 A0,0 0 0 0 741.376,522 L741.376,269.875 L731.376,259.875 L403.5645,259.875 A0,0 0 0 0 403.5645,259.875" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M731.376,259.875 L731.376,269.875 L741.376,269.875 L731.376,259.875" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.3555" x="409.5645" y="276.9419">Every start of an agent passes one check.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="301.3867" x="409.5645" y="292.0747">While cumin stops, the check gives no permit:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="303.856" x="409.5645" y="307.2075">no agent starts, no label changes for the start,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.457" x="409.5645" y="322.3403">and nothing is counted. This holds for every</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="289.7705" x="409.5645" y="337.4731">request to an agent, at a poll and at the end</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="54.9644" x="409.5645" y="352.606">of a run:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251.7036" x="409.5645" y="367.7388">split, acceptance check, claim, review,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258.3687" x="409.5645" y="382.8716">check fix, conflict resolution, review fix,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.6514" x="409.5645" y="398.0044">fix of the review of the Owner, cause,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.9941" x="409.5645" y="413.1372">and the second request of the split,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="316.8115" x="409.5645" y="428.27">of the acceptance check, of the implementation,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.6479" x="409.5645" y="443.4028">of the review, and of the cause.</text><line style="stroke:#181818;stroke-width:1;" x1="403.5645" x2="741.376" y1="451.4688" y2="451.4688"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.9531" x="409.5645" y="468.5356">The agent runs that are going on end</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="240.6777" x="409.5645" y="483.6685">by themselves. What follows the end</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.5234" x="409.5645" y="498.8013">of a run and needs no agent still runs:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.7905" x="409.5645" y="513.9341">verify done, labels, merge, stops for the Owner.</text><rect fill="#F1F1F1" height="75.875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="372.5645" x="11" y="353"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="222.7617" x="21" y="374.1387">apply the actions that need no agent</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="313.9863" x="21" y="388.1074">(requirement issue labels, labels of the pull request,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="352.5645" x="21" y="402.0762">merge after an approval of an Owner, close after a merge,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="278.4668" x="21" y="416.0449">stops for the Owner, follow-up notes, cleanup)</text><polygon fill="#F1F1F1" points="197.2822,171.9063,209.2822,183.9063,197.2822,195.9063,185.2822,183.9063,197.2822,171.9063" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="84.4517,545.8989,310.1128,545.8989,322.1128,558.7036,310.1128,571.5083,84.4517,571.5083,72.4517,558.7036,84.4517,545.8989" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="225.6611" x="84.4517" y="556.1094">a run in progress before or after the poll,</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="154.6284" x="84.4517" y="568.9141">or one that the poll started?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="113.7061" x="322.1128" y="543.3047">yes: wait for the end</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="124.5342" x="322.1128" y="556.1094">of a run or the interval</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="174.1191" x="110.2227" y="612.9072"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="154.1191" x="120.2227" y="634.0459">remove stop-request.json</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="176.0352" x="109.2646" y="666.876"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="156.0352" x="119.2646" y="688.0146">log "stopped", exit code 0</text><path d="M228.2822,710.8447 L228.2822,742.1104 L208.2822,746.1104 L228.2822,750.1104 L228.2822,781.376 A0,0 0 0 0 228.2822,781.376 L514.354,781.376 A0,0 0 0 0 514.354,781.376 L514.354,720.8447 L504.354,710.8447 L228.2822,710.8447 A0,0 0 0 0 228.2822,710.8447" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M504.354,710.8447 L504.354,720.8447 L514.354,720.8447 L504.354,710.8447" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.0718" x="234.2822" y="727.9116">SIGTERM keeps its meaning at any time:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.9023" x="234.2822" y="743.0444">cancel the runs and stop at once.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.2432" x="234.2822" y="758.1772">A request that is found at the start</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163.2046" x="234.2822" y="773.3101">of cumin run is removed.</text><ellipse cx="197.2822" cy="746.1104" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="197.2822" cy="746.1104" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="197.2822" x2="197.2822" y1="30" y2="50"/><polygon fill="#181818" points="193.2822,40,197.2822,50,201.2822,40,197.2822,44" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="197.2822" x2="197.2822" y1="83.9688" y2="103.9688"/><polygon fill="#181818" points="193.2822,93.9688,197.2822,103.9688,201.2822,93.9688,197.2822,97.9688" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="197.2822" x2="197.2822" y1="249.875" y2="353"/><polygon fill="#181818" points="193.2822,343,197.2822,353,201.2822,343,197.2822,347" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="197.2822" x2="197.2822" y1="195.9063" y2="215.9063"/><polygon fill="#181818" points="193.2822,205.9063,197.2822,215.9063,201.2822,205.9063,197.2822,209.9063" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="322.1128" x2="753.376" y1="558.7036" y2="558.7036"/><polygon fill="#181818" points="749.376,366.8555,753.376,356.8555,757.376,366.8555,753.376,362.8555" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="753.376" x2="753.376" y1="183.9063" y2="558.7036"/><line style="stroke:#181818;stroke-width:1;" x1="753.376" x2="209.2822" y1="183.9063" y2="183.9063"/><polygon fill="#181818" points="219.2822,179.9063,209.2822,183.9063,219.2822,187.9063,215.2822,183.9063" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="197.2822" x2="197.2822" y1="428.875" y2="545.8989"/><polygon fill="#181818" points="193.2822,535.8989,197.2822,545.8989,201.2822,535.8989,197.2822,539.8989" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="197.2822" x2="197.2822" y1="151.9063" y2="171.9063"/><polygon fill="#181818" points="193.2822,161.9063,197.2822,171.9063,201.2822,161.9063,197.2822,165.9063" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="197.2822" x2="197.2822" y1="571.5083" y2="612.9072"/><polygon fill="#181818" points="193.2822,602.9072,197.2822,612.9072,201.2822,602.9072,197.2822,606.9072" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="201.2822" y="592.813">no</text><line style="stroke:#181818;stroke-width:1;" x1="197.2822" x2="197.2822" y1="646.876" y2="666.876"/><polygon fill="#181818" points="193.2822,656.876,197.2822,666.876,201.2822,656.876,197.2822,660.876" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="197.2822" x2="197.2822" y1="700.8447" y2="735.1104"/><polygon fill="#181818" points="193.2822,725.1104,197.2822,735.1104,201.2822,725.1104,197.2822,729.1104" style="stroke:#181818;stroke-width:1;"/><!--SRC=[RLLDRzmu3BtxLn2zD05iRyyJO8i2_TWUkWjq0-ob5yMYRJMov8hokFdtIrBoJ5eabrWIFnuV7pclOTWM5s2FwP6WWpmZK8uhc35ZqkEmfOGXGze2dQhvw8AZ6KaDp7GyWmcMtKtA1252m5q3mmEECI6u3FZJPUgRr_0-SYJsgn6xWGtwnRR0oTq0CRm4HNA8yrSC5jD9pa13SckcFvBUTTQPAPc5Ufh1vE8LOuOubczS8xaSqrFVqACBgs5ZeDdOkBimmMWyuRCNYwFPVFuOG_xRB0p81Ee8ankRHWjjJl_iGR0KOXHmrodahZBN2UoxvhGdbqj9NS8V6rBklrCCpGq7uWVh4Ww2xC3wLwHyUzSmP3Iv0JYjqNik6e