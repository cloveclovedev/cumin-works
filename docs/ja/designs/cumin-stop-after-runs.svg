<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="657px" preserveAspectRatio="none" style="width:670px;height:657px;background:#FFFFFF;" version="1.1" viewBox="0 0 670 657" width="670px" zoomAndPan="magnify"><defs/><g><ellipse cx="177.9932" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="253.4961" x="51.2451" y="50"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="233.4961" x="61.2451" y="71.1387">Owner: cumin stop --after-current-runs</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="187.5488" x="84.2188" y="103.9688"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="138.457" x="94.2188" y="125.1074">write stop-request.json</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="167.5488" x="94.2188" y="139.0762">(state directory of the Host)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="149.9727" x="103.0068" y="215.9063"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="129.9727" x="113.0068" y="237.0449">poll: read the request</text><path d="M364.9863,259.875 L364.9863,318.8398 L344.9863,322.8398 L364.9863,326.8398 L364.9863,385.8047 A0,0 0 0 0 364.9863,385.8047 L632.7959,385.8047 A0,0 0 0 0 632.7959,385.8047 L632.7959,269.875 L622.7959,259.875 L364.9863,259.875 A0,0 0 0 0 364.9863,259.875" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M622.7959,259.875 L622.7959,269.875 L632.7959,269.875 L622.7959,259.875" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="195.0127" x="370.9863" y="276.9419">Held back until the next start:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.8843" x="370.9863" y="292.0747">plan, acceptance check, claim,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="113.75" x="370.9863" y="307.2075">review, check fix.</text><line style="stroke:#181818;stroke-width:1;" x1="364.9863" x2="632.7959" y1="315.2734" y2="315.2734"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.9531" x="370.9863" y="332.3403">The agent runs that are going on end</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="240.6777" x="370.9863" y="347.4731">by themselves. What follows the end</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="246.8096" x="370.9863" y="362.606">of a run still runs: verify done, merge,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.7695" x="370.9863" y="377.7388">and the fix that a review asked for.</text><rect fill="#F1F1F1" height="75.875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="333.9863" x="11" y="284.9023"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="222.7617" x="21" y="306.041">apply the actions that need no agent</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="313.9863" x="21" y="320.0098">(requirement issue labels, labels of the pull request,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="227.625" x="21" y="333.9785">merge after an approval of an Owner,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="151.8516" x="21" y="347.9473">follow-up notes, cleanup)</text><polygon fill="#F1F1F1" points="177.9932,171.9063,189.9932,183.9063,177.9932,195.9063,165.9932,183.9063,177.9932,171.9063" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="65.1626,409.7036,290.8237,409.7036,302.8237,422.5083,290.8237,435.313,65.1626,435.313,53.1626,422.5083,65.1626,409.7036" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="225.6611" x="65.1626" y="419.9141">a run in progress before or after the poll,</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="154.6284" x="65.1626" y="432.7188">or one that the poll started?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="113.7061" x="302.8237" y="407.1094">yes: wait for the end</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="124.5342" x="302.8237" y="419.9141">of a run or the interval</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="174.1191" x="90.9336" y="476.7119"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="154.1191" x="100.9336" y="497.8506">remove stop-request.json</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="176.0352" x="89.9756" y="530.6807"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="156.0352" x="99.9756" y="551.8193">log "stopped", exit code 0</text><path d="M208.9932,574.6494 L208.9932,605.915 L188.9932,609.915 L208.9932,613.915 L208.9932,645.1807 A0,0 0 0 0 208.9932,645.1807 L495.0649,645.1807 A0,0 0 0 0 495.0649,645.1807 L495.0649,584.6494 L485.0649,574.6494 L208.9932,574.6494 A0,0 0 0 0 208.9932,574.6494" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M485.0649,574.6494 L485.0649,584.6494 L495.0649,584.6494 L485.0649,574.6494" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.0718" x="214.9932" y="591.7163">SIGTERM keeps its meaning at any time:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.9023" x="214.9932" y="606.8491">cancel the runs and stop at once.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.2432" x="214.9932" y="621.9819">A request that is found at the start</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163.2046" x="214.9932" y="637.1147">of cumin run is removed.</text><ellipse cx="177.9932" cy="609.915" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="177.9932" cy="609.915" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="177.9932" x2="177.9932" y1="30" y2="50"/><polygon fill="#181818" points="173.9932,40,177.9932,50,181.9932,40,177.9932,44" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="177.9932" x2="177.9932" y1="83.9688" y2="103.9688"/><polygon fill="#181818" points="173.9932,93.9688,177.9932,103.9688,181.9932,93.9688,177.9932,97.9688" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="177.9932" x2="177.9932" y1="249.875" y2="284.9023"/><polygon fill="#181818" points="173.9932,274.9023,177.9932,284.9023,181.9932,274.9023,177.9932,278.9023" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="177.9932" x2="177.9932" y1="195.9063" y2="215.9063"/><polygon fill="#181818" points="173.9932,205.9063,177.9932,215.9063,181.9932,205.9063,177.9932,209.9063" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="302.8237" x2="644.7959" y1="422.5083" y2="422.5083"/><polygon fill="#181818" points="640.7959,298.7578,644.7959,288.7578,648.7959,298.7578,644.7959,294.7578" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="644.7959" x2="644.7959" y1="183.9063" y2="422.5083"/><line style="stroke:#181818;stroke-width:1;" x1="644.7959" x2="189.9932" y1="183.9063" y2="183.9063"/><polygon fill="#181818" points="199.9932,179.9063,189.9932,183.9063,199.9932,187.9063,195.9932,183.9063" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="177.9932" x2="177.9932" y1="360.7773" y2="409.7036"/><polygon fill="#181818" points="173.9932,399.7036,177.9932,409.7036,181.9932,399.7036,177.9932,403.7036" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="177.9932" x2="177.9932" y1="151.9063" y2="171.9063"/><polygon fill="#181818" points="173.9932,161.9063,177.9932,171.9063,181.9932,161.9063,177.9932,165.9063" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="177.9932" x2="177.9932" y1="435.313" y2="476.7119"/><polygon fill="#181818" points="173.9932,466.7119,177.9932,476.7119,181.9932,466.7119,177.9932,470.7119" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="181.9932" y="456.6177">no</text><line style="stroke:#181818;stroke-width:1;" x1="177.9932" x2="177.9932" y1="510.6807" y2="530.6807"/><polygon fill="#181818" points="173.9932,520.6807,177.9932,530.6807,181.9932,520.6807,177.9932,524.6807" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="177.9932" x2="177.9932" y1="564.6494" y2="598.915"/><polygon fill="#181818" points="173.9932,588.915,177.9932,598.915,181.9932,588.915,177.9932,592.915" style="stroke:#181818;stroke-width:1;"/><!--SRC=[