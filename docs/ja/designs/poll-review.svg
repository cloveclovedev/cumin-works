<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="586px" preserveAspectRatio="none" style="width:482px;height:586px;background:#000000;" version="1.1" viewBox="0 0 482 586" width="482px" zoomAndPan="magnify"><defs/><g><rect fill="#1B1B27" height="1" style="stroke:#1B1B27;stroke-width:1;" width="1" x="0" y="0"/><text fill="#33FF02" font-family="sans-serif" font-size="12" font-style="italic" font-weight="bold" lengthAdjust="spacing" textLength="128.0098" x="5" y="17">PlantUML 1.2025.4</text><text fill="#33FF02" font-family="sans-serif" font-size="12" font-style="italic" font-weight="bold" lengthAdjust="spacing" textLength="4.1777" x="5" y="30.9688">&#160;</text><text fill="#33FF02" font-family="sans-serif" font-size="12" font-style="italic" font-weight="bold" lengthAdjust="spacing" textLength="376.4004" x="5" y="44.9375">This version of PlantUML is 463 days old, so you should</text><text fill="#33FF02" font-family="sans-serif" font-size="12" font-style="italic" font-weight="bold" lengthAdjust="spacing" textLength="383.6602" x="5" y="58.9063">consider upgrading from https://plantuml.com/download</text><rect fill="#33FF02" height="21.2969" style="stroke:#33FF02;stroke-width:1;" width="470.1416" x="5" y="68.875"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="181.0225" x="6" y="83.875">[From string (line 90) ]</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="4.874" x="5" y="104.1719">&#160;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="174.0977" x="5" y="120.4688">@startuml poll-review</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="215.8379" x="5" y="136.7656">skinparam shadowing false</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="307.6787" x="5" y="153.0625">skinparam defaultFontName sans-serif</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="4.874" x="5" y="169.3594">&#160;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="38.0693" x="5" y="185.6563">start</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="15.9551" x="5" y="201.9531">...</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="177.2695" x="5" y="218.25">... ( skipping 62 lines )</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="15.9551" x="5" y="234.5469">...</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="410.8809" x="34.2441" y="250.8438">:I5: change the label to cumin/status/implementing;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="334.6943" x="34.2441" y="267.1406">:Ask the Implementer to fix the comments</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="387.0439" x="34.2441" y="283.4375">(its own session, the branch of the pull request);</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="330.6201" x="24.4961" y="299.7344">elseif (A decision request of the Reviewer</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="255.2402" x="24.4961" y="316.0313">after its last review?) then (yes)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="440.8975" x="34.2441" y="332.3281">:I8: change the label to cumin/status/awaiting-decision;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="314.2822" x="34.2441" y="348.625">:Notify the Owner (link: that comment);</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="389.4023" x="24.4961" y="364.9219">elseif (The cause was just requested?) then (yes)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="269.541" x="34.2441" y="381.2188">:Hand back to the Owner (row I8);</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="69.3779" x="24.4961" y="397.5156">else (no)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="332.1035" x="34.2441" y="413.8125">:I8: ask the Reviewer to explain the cause</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="155.0391" x="34.2441" y="430.1094">(the same session);</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="40.373" x="24.4961" y="446.4063">endif</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="88.8398" x="14.748" y="462.7031">else (none)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="255.917" x="24.4961" y="479">if (Requested again in this stay?</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="268.249" x="24.4961" y="495.2969">(count in the state file)) then (no)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="280.7861" x="34.2441" y="511.5938">:Count the request in the state file;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="230.7402" x="34.2441" y="527.8906">:Ask the Reviewer once more</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="324.5498" x="34.2441" y="544.1875">(after a run: the short text in its session;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="288.292" x="34.2441" y="560.4844">at a poll: the whole review request);</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="376.2432" x="9.874" y="576.7813">Syntax Error? (Assumed diagram type: activity)</text><!--SRC=[dLPBR-Cs4BxhLmnoMGjmagP1ie5yM1YRT9D3irjlsXu3MXfRR2HI9QauRj7_tXcIab_ARbh0XYrgtjytCtm7ULjB1IjjdYmSWoiHPlWiSOK63FxPedKmkZjFno1KuL-ln1fqwq0lWkwfTSArzjHuDQcM92KSu3EQDJIwgdfDf5_I4biUMWK5vh90Sd8nXhjB-hwdxnLzptv8Jv9tSAt93IgNUMCdTJ46YxcJMW5zXW9chHavGvDv3pOtid4S8PyT5r8iZQZjYIs10cKBHckVaF-FZRRIQRC-IUoJL8qWOR2bABJFRY4gYrjl2bo8jd8_QUNkHOrWXRB75erS90cLnhWakplFOZquGccmWBp4_0aQOIqzn3nA5FH2rxLqaoIRyHCVLtf92CNe-bodJPDqXQq4eRG7XYZMdOwqjaMo-56tgikt9TM5qNLCcOrQZkEJTBVjF1arhK5OjCeNEYNbturqk1-cXrR0NsWqdP3rX5mIEfgE8nWMdFPg71cPb9KFfHHgYJ7uELOiDCmcNubQF-Dk-anOPn37YMxme7m4YXDKucAIo0MCPfpkXvIb58pEqWGWkySLHMejfJT9a225qO-W3ONZq7Y96LeYtgxRNeCjY1etvGy1umP08XjHWDq_R5iGJMCe6ogR0XIcadGMLFe0rsZJGmUzOf0cWL60yIoBpWc_QkqLoFCYm2jTsgMdT1g3ocRjNkUCZeA98v9Mcd0oSbcoZtcbyoSiCYWPwhaWqaOyFwyKfqDzetBaM5QnPG6cSwLDBIhkU0xE4VEz5F5OWDfKVap2FkTNh0UhvsIKPmS7bb3JEUcx_-ZXBTCesvf4us-FeYFuc-9XnAOxvnOMH8o-a_Pn8gGYdId0aboEWTklUvfu4UjqGtysI004B3pHOgTxyo2MGgenhAGh_Ub2vCvc9BWgDOYYm6AhRpYX5KKpzcU-uxWsp16QcJOM-BK9CJxep93_GszVshwqnxcccK2LuC