<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="413px" preserveAspectRatio="none" style="width:886px;height:413px;background:#FFFFFF;" version="1.1" viewBox="0 0 886 413" width="886px" zoomAndPan="magnify"><defs/><g><!--entity run--><g class="entity" data-entity="run" data-source-line="9" data-uid="ent0002" id="entity_run"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="115.4434" x="259.51" y="7"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="70.9229" x="269.51" y="29.9951">cumin run</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="95.4434" x="269.51" y="46.292">(poll, actions)</text></g><!--entity status--><g class="entity" data-entity="status" data-source-line="10" data-uid="ent0003" id="entity_status"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="110.4395" x="410.01" y="15.15"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="90.4395" x="420.01" y="38.1451">cumin status</text></g><!--entity setup--><g class="entity" data-entity="setup" data-source-line="11" data-uid="ent0004" id="entity_setup"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="106.5771" x="555.94" y="15.15"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="86.5771" x="565.94" y="38.1451">cumin setup</text></g><!--entity client--><g class="entity" data-entity="client" data-source-line="12" data-uid="ent0005" id="entity_client"><rect fill="#F1F1F1" height="68.8906" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="188.0273" x="371.21" y="159.25"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="67.8809" x="381.21" y="182.2451">AppClient</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="168.0273" x="381.21" y="198.542">internal/platform/github</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="133.0137" x="381.21" y="214.8389">REST and GraphQL</text></g><!--entity api--><g class="entity" data-entity="api" data-source-line="13" data-uid="ent0006" id="entity_api"><path d="M422.3658,368.0148 C424.0729,363.3885 428.4381,361.6803 431.9211,366.149 C435.1718,361.0122 440.7037,360.2899 443.8026,366.3106 C447.768,360.8165 451.3144,360.6536 455.4182,366.1645 C458.2097,360.5217 461.3256,360.6187 465.4334,364.8262 C469.4519,358.501 474.9927,359.6221 477.7683,366.0302 C481.3667,361.3081 485.6194,361.3001 488.3573,366.912 C493.0009,361.1142 496.5585,361.928 499.8616,368.1907 C502.7463,362.3721 507.1781,362.804 510.5121,367.746 C519.8779,366.9412 523.4455,374.7375 520.0479,382.297 C525.8882,392.192 523.0359,398.5517 511.1896,399.1505 C507.7985,403.3916 503.2263,403.0121 500.8289,398.0338 C497.7689,403.281 492.9972,403.4787 489.2546,398.8324 C486.137,403.6384 481.6971,403.4755 478.4195,399.0196 C474.97,404.7284 469.5453,406.1572 465.3512,399.8279 C462.4295,405.1756 457.9787,403.9884 455.3821,399.4985 C451.79,404.4595 446.8889,405.5682 443.2327,399.5695 C439.8272,403.9927 435.4418,404.5059 432.9285,398.6731 C430.0175,405.2277 424.2341,403.9771 420.9113,399.1062 C412.1217,395.1232 410.8128,389.9404 416.8413,382.3568 C411.5209,375.2085 413.4437,369.6768 422.3658,368.0148" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="75.1133" x="427.67" y="386.7851">GitHub API</text></g><g class="entity" data-entity="GMN11" data-source-line="21" data-uid="ent0012" id="entity_GMN11"><path d="M594.61,120.6 L594.61,189.7 L559.52,193.7 L594.61,197.7 L594.61,266.7953 A0,0 0 0 0 594.61,266.7953 L879.8375,266.7953 A0,0 0 0 0 879.8375,266.7953 L879.8375,130.6 L869.8375,120.6 L594.61,120.6 A0,0 0 0 0 594.61,120.6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M869.8375,120.6 L869.8375,130.6 L879.8375,130.6 L869.8375,120.6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.3564" x="600.61" y="137.6669">A try that gets no answer</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.2876" x="600.61" y="152.7997">ends with an error at the deadline.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251.5703" x="600.61" y="167.9325">A read (GET, GraphQL query) that fails</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.1284" x="600.61" y="183.0653">with a network error or a 5xx answer</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.8145" x="600.61" y="198.1981">is sent again: up to 3 retries,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.2275" x="600.61" y="213.331">2 seconds apart, one warn log line each.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.0693" x="600.61" y="228.4638">A write is sent once.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.9419" x="600.61" y="243.5966">After the last try, the error</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.2197" x="600.61" y="258.7294">is a temporary error (IsTemporary).</text></g><g class="entity" data-entity="GMN14" data-source-line="33" data-uid="ent0015" id="entity_GMN14"><path d="M6,120.6 L6,266.7953 A0,0 0 0 0 6,266.7953 L336.4546,266.7953 A0,0 0 0 0 336.4546,266.7953 L336.4546,197.7 L370.73,193.7 L336.4546,189.7 L336.4546,130.6 L326.4546,120.6 L6,120.6 A0,0 0 0 0 6,120.6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M326.4546,120.6 L326.4546,130.6 L336.4546,130.6 L326.4546,120.6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.4272" x="12" y="137.6669">An answer of a full primary rate limit</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309.4546" x="12" y="152.7997">(REST: 403 or 429, GraphQL: 200 with an error,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.2466" x="12" y="167.9325">both with x-ratelimit-remaining: 0)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="285.8159" x="12" y="183.0653">returns a RateLimitError with the reset time</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="274.9868" x="12" y="198.1981">of x-ratelimit-reset, and one warn log line.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.0771" x="12" y="213.331">It is not sent again at once.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.7515" x="12" y="228.4638">Until the reset time, a call of the same</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.5981" x="12" y="243.5966">installation returns that error</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124.522" x="12" y="258.7294">and sends nothing.</text></g><!--link run to client--><g class="link" data-entity-1="run" data-entity-2="client" data-source-line="15" data-uid="lnk7" id="link_run_client"><path d="M341.01,59.75 C366.17,86.68 401.9137,124.9359 429.6737,154.6459" fill="none" id="run-to-client" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="433.77,159.03,430.5482,149.723,430.3564,155.3766,424.7028,155.1848,433.77,159.03" style="stroke:#181818;stroke-width:1;"/></g><!--link status to client--><g class="link" data-entity-1="status" data-entity-2="client" data-source-line="16" data-uid="lnk8" id="link_status_client"><path d="M465.23,51.86 C465.23,77.63 465.23,120.2 465.23,153.01" fill="none" id="status-to-client" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="465.23,159.01,469.23,150.01,465.23,154.01,461.23,150.01,465.23,159.01" style="stroke:#181818;stroke-width:1;"/></g><!--link setup to client--><g class="link" data-entity-1="setup" data-entity-2="client" data-source-line="17" data-uid="lnk9" id="link_setup_client"><path d="M593.27,51.86 C569.83,77.63 529.7162,121.7605 499.8862,154.5705" fill="none" id="setup-to-client" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="495.85,159.01,504.864,155.0416,499.2135,155.3105,498.9447,149.66,495.85,159.01" style="stroke:#181818;stroke-width:1;"/></g><!--link client to api--><g class="link" data-entity-1="client" data-entity-2="api" data-source-line="18" data-uid="lnk10" id="link_client_api"><path d="M465.23,228.42 C465.23,266.06 465.23,319.9 465.23,352.3" fill="none" id="client-to-api" style="stroke:#FF0000;stroke-width:2;"/><polygon fill="#FF0000" points="465.23,358.3,469.23,349.3,465.23,353.3,461.23,349.3,465.23,358.3" style="stroke:#FF0000;stroke-width:2;"/><text fill="#FF0000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.3896" x="473.4981" y="309.8569">every try ends</text><text fill="#FF0000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="108.9258" x="466.23" y="324.9897">after 30 seconds</text></g><!--SRC=[VLJ1Jjmm4BtdAqRqm28bkokWXqO82RMK8g6gfVJKxM4scIGMZftQ4nR-lc