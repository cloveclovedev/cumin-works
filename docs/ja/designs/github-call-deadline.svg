<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="413px" preserveAspectRatio="none" style="width:634px;height:413px;background:#FFFFFF;" version="1.1" viewBox="0 0 634 413" width="634px" zoomAndPan="magnify"><defs/><g><!--entity run--><g class="entity" data-entity="run" data-source-line="8" data-uid="ent0002" id="entity_run"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="115.4434" x="7" y="7"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="70.9229" x="17" y="29.9951">cumin run</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="95.4434" x="17" y="46.292">(poll, actions)</text></g><!--entity status--><g class="entity" data-entity="status" data-source-line="9" data-uid="ent0003" id="entity_status"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="110.4395" x="157.5" y="15.15"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="90.4395" x="167.5" y="38.1451">cumin status</text></g><!--entity setup--><g class="entity" data-entity="setup" data-source-line="10" data-uid="ent0004" id="entity_setup"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="106.5771" x="303.43" y="15.15"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="86.5771" x="313.43" y="38.1451">cumin setup</text></g><!--entity client--><g class="entity" data-entity="client" data-source-line="11" data-uid="ent0005" id="entity_client"><rect fill="#F1F1F1" height="68.8906" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="188.0273" x="118.71" y="159.25"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="67.8809" x="128.71" y="182.2451">AppClient</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="168.0273" x="128.71" y="198.542">internal/platform/github</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="133.0137" x="128.71" y="214.8389">REST and GraphQL</text></g><!--entity api--><g class="entity" data-entity="api" data-source-line="12" data-uid="ent0006" id="entity_api"><path d="M169.8658,368.0148 C171.5729,363.3885 175.9381,361.6803 179.4211,366.149 C182.6718,361.0122 188.2037,360.2899 191.3026,366.3106 C195.268,360.8165 198.8144,360.6536 202.9182,366.1645 C205.7097,360.5217 208.8256,360.6187 212.9334,364.8262 C216.9519,358.501 222.4927,359.6221 225.2683,366.0302 C228.8667,361.3081 233.1194,361.3001 235.8573,366.912 C240.5009,361.1142 244.0585,361.928 247.3616,368.1907 C250.2463,362.3721 254.6781,362.804 258.0121,367.746 C267.3779,366.9412 270.9455,374.7375 267.5479,382.297 C273.3882,392.192 270.5359,398.5517 258.6896,399.1505 C255.2985,403.3916 250.7263,403.0121 248.3289,398.0338 C245.2689,403.281 240.4972,403.4787 236.7546,398.8324 C233.637,403.6384 229.1971,403.4755 225.9195,399.0196 C222.47,404.7284 217.0453,406.1572 212.8512,399.8279 C209.9295,405.1756 205.4787,403.9884 202.8821,399.4985 C199.29,404.4595 194.3889,405.5682 190.7327,399.5695 C187.3272,403.9927 182.9418,404.5059 180.4285,398.6731 C177.5175,405.2277 171.7341,403.9771 168.4113,399.1062 C159.6217,395.1232 158.3128,389.9404 164.3413,382.3568 C159.0209,375.2085 160.9437,369.6768 169.8658,368.0148" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="75.1133" x="175.17" y="386.7851">GitHub API</text></g><g class="entity" data-entity="GMN11" data-source-line="20" data-uid="ent0012" id="entity_GMN11"><path d="M342.11,120.6 L342.11,189.7 L307.02,193.7 L342.11,197.7 L342.11,266.7953 A0,0 0 0 0 342.11,266.7953 L627.3375,266.7953 A0,0 0 0 0 627.3375,266.7953 L627.3375,130.6 L617.3375,120.6 L342.11,120.6 A0,0 0 0 0 342.11,120.6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M617.3375,120.6 L617.3375,130.6 L627.3375,130.6 L617.3375,120.6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.3564" x="348.11" y="137.6669">A try that gets no answer</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.2876" x="348.11" y="152.7997">ends with an error at the deadline.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251.5703" x="348.11" y="167.9325">A read (GET, GraphQL query) that fails</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.1284" x="348.11" y="183.0653">with a network error or a 5xx answer</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.8145" x="348.11" y="198.1981">is sent again: up to 3 retries,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.2275" x="348.11" y="213.331">2 seconds apart, one warn log line each.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.0693" x="348.11" y="228.4638">A write is sent once.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.9419" x="348.11" y="243.5966">After the last try, the error</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.2197" x="348.11" y="258.7294">is a temporary error (IsTemporary).</text></g><!--link run to client--><g class="link" data-entity-1="run" data-entity-2="client" data-source-line="14" data-uid="lnk7" id="link_run_client"><path d="M88.5,59.75 C113.67,86.68 149.4145,124.9352 177.1645,154.6452" fill="none" id="run-to-client" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="181.26,159.03,178.0399,149.7224,177.8471,155.376,172.1935,155.1831,181.26,159.03" style="stroke:#181818;stroke-width:1;"/></g><!--link status to client--><g class="link" data-entity-1="status" data-entity-2="client" data-source-line="15" data-uid="lnk8" id="link_status_client"><path d="M212.72,51.86 C212.72,77.63 212.72,120.2 212.72,153.01" fill="none" id="status-to-client" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="212.72,159.01,216.72,150.01,212.72,154.01,208.72,150.01,212.72,159.01" style="stroke:#181818;stroke-width:1;"/></g><!--link setup to client--><g class="link" data-entity-1="setup" data-entity-2="client" data-source-line="16" data-uid="lnk9" id="link_setup_client"><path d="M340.76,51.86 C317.33,77.63 277.2055,121.7599 247.3855,154.5699" fill="none" id="setup-to-client" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="243.35,159.01,252.3633,155.0401,246.7129,155.3099,246.4432,149.6595,243.35,159.01" style="stroke:#181818;stroke-width:1;"/></g><!--link client to api--><g class="link" data-entity-1="client" data-entity-2="api" data-source-line="17" data-uid="lnk10" id="link_client_api"><path d="M212.72,228.42 C212.72,266.06 212.72,319.9 212.72,352.3" fill="none" id="client-to-api" style="stroke:#FF0000;stroke-width:2;"/><polygon fill="#FF0000" points="212.72,358.3,216.72,349.3,212.72,353.3,208.72,349.3,212.72,358.3" style="stroke:#FF0000;stroke-width:2;"/><text fill="#FF0000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.3896" x="220.9881" y="309.8569">every try ends</text><text fill="#FF0000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="108.9258" x="213.72" y="324.9897">after 30 seconds</text></g><!--SRC=[RLF1RjH03BtdAwnoQ2ibkuYAowggL44fbH22iZUMWvjuar5dPuBjiEtVuvdPY2rmY9IyPtkUtxoSGZljN81zv4U11