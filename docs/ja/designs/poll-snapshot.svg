tate, labels (up to 100)</text><line style="stroke:#181818;stroke-width:0.5;" x1="52.58" x2="332.7196" y1="287.8938" y2="287.8938"/></g><g class="entity" data-entity="blocker" data-source-line="10" data-uid="ent0005" id="entity_blocker"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="131.2842" x="73.01" y="390.44"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="117.2842" x="80.01" y="405.4351">blocked-by issue</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="99.0049" x="89.1496" y="421.732">number, state</text><line style="stroke:#181818;stroke-width:0.5;" x1="74.01" x2="203.2942" y1="427.0338" y2="427.0338"/></g><g class="entity" data-entity="pr" data-source-line="11" data-uid="ent0006" id="entity_pr"><rect fill="#F1F1F1" height="68.8906" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="322.3213" x="239.49" y="382.29"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="271.4277" x="264.9368" y="397.2851">open pull request that closes the issue</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="268.4609" x="266.4202" y="413.582">number, author, head commit, branch</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="308.3213" x="246.49" y="429.8789">labels (up to 100), check results (up to 100)</text><line style="stroke:#181818;stroke-width:0.5;" x1="240.49" x2="560.8113" y1="435.1806" y2="435.1806"/></g><g class="entity" data-entity="GMN11" data-source-line="19" data-uid="ent0012" id="entity_GMN11"><path d="M200.23,512.18 L200.23,552.4456 A0,0 0 0 0 200.23,552.4456 L601.0801,552.4456 A0,0 0 0 0 601.0801,552.4456 L601.0801,522.18 L591.0801,512.18 L404.65,512.18 L400.65,451.51 L396.65,512.18 L200.23,512.18 A0,0 0 0 0 200.23,512.18" fill="#FEFFDD" style=