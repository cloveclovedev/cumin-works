.9569">The time that cumin/status/awaiting-checks</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="280.4585" x="12" y="282.0897">was last added comes from the label times</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175.3984" x="12" y="297.2225">query, not from this query.</text></g><g class="entity" data-entity="GMN19" data-source-line="30" data-uid="ent0020" id="entity_GMN19"><path d="M664.19,249.89 L664.19,273.59 L629.81,277.59 L664.19,281.59 L664.19,305.2884 A0,0 0 0 0 664.19,305.2884 L914.6578,305.2884 A0,0 0 0 0 914.6578,305.2884 L914.6578,259.89 L904.6578,249.89 L664.19,249.89 A0,0 0 0 0 664.19,249.89" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M904.6578,249.89 L904.6578,259.89 L914.6578,259.89 L904.6578,249.89" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.1475" x="670.19" y="266.9569">When an issue exceeds a limit,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205.2261" x="670.19" y="282.0897">the poll of that repository stops</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.4678" x="670.19" y="297.2225">with an error that names the issue.</text></g><!--link repo to req--><g class="link" data-entity-1="repo" data-entity-2="req" data-source-line="14" data-uid="lnk8" id="link_repo_req"><path codeLine="14" d="M488.43,43.77 C488.43,63.89 488.43,90.97 488.43,113.95" fill="none" id="repo-to-req" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="488.43,119.95,492.43,110.95,488.43,114.95,484.43,110.95,488.43,119.95" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="40.168" x="489.43" y="86.3669">issues</text>