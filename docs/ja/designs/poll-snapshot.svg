xt><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="415.7524" x="1510.35" y="813.8597">write the follow-up note reads merged pull requests separately.</text></g><g class="entity" data-entity="GMN20" data-source-line="31" data-uid="ent0021" id="entity_GMN20"><path d="M6,291.45 L6,346.8484 A0,0 0 0 0 6,346.8484 L307.4585,346.8484 A0,0 0 0 0 307.4585,346.8484 L307.4585,323.15 L432.97,319.15 L307.4585,315.15 L307.4585,301.45 L297.4585,291.45 L6,291.45 A0,0 0 0 0 6,291.45" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M297.4585,291.45 L297.4585,301.45 L307.4585,301.45 L297.4585,291.45" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.1162" x="12" y="308.5169">The time that cumin/status/checking</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="280.4585" x="12" y="323.6497">was last added comes from the label times</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175.3984" x="12" y="338.7825">query, not from this query.</text></g><g class="entity" data-entity="GMN23" data-source-line="36" data-uid="ent0024" id="entity_GMN23"><path d="M841.5,283.89 L841.5,315.15 L806.45,319.15 L841.5,323.15 L841.5,354.4213 A0,0 0 0 0 841.5,354.4213 L1091.9678,354.4213 A0,0 0 0 0 1091.9678,354.4213 L1091.9678,293.89 L1081.9678,283.89 L841.5,283.89 A0,0 0 0 0 841.5,283.89" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1081.9678,283.89 L1081.9678,293.89 L1091.9678,293.89 L1081.9678,283.89" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.0151" x="847.5" y="300.9569">When an issue exceeds a limit</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLen