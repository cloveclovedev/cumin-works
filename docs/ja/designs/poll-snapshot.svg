ke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="40.168" x="193.65" y="86.3669">issues</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="8.271" x="183.563" y="63.2151">1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="78.8696" x="105.7309" y="109.1358">10 per page</text></g><!--link req to sub--><g class="link" data-entity-1="req" data-entity-2="sub" data-source-line="14" data-uid="lnk8" id="link_req_sub"><path codeLine="14" d="M192.65,173.39 C192.65,195.89 192.65,222.36 192.65,244.84" fill="none" id="req-to-sub" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="192.65,250.84,196.65,241.84,192.65,245.84,188.65,241.84,192.65,250.84" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="63.6543" x="193.65" y="215.9669">subIssues</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="8.271" x="183.8038" y="192.973">1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="54.3486" x="132.7819" y="240.4277">up to 15</text></g><!--link sub to blocker--><g class="link" data-entity-1="sub" data-entity-2="blocker" data-source-line="15" data-uid="lnk9" id="link_sub_blocker"><path codeLine="15" d="M182.5,304.39 C172.84,328.91 160.5965,359.9965 150.9665,384.4765" fill="none" id="sub-to-blocker" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="148.77,390.06,155.787,383.149,150.6004,385.4071,148.3423,380.2204,148.77,390.06" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="67.355" x="169.89" y="348.3569">blockedBy</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="