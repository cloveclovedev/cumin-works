"141.7234" y="354.4766"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="91.8926" x="151.7234" y="375.6152">clear the mark:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="109.916" x="151.7234" y="389.584">a later wait is new</text><ellipse cx="206.6814" cy="433.4141" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="206.6814" cy="433.4141" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="32,278.8555,381.3628,278.8555,393.3628,304.4648,381.3628,330.0742,32,330.0742,20,304.4648,32,278.8555" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="210.6814" y="340.2847">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="239.626" x="32" y="289.0659">the poll decided an action in any repository</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="349.3628" x="32" y="301.8706">(a start that only the quota or only the tool checks stop counts,</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="98.1675" x="32" y="314.6753">stop agent starts)</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="97.2651" x="32" y="327.48">or an agent runs?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="393.3628" y="301.8706">no</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="294.623" x="59.3699" y="534.8164"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="90.2871" x="69.3699" y="555.9551">no notification:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="274.623" x="69.3699" y="569.9238">a repository that was not read may hold work</text><ellipse cx="206.6814" cy="615.2852" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="206.6814" cy="615.2852" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="97.7771,486.4141,315.5857,486.4141,327.5857,498.4141,315.5857,510.4141,97.7771,510.4141,85.7771,498.4141,97.7771,486.4141" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="210.6814" y="520.6245">no</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="217.8086" x="97.7771" y="502.2222">the poll of every repository succeeded?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="327.5857" y="495.8198">yes</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="283.3203" x="65.0212" y="731.1016"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="90.2871" x="75.0212" y="752.2402">no notification:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="263.3203" x="75.0212" y="766.209">stop agent starts already named the cause;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="132.5859" x="75.0212" y="780.1777">the mark stays as it is</text><ellipse cx="206.6814" cy="824.0078" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="206.6814" cy="824.0078" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="86.4629,668.2852,326.8999,668.2852,338.8999,687.4922,326.8999,706.6992,86.4629,706.6992,74.4629,687.4922,86.4629,668.2852" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="210.6814" y="716.9097">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="240.437" x="86.4629" y="678.4956">a start of an agent waits only for the quota,</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="237.499" x="86.4629" y="691.3003">or only for the tool checks of its repository,</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="238.4497" x="86.4629" y="704.105">in any repository, in any state of the issue?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="338.8999" y="684.8979">no</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="152.5859" x="130.3884" y="965.4336"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="90.2871" x="140.3884" y="986.5723">no notification;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="132.5859" x="140.3884" y="1000.541">the mark stays as it is</text><ellipse cx="206.6814" cy="1044.3711" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="206.6814" cy="1044.3711" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="65.2202,877.0078,348.1426,877.0078,360.1426,909.0195,348.1426,941.0313,65.2202,941.0313,53.2202,909.0195,65.2202,877.0078" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="210.6814" y="951.2417">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="282.9224" x="65.2202" y="887.2183">an issue that cumin moves on without a Maintainer</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="134.5513" x="65.2202" y="900.0229">exists in any repository?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="147.9629" x="65.2202" y="912.8276">(checking, a working label,</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="114.0767" x="65.2202" y="925.6323">or ready and waiting</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="163.3296" x="65.2202" y="938.437">only for room under the limit)</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="360.1426" y="906.4253">no</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="216.875" x="98.2439" y="1145.7734"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="90.2871" x="108.2439" y="1166.9121">no notification:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="196.875" x="108.2439" y="1180.8809">the notification was already sent</text><ellipse cx="206.6814" cy="1226.2422" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="206.6814" cy="1226.2422" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="162.5176,1097.3711,250.8452,1097.3711,262.8452,1109.3711,250.8452,1121.3711,162.5176,1121.3711,150.5176,1109.3711,162.5176,1097.3711" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="210.6814" y="1131.5815">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLeng