work</text><ellipse cx="167.7598" cy="602.4805" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="167.7598" cy="602.4805" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="58.8555,473.6094,276.6641,473.6094,288.6641,485.6094,276.6641,497.6094,58.8555,497.6094,46.8555,485.6094,58.8555,473.6094" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="171.7598" y="507.8198">no</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="217.8086" x="58.8555" y="489.4175">the poll of every repository succeeded?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="288.6641" y="483.0151">yes</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="152.5859" x="91.4668" y="743.9063"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="90.2871" x="101.4668" y="765.0449">no notification;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="132.5859" x="101.4668" y="779.0137">the mark stays as it is</text><ellipse cx="167.7598" cy="822.8438" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="167.7598" cy="822.8438" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="32,655.4805,303.5195,655.4805,315.5195,687.4922,303.5195,719.5039,32,719.5039,20,687.4922,32,655.4805" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="171.7598" y="729.7144">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="271.5195" x="32" y="665.6909">an issue t