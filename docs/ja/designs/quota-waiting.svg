" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="223.9236" y="885.2495">no</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="253.9004" x="40.8096" y="1057.7148"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="233.9004" x="50.8096" y="1078.8535">Q4: notify the Owner that cumin waits;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="76.5879" x="50.8096" y="1092.8223">set the mark</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="227.2383" x="50.8096" y="1106.791">(clear it again when the channel fails)</text><ellipse cx="167.7598" cy="1150.6211" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="167.7598" cy="1150.6211" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="167.7598" x2="167.7598" y1="30" y2="50"/><polygon fill="#181818" points="163.7598,40,167.7598,50,171.7598,40,167.7598,44" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="167.7598" x2="167.7598" y1="186.3398" y2="214.8555"/><polygon fill="#181818" points="163.7598,204.8555,167.7598,214.8555,171.7598,204.8555,167.7598,208.8555" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="167.7598" x2="167.7598" y1="127.9688" y2="152.3711"/><polygon fill="#181818" points="163.7598,142.3711,167.7598,152.3711,171.7598,142.3711,167.7598,146.3711" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="277.3364" x2="289.3364" y1="115.9688" y2="115.9688"/><polygon fill="#181818" points="285.3364,184.8555,289.3364,194.8555,293.3364,184.8555,289.3364,188.8555" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="289.3364" x2="289.