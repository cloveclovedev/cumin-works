<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1368px" preserveAspectRatio="none" style="width:387px;height:1368px;background:#FFFFFF;" version="1.1" viewBox="0 0 387 1368" width="387px" zoomAndPan="magnify"><defs/><g><ellipse cx="181.2979" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="232.666" x="64.9648" y="50"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="212.666" x="74.9648" y="71.1387">poll of every target repository ends</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="73.8945" x="144.3506" y="152.3711"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="53.8945" x="154.3506" y="173.5098">no check</text><ellipse cx="181.2979" cy="225.8555" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="181.2979" cy="225.8555" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="83.7212,103.9688,278.8745,103.9688,290.8745,115.9688,278.8745,127.9688,83.7212,127.9688,71.7212,115.9688,83.7212,103.9688" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="185.2979" y="138.1792">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="195.1533" x="83.7212" y="119.7769">cumin stops after the current runs?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="290.8745" y="113.3745">no</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="129.916" x="116.3398" y="341.6719"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="91.8926" x="126.3398" y="362.8105">clear the mark:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="109.916" x="126.3398" y="376.7793">a later wait is new</text><ellipse cx="181.2979" cy="420.6094" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="181.2979" cy="420.6094" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="56.4387,278.8555,306.157,278.8555,318.157,298.0625,306.157,317.2695,56.4387,317.2695,44.4387,298.0625,56.4387,278.8555" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="185.2979" y="327.48">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="239.626" x="56.4387" y="289.0659">the poll decided an action in any repository</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="249.7183" x="56.4387" y="301.8706">(a start that only the quota stops counts, Q1)</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="97.2651" x="56.4387" y="314.6753">or an agent runs?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="318.157" y="295.4683">no</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="294.623" x="33.9863" y="522.0117"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="90.2871" x="43.9863" y="543.1504">no notification:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="274.623" x="43.9863" y="557.1191">a repository that was not read may hold work</text><ellipse cx="181.2979" cy="602.4805" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="181.2979" cy="602.4805" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="72.3936,473.6094,290.2021,473.6094,302.2021,485.6094,290.2021,497.6094,72.3936,497.6094,60.3936,485.6094,72.3936,473.6094" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="185.2979" y="507.8198">no</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="217.8086" x="72.3936" y="489.4175">the poll of every repository succeeded?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="302.2021" y="483.0151">yes</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="340.5957" x="11" y="705.4922"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="90.2871" x="21" y="726.6309">no notification:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="320.5957" x="21" y="740.5996">the quota notification (Q1) already named the cause;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="132.5859" x="21" y="754.5684">the mark stays as it is</text><ellipse cx="181.2979" cy="798.3984" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="181.2979" cy="798.3984" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="62.073,655.4805,300.5227,655.4805,312.5227,668.2852,300.5227,681.0898,62.073,681.0898,50.073,668.2852,62.073,655.4805" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="185.2979" y="691.3003">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="236.9404" x="62.073" y="665.6909">a start of an agent waits only for the quota</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="238.4497" x="62.073" y="678.4956">in any repository, in any state of the issue?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="312.5227" y="665.6909">no</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="152.5859" x="105.0049" y="939.8242"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="90.2871" x="115.0049" y="960.9629">no notification;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="132.5859" x="115.0049" y="974.9316">the mark stays as it is</text><ellipse cx="181.2979" cy="1018.7617" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="181.2979" cy="1018.7617" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="45.5381,851.3984,317.0576,851.3984,329.0576,883.4102,317.0576,915.4219,45.5381,915.4219,33.5381,883.4102,45.5381,851.3984" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="185.2979" y="925.6323">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="271.5195" x="45.5381" y="861.6089">an issue that cumin moves on without the Owner</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="134.5513" x="45.5381" y="874.4136">exists in any repository?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="147.9629" x="45.5381" y="887.2183">(checking, a working label,</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="114.0767" x="45.5381" y="900.0229">or ready and waiting</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="163.3296" x="45.5381" y="912.8276">only for room under the limit)</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="329.0576" y="880.8159">no</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="170.2871" x="96.1543" y="1120.1641"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="90.2871" x="106.1543" y="1141.3027">no notification:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="150.2871" x="106.1543" y="1155.2715">the Owner already heard</text><ellipse cx="181.2979" cy="1200.6328" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="181.2979" cy="1200.6328" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="137.134,1071.7617,225.4617,1071.7617,237.4617,1083.7617,225.4617,1095.7617,137.134,1095.7617,125.134,1083.7617,137.134,1071.7617" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="185.2979" y="1105.9722">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="88.3276" x="137.134" y="1087.5698">the mark is set?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="237.4617" y="1081.1675">no</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="253.9004" x="54.3477" y="1253.6328"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="233.9004" x="64.3477" y="1274.7715">Q4: notify the Owner that cumin waits;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="76.5879" x="64.3477" y="1288.7402">set the mark</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="227.2383" x="64.3477" y="1302.709">(clear it again when the channel fails)</text><ellipse cx="181.2979" cy="1346.5391" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="181.2979" cy="1346.5391" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="181.2979" x2="181.2979" y1="30" y2="50"/><polygon fill="#181818" points="177.2979,40,181.2979,50,185.2979,40,181.2979,44" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="181.2979" x2="181.2979" y1="186.3398" y2="214.8555"/><polygon fill="#181818" points="177.2979,204.8555,181.2979,214.8555,185.2979,204.8555,181.2979,208.8555" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="181.2979" x2="181.2979" y1="127.9688" y2="152.3711"/><polygon fill="#181818" points="177.2979,142.3711,181.2979,152.3711,185.2979,142.3711,181.2979,146.3711" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="290.8745" x2="302.8745" y1="115.9688" y2="115.9688"/><polygon fill="#181818" points="298.8745,184.8555,302.8745,194.8555,306.8745,184.8555,302.8745,188.8555" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="302.8745" x2="302.8745" y1="115.9688" y2="258.8555"/><line style="stroke:#181818;stroke-width:1;" x1="302.8745" x2="181.2979" y1="258.8555" y2="258.8555"/><line style="stroke:#181818;stroke-width:1;" x1="181.2979" x2="181.2979" y1="258.8555" y2="278.8555"/><polygon fill="#181818" points="