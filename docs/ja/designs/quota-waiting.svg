s not read may hold work</text><ellipse cx="207.7529" cy="602.4805" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="207.7529" cy="602.4805" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="98.8486,473.6094,316.6572,473.6094,328.6572,485.6094,316.6572,497.6094,98.8486,497.6094,86.8486,485.6094,98.8486,473.6094" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="211.7529" y="507.8198">no</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="217.8086" x="98.8486" y="489.4175">the poll of every repository succeeded?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="328.6572" y="483.0151">yes</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="393.5059" x="11" y="705.4922"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="90.2871" x="21" y="726.6309">no notification:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="373.5059" x="21" y="740.5996">the notification of stop agent starts already named the cause;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="132.5859" x="21" y="754.5684">the mark stays as it is</text><ellipse cx="207.7529" cy="798.3984" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="207.7529" cy="798.3984" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="88.5281,655.4805,326.9778,655.4805,338.9778,668.2852,326.9778,681.0898,88.5281,681.0898,76.5281,668.2852,88.5281,655.4805" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="211.7529" y="691.3003">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="236.9404" x="88.5281" y="665.6909">a start of an agent waits only for the quota</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="238.4497" x="88.5281" y="678.4956">in any repository, in any state of the issue?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="338.9778" y="665.6909">no</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="152.5859" x="131.46" y="939.8242"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="90.2871" x="141.46" y="960.9629">no notification;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="132.5859" x="141.46" y="974.9316">the mark stays as it is</text><ellipse cx="207.7529" cy="1018.7617" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="207.7529" cy="1018.7617" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="66.2917,851.3984,349.2141,851.3984,361.2141,883.4102,349.2141,915.4219,66.2917,915.4219,54.2917,883.4102,66.2917,851.3984" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="211.7529" y="925.6323">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="282.9224" x="66.2917" y="861.6089">an issue that cumin moves on without a Maintainer</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="134.5513" x="66.2917" y="874.4136">exists in any repository?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="147.9629" x="66.2917" y="887.2183">(checking, a working label,</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="114.0767" x="66.2917" y="900.0229">or ready and waiting</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="163.3296" x="66.2917" y="912.8276">only for room under the limit)</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="361.2141" y="880.8159">no</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="216.875" x="99.3154" y="1120.1641"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="90.2871" x="109.3154" y="1141.3027">no notification:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="196.875" x="109.3154" y="1155.2715">the notification was already sent</text><ellipse cx="207.7529" cy="1200.6328" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="207.7529" cy="1200.6328" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="163.5891,1071.7617,251.9167,1071.7617,263.9167,1083.7617,251.9167,1095.7617,163.5891,1095.7617,151.5891,1083.7617,163.5891,1071.7617" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="211.7529" y="1105.9722">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="88.3276" x="163.5891" y="1087.5698">the mark is set?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="263.9167" y="1081.1675">no</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" w