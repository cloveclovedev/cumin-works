<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1000px" preserveAspectRatio="none" style="width:314px;height:1000px;background:#FFFFFF;" version="1.1" viewBox="0 0 314 1000" width="314px" zoomAndPan="magnify"><defs/><g><ellipse cx="152.6748" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="283.3496" x="11" y="50"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="263.3496" x="21" y="71.1387">the poll of a repository ran every tool check</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="146.0098" x="21" y="85.1074">and kept the failed ones</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="215.5391" x="44.9053" y="166.3398"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="195.5391" x="54.9053" y="187.4785">clear the mark of the repository:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="122.877" x="54.9053" y="201.4473">a later failure is new</text><ellipse cx="152.6748" cy="246.8086" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="152.6748" cy="246.8086" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="51.8809,117.9375,253.4688,117.9375,265.4688,129.9375,253.4688,141.9375,51.8809,141.9375,39.8809,129.9375,51.8809,117.9375" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="156.6748" y="152.1479">no</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="201.5879" x="51.8809" y="133.7456">a tool check of the repository failed?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="265.4688" y="127.3433">yes</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="216.875" x="44.2373" y="348.2109"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="90.2871" x="54.2373" y="369.3496">no notification:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="196.875" x="54.2373" y="383.3184">the notification was already sent</text><ellipse cx="152.6748" cy="428.6797" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="152.6748" cy="428.6797" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="61.0063,299.8086,244.3433,299.8086,256.3433,311.8086,244.3433,323.8086,61.0063,323.8086,49.0063,311.8086,61.0063,299.8086" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="156.6748" y="334.019">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="183.3369" x="61.0063" y="315.6167">the mark of the repository is set?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="256.3433" y="309.2144">no</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="200.2344" x="52.5576" y="481.6797"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="180.2344" x="62.5576" y="502.8184">set the mark of the repository</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="110.2871" x="97.5313" y="584.0508"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="90.2871" x="107.5313" y="605.1895">no notification;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="89.9121" x="107.5313" y="619.1582">the mark stays</text><ellipse cx="152.6748" cy="664.5195" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="152.6748" cy="664.5195" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="40.8674,535.6484,264.4822,535.6484,276.4822,547.6484,264.4822,559.6484,40.8674,559.6484,28.8674,547.6484,40.8674,535.6484" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="14.4751" x="156.6748" y="569.8589">off</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="223.6147" x="40.8674" y="551.4565">notify.discord.enabled of the repository?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="276.4822" y="545.0542">on</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="248.9668" x="28.1914" y="717.5195"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="144.5801" x="38.1914" y="738.6582">stop agent starts: notify</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="228.9668" x="38.1914" y="752.627">(the repository and each failed check)</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="163.2441" x="71.0527" y="833.8594"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="91.8926" x="81.0527" y="854.998">clear the mark:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="143.2441" x="81.0527" y="868.9668">the next poll tries again</text><ellipse cx="152.6748" cy="914.3281" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="152.6748" cy="914.3281" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="59.9456,785.457,245.4041,785.457,257.4041,797.457,245.4041,809.457,59.9456,809.457,47.9456,797.457,59.9456,785.457" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="156.6748" y="819.6675">no</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="185.4585" x="59.9456" y="801.2651">the channel took the notification?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="257.4041" y="794.8628">yes</text><ellipse cx="152.6748" cy="978.3281" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="152.6748" cy="978.3281" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="152.6748" x2="152.6748" y1="30" y2="50"/><polygon fill="#181818" points="148.6748,40,152.6748,50,156.6748,40,152.6748,44" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="152.6748" x2="152.6748" y1="214.2773" y2="235.8086"/><polygon fill="#181818" points="148.6748,225.8086,152.6748,235.8086,156.6748,225.8086,152.6748,229.8086" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="152.6748" x2="152.6748" y1="141.9375" y2="166.3398"/><polygon fill="#181818" points="148.6748,156.3398,152.6748,166.3398,156.6748,156.3398,152.6748,160.3398" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="265.4688" x2="277.4688" y1="129.9375" y2="129.9375"/><polygon fill="#1818