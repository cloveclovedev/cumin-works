<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="775px" preserveAspectRatio="none" style="width:591px;height:775px;background:#FFFFFF;" version="1.1" viewBox="0 0 591 775" width="591px" zoomAndPan="magnify"><defs/><g><ellipse cx="282.5549" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="235.2324" x="164.9387" y="50"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="215.2324" x="174.9387" y="71.1387">Read the check runs of the commit,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="151.043" x="174.9387" y="85.1074">every attempt (filter=all)</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="262.3555" x="151.3772" y="117.9375"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="242.3555" x="161.3772" y="139.0762">Keep the runs of the name of the check,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="154.6816" x="161.3772" y="153.0449">and of the App of the rule</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="193.5664" x="185.7717" y="234.2773"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="173.5664" x="195.7717" y="255.416">Text: the name of the check,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="165.9668" x="195.7717" y="269.3848">"could not read its content"</text><ellipse cx="282.5549" cy="314.7461" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="282.5549" cy="314.7461" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="235.3806,185.875,329.7292,185.875,341.7292,197.875,329.7292,209.875,235.3806,209.875,223.3806,197.875,235.3806,185.875" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="286.5549" y="220.0854">no</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="94.3486" x="235.3806" y="201.6831">a run that failed?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="341.7292" y="195.2808">yes</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="208.6836" x="178.2131" y="367.7461"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="188.6836" x="188.2131" y="388.8848">Take the newest run that failed</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="92.1387" x="188.2131" y="402.8535">(the highest id)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="254.0469" x="155.5315" y="435.6836"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="234.0469" x="165.5315" y="456.8223">Read the failure annotations of the run</text><polygon fill="#F1F1F1" points="144.3057,489.6523,420.8042,489.6523,432.8042,515.2617,420.8042,540.8711,144.3057,540.8711,132.3057,515.2617,144.3057,489.6523" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="169.0928" x="144.3057" y="499.8628">details_url: https://github.com,</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="83.0317" x="144.3057" y="512.6675">and the path is</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="276.4985" x="144.3057" y="525.4722">/&lt;owner&gt;/&lt;repo&gt;/actions/runs/&lt;n&gt;/job/&lt;job id&gt;</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="99.3706" x="144.3057" y="538.2769">of this repository?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="113.2974" y="512.6675">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="432.8042" y="512.6675">no</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="222.6113" x="11" y="550.8711"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="202.6113" x="21" y="572.0098">Read the end of the log of the job</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="113.668" x="385.9702" y="550.8711"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="93.668" x="395.9702" y="572.0098">Read no job log</text><polygon fill="#F1F1F1" points="282.5549,590.8398,294.5549,602.8398,282.5549,614.8398,270.5549,602.8398,282.5549,590.8398" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="180.3301" x="192.3899" y="634.8398"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="132.9023" x="202.3899" y="655.9785">Text: the annotations,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="160.3301" x="202.3899" y="669.9473">then the end of the job log</text><path d="M313.5549,692.7773 L313.5549,724.043 L293.5549,728.043 L313.5549,732.043 L313.5549,763.3086 A0,0 0 0 0 313.5549,763.3086 L579.0857,763.3086 A0,0 0 0 0 579.0857,763.3086 L579.0857,702.7773 L569.0857,692.7773 L313.5549,692.7773 A0,0 0 0 0 313.5549,692.7773" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M569.0857,692.7773 L569.0857,702.7773 L579.0857,702.7773 L569.0857,692.7773" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.4907" x="319.5549" y="709.8442">Without filter=all, GitHub lists only</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.5308" x="319.5549" y="724.9771">the latest attempt of a name. A rerun</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.0293" x="319.5549" y="740.1099">that passed then hides the attempt</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="70.6812" x="319.5549" y="755.2427">that failed.</text><ellipse cx="282.5549" cy="728.043" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="282.5549" cy="728.043" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="282.5549" x2="282.5549" y1="30" y2="50"/><polygon fill="#181818" points="278.5549,40,282.5549,50,286.5549,40,282.5549,44" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="282.5549" x2="282.5549" y1="97.9375" y2="117.9375"/><polygon fill="#181818" points="278.5549,107.9375,282.5549,117.9375,286.5549,107.9375,282.5549,111.9375" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="282.5549" x2="282.5549" y1="282.2148" y2="303.7461"/><polygon fill="#181818" points="278.5549,293.7461,282.5549,303.7461,286.5549,293.7461,282.5549,297.7461" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="282.5549" x2