<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1160px" preserveAspectRatio="none" style="width:704px;height:1160px;background:#FFFFFF;" version="1.1" viewBox="0 0 704 1160" width="704px" zoomAndPan="magnify"><defs/><g><ellipse cx="168.7793" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="75.875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="303.4414" x="17.0586" y="50"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="161.4023" x="27.0586" y="71.1387">The only open blocker is in</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="233.8535" x="27.0586" y="85.1074">cumin/status/awaiting-merge-decision,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="283.4414" x="27.0586" y="99.0762">its pull request has the default branch as base,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="203.0859" x="27.0586" y="113.0449">and deleteBranchOnMerge is true</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="314.9492" x="11.3047" y="145.875"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="172.3242" x="21.3047" y="167.0137">request the implementation:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="294.9492" x="21.3047" y="180.9824">the branch starts from the branch of the blocker,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="270.0586" x="21.3047" y="194.9512">and the pull request has that branch as base</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="299.6504" x="18.9541" y="271.7813"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="279.6504" x="28.9541" y="292.9199">Checks and the review, as for any pull request</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="194.3613" x="28.9541" y="306.8887">(a conflict with the base branch:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="172.9336" x="28.9541" y="320.8574">request a conflict resolution)</text><rect fill="#FFC0CB" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="315.5586" x="11" y="429.3086"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="152.3613" x="21" y="450.4473">stop the implementation:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="295.5586" x="21" y="464.416">cumin/status/awaiting-decision and a notification</text><ellipse cx="168.7793" cy="508.2461" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="168.7793" cy="508.2461" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="48.4749,353.6875,289.0837,353.6875,301.0837,379.2969,289.0837,404.9063,48.4749,404.9063,36.4749,379.2969,48.4749,353.6875" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="172.7793" y="415.1167">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="230.667" x="48.4749" y="363.8979">The base pull request of the blocker issue</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="240.6089" x="48.4749" y="376.7026">is closed without a merge, or GitHub closed</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="215.6655" x="48.4749" y="389.5073">the stacked pull request, or the update</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="227.0791" x="48.4749" y="402.312">left the head without the merge commit?</text><rect fill="#ADD8E6" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="185.8438" x="75.8574" y="611.2578"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="105.4922" x="85.8574" y="632.3965">wait for the base:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="165.8438" x="85.8574" y="646.3652">cumin/status/awaiting-base</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="283.666" x="26.9463" y="683.375"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="254.7715" x="36.9463" y="704.5137">The Maintainer merges the base (squash).</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="245.3496" x="36.9463" y="718.4824">GitHub deletes the branch of the blocker</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="263.666" x="36.9463" y="732.4512">and changes the base to the default branch</text><rect fill="#FFC0CB" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="315.5586" x="11" y="815.293"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="152.3613" x="21" y="836.4316">stop the implementation:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="295.5586" x="21" y="850.4004">cumin/status/awaiting-decision and a notification</text><ellipse cx="168.7793" cy="895.3594" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="168.7793" cy="895.3594" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="62.6975,765.2813,274.8611,765.2813,286.8611,778.0859,274.8611,790.8906,62.6975,790.8906,50.6975,778.0859,62.6975,765.2813" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="172.7793" y="801.1011">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="212.1636" x="62.6975" y="775.4917">The base is still not the default branch</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="187.5801" x="62.6975" y="788.2964">one poll_interval after the merge?</text><polygon fill="#F1F1F1" points="36.2019,561.2461,301.3567,561.2461,313.3567,574.0508,301.3567,586.8555,36.2019,586.8555,24.2019,574.0508,36.2019,561.2461" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="172.7793" y="597.0659">no</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="167.2236" x="36.2019" y="571.4565">The base of the pull request is</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="265.1548" x="36.2019" y="584.2612">the default branch, and every blocker is closed?</text><polygon fill="#F1F1F1" points="168.7793,948.3594,180.7793,960.3594,168.7793,972.3594,156.7793,960.3594,168.7793,948.3594" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="168.7793,227.7813,180.7793,239.7813,168.7793,251.7813,156.7793,239.7813,168.7793,227.7813" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="65.1038,992.3594,272.4548,992.3594,284.4548,1005.1641,272.4548,1017.9688,65.1038,1017.9688,53.1038,1005.1641,65.1038,992.3594" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="207.3511" x="65.1038" y="1002.5698">The head contains the merge commit</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="136.8232" x="65.1038" y="1015.3745">of the base pull request?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="284.4548" y="1002.5698">no</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="324.5996" x="368.5586" y="591.4688"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="192.2051" x="378.5586" y="612.6074">update onto the default branch:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="304.5996" x="378.5586" y="626.5762">cumin/status/implementing, then the Implementer</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="292.7637" x="378.5586" y="640.5449">merges the default branch with a merge commit</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="298.4727" x="19.543" y="1059.3677"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="278.4727" x="29.543" y="1080.5063">ask for the merge decision or start the merge,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="135.1934" x="29.543" y="1094.4751">as for any pull request</text><ellipse cx="168.7793" cy="1138.3052" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="168.7793" cy="1138.3052" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="168.7793" x2="168.7793" y1="30" y2="50"/><polygon fill="#181818" points="164.7793,40,168.7793,50,172.7793,40,168.7793,44" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="168.7793" x2="168.7793" y1="125.875" y2="145.875"/><polygon fill="#181818" points="164.7793,135.875,168.7793,145.875,172.7793,135.875,168.7793,139.875" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="168.7793" x2="168.7793" y1="477.2461" y2="497.2461"/><polygon fill="#181818" points="164.7793,487.2461,168.7793,497.2461,172.7793,487.2461,168.7793,491.2461" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="168.7793" x2="168.7793" y1="404.9063" y2="429.3086"/><polygon fill="#181818" points="164.7793,419.3086,168.7793,429.3086,172.7793,419.3086,168.7793,423.3086" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="301.0837" x2="336.5586" y1="379.2969" y2="379.2969"/><polygon fill="#181818" points="332.5586,461.9727,336.5586,471.9727,340.5586,461.9727,336.5586,465.9727" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="336.5586" x2="336.5586" y1="379.2969" y2="541.2461"/><line style="stroke:#181818;stroke-width:1;" x1="336.5586" x2="168.7793" y1="541.2461" y2="541.2461"/><line style="stroke:#181818;stroke-width:1;" x1="168.7793" x2="168.7793" y1="541.2461" y2="561.2461"/><polygon fill="#181818" points="164.7793,551.2461,168.7793,561.2461,172.7793,551.2461,168.7793,555.2461" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="168.7793" x2="168.7793" y1="333.6875" y2="353.6875"/><polygon fill="#181818" points="164.7793,343.6875,168.7793,353.6875,172.7793,343.6875,168.7793,347.6875" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="168.7793" x2="168.7793" y1="659.1953" y2="683.375"/><polygon fill="#181818" points="164.7793,673.375,168.7793,683.375,172.7793,673.375,168.7