<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="994px" preserveAspectRatio="none" style="width:686px;height:994px;background:#FFFFFF;" version="1.1" viewBox="0 0 686 994" width="686px" zoomAndPan="magnify"><defs/><g><ellipse cx="168.7793" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="75.875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="303.4414" x="17.0586" y="50"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="161.4023" x="27.0586" y="71.1387">The only open blocker is in</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="233.8535" x="27.0586" y="85.1074">cumin/status/awaiting-merge-decision,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="283.4414" x="27.0586" y="99.0762">its pull request has the default branch as base,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="203.0859" x="27.0586" y="113.0449">and deleteBranchOnMerge is true</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="314.9492" x="11.3047" y="145.875"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="172.3242" x="21.3047" y="167.0137">request the implementation:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="294.9492" x="21.3047" y="180.9824">the branch starts from the branch of the blocker,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="270.0586" x="21.3047" y="194.9512">and the pull request has that branch as base</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="299.6504" x="18.9541" y="271.7813"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="279.6504" x="28.9541" y="292.9199">Checks and the review, as for any pull request</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="194.3613" x="28.9541" y="306.8887">(a conflict with the base branch:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="172.9336" x="28.9541" y="320.8574">request a conflict resolution)</text><rect fill="#FFC0CB" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="315.5586" x="11" y="416.5039"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="152.3613" x="21" y="437.6426">stop the implementation:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="295.5586" x="21" y="451.6113">cumin/status/awaiting-decision and a notification</text><ellipse cx="168.7793" cy="495.4414" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="168.7793" cy="495.4414" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="74.0225,353.6875,263.5361,353.6875,275.5361,372.8945,263.5361,392.1016,74.0225,392.1016,62.0225,372.8945,74.0225,353.6875" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="172.7793" y="402.312">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="170.3872" x="74.0225" y="363.8979">The base pull request is closed</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="189.5137" x="74.0225" y="376.7026">without a merge, or GitHub closed</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="139.4551" x="74.0225" y="389.5073">the stacked pull request?</text><rect fill="#ADD8E6" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="185.8438" x="75.8574" y="621.8555"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="105.4922" x="85.8574" y="642.9941">wait for the base:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="165.8438" x="85.8574" y="656.9629">cumin/status/awaiting-base</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="283.666" x="26.9463" y="700.7109"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="254.7715" x="36.9463" y="721.8496">The Maintainer merges the base (squash).</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="245.3496" x="36.9463" y="735.8184">GitHub deletes the branch of the blocker</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="263.666" x="36.9463" y="749.7871">and changes the base to the default branch</text><polygon fill="#F1F1F1" points="36.2019,571.8438,301.3567,571.8438,313.3567,584.6484,301.3567,597.4531,36.2019,597.4531,24.2019,584.6484,36.2019,571.8438" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="172.7793" y="607.6636">no</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="167.2236" x="36.2019" y="582.0542">The base of the pull request is</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="265.1548" x="36.2019" y="594.8589">the default branch, and every blocker is closed?</text><polygon fill="#F1F1F1" points="168.7793,782.6172,180.7793,794.6172,168.7793,806.6172,156.7793,794.6172,168.7793,782.6172" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="168.7793,227.7813,180.7793,239.7813,168.7793,251.7813,156.7793,239.7813,168.7793,227.7813" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="65.1038,826.6172,272.4548,826.6172,284.4548,839.4219,272.4548,852.2266,65.1038,852.2266,53.1038,839.4219,65.1038,826.6172" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="207.3511" x="65.1038" y="836.8276">The head contains the merge commit</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="136.8232" x="65.1038" y="849.6323">of the base pull request?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="284.4548" y="836.8276">no</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="324.5996" x="350.5586" y="498.293"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="192.2051" x="360.5586" y="519.4316">update onto the default branch:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="304.5996" x="360.5586" y="533.4004">cumin/status/implementing, then the Implementer</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="249.6973" x="360.5586" y="547.3691">merges origin/main with a merge commit</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="298.4727" x="19.543" y="893.6255"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="278.4727" x="29.543" y="914.7642">ask for the merge decision or start the merge,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="135.1934" x="29.543" y="928.7329">as for any pull request</text><ellipse cx="168.7793" cy="972.563" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="168.7793" cy="972.563" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="168.7793" x2="168.7793" y1="30" y2="50"/><polygon fill="#181818" points="164.7793,40,168.7793,50,172.7793,40,168.7793,44" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="168.7793" x2="168.7793" y1="125.875" y2="145.875"/><polygon fill="#181818" points="164.7793,135.875,168.7793,145.875,172.7793,135.875,168.7793,139.875" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="168.7793" x2="168.7793" y1="464.4414" y2="484.4414"/><polygon fill="#181818" points="164.7793,474.4414,168.7793,484.4414,172.7793,474.4414,168.7793,478.4414" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="168.7793" x2="168.7793" y1="392.1016" y2="416.5039"/><polygon fill="#181818" points="164.7793,406.5039,168.7793,416.5039,172.7793,406.5039,168.7793,410.5039" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="275.5361" x2="336.5586" y1="372.8945" y2="372.8945"/><polygon fill="#181818" points="332.5586,452.3691,336.5586,462.3691,340.5586,452.3691,336.5586,456.3691" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="336.5586" x2="336.5586" y1="372.8945" y2="536.8438"/><line style="stroke:#181818;stroke-width:1;" x1="336.5586" x2="168.7793" y1="536.8438" y2="536.8438"/><line style="stroke:#181818;stroke-width:1;" x1="168.7793" x2="168.7793" y1="536.8438" y2="571.8438"/><polygon fill="#181818" points="164.7793,561.8438,168.7793,571.8438,172.7793,561.8438,168.7793,565.8438" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="168.7793" x2="168.7793" y1="333.6875" y2="353.6875"/><polygon fill="#181818" points="164.7793,343.6875,168.7793,353.6875,172.7793,343.6875,168.7793,347.6875" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="168.7793" x2="168.7793" y1="669.793" y2="700.7109"/><polygon fill="#181818" points="164.7793,690.7109,168.7793,700.7109,172.7793,690.7109,168.7793,694.7109" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="168.7793" x2="168.7793" y1="597.4531" y2="621.8555"/><polygon fill="#181818" points="164.7793,611.8555,168.7793,621.8555,172.7793,611.8555,168.7793,615.8555" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="313.3567" x2="325.3567" y1="584.6484" y2="584.6484"/><polygon fill="#181818" points="321.3567,679.793,325.3567,689.793,329.3567,679.793,325.3567,683.793" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="325.3567" x2="325.3567" y1="584.6484" y2="794.6172"/><line style="stroke:#181818;stroke-width:1;" x1="325.3567" x2="180.7793" y1="794.6172" y2="794.6172"/><polygon fill="#181818" points="190.7793,790.6172,180.7793,794.6172,190.7793,798.6172,186.7793,794.6172" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="168.7793" x2="168.7793" y1="762.6172" y2="782.6172"/><polygon fill="#181818" points="164.7793,772.6172,168.7793,782.6172,172.7793,772.6172,168.7793,776.6172" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="168.7793" x2="168.7793" y1="251.7813" y2="271.7813"/><polygon fill="#181818" points="164.7793,261.7813,168.7793,271.7813,172.7793,261.7813,168.7793,265.7813" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="284.4548" x2="512.8584" y1="839.4219" y2="839.4219"/><line style="stroke:#181818;stroke-width:1;" x1="512.8584" x2="512.8584" y1="560.1992" y2="839.4219"/><polygon fill=