<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="571px" preserveAspectRatio="none" style="width:676px;height:571px;background:#FFFFFF;" version="1.1" viewBox="0 0 676 571" width="676px" zoomAndPan="magnify"><defs/><g><ellipse cx="242.9243" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="216.4473" x="134.7007" y="50"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="196.4473" x="144.7007" y="71.1387">poll: an issue can start (R1 or I1)</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="187.7012" x="149.0737" y="103.9688"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="167.7012" x="159.0737" y="125.1074">minimal run of Claude Code</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="100.1836" x="159.0737" y="139.0762">(read the usage)</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="211.5313" x="137.1587" y="171.9063"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="191.5313" x="147.1587" y="193.0449">store the usage, its reset times,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="147" x="147.1587" y="207.0137">and the time of the read</text><path d="M408.5806,236.1133 L408.5806,259.8125 L388.5806,263.8125 L408.5806,267.8125 L408.5806,291.5117 A0,0 0 0 0 408.5806,291.5117 L664.3359,291.5117 A0,0 0 0 0 664.3359,291.5117 L664.3359,246.1133 L654.3359,236.1133 L408.5806,236.1133 A0,0 0 0 0 408.5806,236.1133" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M654.3359,236.1133 L654.3359,246.1133 L664.3359,246.1133 L654.3359,236.1133" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#D62728" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234.7554" x="414.5806" y="253.1802">The rule takes the location as input.</text><text fill="#D62728" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.4233" x="414.5806" y="268.313">cumin passes the zone of the Host;</text><text fill="#D62728" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="153.2769" x="414.5806" y="283.4458">tests pass a fixed zone.</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#D62728;stroke-width:3;" width="291.3125" x="97.2681" y="239.8438"/><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="271.3125" x="107.2681" y="260.9824">5h limit = threshold of the current time band</text><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="238.6348" x="107.2681" y="274.9512">(100% while the allowance of Q2 holds)</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="269.8027" x="108.0229" y="311.5117"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="149.0215" x="118.0229" y="332.6504">weekly limit = pace limit</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="249.8027" x="118.0229" y="346.6191">target x min(1, (elapsed + lead) / 7 days)</text><polygon fill="#F1F1F1" points="149.2578,379.4492,336.5908,379.4492,348.5908,392.2539,336.5908,405.0586,149.2578,405.0586,137.2578,392.2539,149.2578,379.4492" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="117.7505" x="149.2578" y="389.6597">5h usage &gt;= 5h limit</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="187.333" x="149.2578" y="402.4644">or weekly usage &gt;= weekly limit?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="118.2495" y="389.6597">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="348.5908" y="389.6597">no</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#D62728;stroke-width:3;" width="212.8379" x="11" y="415.0586"/><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="75.6914" x="21" y="436.1973">Q1: no start;</text><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="192.8379" x="21" y="450.166">compute the next try time (Q3):</text><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="192.5508" x="21" y="464.1348">next start or end of a time band</text><ellipse cx="117.4189" cy="507.9648" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="117.4189" cy="507.9648" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="249.1836" x="243.8379" y="415.0586"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="229.1836" x="253.8379" y="436.1973">change the label, then start the agent</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="56.4141" x="253.8379" y="450.166">(R1 or I1)</text><ellipse cx="242.9243" cy="549.9648" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="242.9243" cy="549.9648" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="242.9