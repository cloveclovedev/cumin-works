:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="83.1582" x2="264.4453" y1="345.9219" y2="345.9219"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="96.2749" x="95.1582" y="340.856">Run returns nil</text></g><path d="M26,358.9219 L26,413.9219 L738,413.9219 L738,368.9219 L728,358.9219 L26,358.9219" fill="#FFFFFF" style="stroke:#D62728;stroke-width:0.5;"/><path d="M728,358.9219 L728,368.9219 L738,368.9219 L728,358.9219" fill="#FFFFFF" style="stroke:#D62728;stroke-width:0.5;"/><text fill="#D62728" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="323.502" x="203.4016" y="375.9888">The tests wait on these signals and assert the log</text><text fill="#D62728" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="348.4927" x="203.4016" y="391.1216">of the stop ("ended_within_grace"), not elapsed time.</text><text fill="#D62728" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="294.9946" x="203.4016" y="406.2544">One generous deadline stays against a hang.</text><!--SRC=[bLDDZzCm4BtdLuowbrPgkz8U08LLBg0590GIS6FHQZQPEAEwus0x3VnxnawJLVaua4iIpzTxRvx3WQL7ZqS87JPkP37GeWrKX2NIK8k3ZNTEuWSy4WIKi0lakIqApOXSSuyIOHKfn7jPiqJoWlPwTFxGMZTkLe01KlGoltVMWdMkp_7qTnblyK3mXkFRuJ5dcEuoZeOaxZ-JFt5DEIEVXBzqUVN-NKweBHT5GWAxAayiuTCWHKQY9wOhmHCs43lbATY7piN2TB3xUlNwsStpcnVRHsURRrLcKy9jxQppvJbM1JRAkmHSQgTkw3sVg85rtQ48sStjTIwivi7L6Na98IhsFDuF0ciKfzyUZFDkY2oqAQRCX5R9p0KZnswgekz34bfZ_mbwdfaR9h0jMmBdGNJf3VJSqnFkImb3TBsIGwd9vZwrUeL-nCqYx4nlH8xGQjFpD4c6qtTOQ2rDPpmaJKAZTcpqaDM0be-yzDxDj7IFoZuENW88sqALK_Wd5I_5jqajkBhBpqkhIfOJ__ozJm8LyBiqNnH2AWuJRYS9L51dPCdKRgAx3NeLferPPnQ1_kZbsibKMQfL9lMGjiRoO3ogVpTRKCX0LfsZX1FJ_R_RVHG2LOpK5a5lA3Q9HjhTptGBa4NtWw1sCqzDT6WQGRy0]--></g></svg>