<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="660px" preserveAspectRatio="none" style="width:854px;height:660px;background:#FFFFFF;" version="1.1" viewBox="0 0 854 660" width="854px" zoomAndPan="magnify"><defs/><g><ellipse cx="422.4583" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="none" height="138.1406" style="stroke:#000000;stroke-width:1.5;" width="396.4727" x="224.2219" y="40"/><path d="M453.6213,40 L453.6213,49.2969 L443.6213,59.2969 L224.2219,59.2969" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="219.3994" x="227.2219" y="53.9951">Decision (pure function, no I/O)</text><rect fill="#F1F1F1" height="89.8438" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="376.4727" x="234.2219" y="76.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="134.2148" x="244.2219" y="97.4355">Collect the candidates</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="356.4727" x="244.2219" y="111.4043">- open sub-issues with cumin/status/awaiting-owner-review</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="208.9395" x="244.2219" y="125.373">- a review of a person that decides</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="233.3496" x="251.8508" y="139.3418">(APPROVED or CHANGES_REQUESTED)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="235.6875" x="251.8508" y="153.3105">on the head commit of the pull request</text><rect fill="none" height="419.2344" style="stroke:#000000;stroke-width:1.5;" width="832.9165" x="11" y="188.1406"/><path d="M60.5254,188.1406 L60.52