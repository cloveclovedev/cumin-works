/implementing</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#D62728;stroke-width:3;" width="246.7461" x="193.9102" y="421.5313"/><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="146.7715" x="203.9102" y="442.6699">Ask the Implementer:</text><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="186.0234" x="203.9102" y="456.6387">request "owner review fix",</text><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="226.7461" x="203.9102" y="470.6074">it names the review of the Owner</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="199.9355" x="217.3154" y="503.4375"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="179.9355" x="227.3154" y="524.5762">done: I2, the required checks,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="119.3379" x="227.3154" y="538.5449">the review, I7 again</text><path d="M570.5313,353.5938 L570.5313,369.7266 L550.5313,373.7266 L570.5313,377.7266 L570.5313,393.8594 A0,0 0 0 0 570.5313,393.8594 L833.9165,393.8594 A0,0 0 0 0 833.9165,393.8594 L833.9165,363.5938 L823.9165,353.5938 L570.5313,353.5938 A0,0 0 0 0 570.5313,353.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M823.9165,353.5938 L823.9165,363.5938 L833.9165,363.5938 L823.9165,353.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.7915" x="576.5313" y="370.6606">This issue: the request text</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.3853" x="576.5313" y="385.7935">and the rule of the Implementer role.</text><rec