<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="660px" preserveAspectRatio="none" style="width:830px;height:660px;background:#FFFFFF;" version="1.1" viewBox="0 0 830 660" width="830px" zoomAndPan="magnify"><defs/><g><ellipse cx="415.3833" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="none" height="138.1406" style="stroke:#000000;stroke-width:1.5;" width="443.6289" x="193.5688" y="40"/><path d="M422.9683,40 L422.9683,49.2969 L412.9683,59.2969 L193.5688,59.2969" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="219.3994" x="196.5688" y="53.9951">Decision (pure function, no I/O)</text><rect fill="#F1F1F1" height="89.8438" rx="12.5" ry="12.5" style="stroke:#D62728;stroke-width:3;" width="423.6289" x="203.5688" y="76.2969"/><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="151.2012" x="213.5688" y="97.4355">Collect the candidates</text><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="403.6289" x="213.5688" y="111.4043">- open sub-issues with cumin/status/awaiting-owner-review</text><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="235.6172" x="213.5688" y="125.373">- a review of a person that decides</text><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="258.6855" x="221.9243" y="139.3418">(APPROVED or CHANGES_REQUESTED)</text><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="265.4824" x="221.9243" y="153.3105">on the head commit of the pull request</text><rect fill="none" height="419.2344" style="stroke:#000000;stroke-width:1.5;" width="808.7666" x="11" y="188.1406"/><path d="M60.5254,188.1406 L60.5254,197.4375 L50.5254,207.4375 L11,207.4375" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="39.5254" x="14" y="202.1357">Apply</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="272.9727" x="278.897" y="224.4375"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="227.9707" x="288.897" y="245.5762">Read the permission of each reviewer</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="252.9727" x="288.897" y="259.5449">(the Owner: a person with write or admin)</text><polygon fill="#F1F1F1" points="317.7959,292.375,512.9707,292.375,524.9707,305.1797,512.9707,317.9844,317.7959,317.9844,305.7959,305.1797,317.7959,292.375" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="195.1748" x="317.7959" y="302.5854">Latest deciding review of an Owner</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="117.1221" x="317.7959" y="315.3901">on the head commit?</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="162.9102" x="21" y="353.5938"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="142.9102" x="31" y="374.7324">I12: run the merge step</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#D62728;stroke-width:3;" width="205.6074" x="211.7529" y="353.5938"/><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="132.7031" x="221.7529" y="374.7324">Change the label to</text><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="185.6074" x="221.7529" y="388.7012">cumin/status/implementing</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="221.293" x="203.9102" y="421.5313"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="130.0371" x="213.9102" y="442.6699">Ask the Implementer:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="163.8633" x="213.9102" y="456.6387">request "owner review fix",</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="201.293" x="213.9102" y="470.6074">it names the review of the Owner</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="199.9355" x="214.5889" y="503.4375"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="179.9355" x="224.5889" y="524.5762">done: I2, the required checks,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="119.3379" x="224.5889" y="538.5449">the review, I7 again</text><path d="M567.8047,353.5938 L567.8047,369.7266 L547.8047,373.7266 L567.8047,377.7266 L567.8047,393.8594 A0,0 0 0 0 567.8047,393.8594 L809.7666,393.8594 A0,0 0 0 0 809.7666,393.8594 L809.7666,363.5938 L799.7666,353.5938 L567.8047,353.5938 A0,0 0 0 0 567.8047,353.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M799.7666,353.5938 L799.7666,363.5938 L809.7666,363.5938 L799.7666,353.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="220.9619" x="573.8047" y="370.6606">This issue: the decision, the label,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.431