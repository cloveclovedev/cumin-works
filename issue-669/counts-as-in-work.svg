<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="678px" preserveAspectRatio="none" style="width:655px;height:678px;background:#FFFFFF;" version="1.1" viewBox="0 0 655 678" width="655px" zoomAndPan="magnify"><defs/><g><ellipse cx="304.3218" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="134.1582" x="237.2427" y="94"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="114.1582" x="247.2427" y="115.1387">tick of poll_interval</text><polygon fill="#F1F1F1" points="213.0535,203.6792,395.5901,203.6792,407.5901,216.4839,395.5901,229.2886,213.0535,229.2886,201.0535,216.4839,213.0535,203.6792" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="182.5366" x="213.0535" y="213.8896">in work, or idle_poll_interval over</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="102.6201" x="213.0535" y="226.6943">since the last poll?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="182.0452" y="213.8896">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="407.5901" y="213.8896">no</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="217.5547" x="77.3604" y="239.2886"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="113.9355" x="87.3604" y="260.4272">poll the repository:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="197.5547" x="87.3604" y="274.396">read the snapshot, decide, apply</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#D62728;stroke-width:3;" width="296.2754" x="38" y="320.5034"/><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="250.1953" x="48" y="341.6421">keep the issues that wait for a Maintainer</text><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="276.2754" x="48" y="355.6108">(monitor file), and whether an issue is in work</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="136.4609" x="354.2754" y="239.2886"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="116.4609" x="364.2754" y="260.4272">skip the repository:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="84.7793" x="364.2754" y="274.396">no GitHub call</text><polygon fill="#F1F1F1" points="304.3218,374.4409,316.3218,386.4409,304.3218,398.4409,292.3218,386.4409,304.3218,374.4409" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="240.873,147.9688,367.7705,147.9688,379.7705,159.9688,367.7705,171.9688,240.873,171.9688,228.873,159.9688,240.873,147.9688" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="308.3218" y="182.1792">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="126.8975" x="240.873" y="163.7769">next target repository?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="215.1714" y="157.3745">no</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#D62728;stroke-width:3;" width="236.2988" x="186.1724" y="440.4409"/><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="216.2988" x="196.1724" y="461.5796">tell that cumin waits, when no issue</text><text fill="#D62728" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="186.3984" x="196.1724" y="475.5483">moves on without a Maintainer</text><polygon fill="#F1F1F1" points="304.3218,50,316.3218,62,304.3218,74,292.3218,62,304.3218,50" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="289.5244,508.3784,319.1191,508.3784,331.1191,520.3784,319.1191,532.3784,289.5244,532.3784,277.5244,520.3784,289.5244,508.3784" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="29.5947" x="289.5244" y="524.1865">stop?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="331.1191" y="517.7842">no</text><path d="M335.3218,550.2949 L335.3218,604.2598 L315.3218,608.2598 L335.3218,612.2598 L335.3218,666.2246 A0,0 0 0 0 335.3218,666.2246 L643.8833,666.2246 A0,0 0 0 0 643.8833,666.2246 L643.8833,560.2949 L633.8833,550.2949 L335.3218,550.2949 A0,0 0 0 0 335.3218,550.2949" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M633.8833,550.2949 L633.8833,560.2949 L643.8833,560.2949 L633.8833,550.2949" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.1914" x="341.3218" y="567.3618">This issue changes the red steps.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="287.5615" x="341.3218" y="582.4946">A requirement issue in awaiting-plan-review</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.3848" x="341.3218" y="597.6274">with one or more sub-issues, all closed:</text><ellipse cx="346.8218" cy="608.3262" fill="#000000" rx="2.5" ry="2.5"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="253.2271" x="353.3218" y="612.7603">counts as in work (no idle poll interval)</text><ellipse cx="346.8218" cy="623.459" fill="#000000" rx="2.5" ry="2.5"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="262.2915" x="353.3218" y="627.8931">counts as an issue that cumin moves on</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="155.1177" x="349.5864" y="643.0259">(no waiting notification)</text><ellipse cx="346.8218" cy="653.7246" fill="#000000" rx="2.5" ry="2.5"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.416" x="353.3218" y="658.1587">is not listed as waiting for a plan review</text><ellipse cx="304.3218" cy="608.2598" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="304.3218" cy="608.2598" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="186.1377" x2="186.1377" y1="287.2261" y2="320.5034"/><polygon fill="#181818" points="182.1377,310.5034,186.1377,320.5034,190.1377,310.5034,186.1377,314.5034" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="201.0535" x2="186.1377" y1="216.4839" y2="216.4839"/><line style="stroke:#181818;stroke-width:1;" x1="186.1377" x2="186.1377" y1="216.4839" y2="239.2886"/><polygon fill="#181818" points="182.1377,229.2886,186.1377,239.2886,190.1377,229.2886,186.1377,233.2886" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="407.5901" x2="422.5059" y1="216.4839" y2="216.4839"/><line style="stroke:#181818;stroke-width:1;" x1="422.5059" x2="422.5059" y1="216.4839" y2="239.2886"/><polygon fill="#181818" points="418.5059,229.2886,422.5059,239.2886,426.5059,229.2886,422.5059,233.2886" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="186.1377" x2="186.1377" y1="368.