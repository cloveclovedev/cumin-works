<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="438px" preserveAspectRatio="none" style="width:1110px;height:438px;background:#FFFFFF;" version="1.1" viewBox="0 0 1110 438" width="1110px" zoomAndPan="magnify"><defs/><g><g id="PlanReview"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="341.6035" x="289.07" y="8.56"/><line style="stroke:#181818;stroke-width:0.5;" x1="289.07" x2="630.6735" y1="34.8569" y2="34.8569"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="146.5762" x="386.5837" y="26.5551">awaiting-plan-review</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="321.6035" x="294.07" y="50.9955">do / a Maintainer reviews the plan and the sub-issues</text></g><g id="Implementing"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="252.875" x="333.43" y="181.76"/><line style="stroke:#181818;stroke-width:0.5;" x1="333.43" x2="586.305" y1="208.0569" y2="208.0569"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="97.1797" x="411.2777" y="199.7551">implementing</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="232.875" x="338.43" y="224.1955">do / the agents work on the sub-issues</text></g><g id="Accepting"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="267.5879" x="490.08" y="382.39"/><line style="stroke:#181818;stroke-width:0.5;" x1="490.08" x2="757.6679" y1="408.6869" y2="408.6869"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="68.6123" x="589.5678" y="400.3851">accepting</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing"