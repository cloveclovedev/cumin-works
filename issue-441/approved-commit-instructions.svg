xt fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="50.644" x="212.5715" y="235.2808">2 or later</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="94.4082" x="46.1206" y="259.875"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="74.4082" x="56.1206" y="281.0137">New session</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="199.877" x="166.7427" y="259.875"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="179.877" x="176.7427" y="281.0137">Resume the Reviewer session</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="212.3047" x="160.5288" y="313.8438"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="192.3047" x="170.5288" y="334.9824">Name the last reviewed commit</text><polygon fill="#F1F1F1" points="180.0029,353.8125,192.0029,365.8125,180.0029,377.8125,168.0029,365.8125,180.0029,353.8125" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="293.8848" x="33.0605" y="397.8125"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="273.8848" x="43.0605" y="418.9512">Name the approved commit, when one exists</text><path d="M306.2842,441.7813 L306.2842,465.4805 L286.2842,469.4805 L306.2842,473.4805 L306.2842,497.1797 A0,0 0 0 0 306.2842,497.1797 L620.5649,497.1797 A0,0 0 0 0 620.5649,497.1797 L620.5649,451.7813 L610.5649,441.7813 L306.2842,441.7813 A0,0 0 0 0 306.2842,441.7813" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M610.5649,441.7813 L610.5649,451.7813 L620.5649,451.7813 L610.5649,441.7813" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;