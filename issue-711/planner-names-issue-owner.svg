<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="355px" preserveAspectRatio="none" style="width:929px;height:355px;background:#FFFFFF;" version="1.1" viewBox="0 0 929 355" width="929px" zoomAndPan="magnify"><title>The way out of cumin/status/planning (part)</title><defs/><g><g class="title" data-source-line="3"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="349.0361" x="288.9502" y="32.9951">The way out of cumin/status/planning (part)</text></g><ellipse cx="487.9609" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="224.1172" x="375.9023" y="87.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="204.1172" x="385.9023" y="108.4355">The end of a Planner run of a split</text><polygon fill="#F1F1F1" points="467.8005,141.2656,508.1213,141.2656,520.1213,153.2656,508.1213,165.2656,467.8005,165.2656,455.8005,153.2656,467.8005,141.2656" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="40.3208" x="467.8005" y="157.0737">Result?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="42.9365" x="412.864" y="150.6714">blocked</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="125.8716" x="520.1213" y="150.6714">done, or abnormal end</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="224.3047" x="65.4746" y="175.2656"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="204.3047" x="75.4746" y="196.4043">Read the requirement issue again</text><path d="M364.2539,239.4727 L364.2539,263.1719 L344.2539,267.1719 L364.2539,271.1719 L364.2539,294.8711 A0,0 0 0 0 364.2539,294.8711 L647.6533,294.8711 A0,0 0 0 0 647.6533,294.8711 L647.6533,249.4727 L637.6533,239.4727 L364.2539,239.4727 A0,0 0 0 0 364.2539,239.4727" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M637.6533,239.4727 L637.6533,249.4727 L647.6533,249.4727 L637.6533,239.4727" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="262.3994" x="370.2539" y="256.5396">roles/planner.md says who answers</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.9238" x="370.2539" y="271.6724">this comment: the Issue Owner,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.9287" x="370.2539" y="286.8052">as roles/implementer.md says.</text><rect fill="#FFFFFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#D62728;stroke-width:3;" width="333.2539" x="11" y="243.2031"/><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="313.2539" x="21" y="264.3418">Comment blocked_reason, change the label to</text><text fill="#D62728" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="259.752" x="21" y="278.3105">cumin/status/awaiting-decision, notify</text><ellipse cx="177.627" cy="333.332" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="177.627" cy="333.332" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="224.3047" x="676.1426" y="175.2656"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="204.3047" x="686.1426" y="196.4043">Read the requirement issue again</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="180.4102" x="686.1426" y="210.373">(one issue with its sub-issues)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="261.2832" x="657.6533" y="253.4414"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="241.2832" x="667.6533" y="274.5801">Decision (pure function SplitEnd, no I/O)</text><ellipse cx="788.2949" cy="325.8711" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="788.2949" cy="325.8711" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="487.9609" x2="487.9609" y1="67.2969" y2="87.2969"/><polygon fill="#181818" points="483.9609,77.2969,487.9609,87.2969,491.9609,77.2969,487.9609,81.2969" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="177.627" x2="177.627" y1="209.2344" y2="243.2031"/><polygon fill="#181818" points="173.627,233.2031,177.627,243.2031,181.627,233.2031,177.627,237.2031" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="177.627" x2="177.627" y1="291.1406" y2="322.332"/><polygon fill="#181818" points="173.627,312.332,177.627,322.332,181.627,312.332,177.627,316.332" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="788.2949" x2="788.2949" y1="223.2031" y2="253.4414"/><polygon fill="#181818" points="784.2949,243.4414,788.2949,253.4414,792.2949,243.4414,788.2949,247.4414" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="788.2949" x2="788.2949" y1="287.4102" y2="314.8711"/><polygon fill="#181818" points="784.2949,304.8711,788.2949,314.8711,792.2949,304.8711,788.2949,308.8711" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1=